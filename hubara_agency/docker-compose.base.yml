# Base services del stack local — NO incluye workers (esos se auto-generan
# desde los manifests via `scripts/render-compose.py`).
#
# Editar este archivo cuando cambien servicios FIJOS (db, temporal, litellm,
# api, frontend). Los workers per-plugin se agregan declarándolos en
# `frontend_dashboard/src/plugins/<id>/plugin.yaml` y regenerando.
#
# Workflow:
#   1. Editar este archivo (cambios a infra fija) o `plugin.yaml` (workers).
#   2. `python scripts/render-compose.py` → regenera `docker-compose.local.yml`.
#   3. `docker compose -f docker-compose.local.yml up -d`.
#
# SigNoz (observabilidad, HU-003) — vendorizado en deploy/signoz/. Con `include`,
# un solo `docker compose -f docker-compose.local.yml up` levanta TODO el entorno
# (stack hubara + SigNoz). Los workers exportan OTLP al collector publicado en el
# host (host.docker.internal:4317) — ver el env de los workers en plugin.yaml.
include:
  - deploy/signoz/docker/docker-compose.yaml

services:
  # ── 1. Base de Datos ────────────────────────────────────────────────
  db:
    image: postgres:14
    container_name: local-temporal-db
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
      - POSTGRES_DB=temporal
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── 2. Infraestructura Temporal ─────────────────────────────────────
  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: local-temporal
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_ADDR=db
      - DB_PORT=5432
      - POSTGRES_SEEDS=db
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_DB=temporal
      - SKIP_DB_CREATE=false
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 cluster health || temporal operator cluster health --address temporal:7233 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  temporal-ui:
    image: temporalio/ui:latest
    container_name: local-temporal-ui
    ports:
      - "8233:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal

  # ── 3. Router de Inteligencia (Local LiteLLM) ───────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:v1.86.2
    container_name: local-litellm
    ports:
      - "4000:4000"
    volumes:
      - ../exoclaw-temporal/litellm_config.yaml:/app/config.yaml
    command: [ "--config", "/app/config.yaml", "--port", "4000", "--debug" ]
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── 4. Entorno de Negocio: Puerta Web (FastAPI loader) ──────────────
  # Único container HTTP. El loader (src.main) auto-discovers todos los
  # routers de todos los plugins habilitados — un solo container sirve
  # todos los `api:` declarados en los manifests.
  hubara-api:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: local-hubara-api
    working_dir: /app/hubara_agency
    command: ["python", "run_api.py"]
    ports:
      - "8000:8000"
    environment:
      - TEMPORAL_URL=temporal:7233
      - API_BASE_LLMLITE=http://litellm:4000
      - WORKSPACE_VAULT_DIR=/app/hubara_vault
      # La API LEE los candidatos a golden que el worker sales-eval ESCRIBE acá
      # (mismo path en el volumen compartido hubara-vault). Sin esto, get_candidates_dir()
      # cae al default tests/_candidates (efímero) y el frontend Calidad LLM sale vacío.
      - EVAL_CANDIDATES_DIR=/app/hubara_vault/_evals/candidates
      # Manda los traces de la API (service.name=api-gateway) al collector de SigNoz
      # vía OTLP. Sin esto, init_otel() cae a ConsoleSpanExporter e imprime CADA span
      # HTTP como JSON a stdout (ruido en docker logs) y la API nunca aparece en SigNoz.
      # Mismo endpoint probado que ya usan los workers (A6): host.docker.internal:4317
      # = el collector publicado al host (Docker Desktop/macOS).
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4317
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
      # OAuth + Marketing API de Meta (plugin `ads`, wiring_intents.env_vars_required).
      # Sin valor → el plugin degrada limpio (/api/ads/meta/login = 503). El token OAuth
      # NO es una env var: vive server-side en SSM SecureString.
      - META_APP_ID=${META_APP_ID}
      - META_APP_SECRET=${META_APP_SECRET}
      - META_OAUTH_REDIRECT_URI=${META_OAUTH_REDIRECT_URI}
    volumes:
      - hubara-vault-local:/app/hubara_vault
      # SSoT post-PR11: manifests viven en frontend_dashboard/. El loader
      # los lee desde /app/frontend_dashboard/src/plugins. En dev mounteamos
      # el dir del host para que cambios en manifests se reflejen sin
      # rebuild. En prod (k8s) los manifests vienen vía COPY del Dockerfile.
      - ../frontend_dashboard/src/plugins:/app/frontend_dashboard/src/plugins:ro
    depends_on:
      temporal:
        condition: service_healthy
      litellm:
        condition: service_healthy

  # ── 5. Frontend (Vite dev server) ───────────────────────────────────
  hubara-frontend:
    build:
      context: ../frontend_dashboard
      dockerfile: Dockerfile
    container_name: local-hubara-frontend
    ports:
      # Host port 5174 → container 5173. Archon usa el 5173 del host.
      - "5174:5173"
    volumes:
      - ../frontend_dashboard:/app
      - /app/node_modules # prevent overwriting container node_modules
    depends_on:
      - hubara-api

  # (El visualizador web `system_explorer` se eliminó — la visualización del
  #  sistema vive en Acktos Studio, la extensión de VS Code en `vscode-hubara/`,
  #  que lee el grafo directo del dominio vía `scripts/system_map_bridge.py`.
  #  El endpoint /api/system-map/graph del hubara-api sigue vivo.)

# Simulador del EFS de Amazon
volumes:
  hubara-vault-local:
