apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: default
data:
  config.yaml: |
    model_list:
      - model_name: deepseek-v4-flash
        litellm_params:
          model: deepseek/deepseek-flash
          api_key: "os.environ/DEEPSEEK_API_KEY"

      # Fallback conversacional: id ESTABLE, nunca -preview (lección L-23).
      # Paridad con exoclaw-temporal/litellm_config.yaml; guard:
      # tests/platform/test_litellm_model_ids_stable.py.
      - model_name: gemini-backup
        litellm_params:
          model: gemini/gemini-3.5-flash-lite
          api_key: "os.environ/GEMINI_API_KEY"

      # Multimodal de soporte del chat de sales (audio + visión) — paridad
      # con exoclaw-temporal/litellm_config.yaml. Consumido como
      # `litellm_proxy/gemini-multimodal` por platform/{audio,vision}.
      - model_name: gemini-multimodal
        litellm_params:
          model: gemini/gemini-2.5-flash-lite
          api_key: "os.environ/GEMINI_API_KEY"

    router_settings:
      routing_strategy: simple-shuffle
      num_retries: 1
      fallbacks: [{"deepseek-v4-flash": ["gemini-backup"]}]
      drop_params: True
