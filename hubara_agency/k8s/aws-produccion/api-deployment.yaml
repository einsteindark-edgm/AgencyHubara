apiVersion: apps/v1
kind: Deployment
metadata:
  name: hubara-api
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hubara-api
  template:
    metadata:
      labels:
        app: hubara-api
    spec:
      containers:
        - name: api
          image: hubara-agency-prod:latest # Rellenar en CD con la URI real de ECR
          imagePullPolicy: Always
          command: ["python", "hubara_agency/run_api.py"]
          ports:
            - containerPort: 8000
          env:
            - name: API_BASE_LLMLITE
              value: "http://litellm-proxy.default.svc.cluster.local:4000"
            - name: TEMPORAL_URL
              value: "temporal-frontend.temporal.svc.cluster.local:7233" # O <instancia>.tmprl.cloud:7233
            - name: TEMPORAL_NAMESPACE
              value: "default"
            - name: TEMPORAL_TLS_CERT_PATH
              value: "/etc/temporal-certs/temporal.pem"
            - name: TEMPORAL_TLS_KEY_PATH
              value: "/etc/temporal-certs/temporal.key"
            # Importante: Inyectar llaves privadas adicionales usando envFrom -> Secret
          volumeMounts:
            - name: temporal-certs
              mountPath: "/etc/temporal-certs"
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: temporal-certs
          secret:
            secretName: temporal-cloud-certs
