apiVersion: apps/v1
kind: Deployment
metadata:
  name: hubara-worker-sales
  namespace: default
spec:
  replicas: 3 # Tres servidores dedicados exclusivamente a la cola de ventas
  selector:
    matchLabels:
      app: hubara-worker-sales
  template:
    metadata:
      labels:
        app: hubara-worker-sales
    spec:
      containers:
        - name: worker
          image: hubara-agency-prod:latest
          imagePullPolicy: Always
          # Ejecutamos explícitamente el módulo del dominio de ventas
          command: ["python", "-m", "hubara_agency.src.domains.sales_whatsapp.worker"]
          env:
            - name: API_BASE_LLMLITE
              value: "http://litellm-proxy.default.svc.cluster.local:4000"
            - name: TEMPORAL_URL
              value: "temporal-frontend.temporal.svc.cluster.local:7233"
            - name: TEMPORAL_NAMESPACE
              value: "default"
            - name: TEMPORAL_TLS_CERT_PATH
              value: "/etc/temporal-certs/temporal.pem"
            - name: TEMPORAL_TLS_KEY_PATH
              value: "/etc/temporal-certs/temporal.key"
            - name: WORKSPACE_VAULT_DIR
              value: "/app/hubara_vault" # Este será el punto fijo anclado al PVC
          volumeMounts:
            - name: hubara-vault
              mountPath: /app/hubara_vault
            - name: temporal-certs
              mountPath: "/etc/temporal-certs"
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: hubara-vault
          persistentVolumeClaim:
            claimName: hubara-vault-efs
        - name: temporal-certs
          secret:
            secretName: temporal-cloud-certs
