
services:
  # 1. Base de Datos
  db:
    image: postgres:14
    container_name: local-temporal-db
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
      - POSTGRES_DB=temporal
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Infraestructura Temporal
  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: local-temporal
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_ADDR=db
      - DB_PORT=5432
      - POSTGRES_SEEDS=db
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_DB=temporal
      - SKIP_DB_CREATE=false
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 cluster health || temporal operator cluster health --address temporal:7233 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  temporal-ui:
    image: temporalio/ui:latest
    container_name: local-temporal-ui
    ports:
      - "8233:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal

  # 3. Router de Inteligencia (Local LiteLLM)
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: local-litellm
    ports:
      - "4000:4000"
    volumes:
      - ../exoclaw-temporal/litellm_config.yaml:/app/config.yaml
    command: [ "--config", "/app/config.yaml", "--port", "4000", "--debug" ]
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 4. Entorno de Negocio: Puerta Web
  hubara-api:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: local-hubara-api
    working_dir: /app/hubara_agency
    command: ["python", "run_api.py"]
    ports:
      - "8000:8000"
    environment:
      - TEMPORAL_URL=temporal:7233
      - API_BASE_LLMLITE=http://litellm:4000
      - WORKSPACE_VAULT_DIR=/app/hubara_vault
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
    volumes:
      - hubara-vault-local:/app/hubara_vault
    depends_on:
      temporal:
        condition: service_healthy
      litellm:
        condition: service_healthy

  # 5. Entorno de Negocio: Worker Especialista
  hubara-worker:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: local-hubara-worker
    working_dir: /app/hubara_agency
    command: ["python", "-m", "src.plugins.chats.workers.sales"]
    environment:
      - TEMPORAL_URL=temporal:7233
      - API_BASE_LLMLITE=http://litellm:4000
      - WORKSPACE_VAULT_DIR=/app/hubara_vault
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
      # HU-04: Sales lee el snapshot del catalogo escrito por catalog-sync.
      - CATALOG_SNAPSHOT_DIR=/app/hubara_vault/catalog
      - CATALOG_MAX_AGE_MINUTES=30
    volumes:
      - hubara-vault-local:/app/hubara_vault
    depends_on:
      temporal:
        condition: service_healthy
      litellm:
        condition: service_healthy

  # 6. Entorno de Negocio: Worker de Sincronizacion del Catalogo (HU-03)
  # Descarga el catalogo de Medusa cada N minutos (Schedule de Temporal),
  # escribe snapshot atomico en /app/hubara_vault/catalog/. Sales lo lee con
  # cache mtime-aware sin restart cuando cambia.
  hubara-worker-catalog-sync:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: local-hubara-worker-catalog-sync
    working_dir: /app/hubara_agency
    command: ["python", "-m", "src.catalog_sync.worker"]
    environment:
      - TEMPORAL_URL=temporal:7233
      - WORKSPACE_VAULT_DIR=/app/hubara_vault
      - CATALOG_SNAPSHOT_DIR=/app/hubara_vault/catalog
      - CATALOG_MAX_AGE_MINUTES=30
      - MEDUSA_BASE_URL=${MEDUSA_BASE_URL}
      - MEDUSA_ADMIN_TOKEN=${MEDUSA_ADMIN_TOKEN}
    volumes:
      - hubara-vault-local:/app/hubara_vault
    depends_on:
      temporal:
        condition: service_healthy

  # 7. Entorno de Negocio: Worker de Remarketing Autónomo
  hubara-worker-remarketing:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: local-hubara-worker-remarketing
    working_dir: /app/hubara_agency
    command: ["python", "-m", "src.plugins.chats.workers.remarketing"]
    environment:
      - TEMPORAL_URL=temporal:7233
      - API_BASE_LLMLITE=http://litellm:4000
      - WORKSPACE_VAULT_DIR=/app/hubara_vault
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
    volumes:
      - hubara-vault-local:/app/hubara_vault
    depends_on:
      temporal:
        condition: service_healthy
      litellm:
        condition: service_healthy

  # 8. Frontend
  hubara-frontend:
    build:
      context: ../frontend_dashboard
      dockerfile: Dockerfile
    container_name: local-hubara-frontend
    ports:
      # Host port 5174 → container 5173. Archon usa el 5173 del host.
      - "5174:5173"
    volumes:
      - ../frontend_dashboard:/app
      - /app/node_modules # prevent overwriting container node_modules
    depends_on:
      - hubara-api

# Simulador del EFS de Amazon
volumes:
  hubara-vault-local:
