
services:
  # 1. Base de Datos
  db:
    image: postgres:14
    container_name: local-temporal-db
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
      - POSTGRES_DB=temporal
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Infraestructura Temporal
  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: local-temporal
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_ADDR=db
      - DB_PORT=5432
      - POSTGRES_SEEDS=db
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_DB=temporal
      - SKIP_DB_CREATE=false
    depends_on:
      db:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:latest
    container_name: local-temporal-ui
    ports:
      - "8233:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal

  # 3. Router de Inteligencia (Local LiteLLM)
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: local-litellm
    ports:
      - "4000:4000"
    volumes:
      - ../exoclaw-temporal/litellm_config.yaml:/app/config.yaml
    command: [ "--config", "/app/config.yaml", "--port", "4000", "--debug" ]
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}

  # 4. Entorno de Negocio: Puerta Web
  hubara-api:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: local-hubara-api
    working_dir: /app/hubara_agency
    command: ["python", "run_api.py"]
    ports:
      - "8000:8000"
    environment:
      - TEMPORAL_URL=temporal:7233
      - API_BASE_LLMLITE=http://litellm:4000
      - WORKSPACE_VAULT_DIR=/app/hubara_vault
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    volumes:
      - hubara-vault-local:/app/hubara_vault
    depends_on:
      - temporal
      - litellm

  # 5. Entorno de Negocio: Worker Especialista
  hubara-worker:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: local-hubara-worker
    working_dir: /app/hubara_agency
    command: ["python", "-m", "src.domains.sales_whatsapp.worker"]
    environment:
      - TEMPORAL_URL=temporal:7233
      - API_BASE_LLMLITE=http://litellm:4000
      - WORKSPACE_VAULT_DIR=/app/hubara_vault
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    volumes:
      - hubara-vault-local:/app/hubara_vault
    depends_on:
      - temporal
      - litellm

# Simulador del EFS de Amazon
volumes:
  hubara-vault-local:
