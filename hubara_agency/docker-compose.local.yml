services:
  db:
    image: postgres:14
    container_name: local-temporal-db
    environment:
    - POSTGRES_USER=temporal
    - POSTGRES_PASSWORD=temporal
    - POSTGRES_DB=temporal
    ports:
    - 5432:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U temporal -d temporal
      interval: 5s
      timeout: 5s
      retries: 10
  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: local-temporal
    ports:
    - 7233:7233
    environment:
    - DB=postgres12
    - DB_ADDR=db
    - DB_PORT=5432
    - POSTGRES_SEEDS=db
    - POSTGRES_USER=temporal
    - POSTGRES_PWD=temporal
    - POSTGRES_DB=temporal
    - SKIP_DB_CREATE=false
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - tctl --address temporal:7233 cluster health || temporal operator cluster health --address temporal:7233 || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
  temporal-ui:
    image: temporalio/ui:latest
    container_name: local-temporal-ui
    ports:
    - 8233:8080
    environment:
    - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
    - temporal
  litellm:
    image: ghcr.io/berriai/litellm:v1.86.2
    container_name: local-litellm
    ports:
    - 4000:4000
    volumes:
    - ../exoclaw-temporal/litellm_config.yaml:/app/config.yaml
    command:
    - --config
    - /app/config.yaml
    - --port
    - '4000'
    - --debug
    environment:
    - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
    - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
    - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
    - GEMINI_API_KEY=${GEMINI_API_KEY}
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  hubara-api:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: local-hubara-api
    working_dir: /app/hubara_agency
    command:
    - python
    - run_api.py
    ports:
    - 8000:8000
    environment:
    - TEMPORAL_URL=temporal:7233
    - API_BASE_LLMLITE=http://litellm:4000
    - WORKSPACE_VAULT_DIR=/app/hubara_vault
    - EVAL_CANDIDATES_DIR=/app/hubara_vault/_evals/candidates
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4317
    - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
    - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
    - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
    - META_APP_ID=${META_APP_ID}
    - META_APP_SECRET=${META_APP_SECRET}
    - META_OAUTH_REDIRECT_URI=${META_OAUTH_REDIRECT_URI}
    - ENABLED_PLUGINS=ads,agents_admin,catalog,chats,eta,orders,reengagement,system_map
    volumes:
    - hubara-vault-local:/app/hubara_vault
    - ../frontend_dashboard/src/plugins:/app/frontend_dashboard/src/plugins:ro
    depends_on:
      temporal:
