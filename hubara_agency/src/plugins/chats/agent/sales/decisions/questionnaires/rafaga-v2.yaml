# Cuestionario de la ráfaga, versión 2 (diseño v2 §01, fase F1): el «Si» con
# contexto. Cambios contra v1:
#   * el `state` separa CONTEXTO (lo que el cliente vio antes: no es de este
#     turno), HECHOS DEL PEDIDO y ESTE TURNO;
#   * las preguntas de asuntos se limitan a ESTE TURNO (si no, Jev tomaría
#     como pedido nuevo algo que ya está en el contexto);
#   * preguntas del hilo: qué preguntó el asesor, si el cliente lo responde y
#     qué responde. `thread.bot_asked` no se hace cuando el código ya sabe qué
#     se preguntó (tarjeta de confirmación o formulario);
#   * sin la pregunta de etapa: la etapa la calcula el código (su respuesta
#     no se usaba) ni la de "repite algo sin respuesta" (tampoco se usaba).
# Los ids de los asuntos son los de v1: el banco de referencia califica por id.
id: rafaga-v2

topics:
  - {id: catalogo, label: "catálogo", hint: "pide ver el catálogo, los diseños o los modelos"}
  - {id: precio, label: "precio", hint: "pregunta cuánto vale o cuánto cuesta algo"}
  - {id: envio, label: "envío", hint: "pregunta por el envío o el domicilio (costo o cobertura)"}
  - {id: tiempos, label: "tiempos de entrega", hint: "pregunta cuánto tarda en llegar o cuándo está listo"}
  - {id: pagos, label: "medios de pago", hint: "pregunta cómo pagar o por un medio de pago"}
  - {id: medidas, label: "medidas", hint: "pregunta por el tamaño o las medidas"}
  - {id: variante, label: "colores o variantes", hint: "pregunta por colores o variantes"}
  - {id: aroma, label: "aromas", hint: "pregunta por los aromas"}
  - {id: personalizacion, label: "personalización", hint: "pide personalizar (nombre, dedicatoria, diseño propio)"}
  - {id: disponibilidad, label: "disponibilidad", hint: "pregunta si hay disponible o en stock"}
  - {id: estado_pedido, label: "estado del pedido", hint: "pregunta por un pedido que ya hizo"}
  - {id: datos_envio, label: "datos de envío", hint: "entrega sus datos de envío (ciudad, dirección, teléfono, quién recibe)"}
  - {id: confirma_compra, label: "confirmación de compra", hint: "confirma que quiere comprar"}
  - {id: aplaza, label: "aplazamiento", hint: "aplaza la compra (luego, otro día, voy en camino)"}
  - {id: queja, label: "queja", hint: "se queja o reporta un problema"}
  - {id: foto, label: "la foto", hint: "pregunta por una foto que envió o citó"}
  - {id: saludo, label: "saludo", hint: "saluda"}

questions:
  - each_topic:
      id: "topic.{topic}"
      kind: noul
      text: "¿En los mensajes de ESTE TURNO el cliente {hint}?"
      criteria:
        "true": "sí, lo plantea en un mensaje de este turno"
        "false": "no lo plantea en este turno (aunque aparezca en el contexto)"
  - id: thread.bot_asked
    kind: choice
    when: {has_context: true, bot_asked_known: null}
    text: "¿Qué le preguntó el asesor al cliente en su ÚLTIMO mensaje del CONTEXTO?"
    criteria:
      confirmar_compra: "si confirma la compra o el pedido"
      confirmar_dato_envio: "si confirma un dato de envío (dirección, ciudad, teléfono, quien recibe o pago)"
      elegir_variante: "que elija una variante (color, aroma, diseño o cantidad)"
      ver_opciones: "si quiere ver opciones (catálogo, aromas, colores o fotos)"
      otra_si_no: "otra pregunta de sí o no"
      pregunta_abierta: "una pregunta abierta"
      nada: "no le preguntó nada"
  - id: thread.answers_bot
    kind: noul
    when: {has_context: true}
    text: "¿En ESTE TURNO el cliente responde la última pregunta del asesor?"
    criteria: {"true": "sí, la responde", "false": "no, habla de otra cosa"}
  - id: thread.answer
    kind: choice
    when: {has_context: true}
    text: "¿Qué responde el cliente en ESTE TURNO a la última pregunta del asesor?"
    criteria:
      si: "sí"
      "no": "no"
      otra: "otra cosa (elige algo, pregunta o no la responde)"
  - each_message:
      id: "msg.{k}.topic"
      kind: choice
      text: "¿Cuál es el asunto principal del mensaje [{k}] de este turno?"
      criteria: {from_topics: label, extra: {ninguno: "ningún asunto de la lista"}}

verify:
  id: "cover.{topic}"
  kind: noul
  text: "¿La respuesta del asesor (texto y tarjetas) atiende el asunto «{label}»{where}"
  where_msg: " que el cliente planteó en el mensaje [{msg}]?"
  where_none: " que planteó el cliente?"
  criteria: {"true": "sí, lo atiende", "false": "no lo atiende"}

state:
  sections:
    context: "CONTEXTO — lo que el cliente vio antes de este turno (no es de este turno)"
    facts: "HECHOS DEL PEDIDO"
    turn: "ESTE TURNO — mensajes del cliente"
    quoted: "(el cliente cita este mensaje: «{text}»)"
  message: "[{k}] ({offset}) {text}"
  pending: "Asuntos que quedaron sin responder en turnos anteriores: {pending}"

reply_state:
  header: "Respuesta del asesor:"
  empty: "(sin texto)"
  components: "Tarjetas y componentes que también recibe el cliente: {components}"
