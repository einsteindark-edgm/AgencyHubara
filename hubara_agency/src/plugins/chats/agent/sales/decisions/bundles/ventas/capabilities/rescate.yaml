# yaml-language-server: $schema=../../../../../../../../../schemas/decision-capability.schema.json
#
# Lo que sí es para el cliente, párrafo por párrafo (valor: el texto que
# queda; "" = nada). Jev contesta el «¿qué es?» de cada párrafo; si duda de
# alguno, decide la regla.
capability: rescate
value: string
input: TextCheck
items: {builtin: paragraphs}
rule: {builtin: salvage}
state:
  builtin: numbered_items
  with: {header: "Texto que el asesor de ventas escribió para el cliente, por párrafos:", max: 8}
each:
  id: "egreso.rescate.{n}"
  kind: choice
  text: "¿Qué es el párrafo [{n}]?"
  criteria:
    "mensaje_al_cliente": "un mensaje para el cliente (le responde, le pregunta, le informa o se despide)"
    "razonamiento": "el razonamiento del asesor sobre qué responder o qué hacer"
    "reporte_interno": "un reporte interno: etiquetas, estados, sistemas o datos para el equipo"
    "acuse_al_sistema": "un acuse de recibo a una herramienta o al sistema"
    "deliberacion": "la deliberación de si responder o no"
thresholds: {"choice": 0.8}
decide:
  - when: "items.exists(i, !has(i.choice) || i.conf < th['choice'])"
    then: doubt
  - otherwise: {expr: "items.filter(i, i.choice == 'mensaje_al_cliente').map(i, i.text).join('\\n\\n')"}
floor: {builtin: jev}
same: {builtin: text_eq}
examples:
  - items: [{text: "Hola", choice: mensaje_al_cliente, conf: 0.9}, {text: "ESTADO", choice: reporte_interno, conf: 0.9}, {text: "Chao", choice: mensaje_al_cliente, conf: 0.8}]
    expect: "Hola\n\nChao"
  - {items: [{text: "ESTADO", choice: reporte_interno, conf: 0.9}], expect: ""}
  - {items: [{text: "Hola", choice: mensaje_al_cliente, conf: 0.79}], expect: doubt}
