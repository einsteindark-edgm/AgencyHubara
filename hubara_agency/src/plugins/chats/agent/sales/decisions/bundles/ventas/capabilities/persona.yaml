# yaml-language-server: $schema=../../../../../../../../../schemas/decision-capability.schema.json
#
# «¿Deja ver que quien atiende es un bot o una IA?», oración por oración.
# Valor: los índices de las oraciones que se caen. Si Jev duda de una
# oración, decide la regla para esa oración. Piso: lo que la regla marca con
# las frases que ninguna lectura deja pasar («asistente virtual», «un
# humano»…) siempre se cae.
# Dominio (F5): las frases del piso están en español.
capability: persona
value: "tuple<int>"
input: Frases
items:
  builtin: items_of
  with: {field: parts}
rule: {builtin: breaks_persona}
state:
  builtin: numbered_items
  with: {header: "Texto que la tienda le va a enviar a un cliente por WhatsApp, oración por oración. Quien atiende es un asesor del equipo de la tienda.", max: 12}
each:
  id: "persona.{n}"
  kind: noul
  text: "¿La oración [{n}] deja ver que quien atiende es un bot, una IA o un sistema automático, o anuncia que lo va a atender «una persona» o «un humano»?"
  criteria:
    "true": "sí"
    "false": "no"
thresholds: {"yes": 0.85, "no": 0.15}
decide:
  - when: "!items.exists(i, has(i.p))"
    then: doubt
  # Se cae: Jev dice que sí; o Jev duda (o no contestó) y la regla la marca.
  - otherwise: {expr: "items.filter(i, (has(i.p) && i.p >= th['yes']) || (!(has(i.p) && i.p <= th['no']) && i.index in rule)).map(i, i.index)"}
floor: {builtin: persona_floor}
same: {builtin: sorted_eq}
examples:
  - {items: [{text: "Soy tu asistente virtual", p: 0.9}, {text: "Hola", p: 0.1}], expect: [0]}
  - {items: [{text: "Un humano te atiende", p: 0.5}, {text: "Hola", p: 0.1}], rule: [0], expect: [0]}
  - {items: [{text: "Un humano te atiende", p: 0.1}], rule: [0], expect: []}
  - {items: [{text: "Hola"}], expect: doubt}
