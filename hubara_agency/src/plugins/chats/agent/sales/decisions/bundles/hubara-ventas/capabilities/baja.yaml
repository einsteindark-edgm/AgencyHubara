# yaml-language-server: $schema=../../../../../../../../../schemas/decision-capability.schema.json
#
# «¿Pide dejar de recibir mensajes o promociones?» (piso legal). Solo se
# pregunta con una promoción reciente (lo decide quien llama). La frase
# explícita de hoy es PISO: nunca se quita; Jev solo agrega bajas que la
# regla no ve («no me escriban», «elimínenme de la lista»).
capability: baja
value: bool
input: Inbound
rule: {builtin: opt_out_text}
state:
  builtin: customer_message
  with: {header: "Mensaje del cliente, que hace poco recibió una promoción de la tienda:"}
questions:
  - id: baja.pide
    kind: noul
    text: "¿El cliente pide dejar de recibir mensajes o promociones de la tienda?"
    criteria: {"true": "sí", "false": "no"}
thresholds: {"yes": 0.85, "no": 0.15}
decide:
  - when: "!('baja.pide' in p)"
    then: doubt
  - when: "p['baja.pide'] >= th['yes']"
    then: true
  - when: "p['baja.pide'] <= th['no']"
    then: false
  - otherwise: doubt
floor: {builtin: rule_or_jev}
same: {builtin: bool_eq}
examples:
  - {answers: {baja.pide: 0.9}, expect: true}
  - {answers: {baja.pide: 0.85}, expect: true}
  - {answers: {baja.pide: 0.84}, expect: doubt}
  - {answers: {baja.pide: 0.16}, expect: doubt}
  - {answers: {baja.pide: 0.15}, expect: false}
  - {answers: {}, expect: doubt}
