# yaml-language-server: $schema=../../../../../../../../../schemas/decision-capability.schema.json
#
# «¿Qué hace el cliente con la compra?», con lo que le preguntó el asesor a la
# vista: la ÚNICA definición de «compra confirmada». El carrito y el botón
# «Confirmar» los lee el código (no se preguntan). Confirma solo con
# certeza y la pregunta de compra a la vista (la tarjeta de confirmación como
# lo último que vio el cliente, o Jev que lo dice); retira un «sí» que
# respondía otra cosa (el costo de equivocarse es una pregunta más).
# Dominio (F5): «elige un producto, color, aroma, diseño» es de velas.
capability: compra
value: "list<string?>"
input: Inbound
view: {builtin: purchase_window}
rule: {builtin: purchase_signal}
state: {builtin: purchase_context}
questions:
  - id: compra.que_hace
    kind: choice
    text: "¿Qué hace el cliente con la compra en ESTE MENSAJE?"
    criteria:
      "confirma": "confirma que compra o acepta el pedido"
      "aplaza": "aplaza la compra (luego, otro día, voy en camino)"
      "rechaza": "dice que no quiere comprar"
      "pregunta": "hace una pregunta"
      "da_datos": "da datos de envío o de pago"
      "elige": "elige un producto, color, aroma, diseño o cantidad"
      "se_despide": "se despide o agradece"
      "otro": "otra cosa"
  - id: compra.pregunta_compra
    kind: noul
    text: "¿El último mensaje del asesor en el CONTEXTO le pregunta al cliente si confirma la compra o el pedido?"
    when: "inp.context && inp.asked_known == null"
    criteria:
      "true": "sí"
      "false": "no"
thresholds: {"choice": 0.7, "confirm": 0.85, "purchase_question": 0.85, "retract": 0.2}
vars:
  # Si el asesor le preguntó por la compra: la tarjeta lo dice; si no, Jev.
  asked: "inp.asked_known != null ? (inp.asked_known == 'confirmar_compra' ? 1.0 : 0.0) : ('compra.pregunta_compra' in p ? p['compra.pregunta_compra'] : -1.0)"
decide:
  - when: "!('compra.que_hace' in choice) || conf['compra.que_hace'] < th['choice']"
    then: doubt
  - when: "choice['compra.que_hace'] == 'aplaza'"
    then: [deferral, text]
  - when: "choice['compra.que_hace'] != 'confirma'"
    then: [null, text]
  # Sin contexto no se sabe qué respondió: decide la regla.
  - when: "inp.asked_known == null && !inp.context"
    then: doubt
  - when: "inp.asked_known == null && !('compra.pregunta_compra' in p)"
    then: doubt
  - when: "conf['compra.que_hace'] >= th['confirm'] && vars.asked >= th['purchase_question']"
    then: [affirmation, text]
  - when: "vars.asked <= th['retract']"
    then: [null, text]
  - otherwise: doubt
floor: {builtin: jev}
same: {builtin: first_eq}
examples:
  - {answers: {compra.que_hace: {choice: confirma, p: 0.9}}, input: {context: true, asked_known: confirmar_compra}, expect: [affirmation, text]}
  - {answers: {compra.que_hace: {choice: confirma, p: 0.9}, compra.pregunta_compra: 0.9}, input: {context: true}, expect: [affirmation, text]}
  - {answers: {compra.que_hace: {choice: confirma, p: 0.9}, compra.pregunta_compra: 0.2}, input: {context: true}, expect: [null, text]}
  - {answers: {compra.que_hace: {choice: confirma, p: 0.9}, compra.pregunta_compra: 0.5}, input: {context: true}, expect: doubt}
  - {answers: {compra.que_hace: {choice: confirma, p: 0.9}}, input: {context: false}, expect: doubt}
  - {answers: {compra.que_hace: {choice: confirma, p: 0.8}}, input: {context: true, asked_known: confirmar_compra}, expect: doubt}
  - {answers: {compra.que_hace: {choice: confirma, p: 0.9}}, input: {context: true, asked_known: confirmar_dato_envio}, expect: [null, text]}
  - {answers: {compra.que_hace: {choice: aplaza, p: 0.7}}, expect: [deferral, text]}
  - {answers: {compra.que_hace: {choice: pregunta, p: 0.9}}, expect: [null, text]}
  - {answers: {compra.que_hace: {choice: confirma, p: 0.69}}, expect: doubt}
