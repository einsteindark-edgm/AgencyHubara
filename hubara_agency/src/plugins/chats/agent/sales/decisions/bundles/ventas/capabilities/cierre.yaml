# yaml-language-server: $schema=../../../../../../../../../schemas/decision-capability.schema.json
#
# La etiqueta del cierre por ghosting (F8). Hoy la elige el LLM con el aviso
# de ghosting (regla = ""); con Jev, la lectura de la conversación la decide.
# Los invariantes del pedido son piso (closing_invariants, obligatorio).
capability: cierre
value: string
options: ["", CONFIRMADO_SIN_DATOS, INTERESADO, RECHAZO, COMPRA_EXITOSA]
input: Abandono
rule: {builtin: constant_empty}
state: {builtin: abandoned_chat}
questions:
  - id: cierre.etiqueta
    kind: choice
    text: "¿Cómo quedó la conversación?"
    criteria:
      "confirmado_sin_datos": "confirmó la compra pero no terminó de dar los datos de envío"
      "interesado": "mostró interés y quedó pensándolo, o no está claro"
      "rechazo": "dijo que no, o pedía algo que no vendemos y se fue, o solo resolvió una duda y se despidió"
      "compra_exitosa": "compró y el pedido quedó registrado"
thresholds: {"choice": 0.85}
decide:
  - when: "!('cierre.etiqueta' in choice) || conf['cierre.etiqueta'] < th['choice']"
    then: doubt
  - when: "choice['cierre.etiqueta'] == 'confirmado_sin_datos'"
    then: CONFIRMADO_SIN_DATOS
  - when: "choice['cierre.etiqueta'] == 'interesado'"
    then: INTERESADO
  - when: "choice['cierre.etiqueta'] == 'rechazo'"
    then: RECHAZO
  - when: "choice['cierre.etiqueta'] == 'compra_exitosa'"
    then: COMPRA_EXITOSA
  - otherwise: doubt
floor: {builtin: closing_invariants}
same: {builtin: text_eq}
examples:
  - {answers: {cierre.etiqueta: {choice: rechazo, p: 0.9}}, expect: RECHAZO}
  - {answers: {cierre.etiqueta: {choice: interesado, p: 0.85}}, expect: INTERESADO}
  - {answers: {cierre.etiqueta: {choice: interesado, p: 0.84}}, expect: doubt}
  - {answers: {}, expect: doubt}
