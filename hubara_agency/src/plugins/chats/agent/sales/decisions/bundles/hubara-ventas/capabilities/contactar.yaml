# yaml-language-server: $schema=../../../../../../../../../schemas/decision-capability.schema.json
#
# «¿Sobra un mensaje proactivo ahora?» y «¿la conversación ya terminó?»
# (operador 2026-09-30; conversación real ···4148: la segunda da 0,92 tras
# la entrega y el gracias). Cualquiera de las dos, segura, salta el toque de
# remarketing. La regla de hoy no salta nada (el LLM puede abstenerse).
capability: contactar
value: bool
input: Contacto
rule: {builtin: constant_false}
state: {builtin: proactive_touch}
questions:
  - id: contactar.sobra
    kind: noul
    text: "¿Sobra un mensaje proactivo ahora? Sobra si la conversación ya terminó (el cliente ya compró o recibió su pedido, se despidió o solo agradeció al final, o dijo que no), pidió que no le escribieran, lo está atendiendo una persona del equipo o la conversación sigue viva."
    criteria:
      "true": "sí"
      "false": "no"
  - id: contactar.terminada
    kind: noul
    text: "¿La conversación ya terminó? Terminó si el cliente ya compró o recibió su pedido y lo último que dijo es solo cortesía (agradece, elogia, se despide, promete mandar fotos o escribir después), o si dijo que no. No terminó si quedó una pregunta, una venta o un pedido a medias por resolver."
    criteria:
      "true": "sí"
      "false": "no"
thresholds: {"yes": 0.85, "no": 0.15}
decide:
  - when: "!('contactar.sobra' in p) && !('contactar.terminada' in p)"
    then: doubt
  - when: "('contactar.sobra' in p && p['contactar.sobra'] >= th['yes']) || ('contactar.terminada' in p && p['contactar.terminada'] >= th['yes'])"
    then: true
  - when: "'contactar.sobra' in p && p['contactar.sobra'] <= th['no']"
    then: false
  - otherwise: doubt
floor: {builtin: jev}
same: {builtin: bool_eq}
examples:
  - {answers: {contactar.sobra: 0.9}, expect: true}
  - {answers: {contactar.terminada: 0.92}, expect: true}
  - {answers: {contactar.sobra: 0.1, contactar.terminada: 0.5}, expect: false}
  - {answers: {contactar.terminada: 0.1}, expect: doubt}
  - {answers: {contactar.sobra: 0.5}, expect: doubt}
  - {answers: {}, expect: doubt}
