# yaml-language-server: $schema=../../../../../../../../../schemas/decision-capability.schema.json
#
# «¿El texto le promete al cliente que una persona del equipo lo va a
# atender?» (laboratorio caso-cortesia-1001: «un colega coordina contigo la
# entrega» sin escalar). La red de seguridad lo consulta antes de enviar: si
# promete y nadie escaló, escala. Las frases del relevo son PISO obligatorio.
capability: relevo
value: bool
input: TextoAlCliente
rule: {builtin: promises_a_handoff}
state:
  builtin: text_template
  with: {template: "Mensaje que la tienda le va a enviar a un cliente por WhatsApp:\n{text}", required: text}
questions:
  - id: relevo.promete
    kind: noul
    text: "¿El mensaje le dice al cliente que una persona del equipo (un colega, un asesor, alguien de despachos) lo va a contactar, a coordinar o a confirmar algo con él?"
    criteria:
      "true": "sí"
      "false": "no"
thresholds: {"yes": 0.85, "no": 0.15}
decide:
  - when: "!('relevo.promete' in p)"
    then: doubt
  - when: "p['relevo.promete'] >= th['yes']"
    then: true
  - when: "p['relevo.promete'] <= th['no']"
    then: false
  - otherwise: doubt
floor: {builtin: rule_or_jev}
same: {builtin: bool_eq}
examples:
  - {answers: {relevo.promete: 0.9}, expect: true}
  - {answers: {relevo.promete: 0.1}, expect: false}
  - {answers: {relevo.promete: 0.5}, expect: doubt}
  - {answers: {}, expect: doubt}
