# yaml-language-server: $schema=../../../../../../../../../schemas/decision-capability.schema.json
#
# «¿Estos botones le piden al cliente elegir un producto o una variante?»
# (tool de quick replies). Valor: los títulos rechazados (vacío = pasan). El
# id del botón (product., color.) es piso; Jev atrapa lo que el vocabulario
# no ve («El rosado») y deja pasar un sí/no que nombra una variante.
capability: selector
value: tuple<string>
input: Botones
rule: {builtin: rule_rejected_titles}
state: {builtin: buttons_message}
questions:
  - id: selector.elige
    kind: noul
    text: "¿Estos botones le piden al cliente elegir un producto o una variante (aroma, color, diseño) entre varias opciones? No cuenta un sí/no ni seguir/cambiar."
    criteria:
      "true": "sí"
      "false": "no"
thresholds: {"yes": 0.85, "no": 0.15}
decide:
  - when: "!('selector.elige' in p)"
    then: doubt
  - when: "p['selector.elige'] >= th['yes']"
    then: {expr: "size(rule) > 0 ? rule : inp.titles"}
  - when: "p['selector.elige'] <= th['no']"
    then: []
  - otherwise: doubt
floor: {builtin: jev_and_button_ids}
same: {builtin: truthy_eq}
examples:
  - answers: {selector.elige: 0.9}
    input: {body: "¿Cuál?", titles: [Rosado, Azul], rule_rejected: [], by_id: []}
    expect: [Rosado, Azul]
  - answers: {selector.elige: 0.9}
    rule: [Rosado]
    input: {body: "¿Cuál?", titles: [Rosado, Azul], rule_rejected: [Rosado], by_id: []}
    expect: [Rosado]
  - {answers: {selector.elige: 0.1}, expect: []}
  - {answers: {selector.elige: 0.5}, expect: doubt}
