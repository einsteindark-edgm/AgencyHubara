# yaml-language-server: $schema=../../../../../../../../../schemas/decision-capability.schema.json
#
# ¿Hace falta la burbuja de bienvenida? Solo en el primer contacto y si el
# turno le manda algo al cliente (eso lo sabe el código); Jev contesta si
# alguno de los textos que el cliente recibe ya saluda. Valor: true = saludar.
capability: saludo
value: bool
input: GreetingCheck
rule: {builtin: first_contact_greeting}
state: {builtin: greeting_texts}
questions:
  - id: egreso.saludo
    kind: noul
    text: "¿Alguno de estos mensajes ya saluda al cliente (buenos días, hola, bienvenida)?"
    criteria:
      "true": "sí"
      "false": "no"
thresholds: {"yes": 0.85, "no": 0.15}
decide:
  - when: "!('egreso.saludo' in p)"
    then: doubt
  - when: "p['egreso.saludo'] >= th['yes']"
    then: false
  - when: "p['egreso.saludo'] <= th['no']"
    then: true
  - otherwise: doubt
floor: {builtin: jev}
same: {builtin: bool_eq}
examples:
  - {answers: {egreso.saludo: 0.85}, expect: false}
  - {answers: {egreso.saludo: 0.15}, expect: true}
  - {answers: {egreso.saludo: 0.5}, expect: doubt}
