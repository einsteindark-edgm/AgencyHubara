# Catálogo de builtins del motor de decisiones de ventas (PAQUETES_DE_DECISION.md §5).
#
# Lo que un paquete puede pedir por nombre y leer: reglas (lo que decide sin
# Jev o con duda), constructores de estado (el texto que lee Jev; null = no
# se pregunta), opciones de la entrada (las de un choice que no se saben al
# escribir el paquete: `{opción: (etiqueta, valor)}`), vistas (campos que se
# derivan de la entrada), ítems (la lista sobre la que se decide ítem por
# ítem: oraciones, párrafos, términos, datos), pisos (lo que nunca se quita),
# comparadores, las entradas que una condición lee como `inp.campo` y las
# constantes (`consts.NOMBRE`). Un constructor de estado de una capacidad con
# ítems los recibe (`items=`). Cada builtin existe en código (`decisions/bundled.py:
# BUILTINS` y `LAZY_BUILTINS`) y cada constante vale lo mismo que en el
# código: una prueba lo verifica. El certificador lee SOLO este archivo (no
# importa el plugin).
#
#   kind    rule | state | options | view | items | floor | same
#   value   tipo del valor (si está, solo sirve a capacidades de ese tipo)
#   input   tipo de entrada que lee (si está, debe ser el de la capacidad)
#   params  parámetros que se pasan con `with:` (str | int | float | bool)
#   fields  campos que deriva una vista, o los de cada ítem (nombre → tipo)
#   keys    campos que identifican un ítem (valores del código, no texto del
#           cliente): los únicos que lleva el id de su pregunta además de {n}
#   takes_items  un estado que recibe los ítems (`items=`): el de una capacidad
#           por ítems los recibe siempre
engine_contract: 1

inputs:
  Inbound: {text: "string?", now_ms: int, synthetic: bool}
  Contacto: {transcript: string, touch_number: "int?", silence_minutes: "int?"}
  Abandono: {transcript: string, purchase_confirmed: bool, order_registered: bool}
  RespuestaDeCantidad: {last_agent_text: "string?", text: "string?", open_slot: bool}
  CiudadDeEnvio: {ciudad: "string?"}
  Botones: {body: string, titles: "tuple<string>", rule_rejected: "tuple<string>", by_id: "tuple<string>"}
  Afirmacion: {text: string, tools_used: "tuple<string>"}
  TextoAlCliente: {text: string}
  CuponEnJuego: {text: "string?"}
  CategoriaPedida: {query: string}
  ColorPedido: {color: string, producto: string}
  DatoDelItem: {actual: int}
  ProductosDeLaCharla: {text: string, titles: "tuple<string>", named: "tuple<string>"}
  TextoCatalogo: {text: string, aromas: "tuple<string>", colors: "tuple<string>"}
  OpcionesDelTexto: {text: string, products: "tuple<string>", own: "tuple<string>", labels: "tuple<string>", others: "tuple<string>"}
  VariantesDelTexto: {text: string, sheets: "tuple<string>", single: "tuple<string>"}
  PreciosDelTexto: {text: string, products: "tuple<string>", prices: "tuple<int>", policy: "tuple<int>", surcharges: "tuple<double>"}
  PagoDelTexto: {text: string, subtotal: "int?", cod_min: int, surcharges: "tuple<string>"}
  EstadoDelTexto: {text: string, order: "string?", stage: "string?", pay_status: "string?"}
  CuponDelTexto: {text: string, known: "tuple<string>", valid: "tuple<string>", valid_lines: "tuple<string>", valid_percents: "tuple<int>"}
  NegacionDelTexto: {text: string, titles: "tuple<string>", own: "tuple<string>", products: "tuple<string>"}
  CifraDelCliente: {text: string, customer: string, figures: "tuple<int>", order: "string?"}
  CajasDelPedido: {producto: string, cantidad: int, por_caja: int, precio: "int?", charla: string}
  PedidoPorMayor: {charla: string, cifras: "tuple<int>", productos: "tuple<string>", por_caja: "tuple<int>"}
  CajaNombrada: {producto: string, por_caja: int, otro: string, otro_por_caja: int, charla: string}
  TextCheck: {text: string, extended: bool}
  GreetingCheck: {first_contact: bool, tools_used: "tuple<string>", client_texts: "tuple<string>"}
  Frases: {parts: "tuple<string>"}
  OracionesPrecio: {sentences: "tuple<string>"}
  DatosDelPedido: {}
  PedidoDelCliente: {text: string}
  PreambuloCheck: {text: string}
  OracionesCheck: {parts: "tuple<string>"}
  PortavelasCheck: {text: string, order_registered: bool, portavelas_included: "bool?"}

constants:
  # messagingkit: la pausa abierta de «yo les escribo cuando…».
  DEFERRAL_KIND_OPEN: {type: string, value: abierto}
  OPEN_DEFERRAL_MS: {type: int, value: 604800000}
  # variant_enumeration: cuántas etiquetas hacen una lista para el selector.
  MIN_ENUMERATED: {type: int, value: 4}

# El dominio de la tienda que trae cada paquete (`<paquete>/domain.yaml`): lo
# que es de UNA tienda y no de la inteligencia. Las condiciones lo leen como
# `dom.campo`; el agente, con `chats/shared/store_pack.py` (los ejemplos de
# sus herramientas y del gancho de remarketing). Un campo nuevo aquí exige
# el valor en el dominio de cada paquete (DB014).
domain:
  store_name: string
  # Los productos que se cobran por caja y cuántas velas trae cada caja
  # (`set_order_slot`, capacidad `cajas`; 2026-10-14: solo las velas de
  # deseos). Opcional: sin él, nada se cobra por caja.
  sold_by_box: "list<{producto: string, por_caja: int}>?"
  # La despedida si todo el texto hablaba del portavelas (el cliente que acaba
  # de dar sus datos nunca recibe silencio). La MISMA del workflow V1.
  farewell_order_registered: string
  vocabulary:
    search_examples: string                   # search_products: «para filtrar (ej: …)»
    product_example: string                   # set_order_slot.producto
    scent_example: string                     # set_order_slot.aroma
    notes_examples: string                    # set_order_slot.notas
    variant_label_examples: string            # register_order.items[].variant_label
    caption_example: string                   # present_product_detail.caption_suffix
    list_intro_example: string                # present_products.body
    tax_note: string                          # present_order_confirmation.tax
    variant_question: string                  # sin más fotos: «pregúntale al cliente …»
    variant_dimensions: string                # «invítalo a elegir …», «4 o más opciones de …»
    variant_kinds: string                     # present_variant_picker: «variante (…)»
    variant_reply_examples: string            # lo que responde el cliente al selector
    variant_label_literal_examples: string    # present_variant_picker.options[].label
    picker_intro_examples: string             # present_variant_picker.intro_text
    hook_topic_examples: string               # gancho de remarketing: el anclaje al motivo
    hook_examples: "list<string>"             # gancho de remarketing: ejemplos de buen gancho
    # Remarketing del cliente que pidió, vio el catálogo y se calló (2026-10-13).
    # Opcionales: sin ellos, el gancho de siempre.
    hook_examples_explain: "list<string>?"    # 1er toque: le explica lo que vio
    practical_facts: "string?"                # 2º toque: envío, tiempos y pago (la única fuente)
    hook_examples_practical: "list<string>?"  # 2º toque: ejemplos
    # Cómo corrige el bot algo que le dijo mal al cliente (los hechos, 2026-10-14).
    # Opcionales: sin ellos, la corrección sin tono de la tienda.
    correction_tone: "string?"                # el tono de la corrección (suave, sin regaño)
    correction_examples: "list<string>?"      # ejemplos de corregir un precio
    sum_correction_examples: "list<string>?"  # ejemplos de corregirle una suma al cliente

builtins:
  # ── reglas ──
  constant_false:
    kind: rule
    value: bool
    doc: "Siempre false: sin Jev, todo sigue como hoy."
  constant_empty:
    kind: rule
    value: string
    doc: "Siempre \"\": decide el LLM (cierre por abandono)."
  opt_out_text:
    kind: rule
    value: bool
    input: Inbound
    doc: "La frase explícita de baja (messagingkit.is_opt_out_text) sobre el texto que escribió el cliente."
  reengagement:
    kind: rule
    input: Inbound
    doc: "El aplazamiento con fecha y la cortesía de hoy (messagingkit.parse_reengagement_deferral / is_courtesy_text)."
  reply_quantity:
    kind: rule
    input: RespuestaDeCantidad
    doc: "La cantidad que la regla lee en la respuesta (`read_reply_quantity`)."
  shipping_zone:
    kind: rule
    input: CiudadDeEnvio
    doc: "«bogota» si la ciudad lo dice; si no, no se sabe (`shipping_zone`)."
  rule_rejected_titles:
    kind: rule
    input: Botones
    doc: "Los botones que ya rechazó el vocabulario del catálogo."
  promises_a_handoff:
    kind: rule
    value: bool
    input: TextoAlCliente
    doc: "Las frases del relevo (un colega te contacta, coordina contigo…)."
  purchase_signal:
    kind: rule
    value: "list<string?>"
    input: Inbound
    doc: "[tipo, fuente] de classify_inbound_purchase_signal: carrito y botón «Confirmar» son estructurales; el texto lo lee la regla de hoy."
  closing_ack:
    kind: rule
    value: bool
    input: Inbound
    doc: "El acuse de hoy (is_closing_ack) sobre el texto tal como llega."
  coupon_in_play:
    kind: rule
    value: bool
    input: CuponEnJuego
    doc: "coupon_in_play: ante la duda dice que sí (cuesta una relectura del cupo, nunca una venta)."
  category_of_query:
    kind: rule
    input: CategoriaPedida
    doc: "{categoria: slug | null} de resolve_category (exacto → contenido → parecido ≥ 0,80)."
  color_family:
    kind: rule
    input: ColorPedido
    doc: "La resolución de la tabla de familias del tenant (resolve_color_family)."
  order_item_for_values:
    kind: rule
    input: DatoDelItem
    doc: "{item, producto}: el ítem en curso, salvo que su producto rechace los datos y otro los acepte."
  named_titles:
    kind: rule
    value: "tuple<string>"
    input: ProductosDeLaCharla
    doc: "Los títulos que la charla nombra tal cual."
  enumerated_variants:
    kind: rule
    input: TextoCatalogo
    doc: "(dimensión, etiquetas) de find_enumerated_variants, o ()."
  admin_leak:
    kind: rule
    value: bool
    input: TextCheck
    doc: "Huele a parte interno (looks_like_admin_leak con el set que pide la entrada)."
  first_contact_greeting:
    kind: rule
    value: bool
    input: GreetingCheck
    doc: "should_send_first_contact_greeting con las entradas del V1."
  no_items:
    kind: rule
    doc: "Siempre (): hoy nada se marca (monto, datos)."
  breaks_persona:
    kind: rule
    value: "tuple<int>"
    input: Frases
    doc: "Las oraciones que hoy rompen la persona (breaks_human_persona)."
  unavailable_terms_rule:
    kind: rule
    value: "list<string>"
    input: PedidoDelCliente
    doc: "Los términos que el cliente pide y no están en el catálogo (unavailable_terms)."
  unexplained_prices_rule:
    kind: rule
    value: "list<string>"
    input: PreciosDelTexto
    params: {politica: str}
    doc: "Los montos del texto que no explica el precio del catálogo de los productos de los que habla (por cantidad, sumas, en vivo, con descuento o con el recargo del link) ni la política en una oración con una frase de `politica` (price_quotes.find_unexplained_amounts). Frases del paquete (fact_rules.phrases)."
  pack_quantity_rule:
    kind: rule
    value: string
    input: CajasDelPedido
    doc: "Sin Jev: desde una caja entera (24 de 12) no se sabe si la cantidad es de cajas o de velas → «duda» (el texto vuelve al modelo con las dos cuentas); menos, «cajas» (pack_quantity.needs_reading)."
  bulk_candles_rule:
    kind: rule
    value: string
    input: PedidoPorMayor
    doc: "Sin Jev: con una cifra del cliente que pasa de 20 pero, contada en velas, cabe en 20 cajas o menos («36 velitas» = 3 cajas de 12), no se sabe si es al por mayor → «duda» (el bot lo revisa una vez con las cuentas); sin ella, «por_mayor» (pack_quantity.candle_counts)."
  named_box_rule:
    kind: rule
    value: string
    input: CajaNombrada
    doc: "Sin Jev no se sabe si el cliente pide el producto que va a anotar el asesor o el de la caja que nombró («Dos cajas de 12» y la ondulada trae 10) → «duda» (el bot lo revisa una vez; pack_quantity.other_box_named)."
  foreign_labels_rule:
    kind: rule
    value: "list<string>"
    input: OpcionesDelTexto
    params: {ofrece: str, no_ofrece: str}
    doc: "La regla sola: las etiquetas del catálogo (aromas o colores) que nombra una oración que ofrece (una frase de `ofrece`, ninguna de `no_ofrece`) y no son del producto del que habla (product_truth.foreign_labels). Frases del paquete separadas por comas (fact_rules.phrases): `*` = cualquier final, `a/b` = una u otra palabra, `…` = hasta tres palabras en medio."
  model_preamble:
    kind: rule
    value: string
    input: PreambuloCheck
    doc: "La muletilla del meta-prefijo de hoy (strip_model_preamble)."
  admin_leak_per_part:
    kind: rule
    value: "tuple<int>"
    input: OracionesCheck
    doc: "Las oraciones que huelen a parte interno (looks_like_admin_leak básico, por oración)."
  salvage:
    kind: rule
    value: string
    input: TextCheck
    doc: "Lo que queda para el cliente (salvage_customer_text con el set extendido)."
  portavelas_notice:
    kind: rule
    value: string
    input: PortavelasCheck
    doc: "En un pedido sin portavelas, borra lo que lo nombra (strip_portavelas_notice) o la despedida aprobada."
  # ── estado ──
  customer_message:
    kind: state
    input: Inbound
    params: {header: str}
    doc: "«<header>» y «[1] <mensaje>». Sin texto del cliente (vacío o escrito por la visión), no se pregunta."
  customer_message_with_window:
    kind: state
    input: Inbound
    doc: "Lo que el cliente vio antes (CONTEXTO) y «MENSAJE DEL CLIENTE [1] …». Sin texto del cliente, no se pregunta."
  text_template:
    kind: state
    params: {template: str, required: str}
    doc: "`template` con {<required>} = ese campo de la entrada sin espacios de más; campo vacío = no se pregunta."
  proactive_touch:
    kind: state
    input: Contacto
    doc: "La conversación y el toque de la escalera / el silencio, antes de un mensaje proactivo."
  abandoned_chat:
    kind: state
    input: Abandono
    doc: "La conversación que el cliente dejó y lo que la tienda ya sabe del pedido."
  quantity_reply:
    kind: state
    input: RespuestaDeCantidad
    doc: "El último mensaje del asesor (recortado por el principio) y la respuesta; sin hueco de cantidad, no se pregunta."
  buttons_message:
    kind: state
    input: Botones
    doc: "El mensaje y sus botones; sin botones, no se pregunta."
  sent_message_with_tools:
    kind: state
    input: Afirmacion
    doc: "Lo que el turno envió y las herramientas que consultó."
  purchase_context:
    kind: state
    input: Inbound
    doc: "CONTEXTO, HECHOS DEL PEDIDO y ESTE MENSAJE; solo si la regla lee el texto (ni carrito ni botón)."
  message_after_close:
    kind: state
    input: Inbound
    doc: "Lo que el cliente vio (la conversación ya cerrada) y su mensaje; sin contexto a la vista, no se pregunta."
  coupon_talk:
    kind: state
    input: CuponEnJuego
    doc: "El cupón aplicado y sus productos, el contexto y el mensaje; sin cupón que dependa del texto, no se pregunta."
  category_request:
    kind: state
    input: CategoriaPedida
    doc: "La categoría que pidió el cliente y las del catálogo; sin pedido o sin categorías, no se pregunta."
  color_request:
    kind: state
    input: ColorPedido
    doc: "El producto, sus colores y el color que pidió el cliente."
  order_item_data:
    kind: state
    input: DatoDelItem
    doc: "Los productos que aceptan los datos y lo último de la conversación; con menos de dos, no se pregunta."
  chat_and_catalog:
    kind: state
    input: ProductosDeLaCharla
    doc: "La charla del gancho y los títulos del catálogo."
  text_with_lists:
    kind: state
    input: TextoCatalogo
    doc: "El texto para el cliente, solo si enumera una lista de aromas o colores que decidir."
  greeting_texts:
    kind: state
    input: GreetingCheck
    doc: "Los mensajes del primer contacto, solo si el turno le manda algo al cliente (como mucho 8)."
  numbered_items:
    kind: state
    takes_items: true
    params: {header: str, max: int}
    doc: "«<header>» y los ítems numerados ([1] …); sin ítems o con más de `max`, no se pregunta."
  leading_sentences_state:
    kind: state
    takes_items: true
    input: PreambuloCheck
    doc: "Las primeras oraciones del texto (hasta 5, «[…]» si hay más); con menos de dos, no se pregunta."
  conversation_for_slots:
    kind: state
    takes_items: true
    input: DatosDelPedido
    doc: "Lo último de la conversación, si algún dato no está en las palabras del cliente."
  customer_order_text:
    kind: state
    takes_items: true
    input: PedidoDelCliente
    doc: "El mensaje del cliente, si la regla propone algún término."
  text_and_product_labels:
    kind: state
    takes_items: true
    input: OpcionesDelTexto
    params: {noun: str}
    doc: "El texto para el cliente con los productos de los que habla y lo que tienen (`noun`: aromas, colores), si la regla propone algo ajeno."
  text_and_product_prices:
    kind: state
    takes_items: true
    input: PreciosDelTexto
    doc: "El texto para el cliente con los productos de los que habla y su precio del catálogo, si la regla propone algún monto."
  text_and_claim_facts:
    kind: state
    takes_items: true
    doc: "El texto para el cliente con lo que dice el sistema de cada cosa que la regla propone (pago, estado, cupón, negación)."
  pack_quantity_state:
    kind: state
    input: CajasDelPedido
    doc: "Lo último de la charla (cliente y asesor) y las dos cuentas de la cantidad («24 cajas = 288 velas, $600.000» / «24 velas = 2 cajas, $50.000»); sin una caja entera o sin lo que escribió el cliente, no se pregunta."
  bulk_candles_state:
    kind: state
    input: PedidoPorMayor
    doc: "Lo último de la charla (con la nota del asesor para el colega), lo que se cobra por caja y las cifras del cliente contadas en velas en cada caja («36 velas = 3 cajas»); sin cifras o sin lo que escribió el cliente, no se pregunta."
  named_box_state:
    kind: state
    input: CajaNombrada
    doc: "Lo último de la charla, el producto que va a anotar el asesor con su caja y el de la caja que nombró el cliente; sin lo que escribió el cliente, no se pregunta."
  customer_and_reply_facts:
    kind: state
    takes_items: true
    input: CifraDelCliente
    doc: "Lo que escribió el cliente, lo que la tienda le va a responder y lo que dice el sistema de su pedido, si la regla propone alguna cifra."
  text_and_option_sheets:
    kind: state
    input: VariantesDelTexto
    params: {words: str, ofrece: str}
    doc: "El texto para el cliente con la ficha de cada producto con presentaciones para escoger si el texto ofrece algo (una frase de `ofrece`, fact_rules.phrases) o nombra una de `words` (palabras de presentación de la tienda, separadas por comas), y la de los de una sola presentación solo con una de `words`; sin ninguna ficha, no se pregunta."
  # ── ítems ──
  items_of:
    kind: items
    params: {field: str}
    fields: {text: string}
    doc: "Un ítem por cada texto del campo `field` de la entrada."
  paragraphs:
    kind: items
    input: TextCheck
    fields: {text: string}
    doc: "Los párrafos del texto (corte mecánico por línea en blanco)."
  sentences:
    kind: items
    input: PortavelasCheck
    fields: {text: string}
    doc: "Las oraciones del texto (corte mecánico)."
  leading_sentences:
    kind: items
    input: PreambuloCheck
    fields: {text: string, askable: bool, preamble: string, cut_ok: bool}
    doc: "Las oraciones con lo que se cae si se corta hasta cada una (preamble) y si lo que queda no empieza a mitad de frase (cut_ok)."
  order_slot_values:
    kind: items
    input: DatosDelPedido
    fields: {slot: string, value: string, ask: bool, personal: bool, label: string}
    keys: [slot]                # el nombre del dato (ciudad, direccion…): lo pone el código, no el cliente
    doc: "Los datos de envío y pago a guardar; ask = no está en las palabras del cliente; personal = Jev lo ve tapado."
  unavailable_term_items:
    kind: items
    input: PedidoDelCliente
    fields: {term: string}
    doc: "Un ítem por término que la regla propone."
  unexplained_price_items:
    kind: items
    input: PreciosDelTexto
    params: {politica: str}
    fields: {term: string}
    doc: "Un ítem por monto que la regla propone («$23.000»)."
  payment_claim_items:
    kind: items
    input: PagoDelTexto
    params: {ofrece_contra_entrega: str, regla_general: str, habla_de_recargo: str, no_es_recargo: str, habla_del_link: str, sin_recargo: str}
    fields: {term: string, fact: string}
    doc: "Contra entrega ofrecida a un pedido que no llega al mínimo, o un recargo del link distinto del configurado: lo que dice el texto (term) y lo cierto (fact). Frases del paquete separadas por comas (fact_rules.phrases): `*` = cualquier final, `a/b` = una u otra palabra, `…` = hasta tres palabras en medio; sin tildes ni mayúsculas."
  status_claim_items:
    kind: items
    input: EstadoDelTexto
    params: {pago_confirmado: str, despachado: str, entregado: str, todavia_no: str}
    fields: {term: string, fact: string}
    doc: "El pago dado por confirmado o el pedido dado por despachado o entregado cuando OrderFacts dice otra cosa: lo que dice el texto (term) y lo cierto (fact). Las mismas frases deciden si se consulta el pedido. Frases del paquete separadas por comas (fact_rules.phrases): `*` = cualquier final, `a/b` = una u otra palabra, `…` = hasta tres palabras en medio; sin tildes ni mayúsculas."
  coupon_claim_items:
    kind: items
    input: CuponDelTexto
    params: {nombra_codigo: str, habla_de_descuento: str, no_es_descuento: str}
    fields: {term: string, fact: string}
    doc: "Un código que no está vigente o un porcentaje que ningún cupón vigente da: lo que dice el texto (term) y lo cierto (fact). Las mismas frases deciden si se consultan los cupones. Frases del paquete separadas por comas (fact_rules.phrases): `*` = cualquier final, `a/b` = una u otra palabra, `…` = hasta tres palabras en medio; sin tildes ni mayúsculas."
  denial_claim_items:
    kind: items
    input: NegacionDelTexto
    params: {niega_tener: str, niega_venir: str, no_es_negacion: str}
    fields: {term: string, fact: string}
    doc: "Lo que el texto niega tener y el catálogo sí tiene: lo que dice el texto (term) y lo cierto (fact). Los verbos van detrás de «no», «ya no», «tampoco» o «ni». Frases del paquete separadas por comas (fact_rules.phrases): `*` = cualquier final, `a/b` = una u otra palabra, `…` = hasta tres palabras en medio; sin tildes ni mayúsculas."
  customer_figure_items:
    kind: items
    input: CifraDelCliente
    fields: {term: string, fact: string}
    doc: "Las cifras de dinero que escribió el cliente («$45.000», «45 mil») y no son ninguna de las de su pedido (precios, líneas, subtotal, con envío, el total registrado): la cifra (term) y lo que suma su pedido (fact). Sin lo que suma su pedido, ninguna (fact_rules.customer_figures)."
  foreign_label_items:
    kind: items
    input: OpcionesDelTexto
    fields: {term: string}
    doc: "Un ítem por etiqueta ajena que el texto nombra (la del catálogo), en cualquier oración: lo que juzga Jev."
  # ── opciones de la entrada ──
  catalog_categories:
    kind: options
    input: CategoriaPedida
    doc: "Una opción por categoría: etiqueta = su nombre, valor = su slug."
  product_colors:
    kind: options
    input: ColorPedido
    doc: "Una opción por color del producto; valor = la resolución (familia del tenant, tono a confirmar)."
  accepting_items:
    kind: options
    input: DatoDelItem
    doc: "item_<n> por producto del pedido que acepta los datos; valor = {item, producto}."
  catalog_titles:
    kind: options
    input: ProductosDeLaCharla
    doc: "Una opción por título del catálogo; valor = el título."
  # ── vistas ──
  purchase_window:
    kind: view
    input: Inbound
    fields: {context: bool, asked_known: "string?"}
    doc: "Si el cliente vio algo antes y qué se le preguntó cuando lo último fue una tarjeta (confirmar_compra, …)."
  reply_gap:
    kind: view
    input: Inbound
    fields: {opens_episode: bool, hours_since_store: "int?"}
    doc: "Si este mensaje abrió el episodio activo y las horas enteras desde el último mensaje de la tienda (por su timestamp; null si nunca escribió)."
  enumeration_found:
    kind: view
    input: TextoCatalogo
    fields: {found_scents: "tuple<string>", found_colors: "tuple<string>"}
    doc: "Los aromas y colores del catálogo que el texto enumera."
  # ── pisos ──
  jev:
    kind: floor
    doc: "Sin piso: decide lo que dijo Jev."
  rule_or_jev:
    kind: floor
    value: bool
    doc: "Piso: lo que dijo la regla nunca se quita; Jev solo agrega."
  closing_invariants:
    kind: floor
    value: string
    input: Abandono
    doc: "Pedido registrado = COMPRA_EXITOSA; COMPRA_EXITOSA sin pedido no existe; CONFIRMADO_SIN_DATOS sin confirmar = INTERESADO."
  jev_and_button_ids:
    kind: floor
    input: Botones
    doc: "Lo de Jev más los botones cuyo id delata un selector (product., color.)."
  jev_without_question_mark:
    kind: floor
    value: bool
    doc: "Lo de Jev, salvo que el mensaje tenga signo de pregunta (nunca se absorbe)."
  rule_if_same_key:
    kind: floor
    params: {key: str}
    doc: "Si Jev coincide con la regla en `key`, queda el detalle de la regla."
  rule_then_jev:
    kind: floor
    doc: "Lo de la regla nunca se quita; Jev solo suma (sin repetir)."
  no_enumeration_with_combinations:
    kind: floor
    input: TextoCatalogo
    doc: "Las combinaciones «Color · Aroma» de un cupón nunca van al selector."
  rule_order_subset:
    kind: floor
    doc: "Jev solo quita: queda lo de la regla que Jev dejó, en su orden."
  persona_floor:
    kind: floor
    input: Frases
    doc: "Las frases de la regla que ninguna lectura deja pasar (asistente virtual, humano…) siempre se caen."
  strong_preamble:
    kind: floor
    value: string
    input: PreambuloCheck
    doc: "Los prefijos que casi nunca abren una oración legítima («Final answer:») siempre se van."
  # ── comparadores ──
  bool_eq:
    kind: same
    value: bool
    doc: "Dos decisiones coinciden si son el mismo bool."
  text_eq:
    kind: same
    doc: "El mismo texto (null = vacío)."
  truthy_eq:
    kind: same
    doc: "Las dos dicen algo, o las dos nada."
  key_eq:
    kind: same
    params: {key: str}
    doc: "El mismo valor en la llave `key` del registro."
  deferral_and_courtesy_eq:
    kind: same
    doc: "El mismo tipo de aplazamiento y la misma cortesía."
  first_eq:
    kind: same
    doc: "El mismo primer elemento ([tipo, fuente]: el mismo tipo)."
  set_eq:
    kind: same
    doc: "Los mismos elementos, sin importar el orden."
  tuple_eq:
    kind: same
    doc: "La misma tupla (null = vacía)."
  sorted_eq:
    kind: same
    doc: "Los mismos elementos ordenados (índices)."

# Las capacidades que el código del motor le pide a un paquete de ventas: un
# paquete tiene que traerlas todas (DB003). Sin esto, el resolutor corría en
# silencio la clase de Python de la que faltara (la inteligencia de velas).
capabilities: [acuse, afirmacion, baja, cantidad, categoria, cierre, compra, contactar, cortesia, cupon, datos, destinatario, destinatario_oracion, destinatario_plantilla, enumeracion, familia_de_color, fuera_de_catalogo, item_del_pedido, monto, persona, portavelas, preambulo, producto_nombrado, relevo, rescate, retoma, saludo, selector, zona_de_envio]

# Las que el código pide desde una versión del paquete: las versiones
# publicadas antes no las traen (no se editan) y siguen certificando; con
# ellas el código no las corre (`registry.capability_if_present`). Desde esa
# versión, un paquete sin ella no certifica (DB003).
capabilities_since:
  # Incidente 2026-10-13: el bot le ofreció a las Velas de deseos aromas de la
  # Plegaria de Luz. Las tres las pide `send_reply` antes de enviar.
  aroma_ajeno: 7
  color_ajeno: 7
  variante_ajena: 7
  precio_ajeno: 7
  pago_ajeno: 7
  estado_ajeno: 7
  cupon_ajeno: 7
  negacion_falsa: 7
  # Laboratorio del 2026-10-14: el cliente afirma una suma equivocada y el bot
  # le da la razón («Así es»). La pide `send_reply` con las demás.
  cifra_del_cliente: 7
  # Laboratorio de ···0686 (2026-10-14): «Dos cajas de 12» se anotó 24. La
  # pide `set_order_slot` al anotar la cantidad de un producto que va por caja.
  cajas: 7
  # El mismo día: «Dos cajas de 12» y se anotó la ondulada, que trae 10 (la pide
  # `set_order_slot` al anotar por primera vez un producto que va por caja), y
  # «me vendes 36 velitas?» se pasó a un colega como por mayor (la pide
  # `escalate_to_human` con BULK_ORDER).
  caja_nombrada: 7
  por_mayor: 7

# El motor de ventas le pasa los ítems (`items=`) al estado de una capacidad
# por ítems (`BundledCapability.ask`): ese estado tiene que recibirlos.
items_to_state: true

required_floors:
  # La baja explícita es un piso legal: achicarlo es decisión del operador.
  baja: rule_or_jev
  # Las frases del relevo son piso: si el texto promete un colega, se escala.
  relevo: rule_or_jev
  # Los invariantes del pedido nunca los decide Jev.
  cierre: closing_invariants

# La REGLA de esas mismas capacidades: es la que decide si Jev duda, cae o el
# proveedor está en reglas. Cambiarla apagaría el piso por otro lado (premortem
# 2026-10-02: `rule: constant_false` en la baja certificaba).
required_rules:
  baja: opt_out_text
  relevo: promises_a_handoff

# El vocabulario del turno (PAQUETES_DE_DECISION.md F7): lo que el `turn.yaml`
# de un paquete puede nombrar. Con esto, cada paquete trae su turno: la ráfaga
# ① (el cuestionario que Jev contesta antes del turno), ③ y las tablas de la
# política. Cada nombre existe en el código del agente: una prueba lo verifica
# (`test_decisions_turn_bundle.py`).
turn:
  policies:
    # `decisions/policies/turno_v3.py`: arma el plan, la lectura del hilo, el
    # contrato y la guía de etapas con las tablas del paquete.
    turno-v3:
      thresholds: [detect, covered, answers, purchase_confirm, purchase_retract, given]
      # Las preguntas fijas que lee el código de la política (las del contrato
      # las certifica cada fila: `p['…']` tiene que ser una pregunta sí/no).
      reads:
        noul: [thread.answers_bot, variantes.elige, etapa.cambia_producto, datos.ciudad, datos.direccion, datos.telefono,
               datos.nombre_recibe, datos.metodo_pago, cierre.confirma_resumen, cierre.pide_cambio,
               postcierre.pregunta_pedido, postcierre.comprobante]
        choice: [thread.bot_asked, thread.answer]
      topic_question: "topic.{topic}"
      message_question: "msg.{k}.topic"
      verify_question: "cover.{topic}"
      reading: {asked: thread.bot_asked, answer: thread.answer}
    # `decisions/policies/turno_v4.py`: la de `turno-v3` con el producto desde
    # el que escribe el cliente (ficha del catálogo o página de la web) en el
    # paso de descubrimiento (2026-10-07). Lee lo mismo que `turno-v3`.
    turno-v4:
      thresholds: [detect, covered, answers, purchase_confirm, purchase_retract, given]
      reads:
        noul: [thread.answers_bot, variantes.elige, etapa.cambia_producto, datos.ciudad, datos.direccion, datos.telefono,
               datos.nombre_recibe, datos.metodo_pago, cierre.confirma_resumen, cierre.pide_cambio,
               postcierre.pregunta_pedido, postcierre.comprobante]
        choice: [thread.bot_asked, thread.answer]
      topic_question: "topic.{topic}"
      message_question: "msg.{k}.topic"
      verify_question: "cover.{topic}"
      reading: {asked: thread.bot_asked, answer: thread.answer}
    # `decisions/policies/turno_v5.py`: la de `turno-v4` con el paso de
    # post-venta del comprobante: mirar el pago con `check_order_status` en vez
    # de «el equipo revisa el pago» (caso pedido #64, 2026-10-09). Lee lo mismo.
    turno-v5:
      thresholds: [detect, covered, answers, purchase_confirm, purchase_retract, given]
      reads:
        noul: [thread.answers_bot, variantes.elige, etapa.cambia_producto, datos.ciudad, datos.direccion, datos.telefono,
               datos.nombre_recibe, datos.metodo_pago, cierre.confirma_resumen, cierre.pide_cambio,
               postcierre.pregunta_pedido, postcierre.comprobante]
        choice: [thread.bot_asked, thread.answer]
      topic_question: "topic.{topic}"
      message_question: "msg.{k}.topic"
      verify_question: "cover.{topic}"
      reading: {asked: thread.bot_asked, answer: thread.answer}
  # Los hechos del turno que filtran las preguntas (`when`): `TurnContext.when_facts`.
  facts:
    has_context: [true, false]
    bot_asked_known: [null, confirmar_compra, confirmar_dato_envio]
    stage: [null, etapa_descubrimiento, etapa_variantes, etapa_datos_envio, etapa_cierre, etapa_postcierre]
  # Lo que leen las filas del contrato como `inp.campo`.
  inputs:
    stage: "string?"
  # Las etapas que calcula el código (`context.STAGE_LABELS`) y los datos de envío (`SHIPPING_SLOTS`).
  stages: [etapa_descubrimiento, etapa_variantes, etapa_datos_envio, etapa_cierre, etapa_postcierre]
  slots: [ciudad, direccion, telefono, nombre_recibe, metodo_pago]
  # Las tools del agente de ventas (las que el contrato y la regla ② pueden nombrar).
  tools: [apply_coupon, check_order_status, escalate_to_human, get_product_by_handle, list_categories, list_promotions,
          load_skill, manage_conversation_tag, present_order_confirmation, present_product_detail, present_product_gallery,
          present_products, present_variant_picker, react_to_message, register_order, request_shipping_details,
          search_products, send_contact_card, send_cta_url, send_quick_replies, send_reply, send_shipping_rates,
          set_order_slot, verify_order_for_checkout]

# Qué resuelve cada decisión y en qué parte del software actúa (Calidad LLM →
# «Motor de decisiones», 2026-10-02). Lo lee el operador: español llano, sin
# códigos. `places` va en el orden de una conversación; cada decisión que el
# código pide (`capabilities`) trae su `about` o el paquete no certifica.
places:
  ingest: Al leer cada mensaje del cliente
  antes_del_turno: Antes de que el bot responda
  herramientas: Dentro de las herramientas del bot
  antes_de_enviar: Antes de enviar la respuesta
  despues_de_enviar: Después de enviar la respuesta
  remarketing: En los mensajes de seguimiento (remarketing)
  cierre: Al cerrar una conversación abandonada

about:
  compra:
    name: Compra confirmada
    where: [ingest]
    solves: >-
      Decide si el cliente de verdad confirmó la compra. Evita tomar como
      confirmación un «sí» que respondía otra cosa: el pedido solo avanza
      cuando el cliente confirma lo que el asesor le preguntó.
  retoma:
    name: Retomar después
    where: [ingest]
    solves: >-
      Detecta cuando el cliente dice que escribirá más adelante y pausa los
      mensajes de seguimiento hasta esa fecha, sin confundir un «más tarde»
      del mismo día ni un simple gracias con un aplazamiento.
  baja:
    name: Baja de mensajes
    where: [ingest]
    solves: >-
      Reconoce cuando el cliente pide no recibir más mensajes o promociones,
      aunque lo diga con otras palabras («no me escriban», «elimínenme de la
      lista»). Es un requisito legal: la frase explícita siempre cuenta.
  cortesia:
    name: Cortesía sin venta
    where: [ingest]
    solves: >-
      Reconoce cuando el cliente solo agradece o saluda, para responderle
      breve y cálido en vez de volver a ofrecerle productos.
  acuse:
    name: Acuse tras la despedida
    where: [ingest]
    solves: >-
      Cuando el bot ya se despidió y el cliente solo contesta «gracias» o un
      emoji, evita que el bot vuelva a escribir y reabra la conversación. Un
      mensaje con una pregunta siempre despierta al bot.
  cupon:
    name: Cupón
    where: [ingest]
    solves: >-
      Decide si el mensaje habla del cupón o del descuento, para revisar el
      cupo y avisarle al bot solo cuando hace falta («código postal» no es el
      cupón; «¿sigue el beneficio?» sí lo es).
  fuera_de_catalogo:
    name: Fuera del catálogo
    where: [ingest, remarketing]
    solves: >-
      Avisa al bot cuando el cliente pide algo que no existe en el catálogo,
      para que no lo invente ni lo prometa. Jev quita los avisos falsos (una
      ciudad, una fecha, el nombre de una persona).
  cantidad:
    name: Cantidad
    where: [antes_del_turno]
    solves: >-
      Lee cuántas unidades pidió el cliente cuando el asesor se lo preguntó,
      para anotarlas en el pedido. Solo anota con certeza: una cantidad
      equivocada es peor que volver a preguntar.
  categoria:
    name: Categoría
    where: [herramientas]
    solves: >-
      Entiende a qué categoría del catálogo se refiere el cliente cuando no
      usa el nombre exacto («velas de santos» son las religiosas), para que
      el bot busque en el lugar correcto.
  familia_de_color:
    name: Color pedido
    where: [herramientas]
    solves: >-
      Lleva el color que dijo el cliente al color real del producto («bordó»
      es el rojo, «oro» es el dorado) y avisa cuando ese color no existe para
      ese producto.
  item_del_pedido:
    name: Producto del pedido
    where: [herramientas]
    solves: >-
      En un pedido con varios productos, decide a cuál van el aroma, el color
      o el diseño que dio el cliente, para no anotarlos en el producto
      equivocado.
  datos:
    name: Datos de envío
    where: [herramientas]
    solves: >-
      Antes de guardar un dato de envío o de pago, confirma que el cliente de
      verdad lo dio. Evita guardar datos que el bot supuso o inventó.
  zona_de_envio:
    name: Zona de envío
    where: [herramientas]
    solves: >-
      Decide si la ciudad del envío es Bogotá (con sus municipios cercanos) o
      envío nacional, para cobrar la tarifa correcta: Chía es cercana y
      Medellín es nacional.
  selector:
    name: Botones para elegir
    where: [herramientas]
    solves: >-
      Revisa los botones que el bot quiere mostrar: los que piden elegir un
      producto o una variante que no corresponde se quitan, para que el
      cliente no elija algo que no existe.
  aroma_ajeno:
    name: Aromas de otro producto
    where: [herramientas]
    solves: >-
      Antes de enviar, revisa que los aromas que el bot nombra sean del
      producto del que habla. Si le ofrece a un producto un aroma que es de
      otro, el bot corrige el mensaje con los aromas reales antes de que
      salga. Jev quita los avisos falsos (cuando habla de otro producto o dice
      que no lo tiene).
  color_ajeno:
    name: Colores de otro producto
    where: [herramientas]
    solves: >-
      Antes de enviar, revisa que los colores que el bot nombra sean del
      producto del que habla. Si le ofrece a un producto un color que es de
      otro, el bot corrige el mensaje con los colores reales antes de que
      salga. Jev quita los avisos falsos (otro producto, el color de la caja).
  precio_ajeno:
    name: Precio que no es el del catálogo
    where: [herramientas]
    solves: >-
      Antes de enviar, revisa que el precio que el bot le dice al cliente sea
      el del catálogo para el producto del que habla (por unidad o por la
      cantidad, con el descuento que tenga). Si no, el bot corrige el mensaje
      con el precio real. Jev quita los avisos falsos (un total con envío, lo
      que le falta para un mínimo).
  pago_ajeno:
    name: Pago que no aplica al pedido
    where: [herramientas]
    solves: >-
      Antes de enviar, revisa lo que el bot dice del pago: no le ofrece
      contra entrega a un pedido que no llega al mínimo, ni un recargo del
      link de pago distinto del vigente. La regla solo propone: decide Jev
      (lo dicho como regla general o que no aplica no cuenta).
  estado_ajeno:
    name: Estado del pedido que no es cierto
    where: [herramientas]
    solves: >-
      Antes de enviar, revisa que lo que el bot dice del pedido coincida con
      el sistema: no le dice que el pago quedó confirmado, que ya salió o
      que ya llegó si no es así. La regla solo propone: decide Jev (lo que
      le avisan después no cuenta).
  cupon_ajeno:
    name: Cupón que no está vigente
    where: [herramientas]
    solves: >-
      Antes de enviar, revisa que el cupón o el descuento que el bot ofrece
      esté vigente (no el que ya venció, ni un porcentaje que ningún cupón
      da). El bot corrige con los cupones vigentes. Solo con Jev.
  negacion_falsa:
    name: Negar lo que sí tenemos
    where: [herramientas]
    solves: >-
      Antes de enviar, revisa que el bot no le diga al cliente que no
      tenemos un producto, un aroma, un color o una presentación que el
      catálogo sí tiene. Si de verdad está agotado hoy, el bot puede
      dejarlo como está. La regla solo propone: decide Jev.
  cajas:
    name: Cajas o velas
    where: [herramientas]
    solves: >-
      Al anotar la cantidad de un producto que se cobra por caja (las velas de
      deseos traen 12 o 10), si el número llega a una caja entera, Jev lee lo
      que escribió el cliente y dice si pidió cajas o velas: «Dos cajas de 12»
      son 2 cajas, no 24. Si no está claro, el bot lo revisa o le pregunta.
  caja_nombrada:
    name: La caja que nombró el cliente
    where: [herramientas]
    solves: >-
      Al anotar por primera vez un producto que se cobra por caja, si el
      cliente nombró el tamaño de la caja de otro («Dos cajas de 12» y el bot
      iba a anotar las onduladas, que traen 10), Jev lee la charla y dice si
      pide ese producto o el de la otra caja. Si no está claro, el bot lo
      revisa una vez.
  por_mayor:
    name: Por mayor o velas sueltas
    where: [herramientas]
    solves: >-
      Antes de pasar un caso a un colega como pedido al por mayor, si el
      cliente dio una cifra que contada en velas cabe en 20 cajas o menos
      («me vendes 36 velitas?» son 3 cajas de 12), Jev lee la charla y dice si
      cuenta velas sueltas. Si es así, el bot no lo pasa: anota las cajas y
      sigue la venta.
  cifra_del_cliente:
    name: Darle la razón en una cuenta equivocada
    where: [herramientas]
    solves: >-
      Antes de enviar, si el cliente escribió una cifra que no es la de su
      pedido («1 cuadrada y 1 ondulada me da $45.000, ¿no?»; suma $47.500),
      Jev lee su mensaje y la respuesta y dice si el bot le da la razón
      («así es», «sí» o repitiéndola). Si se la da, el bot corrige con cariño
      y con la cuenta real. La regla solo propone: decide Jev.
  variante_ajena:
    name: Presentación que no existe
    where: [herramientas]
    solves: >-
      Antes de enviar, Jev lee la ficha del producto (sus presentaciones,
      signos o diseños) y avisa si el bot le ofrece una que no tiene, como un
      signo que no existe o un tamaño inventado. El bot corrige el mensaje
      con las presentaciones reales. Sin Jev no revisa nada: no hay una lista
      donde buscar lo inventado.
  monto:
    name: Precios cotizados
    where: [herramientas]
    solves: >-
      Encuentra las oraciones en que el bot cotiza el precio de un producto,
      para comparar esos montos contra el catálogo antes de cobrar.
  persona:
    name: No parecer un bot
    where: [herramientas]
    solves: >-
      En los mensajes de cierre y de escalación, quita las oraciones que dejan
      ver que atiende un bot o una IA («asistente virtual», «un humano»).
  destinatario_oracion:
    name: Para quién es, oración por oración
    where: [herramientas]
    solves: >-
      Lo mismo que «Para quién es el texto», oración por oración, en los
      mensajes de cierre y de escalación: quita lo que no es para el cliente.
  preambulo:
    name: Muletilla del modelo
    where: [antes_de_enviar]
    solves: >-
      Corta las frases de relleno con que el modelo empieza la respuesta
      («Claro, con gusto te ayudo…») sin cortar nunca a mitad de una frase.
  destinatario:
    name: Para quién es el texto
    where: [antes_de_enviar]
    solves: >-
      Decide si el texto es para el cliente o es una nota interna del bot.
      Frena reportes internos que se colarían al chat y deja pasar textos
      legítimos que antes se frenaban («Usa el código VELAS_10 al pagar»).
  rescate:
    name: Rescate del texto
    where: [antes_de_enviar]
    solves: >-
      Cuando parte del texto no es para el cliente, rescata párrafo por
      párrafo lo que sí lo es, para que el cliente no se quede sin respuesta.
  portavelas:
    name: Portavelas
    where: [antes_de_enviar]
    solves: >-
      En un pedido registrado sin portavelas, quita lo que el bot le promete
      del portavelas, para no prometer algo que no va en el pedido.
  saludo:
    name: Bienvenida
    where: [antes_de_enviar]
    solves: >-
      En el primer contacto, decide si hace falta la burbuja de bienvenida o
      si la respuesta ya saluda, para no saludar dos veces.
  enumeracion:
    name: Lista de opciones
    where: [antes_de_enviar]
    solves: >-
      Detecta cuando el texto le enumera aromas o colores al cliente y los
      cambia por un selector con las opciones del catálogo, más fácil de
      elegir.
  relevo:
    name: Colega prometido
    where: [antes_de_enviar]
    solves: >-
      Si el bot le promete al cliente que una persona del equipo lo va a
      atender y nadie escaló la conversación, la escala para que la promesa
      se cumpla.
  afirmacion:
    name: Afirmación sin consultar
    where: [despues_de_enviar]
    solves: >-
      Revisa, después de enviar, si el bot afirmó algo que solo se sabe
      consultando (el stock, la entrega, el estado del pedido) sin haberlo
      consultado. Por ahora solo mide: no cambia nada.
  contactar:
    name: Escribirle de nuevo
    where: [remarketing]
    solves: >-
      Decide si sobra un mensaje de seguimiento: si la conversación ya
      terminó (el pedido llegó y el cliente agradeció), no se le vuelve a
      escribir.
  producto_nombrado:
    name: Producto del que habló
    where: [remarketing]
    solves: >-
      Encuentra de qué producto del catálogo habló el cliente aunque lo
      nombre con otras palabras («la de los corazoncitos»), para que el
      mensaje de seguimiento hable de ese producto.
  destinatario_plantilla:
    name: Para quién es, en una plantilla
    where: [remarketing]
    solves: >-
      Lo mismo que «Para quién es el texto», para el texto que el bot pone
      dentro de una plantilla de seguimiento.
  cierre:
    name: Etiqueta de cierre
    where: [cierre]
    solves: >-
      Cuando el cliente deja de responder, lee la conversación y elige con qué
      etiqueta se cierra (compra, interesado, rechazo…). Lo que dice el
      pedido registrado siempre manda.
