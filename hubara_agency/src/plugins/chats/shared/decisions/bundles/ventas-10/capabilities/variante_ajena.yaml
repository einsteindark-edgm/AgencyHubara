# yaml-language-server: $schema=../../../../../../../../schemas/decision-capability.schema.json
#
# «¿El texto le ofrece al producto una presentación, un signo, un diseño o un
# tamaño que no tiene?» (incidente 2026-10-13). Lo inventado («lo tenemos en
# Ofiuco», «caja dorada», «tamaño grande») no está en ningún catálogo, así que
# no hay qué buscar: Jev lee la ficha de cada producto en foco con
# presentaciones para escoger (aromas, colores y presentaciones) y contesta. La
# regla no marca nada: sin Jev no revisa (la sombra mide, canary actúa). Sin un
# producto con presentaciones no se le pregunta. Lo pide `send_reply` antes de
# enviar; el mensaje le da al modelo las presentaciones reales (Jev no dice cuál
# inventó).
capability: variante_ajena
value: bool
input: VariantesDelTexto
rule: {builtin: constant_false}
# Un producto de una sola presentación solo se le pregunta a Jev si el texto
# nombra una de estas palabras (la clase del 2026-09-25: «el Cubo Love también
# viene en vaso»); sin ellas no hay qué leer y no se gasta la llamada.
state:
  builtin: text_and_option_sheets
  with:
    words: >-
      vaso, frasco, envase, recipiente, tamaño, grande, pequeña, pequeño, mini, mediana, mediano,
      set, kit, combo, presentación, versión
    # Un producto CON presentaciones se le pregunta a Jev solo si el texto
    # ofrece algo o nombra una presentación (premortem del PR #426: «Quedo
    # atenta» era una llamada a Jev por texto, y en sombra una espera).
    ofrece: >-
      viene*, vienen, tenemos, manejamos, te la/lo/las/los dejo, te la/lo/las/los mando/envío/enviamos,
      disponible*, prefieres, prefiere, quieres, quiere, elige*, elegir, escoge*, escoger, opción*, opciones,
      puede ser, pueden ser, la/lo/las/los tienes, la/lo/las/los tenemos, signo*, diseño*, modelo*, color*,
      aroma*
questions:
  - id: variante.ajena
    kind: noul
    text: "¿El texto le ofrece o le atribuye a ese producto una presentación, diseño o tamaño que NO está en «Presentaciones que tiene»?"
    criteria:
      "true": "sí: nombra para ese producto una presentación, diseño o tamaño que no está en la lista"
      "false": "no: lo que nombra está en la lista, es de otro producto, lo niega, o no nombra presentaciones"
thresholds: {"yes": 0.6, "no": 0.4}
decide:
  - when: "!('variante.ajena' in p)"
    then: doubt
  - when: "p['variante.ajena'] >= th['yes']"
    then: true
  - when: "p['variante.ajena'] <= th['no']"
    then: false
  - otherwise: doubt
floor: {builtin: jev}
same: {builtin: bool_eq}
examples:
  # «El Duo Zodiacal también lo tenemos en Ofiuco»: no es un signo de la ficha.
  - {answers: {variante.ajena: 0.95}, expect: true}
  # «¿Lo quieres para Leo o para Virgo?»: están en la ficha.
  - {answers: {variante.ajena: 0.07}, expect: false}
  # Bordes: 0,60 marca; 0,59 duda (la regla: nada); 0,40 no marca; 0,41 duda.
  # Sonda con Jev real (2026-10-13, frases sintéticas): lo inventado («Ofiuco»,
  # «caja de 24», «tamaño grande») 0,81–0,96; lo que la ficha tiene 0,04–0,21;
  # «no vienen en caja de 24» 0,43 (duda: decide la regla, no marca). Una sola presentación:
  # «el Cubo Love también viene en vaso» 0,96, «tamaño grande y mini» 0,92; «una sola pieza, en
  # caja de regalo» 0,11.
  - {answers: {variante.ajena: 0.6}, expect: true}
  - {answers: {variante.ajena: 0.59}, expect: doubt}
  - {answers: {variante.ajena: 0.4}, expect: false}
  - {answers: {variante.ajena: 0.41}, expect: doubt}
  - {answers: {}, expect: doubt}
