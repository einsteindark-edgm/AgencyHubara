# yaml-language-server: $schema=../../../../../../../../schemas/decision-capability.schema.json
#
# «¿El cliente solo agradece o saluda?» (2026-09-29, ETA «¿Nos confirmas…?» →
# «Hola cómo están? Son geniales. Muchas gracias» abría venta). Con el valor,
# el turno pide una respuesta breve y cálida sin abrir venta. La regla de hoy
# siempre dice «no». Calibración con la conversación real ···4148
# (2026-10-01): 18 de 18 con el umbral en 0,80; los que confirman, eligen o
# preguntan quedan entre 0,02 y 0,11.
#
# ventas-3 (2026-10-06, bot V2 con Jev para un número de prueba): un cliente
# volvió 11 días después y escribió «Buenas»; Jev dio 0,94 y el turno contestó
# solo «Buenos días 🤍», sin invitar a seguir (en el turno 2 el bot dio la
# bienvenida de marca). Un saludo solo con el que el cliente empieza a escribir
# no es cortesía: abre la conversación y espera que lo atiendan. La pregunta
# lo dice. Y cuando la tienda no le escribe hace 24 horas o más (o nunca le
# escribió; la vista `reply_gap`), abra o no un episodio, Jev contesta además
# si es SOLO un saludo: si lo es, no es cortesía aunque `cortesia.solo` diga
# que sí. La hora sola no decide: un «gracias» tardío («Gracias, me llegó y
# está divina» a las 48 h, «Muchas gracias» a una campaña a las 30 h) sigue
# siendo cortesía (revisión del PR #390: la primera versión de la fila lo
# perdía y volvía el caso del 2026-09-29). El aviso reciente (ETA «¿Nos
# confirmas…?» → «Hola… Muchas gracias») lo sigue decidiendo Jev.
capability: cortesia
value: bool
input: Inbound
view: {builtin: reply_gap}
rule: {builtin: constant_false}
state: {builtin: customer_message_with_window}
questions:
  - id: cortesia.solo
    kind: noul
    text: >-
      ¿El mensaje del cliente es solo cortesía: agradece, elogia, cuenta que ya
      recibió el pedido o que le gustó, promete mandar fotos o escribir después,
      o se despide, sin pedir ni preguntar nada y sin dar un dato o una decisión
      que la tienda necesite para seguir (confirmar, elegir, una dirección, una
      hora)? Un saludo solo («hola», «buenas», «buenos días») con el que el
      cliente empieza a escribir NO es cortesía: abre la conversación y espera
      que lo atiendan. Un saludo junto a un agradecimiento, un elogio o una
      despedida sí lo es. Un «¿cómo están?» no cuenta como pregunta, y responder
      que le gustó sí es cortesía.
    criteria:
      "true": "sí, solo agradece, elogia o se despide (aunque también salude)"
      "false": "no: pregunta, pide algo, responde una pregunta o solo saluda para empezar a hablar"
  # Solo cuando importa (y en la misma llamada): la tienda no le escribe hace
  # un día o más, o nunca le escribió. Abra o no un episodio: uno puede seguir
  # abierto hasta 14 días (segunda revisión del PR #390).
  - id: cortesia.saludo_solo
    kind: noul
    when: "inp.hours_since_store == null || inp.hours_since_store >= 24"
    text: >-
      ¿El mensaje del cliente es solo un saludo («hola», «buenas», «buenos
      días»), sin agradecer, elogiar, contar algo ni despedirse?
    criteria:
      "true": "sí, solo saluda"
      "false": "no: también agradece, elogia, cuenta algo, pide algo o se despide"
thresholds: {"yes": 0.80}
decide:
  # La tienda no le escribe hace un día o más (o nunca) y es SOLO un saludo:
  # el cliente empieza a hablar, no agradece. Si Jev no dice que es solo un
  # saludo, decide `cortesia.solo` (un «gracias» tardío sí es cortesía).
  - when: "(inp.hours_since_store == null || inp.hours_since_store >= 24) && 'cortesia.saludo_solo' in p && p['cortesia.saludo_solo'] >= th['yes']"
    then: false
  - when: "!('cortesia.solo' in p)"
    then: doubt
  - when: "p['cortesia.solo'] >= th['yes']"
    then: true
  - otherwise: false
floor: {builtin: jev}
same: {builtin: bool_eq}
examples:
  - {answers: {cortesia.solo: 0.88}, expect: true}
  - {answers: {cortesia.solo: 0.80}, expect: true}
  - {answers: {cortesia.solo: 0.79}, expect: false}
  - {answers: {}, expect: doubt}
  # ventas-3 (2026-10-06): «Buenas» de un cliente que vuelve 11 días (264 h)
  # después abre el episodio. Jev dijo 0,94 a «solo cortesía», pero es SOLO un
  # saludo: no es cortesía (el turno solo había devuelto el saludo).
  - {answers: {cortesia.solo: 0.94, cortesia.saludo_solo: 0.95}, input: {opens_episode: true, hours_since_store: 264}, expect: false}
  # Revisión del PR #390: un «gracias» tardío SÍ es cortesía. «Gracias, me llegó
  # y está divina» a las 48 h; «Muchas gracias» a una campaña a las 30 h.
  - {answers: {cortesia.solo: 0.94, cortesia.saludo_solo: 0.05}, input: {opens_episode: true, hours_since_store: 48}, expect: true}
  - {answers: {cortesia.solo: 0.9, cortesia.saludo_solo: 0.03}, input: {opens_episode: true, hours_since_store: 30}, expect: true}
  # Bordes del umbral del saludo solo (el mismo `yes`): 0,80 decide la fila; con
  # 0,79 decide `cortesia.solo`.
  - {answers: {cortesia.solo: 0.94, cortesia.saludo_solo: 0.80}, input: {opens_episode: true, hours_since_store: 264}, expect: false}
  - {answers: {cortesia.solo: 0.94, cortesia.saludo_solo: 0.79}, input: {opens_episode: true, hours_since_store: 264}, expect: true}
  # Borde de la hora: 24 horas justas ya es volver; también el primer mensaje
  # de alguien a quien la tienda nunca le escribió.
  - {answers: {cortesia.solo: 0.94, cortesia.saludo_solo: 0.95}, input: {opens_episode: true, hours_since_store: 24}, expect: false}
  - {answers: {cortesia.solo: 0.94, cortesia.saludo_solo: 0.95}, input: {opens_episode: true, hours_since_store: null}, expect: false}
  # La fila va antes de leer `cortesia.solo`: sin esa respuesta, el saludo solo basta.
  - {answers: {cortesia.saludo_solo: 0.95}, input: {opens_episode: true, hours_since_store: 264}, expect: false}
  # Sin la respuesta del saludo solo decide `cortesia.solo` (o la regla, si tampoco está).
  - {answers: {cortesia.solo: 0.94}, input: {opens_episode: true, hours_since_store: 264}, expect: true}
  - {answers: {}, input: {opens_episode: true, hours_since_store: 264}, expect: doubt}
  # El aviso reciente (ETA «¿Nos confirmas…?» hace 23 h o menos → «Hola…
  # Muchas gracias»): la pregunta del saludo solo ni se hace y decide
  # `cortesia.solo`. Borde: aunque la respuesta llegara, antes de las 24 h la
  # fila no decide.
  - {answers: {cortesia.solo: 0.94}, input: {opens_episode: true, hours_since_store: 23}, expect: true}
  - {answers: {cortesia.solo: 0.94, cortesia.saludo_solo: 0.95}, input: {opens_episode: true, hours_since_store: 23}, expect: true}
  - {answers: {cortesia.solo: 0.79}, input: {opens_episode: true, hours_since_store: 0}, expect: false}
  # Segunda revisión del PR #390: un episodio puede seguir abierto hasta 14
  # días y la hora manda igual. «Buenas» dentro de él, a las 264 h del último
  # mensaje de la tienda: no es cortesía; «Hola, gracias» a las 2 h y «Muchas
  # gracias» a las 264 h: decide `cortesia.solo`.
  - {answers: {cortesia.solo: 0.94, cortesia.saludo_solo: 0.95}, input: {opens_episode: false, hours_since_store: 264}, expect: false}
  - {answers: {cortesia.solo: 0.9}, input: {opens_episode: false, hours_since_store: 2}, expect: true}
  - {answers: {cortesia.solo: 0.94, cortesia.saludo_solo: 0.05}, input: {opens_episode: false, hours_since_store: 264}, expect: true}
