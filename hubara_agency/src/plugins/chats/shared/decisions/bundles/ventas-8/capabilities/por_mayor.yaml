# yaml-language-server: $schema=../../../../../../../../schemas/decision-capability.schema.json
#
# «¿Es un pedido al por mayor o el cliente cuenta velas sueltas?» (laboratorio
# del 2026-10-14). Las velas de deseos se cobran por caja: la cuadrada trae 12
# velas y la ondulada 10. «Me vendes 36 velitas?» y «quiero 30 velitas de las
# onduladas» se pasaron a un colega con BULK_ORDER («>20 unidades»): eran 3
# cajas. Solo las velas de deseos se cobran por caja (`domain.yaml:
# sold_by_box`). El código arma la comparación: las cifras del cliente que
# pasan de 20 pero, contadas en velas, caben en 20 cajas o menos
# (`pack_quantity.candle_counts`), y esas cifras contadas en cada caja. Jev lee
# la charla, con la nota del asesor para el colega, y contesta dos preguntas:
# ¿pide uno de los productos que van por caja? y ¿su número cuenta velas
# sueltas? (una sola, compuesta, dejaba «36 velitas» en duda: 0,65–0,68). Lo
# pide `escalate_to_human` con BULK_ORDER: «velas» no pasa el caso (el bot
# anota las cajas y sigue la venta); «duda» lo devuelve una vez por mensaje del
# cliente con las cuentas.
capability: por_mayor
value: string
input: PedidoPorMayor
# Sin Jev no se sabe: «duda» (el bot lo revisa una vez con las cuentas).
rule: {builtin: bulk_candles_rule}
state: {builtin: bulk_candles_state}
questions:
  - id: por_mayor.producto_por_caja
    kind: noul
    text: "¿Lo que pide el cliente es uno de los productos que se cobran por caja (los de la lista)?"
    criteria:
      "true": "sí: pide uno de esos productos (o las velitas del anuncio, que son esas)"
      "false": "no: pide otro producto"
  - id: por_mayor.velas_sueltas
    kind: noul
    text: "¿El número que dio el cliente cuenta velas (unidades sueltas), no cajas?"
    criteria:
      "true": "sí: el número son velas"
      "false": "no: el número son cajas o kits"
# Sonda con Jev real (2026-10-14, frases sintéticas ×2): velas sueltas 0,87–0,98 en las dos
# («me vendes 36 velitas?» desde el anuncio, «30 velitas de las onduladas», «48 velitas para la
# novena»); «25 cajas de velas de deseos» 0,08 y «30» tras «¿Cuántas cajas?» 0,16–0,18 en el número;
# «30 velas Luz Serena» 0,34–0,37 en el producto (por eso el «no» en 0,4).
thresholds: {"yes": 0.7, "no": 0.4}
decide:
  - when: "!('por_mayor.producto_por_caja' in p) || !('por_mayor.velas_sueltas' in p)"
    then: doubt
  - when: "p['por_mayor.producto_por_caja'] <= th['no'] || p['por_mayor.velas_sueltas'] <= th['no']"
    then: por_mayor
  - when: "p['por_mayor.producto_por_caja'] >= th['yes'] && p['por_mayor.velas_sueltas'] >= th['yes']"
    then: velas
  - otherwise: doubt
floor: {builtin: jev}
same: {builtin: text_eq}
examples:
  # «Me vendes 36 velitas?» desde el anuncio: velas de deseos sueltas, 3 cajas.
  - {answers: {por_mayor.producto_por_caja: 0.9, por_mayor.velas_sueltas: 0.9}, expect: velas}
  # «Necesito 25 cajas de velas de deseos cuadradas»: al por mayor.
  - {answers: {por_mayor.producto_por_caja: 0.95, por_mayor.velas_sueltas: 0.05}, expect: por_mayor}
  # «Necesito 30 velas Luz Serena para un evento»: otro producto, al por mayor.
  - {answers: {por_mayor.producto_por_caja: 0.05, por_mayor.velas_sueltas: 0.9}, expect: por_mayor}
  # Bordes: 0,7 en las dos son velas; 0,4 en una es por mayor; en medio, duda.
  - {answers: {por_mayor.producto_por_caja: 0.7, por_mayor.velas_sueltas: 0.7}, expect: velas}
  - {answers: {por_mayor.producto_por_caja: 0.9, por_mayor.velas_sueltas: 0.4}, expect: por_mayor}
  - {answers: {por_mayor.producto_por_caja: 0.9, por_mayor.velas_sueltas: 0.5}, expect: doubt}
  - {answers: {por_mayor.producto_por_caja: 0.9}, expect: doubt}
  - {answers: {}, expect: doubt}
