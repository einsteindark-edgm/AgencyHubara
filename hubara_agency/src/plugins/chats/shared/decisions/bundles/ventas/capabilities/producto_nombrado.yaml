# yaml-language-server: $schema=../../../../../../../../schemas/decision-capability.schema.json
#
# «¿De qué producto del catálogo habla la charla?» (qué ficha ve el gancho de
# remarketing). La regla: los títulos nombrados tal cual. Jev SUMA el que el
# cliente nombró con otras palabras («la de los corazoncitos»); los exactos
# se quedan (piso).
capability: producto_nombrado
value: "tuple<string>"
input: ProductosDeLaCharla
rule: {builtin: named_titles}
state: {builtin: chat_and_catalog}
questions:
  - id: producto.nombrado
    kind: choice
    text: "¿De qué producto del catálogo habla el cliente?"
    options: {builtin: catalog_titles}
    criteria:
      "ambiguo": "habla de varios o no se sabe cuál"
      "ninguno": "no habla de ningún producto del catálogo"
thresholds: {"choice": 0.85}
decide:
  - when: "!('producto.nombrado' in choice) || conf['producto.nombrado'] < th['choice'] || choice['producto.nombrado'] == 'ambiguo'"
    then: doubt
  - when: "choice['producto.nombrado'] == 'ninguno'"
    then: []
  - when: "choice['producto.nombrado'] in opt['producto.nombrado']"
    then: {expr: "[opt['producto.nombrado'][choice['producto.nombrado']]]"}
  - otherwise: doubt
floor: {builtin: rule_then_jev}
same: {builtin: set_eq}
examples:
  - {answers: {producto.nombrado: {choice: cubo_de_corazon, p: 0.85}}, options: {producto.nombrado: {cubo_de_corazon: Cubo de corazón}}, expect: [Cubo de corazón]}
  - {answers: {producto.nombrado: {choice: ninguno, p: 0.9}}, expect: []}
  - {answers: {producto.nombrado: {choice: cubo_de_corazon, p: 0.84}}, expect: doubt}
