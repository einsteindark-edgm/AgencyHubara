# yaml-language-server: $schema=../../../../../../../../schemas/decision-capability.schema.json
#
# «¿El asesor preguntó cuántas?» y «¿qué cantidad dio?» {1…20, otra, ninguna}.
# Capturar exige certeza (una cantidad equivocada en el pedido es peor que
# volver a preguntar); «otra» o la duda dejan la regla. El valor lo escribe el
# código con sus compuertas (`apply_reply_quantity`).
capability: cantidad
value: "{cantidad: int?}"
input: RespuestaDeCantidad
rule: {builtin: reply_quantity}
state: {builtin: quantity_reply}
questions:
  - id: cantidad.pregunto
    kind: noul
    text: "¿El último mensaje del asesor le pregunta al cliente cuántas unidades quiere?"
    criteria:
      "true": "sí"
      "false": "no"
  - id: cantidad.dio
    kind: choice
    text: "¿Qué cantidad de unidades da el cliente en su respuesta?"
    criteria:
      "1": "1 unidad"
      "2": "2 unidades"
      "3": "3 unidades"
      "4": "4 unidades"
      "5": "5 unidades"
      "6": "6 unidades"
      "7": "7 unidades"
      "8": "8 unidades"
      "9": "9 unidades"
      "10": "10 unidades"
      "11": "11 unidades"
      "12": "12 unidades"
      "13": "13 unidades"
      "14": "14 unidades"
      "15": "15 unidades"
      "16": "16 unidades"
      "17": "17 unidades"
      "18": "18 unidades"
      "19": "19 unidades"
      "20": "20 unidades"
      "otra": "otra cantidad (más de 20, o no dice cuántas exactamente)"
      "ninguna": "no dice una cantidad de unidades"
thresholds: {"asked": 0.85, "not_asked": 0.15, "quantity": 0.85, "none": 0.7}
decide:
  - when: "!('cantidad.pregunto' in p)"
    then: doubt
  - when: "p['cantidad.pregunto'] <= th['not_asked']"
    then: {cantidad: null}
  - when: "p['cantidad.pregunto'] < th['asked'] || !('cantidad.dio' in choice)"
    then: doubt
  - when: "choice['cantidad.dio'] == 'ninguna' && conf['cantidad.dio'] >= th['none']"
    then: {cantidad: null}
  - when: "choice['cantidad.dio'].matches('^[0-9]+$') && int(choice['cantidad.dio']) >= 1 && int(choice['cantidad.dio']) <= 20 && conf['cantidad.dio'] >= th['quantity']"
    then: {expr: "{'cantidad': int(choice['cantidad.dio'])}"}
  - otherwise: doubt
floor: {builtin: jev}
same:
  builtin: key_eq
  with: {key: cantidad}
examples:
  - {answers: {cantidad.pregunto: 0.9, cantidad.dio: {choice: "3", p: 0.9}}, expect: {cantidad: 3}}
  - {answers: {cantidad.pregunto: 0.1}, expect: {cantidad: null}}
  - {answers: {cantidad.pregunto: 0.9, cantidad.dio: {choice: ninguna, p: 0.7}}, expect: {cantidad: null}}
  - {answers: {cantidad.pregunto: 0.9, cantidad.dio: {choice: otra, p: 0.95}}, expect: doubt}
  - {answers: {cantidad.pregunto: 0.9, cantidad.dio: {choice: "21", p: 0.95}}, expect: doubt}
  - {answers: {cantidad.pregunto: 0.84, cantidad.dio: {choice: "2", p: 0.95}}, expect: doubt}
  # Sin la respuesta de si preguntó (premortem 2026-10-02: un ejemplo por fila).
  - {answers: {}, expect: doubt}
