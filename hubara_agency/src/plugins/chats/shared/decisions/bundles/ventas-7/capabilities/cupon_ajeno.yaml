# yaml-language-server: $schema=../../../../../../../../schemas/decision-capability.schema.json
#
# «¿El texto le ofrece un cupón o un descuento que no está vigente?» (venta
# del 2026-10-09: AMOR2026 vencido ofrecido como vigente). La regla propone los
# códigos que Medusa conoce y no rigen hoy (`coupon_problem`; la condición de
# primera compra no se mira aquí), y los
# porcentajes de descuento que ningún cupón vigente da; Jev, por cada uno, dice
# si el texto se lo ofrece como usable ahora. Solo QUITA («ya no está
# vigente»), y solo con certeza.
capability: cupon_ajeno
value: "list<string>"
input: CuponDelTexto
items: {builtin: coupon_claim_items}
# La regla es de palabras: solo PROPONE (los ítems). Sin Jev no se retiene nada
# —en `reglas` y en sombra decide `no_items`; en sombra Jev contesta al lado y se
# mide—: frases ciertas como «te he enviado el link» o «una vez despachado…»
# no pueden frenar un mensaje por una palabra (revisión del 2026-10-13).
rule: {builtin: no_items}
state: {builtin: text_and_claim_facts}
each:
  id: "cupon_ajeno.termino_{n}"
  kind: noul
  text: "¿El texto le ofrece «{term}» como un cupón o descuento que puede usar ahora? Lo cierto: {fact}."
  criteria:
    "true": "sí: se lo ofrece o le dice que le aplica"
    "false": "no: le dice que ya no está vigente, que no le aplica o habla de otra cosa"
thresholds: {"no": 0.15}
decide:
  - when: "!items.exists(i, has(i.p))"
    then: doubt
  - otherwise: {expr: "items.filter(i, !has(i.p) || i.p > th['no']).map(i, i.term)"}
floor: {builtin: jev}
same: {builtin: tuple_eq}
examples:
  # AMOR2026 vencido ofrecido como vigente.
  - {items: [{term: AMOR2026, fact: x, p: 0.93}], expect: [AMOR2026]}
  # «AMOR2026 ya venció»: Jev lo quita.
  - {items: [{term: AMOR2026, fact: x, p: 0.06}], expect: []}
  # Borde de la certeza: 0,15 quita; 0,16 queda.
  # Sonda con Jev real (2026-10-13): lo ofrecido como usable 0,86–0,91; «ya venció» y
  # «no manejamos descuentos del 15 %» 0,03–0,05.
  - {items: [{term: a, fact: x, p: 0.15}, {term: b, fact: x, p: 0.16}], expect: [b]}
  # Lo que Jev no contestó queda (lo propuso la regla).
  - {items: [{term: a, fact: x, p: 0.9}, {term: b, fact: x}], expect: [a, b]}
  - {items: [{term: a, fact: x}], expect: doubt}
