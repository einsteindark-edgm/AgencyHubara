# yaml-language-server: $schema=../../../../../../../../schemas/decision-capability.schema.json
#
# «¿El texto le dice que no tenemos algo que el catálogo sí tiene?» (casos:
# «leo», la medida del 2026-09-22, r8 con fotos verificadas). La regla propone
# los productos del catálogo y los aromas, colores o presentaciones del
# producto del que habla que el texto niega con un verbo de tener («no
# tenemos», «no manejamos», «ya no hay»); Jev, por cada uno, dice si el texto
# de verdad lo niega. Solo QUITA, y solo con certeza. El stock no se sabe (el
# catálogo no lo trae): si de verdad está agotado, el modelo reenvía el texto.
capability: negacion_falsa
value: "list<string>"
input: NegacionDelTexto
# Las frases son de la tienda (2026-10-13): un falso positivo, o algo que se
# escapa, se corrige aquí con otra frase en una versión nueva del paquete, no
# en el código. Separadas por comas; `*` = cualquier final («despachad*»),
# `a/b` = una u otra palabra («tu/su»), `…` = hasta tres palabras en medio;
# tildes y mayúsculas no importan.
items:
  builtin: denial_claim_items
  with:
    # Detrás de «no», «ya no», «tampoco» o «ni» (y quizá un pronombre: «no la manejamos»).
    niega_tener: >-
      tenemos, manejamos, hay, existe, existen, hacemos, trabajamos, contamos, queda, quedan,
      ofrecemos, vendemos, está disponible, están disponibles
    niega_venir: viene, vienen
    no_es_negacion: >-
      no/tampoco hay … problema*/lío*/afán/inconveniente*/prisa/cuidado, no hay de qué
# La regla es de palabras: solo PROPONE (los ítems). Sin Jev no se retiene nada
# —en `reglas` y en sombra decide `no_items`; en sombra Jev contesta al lado y se
# mide—: frases ciertas como «te he enviado el link» o «una vez despachado…»
# no pueden frenar un mensaje por una palabra (revisión del 2026-10-13).
rule: {builtin: no_items}
state: {builtin: text_and_claim_facts}
each:
  id: "negacion_falsa.termino_{n}"
  kind: noul
  text: "¿El texto le dice que no tenemos «{term}» o que no viene así? Lo cierto: {fact}."
  criteria:
    "true": "sí: le dice que no lo tenemos, que no lo manejamos o que no viene así"
    "false": "no: dice que sí lo tenemos, habla de otro producto o lo niega de otra cosa"
thresholds: {"no": 0.15}
decide:
  - when: "!items.exists(i, has(i.p))"
    then: doubt
  - otherwise: {expr: "items.filter(i, !has(i.p) || i.p > th['no']).map(i, i.term)"}
floor: {builtin: jev}
same: {builtin: tuple_eq}
examples:
  # «No tenemos la Plegaria de Luz»: está en el catálogo.
  - {items: [{term: Plegaria de Luz, fact: x, p: 0.95}], expect: [Plegaria de Luz]}
  # «La Plegaria no viene en Chanel»: niega otra cosa, Jev quita la Plegaria.
  - {items: [{term: Plegaria de Luz, fact: x, p: 0.05}], expect: []}
  # Borde de la certeza: 0,15 quita; 0,16 queda.
  # Sonda con Jev real (2026-10-13): lo negado teniéndolo 0,90–0,93. «La Plegaria no viene en
  # Chanel» y «no hay problema» no llegan a Jev: un producto solo se niega con un verbo de tenerlo.
  - {items: [{term: a, fact: x, p: 0.15}, {term: b, fact: x, p: 0.16}], expect: [b]}
  # Lo que Jev no contestó queda (lo propuso la regla).
  - {items: [{term: a, fact: x, p: 0.9}, {term: b, fact: x}], expect: [a, b]}
  - {items: [{term: a, fact: x}], expect: doubt}
