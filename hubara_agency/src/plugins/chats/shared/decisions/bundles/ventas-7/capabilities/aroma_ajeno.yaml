# yaml-language-server: $schema=../../../../../../../../schemas/decision-capability.schema.json
#
# «¿El texto le ofrece a un producto un aroma que es de otro?» (incidente
# 2026-10-13, Velas de deseos cuadradas: «vienen en Chanel, Drakar y Ylang
# Ylang»; Drakar e Ylang Ylang son de la Plegaria de Luz). La regla propone
# los aromas del catálogo que el texto nombra y no son del producto del que
# habla (el del pedido o el que el texto nombra por su título o por una palabra
# propia de él), menos los que su cláusula niega; por cada uno,
# Jev dice si el texto de verdad se lo ofrece a ese producto. Jev solo QUITA
# candidatos (habla de otro producto, dice que no lo tiene), y solo con
# certeza; nunca agrega uno (piso: lo de la regla, en su orden). Lo pide
# `send_reply` antes de enviar: lo que quede vuelve UNA vez al modelo con los
# aromas reales del producto.
capability: aroma_ajeno
value: "list<string>"
input: OpcionesDelTexto
items: {builtin: foreign_label_items}
rule: {builtin: foreign_labels_rule}
state: {builtin: text_and_product_labels, with: {noun: aromas}}
each:
  id: "aroma_ajeno.termino_{n}"
  kind: noul
  text: "¿El texto le ofrece «{term}» como aroma del producto del pedido, o le dice que ese producto viene en «{term}»? Si el texto no nombra otro producto, habla del producto del pedido."
  criteria:
    "true": "sí: se lo ofrece, lo anota o le pregunta si lo quiere en ese aroma, aunque no nombre el producto"
    "false": "no: dice que es de otro producto, que el producto del pedido no lo tiene, o se lo sugiere para otra vela"
thresholds: {"no": 0.15}
decide:
  - when: "!items.exists(i, has(i.p))"
    then: doubt
  - otherwise: {expr: "items.filter(i, !has(i.p) || i.p > th['no']).map(i, i.term)"}
floor: {builtin: rule_order_subset}
same: {builtin: tuple_eq}
examples:
  # El incidente: los tres se le ofrecen a las Velas de deseos.
  - {items: [{term: Chanel, p: 0.97}, {term: Drakar, p: 0.95}, {term: Ylan ylang, p: 0.96}], expect: [Chanel, Drakar, Ylan ylang]}
  # «La Plegaria de Luz sí viene en Drakar»: es de otro producto, Jev lo quita.
  - {items: [{term: Drakar, p: 0.04}], expect: []}
  # Borde de la certeza: 0,15 quita; 0,16 queda. Sonda con Jev real (2026-10-13,
  # 22 frases sintéticas, varias corridas): lo que el texto ofrece 0,18–0,88 (lo
  # más bajo, «Las dos te las dejo en Drakar» con dos productos en el pedido);
  # otro producto, «para otra vela» o una fecha («antes de la noche de Navidad»)
  # 0,06–0,13. Jev quita solo con certeza: un aviso de más le cuesta al modelo
  # reenviar el texto; un aroma ajeno que sale repite el incidente. Lo que niega
  # su cláusula («no vienen en Chanel») ya no llega a Jev: la regla lo deja.
  - {items: [{term: Drakar, p: 0.15}, {term: Chanel, p: 0.16}], expect: [Chanel]}
  # Un aroma que Jev no contestó queda (lo propuso la regla).
  - {items: [{term: Drakar, p: 0.9}, {term: Chanel}], expect: [Drakar, Chanel]}
  - {items: [{term: Drakar}], expect: doubt}
