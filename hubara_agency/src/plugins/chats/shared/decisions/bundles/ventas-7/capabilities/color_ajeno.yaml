# yaml-language-server: $schema=../../../../../../../../schemas/decision-capability.schema.json
#
# «¿El texto le ofrece a un producto un color que es de otro?» La misma
# búsqueda de `aroma_ajeno` con la lista de colores (incidente 2026-10-13: el
# error es tomar prestado el nombre real de otro producto, y eso lo sabe el
# catálogo). Los colores del producto: la paleta de sus variantes si la tiene
# (Duo Zodiacal), si no sus etiquetas «Color: …» y su opción «Color» (las
# velas de deseos: Multicolor, Rojo y verde). Un nombre que también es aroma
# («Café») no se juzga. Jev solo QUITA candidatos, y solo con certeza (piso: lo
# de la regla, en su orden). Lo pide `send_reply` antes de enviar.
capability: color_ajeno
value: "list<string>"
input: OpcionesDelTexto
items: {builtin: foreign_label_items}
rule: {builtin: foreign_labels_rule}
state: {builtin: text_and_product_labels, with: {noun: colores}}
each:
  id: "color_ajeno.termino_{n}"
  kind: noul
  text: "¿El texto le ofrece «{term}» como color del producto del pedido, o le dice que ese producto viene en «{term}»? Si el texto no nombra otro producto, habla del producto del pedido."
  criteria:
    "true": "sí: se lo ofrece, lo anota o le pregunta si lo quiere en ese color, aunque no nombre el producto"
    "false": "no: dice que es de otro producto, que el producto del pedido no lo tiene, o no es el color del producto (la caja, el empaque, otra cosa)"
thresholds: {"no": 0.15}
decide:
  - when: "!items.exists(i, has(i.p))"
    then: doubt
  - otherwise: {expr: "items.filter(i, !has(i.p) || i.p > th['no']).map(i, i.term)"}
floor: {builtin: rule_order_subset}
same: {builtin: tuple_eq}
examples:
  # Las velas de deseos no vienen en azul ni en lila.
  - {items: [{term: Azul, p: 0.9}, {term: Lila, p: 0.88}], expect: [Azul, Lila]}
  # «La Plegaria sí viene en azul»: es de otro producto, Jev lo quita.
  - {items: [{term: Azul, p: 0.05}], expect: []}
  # Borde de la certeza: 0,15 quita; 0,16 queda. Sonda con Jev real (2026-10-13,
  # frases sintéticas): lo que se ofrece 0,46–0,79; otro producto o el color de la
  # caja 0,06–0,08. Queda marcado «el verde es el de la esperanza» (0,89): un
  # reenvío del modelo.
  - {items: [{term: Azul, p: 0.15}, {term: Lila, p: 0.16}], expect: [Lila]}
  # Un color que Jev no contestó queda (lo propuso la regla).
  - {items: [{term: Azul, p: 0.9}, {term: Lila}], expect: [Azul, Lila]}
  - {items: [{term: Azul}], expect: doubt}
