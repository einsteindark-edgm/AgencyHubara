# yaml-language-server: $schema=../../../../../../../../schemas/decision-capability.schema.json
#
# «¿El texto le ofrece una forma de pago que su pedido no tiene?» (2026-10-13):
# contra entrega a un pedido que no llega al mínimo (config/shipping.py) o un
# recargo del link distinto del vigente (config/payments.py). La regla propone
# con el subtotal del borrador × el catálogo; Jev, por cada uno, dice si el
# texto se lo ofrece a SU pedido. Solo QUITA (lo dicho como regla general,
# «no aplica»), y solo con certeza.
capability: pago_ajeno
value: "list<string>"
input: PagoDelTexto
# Las frases son de la tienda (2026-10-13): un falso positivo, o algo que se
# escapa, se corrige aquí con otra frase en una versión nueva del paquete, no
# en el código. Separadas por comas; `*` = cualquier final («despachad*»),
# `a/b` = una u otra palabra («tu/su»), `…` = hasta tres palabras en medio;
# tildes y mayúsculas no importan.
items:
  builtin: payment_claim_items
  with:
    ofrece_contra_entrega: >-
      contra entrega, contraentrega, pag* al/cuando recib*, pag* al/cuando te llegu*, pag* al/cuando llegu*
    # Lo que enuncia la regla o una condición sobre el pedido no le ofrece nada
    # a su pedido: la cláusula con una de estas no se propone.
    regla_general: >-
      desde, a partir de, mínimo, más de, por encima de, en adelante, al menos, debe/deben sumar,
      si agregas/sumas/llevas/compras/pides/completas/añades, si le sumas
    habla_de_recargo: recargo*, comisión*
    no_es_recargo: descuento*
    habla_del_link: link, enlace*
    sin_recargo: >-
      sin recargo/comisión, sin ningún recargo/comisión, sin costo adicional,
      no tiene recargo/comisión, no tiene ningún recargo/comisión
# La regla es de palabras: solo PROPONE (los ítems). Sin Jev no se retiene nada
# —en `reglas` y en sombra decide `no_items`; en sombra Jev contesta al lado y se
# mide—: frases ciertas como «te he enviado el link» o «una vez despachado…»
# no pueden frenar un mensaje por una palabra (revisión del 2026-10-13).
rule: {builtin: no_items}
state: {builtin: text_and_claim_facts}
each:
  id: "pago_ajeno.termino_{n}"
  kind: noul
  text: "¿El texto le dice que {term}, para el pedido que tiene ahora? Lo que dice el sistema: {fact}."
  criteria:
    "true": "sí: se lo dice o se lo ofrece para el pedido que tiene ahora"
    "false": "no: lo dice como regla general (por ejemplo «contra entrega es desde $45.000»), como algo que aplicaría si cambia el pedido («si agregas otra…») o le dice que no aplica"
thresholds: {"no": 0.15}
decide:
  - when: "!items.exists(i, has(i.p))"
    then: doubt
  - otherwise: {expr: "items.filter(i, !has(i.p) || i.p > th['no']).map(i, i.term)"}
floor: {builtin: jev}
same: {builtin: tuple_eq}
examples:
  # Contra entrega a un pedido de $25.000.
  - {items: [{term: pagar contra entrega, fact: x, p: 0.92}], expect: [pagar contra entrega]}
  # «Contra entrega es desde $45.000»: regla general, Jev lo quita.
  - {items: [{term: pagar contra entrega, fact: x, p: 0.05}], expect: []}
  # Borde de la certeza: 0,15 quita; 0,16 queda.
  # Sonda con Jev real (2026-10-13): lo que se ofrece 0,16–0,80 («¿prefieres pagar al recibir…?»
  # es lo más bajo); «si agregas otra vela…» 0,06. La regla general («contra entrega es desde
  # $45.000») no llega a Jev: la regla no la propone.
  - {items: [{term: a, fact: x, p: 0.15}, {term: b, fact: x, p: 0.16}], expect: [b]}
  # Lo que Jev no contestó queda (lo propuso la regla).
  - {items: [{term: a, fact: x, p: 0.9}, {term: b, fact: x}], expect: [a, b]}
  - {items: [{term: a, fact: x}], expect: doubt}
