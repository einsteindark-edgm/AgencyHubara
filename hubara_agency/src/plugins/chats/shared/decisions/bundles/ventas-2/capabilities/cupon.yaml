# yaml-language-server: $schema=../../../../../../../../schemas/decision-capability.schema.json
#
# «¿Habla del cupón o de sus productos?». La regla ante la duda dice que sí
# (cuesta una relectura del cupo y una nota más larga, nunca una venta). Solo
# se pregunta cuando la regla LEE el texto. Jev corrige los dos lados:
# «código postal» no es el cupón; «¿sigue el beneficio?» sí lo es.
capability: cupon
value: bool
input: CuponEnJuego
rule: {builtin: coupon_in_play}
state: {builtin: coupon_talk}
questions:
  - id: cupon.habla
    kind: noul
    text: "¿En ESTE MENSAJE el cliente habla del cupón, del descuento o de alguno de los productos del cupón?"
    criteria:
      "true": "sí"
      "false": "no"
thresholds: {"yes": 0.7, "no": 0.15}
decide:
  - when: "!('cupon.habla' in p)"
    then: doubt
  - when: "p['cupon.habla'] >= th['yes']"
    then: true
  - when: "p['cupon.habla'] <= th['no']"
    then: false
  - otherwise: doubt
floor: {builtin: jev}
same: {builtin: bool_eq}
examples:
  - {answers: {cupon.habla: 0.7}, expect: true}
  - {answers: {cupon.habla: 0.15}, expect: false}
  - {answers: {cupon.habla: 0.5}, expect: doubt}
