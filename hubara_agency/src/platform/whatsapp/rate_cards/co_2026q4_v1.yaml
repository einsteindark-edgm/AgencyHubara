# WhatsApp Cloud API rate card — Colombia Q4 2026 v1
#
# EFECTIVO: 1-oct-2026. El acantilado de pricing de non-template messages
# (ver WHATSAPP_WINDOW_STRATEGY.md §1). Cambios vs co_2026q2_v1:
#   - service: 0 → 800   (los service messages free-form dentro de la ventana
#                         24h dejan de ser gratis el 1-oct-2026; rate = "igual
#                         que utility/auth", a publicarse por Meta ~1-sep-2026).
#   - utility: sigue 800 pero YA NO es gratis dentro de la CSW (antes free
#              hasta el 1-oct). El "free" no lo modela el rate card sino el
#              pricing_type del webhook / la ventana — ver el guard del
#              short-circuit en test_whatsapp_cost_oct_cliff.py.
#
# `service: 800` VERIFICADO 2026-09-18 contra la doc oficial de Meta
# ("non-template messages"): "By market, rates for service messages are the
# same as the rates for utility and authentication messages" → Colombia
# utility/auth = $0.0008. Shape del webhook post-oct: {"billable": true,
# "pricing_model": "PMP", "type": "regular", "category": "service"}.
# (Los BSP mencionan 1.000 service gratis/mes por número; la página oficial
# no — si existen llegarán como no-billable y el costo real da 0 igual.)
#
# NO hace falta flippear ningún env: desde 2026-09-18 la tarjeta vigente se
# elige POR FECHA (`effective_rate_card_version`). WHATSAPP_RATE_CARD_VERSION
# queda solo como override de emergencia.
#
# Reglas (idénticas a co_2026q2_v1, ver cost.py):
#   - pricing.billable == false                        → 0
#   - pricing.pricing_type == "free_customer_service" → 0 (🔴 short-circuit,
#                                                          riesgo de subconteo
#                                                          si Meta lo manda
#                                                          mientras cobra —
#                                                          verificar webhook)
#   - pricing.pricing_type == "free_entry_point"      → 0 (dentro de 72h CTWA)
#   - pricing.pricing_type == "regular"               → rates[category]
#
# UNIDAD: USD micros (10^-6 USD). $0.0008 = 800; $0.0125 = 12500.
# INMUTABLE una vez en producción — si Meta cambia tarifas, crear versión nueva.

version: co_2026q4_v1
effective_from_ms: 1790812800000   # 2026-10-01T00:00:00Z (era 1759276800000 = 2025-10-01, fix 2026-09-18)
country: CO
currency: USD

rates:
  marketing:
    usd_micros_per_message: 12500       # $0.0125 USD
  utility:
    usd_micros_per_message: 800         # $0.0008 USD (ya no free en CSW)
  authentication:
    usd_micros_per_message: 800         # $0.0008 USD
  authentication_international:
    usd_micros_per_message: null        # NO listado para Colombia
  service:
    usd_micros_per_message: 800         # $0.0008 USD (era 0 — cobrado desde 1-oct)
