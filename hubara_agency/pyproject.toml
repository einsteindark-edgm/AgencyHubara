[project]
name = "hubara-agency"
version = "0.1.0"
description = "Hubara Agency - AI Agent Deployments"
requires-python = ">=3.11"
dependencies = [
    "exoclaw-temporal",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2,<3",
    "tenacity>=8.2,<10",
    # --- Observabilidad OTel (HU-002) ---
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    # GenAI instrumentation → gen_ai.* semantic conventions estándar + métricas
    "openlit>=1.0",
    "pyjwt[crypto]>=2.12.1",
    # AWS SDK — el Boto3Launcher del buzón de análisis de ads (ec2:StartInstances + ssm:SendCommand
    # scoped al tag Role=graphagents). Import perezoso: solo se carga al despachar un run real.
    "boto3>=1.34",
]

[project.optional-dependencies]
evals = [
    "deepeval>=4.0.5",
]

[tool.uv.sources]
exoclaw-temporal = { workspace = true }

[tool.uv]
dev-dependencies = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-archon>=0.0.6",
    "import-linter>=2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "architecture: tests de arquitectura DEHA — bloquean merge a main",
    "functional: tests funcionales end-to-end — evidencia del feature, adjunta al PR comment",
    "eval: tests de evaluación LLM (DeepEval) — requieren el extra `evals` + un juez (litellm). Correr con `uv run --extra evals pytest -m eval`",
]
