[project]
name = "hubara-agency"
version = "0.1.0"
description = "Hubara Agency - AI Agent Deployments"
requires-python = ">=3.11"
dependencies = [
    "exoclaw-temporal",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2,<3",
    "tenacity>=8.2,<10",
]

[tool.uv.sources]
exoclaw-temporal = { workspace = true }

[tool.uv]
dev-dependencies = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-archon>=0.0.6",
    "import-linter>=2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "architecture: tests de arquitectura DEHA — bloquean merge a main",
    "functional: tests funcionales end-to-end — evidencia del feature, adjunta al PR comment",
]
