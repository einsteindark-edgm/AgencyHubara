name: implementar-hu-frontend
description: |
  Orquestador del pipeline FSD-frontend con paralelismo total. Coordina la
  ejecución de los batches de implementar-tarea-frontend según el DAG del
  manifest, invoca al merger después de cada batch para consolidar
  wiring_intents en los spinal files (pages/*.tsx, app/providers/index.tsx,
  index.css, barrels), y guía al operador en los commits + merges intermedios.

  **Use when**: ya corriste planificar-hu-frontend,
  frontend_dashboard/.frontend/plans/<id>/ está visible en main (o el branch
  base), y querés ejecutar TODO el pipeline de implementación, no una tarea
  sola. El input es el HU id (ej: "HU-20260511-1430-foo").

  Si querés TOTALMENTE automatizado (sin terminales manuales), usá
  `hu-frontend-pipeline` (secuencial, sin merger).

  **Modelo operacional**:
  Este workflow asume que el operador (vos) lanza las N tareas paralelas
  de cada batch MANUALMENTE en terminales separadas. El workflow:
    1. Identifica el próximo batch a ejecutar (con un nodo bash de status).
    2. Imprime los N comandos para lanzar (en el loop AI).
    3. Espera a que respondas "ready" cuando los N terminaron.
    4. Stagea los results, invoca al merger skill, muestra el merge-report.
    5. Te da los comandos git para mergear el batch consolidado.
    6. Avanza al siguiente batch.

provider: claude
model: sonnet
interactive: true

nodes:
  # Determinista: resolver HU id, validar manifest, reportar status inicial
  - id: cargar-plan
    bash: |
      set -e
      RAW="$ARGUMENTS"

      # Resolver HU id
      if [[ "$RAW" =~ ^HU- ]]; then
        HU_ID="$RAW"
      elif [[ "$RAW" == *plans/* ]]; then
        HU_ID=$(echo "$RAW" | grep -oE 'plans/[^/]+' | sed 's|^plans/||')
      else
        echo "FATAL: no parece HU id ni path: '$RAW'" >&2
        echo "Planes disponibles:" >&2
        ls frontend_dashboard/.frontend/plans/ 2>/dev/null || echo "  (sin planes)" >&2
        exit 1
      fi

      MANIFEST="frontend_dashboard/.frontend/plans/${HU_ID}/plan-manifest.yaml"
      [ -f "$MANIFEST" ] || {
        echo "FATAL: no encuentro manifest: $MANIFEST" >&2
        exit 1
      }

      grep -q '^parallel_batches:' "$MANIFEST" || {
        echo "FATAL: manifest no tiene 'parallel_batches:'. Re-correr planificar-hu-frontend." >&2
        exit 1
      }

      # Stagear archivos compartidos para el merger en fases posteriores
      cp frontend_dashboard/.frontend/spinal-files.yaml $ARTIFACTS_DIR/spinal-files.yaml
      cp frontend_dashboard/.frontend/project-context.md $ARTIFACTS_DIR/project-context.md

      # Reportar estado actual del pipeline (counting simple, sin parseo de YAML estructural)
      RESULTS_DIR="frontend_dashboard/.frontend/results/${HU_ID}"
      mkdir -p "$RESULTS_DIR"

      # grep -c siempre imprime un número (0 si no matchea, exit 1). NO usar `|| echo 0`
      # porque eso pega "0\n0" cuando no hay matches. Usar :- default.
      TOTAL=$(grep -cE '^  - id: F[0-9]+' "$MANIFEST" 2>/dev/null)
      TOTAL=${TOTAL:-0}
      PASSED=$(find "$RESULTS_DIR" -name 'F*-result.yaml' -exec grep -l '^status: passed' {} + 2>/dev/null | wc -l | tr -d ' ')
      PASSED=${PASSED:-0}

      cat <<EOF
      ╔════════════════════════════════════════════════════════════════╗
      ║ Orquestador implementar-hu-frontend
      ║ HU id:     ${HU_ID}
      ║ Manifest:  ${MANIFEST}
      ║ Progreso:  ${PASSED}/${TOTAL} tareas passed
      ╠════════════════════════════════════════════════════════════════╣
      ║ Parallel batches del plan:
      EOF

      # Dump simple del bloque parallel_batches (no parseo estructural — solo display)
      awk '/^parallel_batches:/{flag=1} /^[a-z]/ && flag && !/^parallel_batches:/{flag=0} flag' "$MANIFEST" | sed 's/^/      ║   /'

      echo "      ╚════════════════════════════════════════════════════════════════╝"
      echo ""
      echo "Ahora entrá al loop interactivo. El siguiente nodo te va a guiar batch por batch."
    timeout: 60000

  # AI iterativo: orquesta batches con fan-out manual del operador + merger
  - id: ejecutar-pipeline
    depends_on: [cargar-plan]
    idle_timeout: 3600000   # 1 hora idle (el operador puede tardar en lanzar terminales)
    loop:
      interactive: true
      max_iterations: 50
      until: PIPELINE_OK
      skills:
        - frontend-merger-archon
      gate_message: |
        Estado del pipeline al final de esta iteración:
          - Batch corriente: <ver output del nodo>
          - Acción esperada del operador: <ver output del nodo>

        Comandos disponibles:
          - "ready"   → ya lancé las N tareas y todas terminaron con passed; invocá al merger
          - "next"    → ya mergeé el batch a main, avanzá al siguiente
          - "rerun"   → re-ejecutar el batch actual (alguna tarea quedó failed/blocked)
          - "skip F<NN>" → la tarea X la implementé a mano; marcala como passed y seguí
          - "all done"   → termino acá (algunas tareas pendientes pero quiero parar)
          - "blocked: <razón>" → frená el pipeline y diagnostiquemos
      prompt: |
        Feedback del operador en esta iteración: $LOOP_USER_INPUT

        Estado del manifest visible en output del nodo `cargar-plan`:
        $cargar-plan.output

        Releé frontend_dashboard/.frontend/plans/<hu_id>/plan-manifest.yaml.
        Releé el estado de frontend_dashboard/.frontend/results/<hu_id>/
        (qué tareas tienen result.yaml con status: passed).

        Si TODAS las tareas están passed o el operador dijo "all done":
        <promise>PIPELINE_OK</promise>

        Caso contrario, decidí en qué fase del batch actual estás:

        ─────────────────────────────────────────────────────────────────
        FASE A — Identificación del próximo batch y emisión de comandos
        ─────────────────────────────────────────────────────────────────
        Si NO hay un batch "en curso" (todos los batches están completos
        o pendientes, ninguno tiene status mixto):

          Paso A.1 — Identificá el primer batch pendiente en parallel_batches[].
          Paso A.2 — Validá depends_on (para cada F<NN> en el batch, sus deps
                     deben tener result.yaml passed Y al menos un files_created
                     visible en el worktree).

          Paso A.3 — Mostrá al operador el plan del batch:

            ╔════════════════════════════════════════════════════════════╗
            ║ 🚀 Batch B<k> listo para arrancar                          ║
            ║ Tareas en paralelo (N): F<NN1>, F<NN2>, ...                ║
            ║ Warnings del planner: <lista de warnings del batch>        ║
            ╚════════════════════════════════════════════════════════════╝

            📋 Abrí N terminales y corré (UNA por terminal):
              archon workflow run implementar-tarea-frontend "<hu_id> F<NN1>"
              archon workflow run implementar-tarea-frontend "<hu_id> F<NN2>"
              ...

            ⏳ Esperá a que TODAS terminen con status: passed.
            ✅ Cuando las N estén passed, commiteá pre-merger:
              git add frontend_dashboard/.frontend/results/<hu_id>/F*-result.yaml \
                      <files_created de cada tarea>
              git commit -m "<hu_id> B<k>: <N> tareas paralelas (pre-merger)"
              (NO pushees aún — falta el merger consolidando spinal files)
            🔄 Respondé "ready" para invocar al merger.

          Salí esperando "ready".

        ─────────────────────────────────────────────────────────────────
        FASE B — Consolidación via merger (operador dijo "ready")
        ─────────────────────────────────────────────────────────────────
        Si $LOOP_USER_INPUT contiene "ready":

          B.0 — REFRESH:  git fetch origin && git merge --ff-only origin/main
          B.1 — Identificá batch en curso (último mostrado como "listo").
          B.2 — Verificá que TODAS las tareas del batch tengan
                result.yaml con status: passed.
          B.3 — Stage para el merger:
                mkdir -p $ARTIFACTS_DIR/batch-results
                rm -f $ARTIFACTS_DIR/batch-results/*.yaml
                cp frontend_dashboard/.frontend/results/<hu_id>/F*-result.yaml \
                   $ARTIFACTS_DIR/batch-results/
                (spinal-files.yaml + project-context.md ya están en $ARTIFACTS_DIR
                 desde el nodo cargar-plan).

          B.4 — Validá que los spinal files estén en main-state:
                for f in $(yq '.spinal_files[].path' $ARTIFACTS_DIR/spinal-files.yaml); do
                  git diff origin/main -- $f
                done   # debería estar vacío

          B.5 — Ejecutá el protocolo del skill frontend-merger-archon
                DIRECTAMENTE (ya está cargado en tu contexto via `skills:`).
                $USER_MESSAGE virtual: "B<k> [F<NN1>, F<NN2>, ...]"
                Skill Steps 1-3:
                  - leer spinal-files.yaml + N task-result.yaml
                  - aplicar wiring_intents a los spinal files del worktree
                  - escribir merge-report.yaml

          B.6 — Mostrá al operador merge-report + git diff.

          B.7 — Comandos para finalizar:
            git add <spinal-files modificados por el merger>
            git commit -m "<hu_id> B<k>: merger consolidó <N> wiring_intents"
            git push   # o merge a main
            (cuando hayas mergeado, respondé "next")

        ─────────────────────────────────────────────────────────────────
        FASE C — Avance (operador dijo "next")
        ─────────────────────────────────────────────────────────────────
          git fetch origin && git merge --ff-only origin/main
          Volvé al estado inicial del loop → próxima iteración entra en FASE A.

        ─────────────────────────────────────────────────────────────────
        FASE D — Re-ejecución ("rerun") / FASE E — Skip ("skip F<NN>")
        ─────────────────────────────────────────────────────────────────
        D: Mostrá los comandos de FASE A para que el operador relance.
        E: Tratá la tarea como completada (asumiendo que está committeada).

  # Determinista: resumen final + cleanup hints
  - id: cerrar-pipeline
    depends_on: [ejecutar-pipeline]
    bash: |
      # Resolver HU_ID del manifest del nodo cargar-plan (re-extraer)
      RAW="$ARGUMENTS"
      if [[ "$RAW" =~ ^HU- ]]; then HU_ID="$RAW"; else HU_ID=$(echo "$RAW" | grep -oE 'plans/[^/]+' | sed 's|^plans/||'); fi

      RESULTS_DIR="frontend_dashboard/.frontend/results/${HU_ID}"
      MANIFEST="frontend_dashboard/.frontend/plans/${HU_ID}/plan-manifest.yaml"

      TOTAL=$(grep -cE '^  - id: F[0-9]+' "$MANIFEST" 2>/dev/null)
      TOTAL=${TOTAL:-0}
      PASSED=$(grep -l '^status: passed' "$RESULTS_DIR"/F*-result.yaml 2>/dev/null | wc -l | tr -d ' ')
      PASSED=${PASSED:-0}

      cat <<EOF
      ╔════════════════════════════════════════════════════════════════╗
      ║ Pipeline cerrado — HU ${HU_ID}
      ║ Tareas:      ${PASSED}/${TOTAL} passed
      ╚════════════════════════════════════════════════════════════════╝

      Sugerencias finales:

        1. Suite completa:
           cd frontend_dashboard && npm test
           cd frontend_dashboard && npx tsc -b
           cd frontend_dashboard && npm run build

        2. PR consolidado (opcional):
           gh pr create --title "${HU_ID}: <título>"

        3. Cleanup de worktrees temporales de Archon:
           archon isolation cleanup --merged

        4. Tabla de tareas:
      EOF
      for r in "$RESULTS_DIR"/F*-result.yaml; do
        [ -f "$r" ] || continue
        TASK=$(basename "$r" -result.yaml)
        STATUS=$(grep -m1 '^status:' "$r" | awk '{print $2}')
        FC=$(awk '/^files_created:/{f=1; next} f && /^  - /{c++; next} f && /^[^ ]/{exit} END{print c+0}' "$r")
        printf "           %-6s %-25s %d files\n" "$TASK" "$STATUS" "$FC"
      done
    timeout: 30000
