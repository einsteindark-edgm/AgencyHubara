name: review-pr-exoclaw
description: |
  Code review especializado para PRs de EXOCLAW (DEHA: Durable Execution +
  Honest Agent en Python + Temporal). Inspirado en archon-smart-pr-review
  pero con 5 agentes específicos del stack: DEHA compliance (5 R-rules),
  Pydantic boundary, Temporal best practices, test coverage Python, security.

  **Use when**:
    - Lanzado automáticamente por hu-exoclaw-pipeline después de crear el PR
    - Lanzado manualmente: `archon workflow run review-pr-exoclaw "<PR_URL>"`

  **Flujo**:
    1. fetch PR + diff → escribe $ARTIFACTS_DIR/pr.json, diff.patch, changed-files.txt
    2. classifier (haiku) lee esos archivos y decide qué agentes correr
    3. agentes especializados corren en paralelo (sonnet) — solo los relevantes
    4. synthesize (sonnet) consolida findings en un comment de PR
    5. auto-fix CRITICAL/HIGH (sonnet) modifica código + commit + push
    6. post-comment al PR con findings + summary del auto-fix

  **Costo aprox**: $0.04-0.10 por PR según tamaño (classifier decide).

provider: claude
model: sonnet
interactive: false

worktree:
  enabled: true

nodes:
  # ════════════════════════════════════════════════════════════════════
  # FASE 1 — Setup: fetch PR + checkout branch + diff
  # ════════════════════════════════════════════════════════════════════

  - id: fetch-pr
    bash: |
      set -e
      RAW="$ARGUMENTS"

      PR_NUM=$(echo "$RAW" | grep -oE '[0-9]+' | head -1)
      if [ -z "$PR_NUM" ]; then
        echo "FAIL_NO_PR_NUMBER" >&2
        exit 1
      fi

      gh pr view "$PR_NUM" --json number,title,body,headRefName,baseRefName,state,additions,deletions,changedFiles,files,url \
        > $ARTIFACTS_DIR/pr.json

      STATE=$(jq -r '.state' $ARTIFACTS_DIR/pr.json)
      if [ "$STATE" != "OPEN" ]; then
        echo "FAIL_PR_NOT_OPEN_$STATE"
        exit 0
      fi

      # Emitir resumen corto para el log y como guía rápida a downstream
      TITLE=$(jq -r '.title' $ARTIFACTS_DIR/pr.json)
      BRANCH=$(jq -r '.headRefName' $ARTIFACTS_DIR/pr.json)
      ADDS=$(jq -r '.additions' $ARTIFACTS_DIR/pr.json)
      DELS=$(jq -r '.deletions' $ARTIFACTS_DIR/pr.json)
      CHANGED=$(jq -r '.changedFiles' $ARTIFACTS_DIR/pr.json)

      jq -r '.headRefName' $ARTIFACTS_DIR/pr.json > $ARTIFACTS_DIR/.branch
      jq -r '.url' $ARTIFACTS_DIR/pr.json > $ARTIFACTS_DIR/.pr-url

      echo "PR_NUM=$PR_NUM BRANCH=$BRANCH TITLE='$TITLE' CHANGED=$CHANGED +$ADDS/-$DELS"
    timeout: 30000

  - id: checkout-branch
    bash: |
      set -e
      BRANCH=$(cat $ARTIFACTS_DIR/.branch)
      git fetch origin --prune
      git checkout -B "$BRANCH" "origin/$BRANCH"

      # Asegurar que .venv del workspace esté hidratado para los greps que
      # podrían correr lint-imports / ruff durante el review.
      if [ ! -d ".venv" ]; then
        echo ".venv ausente — uv sync (puede tardar 30-60s)" >&2
        uv sync >&2 || echo "WARN: uv sync falló — los agentes corren sin venv hidratado" >&2
      fi

      echo "checked out $BRANCH"
    depends_on: [fetch-pr]
    timeout: 120000

  - id: fetch-diff
    bash: |
      set -e
      PR_NUM=$(jq -r '.number' $ARTIFACTS_DIR/pr.json)
      gh pr diff "$PR_NUM" > $ARTIFACTS_DIR/diff.patch
      # Solo paths de exoclaw (descartar otros files si los hubiera)
      jq -r '.files[].path' $ARTIFACTS_DIR/pr.json | grep '^hubara_agency/' > $ARTIFACTS_DIR/changed-files.txt || true
      LINES=$(wc -l < $ARTIFACTS_DIR/diff.patch)
      FILES=$(wc -l < $ARTIFACTS_DIR/changed-files.txt | tr -d ' ')
      echo "diff_lines=$LINES files=$FILES"
    depends_on: [fetch-pr]
    timeout: 30000

  # ════════════════════════════════════════════════════════════════════
  # FASE 2 — Classifier (haiku, lee archivos via Read tool)
  # ════════════════════════════════════════════════════════════════════

  - id: classify
    depends_on: [fetch-diff]
    model: haiku
    allowed_tools: [Read, Bash]
    output_format:
      type: object
      properties:
        run_deha_compliance:    {type: string, enum: ["true", "false"]}
        run_pydantic_boundary:  {type: string, enum: ["true", "false"]}
        run_temporal_practices: {type: string, enum: ["true", "false"]}
        run_test_coverage:      {type: string, enum: ["true", "false"]}
        run_security:           {type: string, enum: ["true", "false"]}
        complexity:             {type: string, enum: ["trivial", "small", "medium", "large"]}
        reasoning:              {type: string}
      required: [run_deha_compliance, run_pydantic_boundary, run_temporal_practices, run_test_coverage, run_security, complexity, reasoning]
    prompt: |
      Sos un classifier de PRs exoclaw. Tu tarea: leer el contexto del PR y
      decidir qué agentes de review correr.

      ## Paso 1 — Leer contexto
      Usá la Read tool para abrir:
        - $ARTIFACTS_DIR/pr.json (metadata: title, body, additions, deletions, changedFiles)
        - $ARTIFACTS_DIR/changed-files.txt (paths tocados)
        - $ARTIFACTS_DIR/diff.patch (diff completo; con 500-1000 líneas alcanza)

      Stats del fetch-pr (resumen rápido): $fetch-pr.output
      Stats del fetch-diff (resumen rápido): $fetch-diff.output

      ## Paso 2 — Reglas para cada agente

      - **deha_compliance**: SIEMPRE corre si hay cualquier archivo .py tocado en
        hubara_agency/src/. Verifica las 5 hard rules DEHA: R-DET (workflows
        determinísticos), R-JSON (DTOs serializables y frozen), R-STATELESS
        (sin module-level mutable state en activities), R-HEARTBEAT (long-running
        activities heartbeatean), R-DIP (capas respetadas via import-linter)
        + anti-patterns (rogue IO en workflow, naming, layout).

      - **pydantic_boundary**: Corre si el diff toca src/*/contracts.py,
        src/*/tools/, src/*/activities/, o cualquier signature pública nueva.
        Verifica que cada tool input/output sea `BaseModel` (no `dict`/`Any`),
        que los DTOs sean `frozen=True`, y que no haya `Any` en boundaries
        públicos.

      - **temporal_practices**: Corre si el diff toca src/*/workflows/,
        src/*/activities/, o configuración del worker. Verifica timeouts
        explícitos en `execute_activity`, retry policies sensatas, no IO
        ni datetime.now()/time.time() dentro de workflows, heartbeats en
        actividades long-running, sin imports de httpx/requests/subprocess
        en workflows.

      - **test_coverage**: Corre si el diff agrega/modifica código en tools/,
        activities/, workflows/, o contracts.py. Verifica que cada feature
        nuevo tenga su test correspondiente (tests/test_<X>.py). SKIP si el
        diff es solo docs/config.

      - **security**: Corre si el diff toca: subprocess, eval/exec, pickle,
        yaml.load (sin SafeLoader), SQL con f-strings, secrets/tokens
        hardcoded, env var reads que podrían leakear secrets en logs. SKIP
        si el diff es puramente cosmético.

      ## Paso 3 — Clasificá la complejidad

      - **trivial**: <50 LOC, 1-3 files, cambios cosméticos (typos, formatting)
      - **small**: 50-200 LOC, 3-6 files, lógica simple
      - **medium**: 200-500 LOC, 6-12 files, features nuevos
      - **large**: >500 LOC, 12+ files, refactor cross-cutting

      Respondé con tu razonamiento + flags en el JSON estructurado.

  # ════════════════════════════════════════════════════════════════════
  # FASE 3 — Agentes de review en paralelo
  # ════════════════════════════════════════════════════════════════════

  - id: deha-compliance
    when: "$classify.output.run_deha_compliance == 'true'"
    depends_on: [classify, checkout-branch]
    context: fresh
    allowed_tools: [Read, Bash, Grep, Glob, Write]
    idle_timeout: 600000
    prompt: |
      Sos un reviewer especializado en DEHA (Durable Execution + Honest Agent).
      Validás las 5 hard rules + anti-patterns del layout exoclaw.

      ## Reglas (las 5 R-rules)

      - **R-DET — Workflows determinísticos**: dentro de cualquier código en
        `src/*/workflows/`, NO se permiten:
          - `datetime.now()`, `datetime.utcnow()`, `time.time()`, `time.monotonic()`
          - `random.*`, `uuid.uuid4()` (usar `workflow.now()`, `workflow.random()`, etc.)
          - `os.environ.*` (config debe llegar como argumento al workflow)
          - I/O directa: `httpx`, `requests`, `asyncio.sleep` (usar `workflow.sleep`),
            file system, subprocess, sockets

      - **R-JSON — DTOs serializables**: todo lo que cruza activity/workflow boundary
        debe ser:
          - `@dataclass(frozen=True)` o `BaseModel` con `model_config = ConfigDict(frozen=True)`
          - No `Any`, no `Callable`, no objetos vivos (DB sessions, sockets, etc.)
          - Listas/tuples de tipos JSON-serializables

      - **R-STATELESS — Activities sin estado**: en `src/*/activities/` NO se permiten:
          - Variables module-level mutables: `_cache = {}`, `_state = []`, etc.
          - Singletons globales que cachean cross-invocation
          - Las dependencias se inyectan por argumento (`@activity.defn` + DI).

      - **R-HEARTBEAT — Activities long-running heartbeatean**: cualquier activity
        cuyo `start_to_close_timeout` sea >30s debe llamar `activity.heartbeat(...)`
        periódicamente (o usar el decorador `@with_heartbeat` del platform).

      - **R-DIP — Capas (Dependency Inversion)**: ver `hubara_agency/.importlinter`.
        Las capas superiores no importan de las inferiores excepto via interfaces.
        Correrlo con: `cd hubara_agency && uv run lint-imports`.

      ## Anti-patterns adicionales

      - Top-level packages prohibidos en `src/`: ningún `common/`, `core/`, `shared/`
        (usar `platform/` para infra cross-agent).
      - Agentes no se importan entre sí (`sales_whatsapp` no toca `remarketing_whatsapp`).
      - Tools nombradas con `*Tool` o `*ToolBase` solo en `tools/` (no en activities).
      - Spinal files (`worker.py`, `composition.py`, `contracts.py`) son consolidados
        — ningún feature debe duplicarlos por agente.

      ## Paso 1 — Cargar contexto
      Leé con Read:
        - $ARTIFACTS_DIR/pr.json (title, body)
        - $ARTIFACTS_DIR/changed-files.txt (paths tocados)
        - $ARTIFACTS_DIR/diff.patch (diff completo)

      ## Paso 2 — Greps útiles (correr con Bash)

      # R-DET violations en workflows
      grep -rEn "datetime\.(now|utcnow)|time\.(time|monotonic)|random\.|uuid\.uuid4|os\.environ|asyncio\.sleep|\bhttpx\b|\brequests\b" hubara_agency/src/*/workflows/ 2>/dev/null

      # R-JSON heuristic — dataclasses sin frozen=True
      grep -rEn "^@dataclass\s*$|^@dataclass\(\)$" hubara_agency/src/

      # R-STATELESS — module-level mutable state en activities
      grep -rEn "^[a-zA-Z_]+ *= *(\[\]|\{\}|set\(\)|list\(\)|dict\(\))" hubara_agency/src/*/activities/ 2>/dev/null

      # R-HEARTBEAT — activities con start_to_close > 30s
      grep -rEnB1 "start_to_close_timeout.*=.*(timedelta\(.*minutes|seconds=[3-9][0-9]|seconds=[1-9][0-9][0-9])" hubara_agency/src/

      # Anti-pattern: top-level prohibido
      ls hubara_agency/src/ | grep -E "^(common|core|shared)$"

      # Anti-pattern: cross-agent imports
      grep -rEn "from src\.(sales_whatsapp|remarketing_whatsapp|catalog_sync)\." hubara_agency/src/ | grep -vE "from src\.(sales_whatsapp|remarketing_whatsapp|catalog_sync) import"

      # Validar con import-linter (R-DIP)
      cd hubara_agency && uv run lint-imports 2>&1 | tail -50

      ## Paso 3 — Para cada hallazgo

      - Severity: CRITICAL / HIGH / MEDIUM / LOW
      - File:line: dónde está el problema
      - Rule violated: R-DET / R-JSON / R-STATELESS / R-HEARTBEAT / R-DIP / antipattern-name
      - Why it matters: 1-2 líneas
      - Fix suggestion: código exacto que arreglaría el problema

      ## Paso 4 — Escribir findings

      Escribí a $ARTIFACTS_DIR/findings-deha.md:

      # DEHA Compliance Findings

      ## Summary
      Verdict: APPROVE | REQUEST_CHANGES | NEEDS_DISCUSSION
      Findings: N (X CRITICAL, Y HIGH, Z MEDIUM, W LOW)

      ## Findings

      ### CRITICAL: <title>
      - File: path:line
      - Rule: R-DET (o la que corresponda)
      - Issue: ...
      - Fix:
        ```python
        # ...
        ```

      (Repetir por finding)

      Si no encontrás violaciones, escribí el archivo con verdict APPROVE y "No findings".

  - id: pydantic-boundary
    when: "$classify.output.run_pydantic_boundary == 'true'"
    depends_on: [classify, checkout-branch]
    context: fresh
    allowed_tools: [Read, Bash, Grep, Glob, Write]
    idle_timeout: 600000
    prompt: |
      Sos un reviewer especializado en Pydantic + DTOs en boundaries.

      ## Mandato
      En este stack, todo lo que cruza:
        - tool input/output (LLM → código)
        - activity input/output (workflow → activity)
        - module boundary público (`contracts.py`)
      DEBE ser `BaseModel` o `@dataclass(frozen=True)`. `dict[str, Any]`,
      `Any`, o tuplas anónimas en signatures públicas son anti-pattern: el
      LLM tipa runtime mal, los workflows fallan en deserialización, y los
      contratos cambian silenciosamente.

      ## Paso 1 — Cargar contexto
      Leé con Read:
        - $ARTIFACTS_DIR/pr.json
        - $ARTIFACTS_DIR/changed-files.txt
        - $ARTIFACTS_DIR/diff.patch

      ## Paso 2 — Reglas que validás
      1. Tool inputs/outputs son `BaseModel` (no `dict`, no `Any`).
      2. Activity inputs/outputs son `BaseModel` o `@dataclass(frozen=True)`.
      3. DTOs en `contracts.py` son frozen.
      4. No `Any` en parámetros o returns de funciones públicas (`def foo() -> Any:` está mal,
         salvo casos justificados como un parser deserializer interno).
      5. No `dict[str, Any]` ni `Dict[str, Any]` en signatures públicas.
      6. `BaseModel.model_config = ConfigDict(frozen=True, extra="forbid")` para shapes
         de contratos (no para state mutable interno).

      ## Paso 3 — Greps útiles
        grep -rEn "Any\b" hubara_agency/src/ --include="*.py" | grep -E "(def |->|: )"
        grep -rEn "Dict\[str, *Any\]|dict\[str, *Any\]" hubara_agency/src/
        grep -rEnA3 "@activity\.defn|@dataclass" hubara_agency/src/ | grep -E "^\s*def|^\s*async def"
        grep -rEn "class .*\(BaseModel\)" hubara_agency/src/
        # Dataclasses sin frozen
        grep -rEnA1 "^@dataclass\b" hubara_agency/src/ | grep -vE "frozen=True|@dataclass"

      ## Paso 4 — Escribir findings
      Escribí a $ARTIFACTS_DIR/findings-pydantic.md con el mismo formato que findings-deha.md.

  - id: temporal-practices
    when: "$classify.output.run_temporal_practices == 'true'"
    depends_on: [classify, checkout-branch]
    context: fresh
    allowed_tools: [Read, Bash, Grep, Glob, Write]
    idle_timeout: 600000
    prompt: |
      Sos un reviewer especializado en Temporal SDK Python + exoclaw-temporal.

      ## Paso 1 — Cargar contexto
      Leé con Read:
        - $ARTIFACTS_DIR/pr.json
        - $ARTIFACTS_DIR/changed-files.txt
        - $ARTIFACTS_DIR/diff.patch

      ## Paso 2 — Reglas que validás

      1. **Activity timeouts explícitos**: cada `workflow.execute_activity(...)` o
         `workflow.start_activity(...)` declara `start_to_close_timeout` (o `schedule_to_close_timeout`).
         Sin timeout → puede colgar indefinidamente.
      2. **Retry policy razonable**: `RetryPolicy(maximum_attempts=N, ...)` cuando aplica.
         No `maximum_attempts=None` (= reintenta para siempre) sin justificación.
      3. **No I/O en workflows**: prohibido `httpx`, `requests`, `subprocess`, `open(...)`,
         sockets, dentro de `src/*/workflows/`.
      4. **No datetime.now/time.time en workflows**: usar `workflow.now()` y `workflow.time()`.
         Lo mismo para `random` (usar `workflow.random()`).
      5. **No `asyncio.sleep` en workflows**: usar `workflow.sleep(timedelta(...))` o equivalente.
      6. **Heartbeats en activities long-running**: si `start_to_close_timeout > 30s`, el código
         de la activity llama `activity.heartbeat(...)` con cadencia ~10% del timeout.
       Excepción: actividades que ya usan `@with_heartbeat` del platform.
      7. **Cancellation handled**: `try/except asyncio.CancelledError` en activities que
         necesitan cleanup (cerrar conexiones, etc.).
      8. **No state cross-invocation en activity classes**: una `class FooActivity` con
         `self._cache = {}` es anti-pattern; el orchestrator puede crear N instancias.
      9. **continue-as-new** documentado: si un workflow se loopea, debe llamar
         `workflow.continue_as_new(...)` cuando el history crece.
      10. **Worker registration**: cada nueva activity / workflow está registrada en
          `src/*/worker.py` (spinal file).

      ## Paso 3 — Greps útiles
        grep -rEn "execute_activity|start_activity" hubara_agency/src/*/workflows/ | grep -vE "start_to_close_timeout|schedule_to_close_timeout"
        grep -rEn "maximum_attempts.*=.*None" hubara_agency/src/
        grep -rEn "(httpx|requests|subprocess|asyncio\.sleep|open\()" hubara_agency/src/*/workflows/
        grep -rEn "datetime\.(now|utcnow)|time\.(time|monotonic)|random\." hubara_agency/src/*/workflows/
        grep -rEn "@activity\.defn" hubara_agency/src/ | head -30
        grep -rEn "activity\.heartbeat" hubara_agency/src/
        # Detectar long-running activities sin heartbeat
        grep -rB2 -A20 "@activity\.defn" hubara_agency/src/*/activities/ | grep -v "heartbeat"

      ## Paso 4 — Escribir findings
      Escribí a $ARTIFACTS_DIR/findings-temporal.md con el mismo formato.

  - id: test-coverage
    when: "$classify.output.run_test_coverage == 'true'"
    depends_on: [classify, checkout-branch]
    context: fresh
    allowed_tools: [Read, Bash, Grep, Glob, Write]
    idle_timeout: 600000
    prompt: |
      Sos un reviewer de cobertura de tests para exoclaw (pytest + temporalio testing).

      ## Paso 1 — Cargar contexto
      Leé con Read:
        - $ARTIFACTS_DIR/pr.json
        - $ARTIFACTS_DIR/changed-files.txt
        - $ARTIFACTS_DIR/diff.patch

      ## Paso 2 — Reglas
      1. Cada `src/<agent>/tools/<X>.py` nuevo o modificado debería tener
         `tests/test_<agent>_<X>.py` (o equivalente) con: happy path + error path
         + edge case Zod-style (Pydantic validation error).
      2. Cada `src/<agent>/activities/<X>.py` nuevo debería tener test que mockee
         las dependencias externas (httpx, DB) y valide el contrato I/O.
      3. Cada `src/<agent>/workflows/<X>.py` nuevo o modificado debería tener un
         test con `TimeSkippingWorkflowEnvironment` o `WorkflowEnvironment.start_time_skipping()`
         + `Worker` mockeando las activities. Verifica al menos el happy path.
      4. Tests usan `pytest-asyncio` (`@pytest.mark.asyncio` o `asyncio_mode = "auto"` en pyproject).
      5. Mocks con `respx` para httpx, `unittest.mock.AsyncMock` para activities.
      6. Test fixtures NO usan `asyncio.run(...)` (eso rompe pytest-asyncio).
      7. Para tests de contratos (DTOs), validar `model_validate(...)` + `model_dump(...)`
         con un fixture de payload realista.

      Para cada archivo `src/*.py` nuevo en changed-files.txt sin test acompañante: REPORTAR.

      ## Paso 3 — Greps útiles
        # Listar nuevos files de código y buscar tests asociados
        grep -E "^hubara_agency/src/.+\.py$" $ARTIFACTS_DIR/changed-files.txt
        ls hubara_agency/tests/ 2>/dev/null
        # Tests de workflows
        grep -rEn "WorkflowEnvironment|TimeSkippingWorkflowEnvironment|Worker\(" hubara_agency/tests/
        # Tests de activities
        grep -rEn "AsyncMock|@pytest.fixture|respx" hubara_agency/tests/
        # Anti-pattern: asyncio.run en tests
        grep -rEn "asyncio\.run\(" hubara_agency/tests/

      ## Paso 4 — Escribir findings
      Escribí a $ARTIFACTS_DIR/findings-tests.md con el mismo formato.

  - id: security
    when: "$classify.output.run_security == 'true'"
    depends_on: [classify, checkout-branch]
    context: fresh
    allowed_tools: [Read, Bash, Grep, Glob, Write]
    idle_timeout: 600000
    prompt: |
      Sos un reviewer de seguridad Python.

      ## Paso 1 — Cargar contexto
      Leé con Read:
        - $ARTIFACTS_DIR/pr.json
        - $ARTIFACTS_DIR/changed-files.txt
        - $ARTIFACTS_DIR/diff.patch

      ## Paso 2 — Reglas que validás
      1. No `eval(...)`, `exec(...)`, `compile(...)` con input no controlado.
      2. No `pickle.loads(...)` ni `cPickle.loads(...)` (deserialización insegura,
         RCE potencial si data viene de red/usuario).
      3. No `yaml.load(...)` sin `Loader=yaml.SafeLoader` — usar `yaml.safe_load(...)`.
      4. No SQL con f-strings: `cursor.execute(f"SELECT ... {var}")` → SQL injection.
         Usar parametrized: `cursor.execute("SELECT ... %s", (var,))`.
      5. No `subprocess.run(..., shell=True)` con input de usuario o sin escapar.
         Preferir `shell=False` + `["cmd", "arg1", ...]`.
      6. No `requests.get(url, verify=False)` ni `httpx.AsyncClient(verify=False)`
         (TLS verification disabled).
      7. No secrets hardcoded: API keys, tokens, passwords en código fuente.
         Buscar patrones tipo `sk-...`, `AIza...`, `ghp_...`, `Bearer ...`.
      8. No `os.environ["SECRET"]` logueado en `logger.info`/`print` directamente.
      9. URLs construidas con `urllib.parse.urlencode` o `httpx.URL(params=...)`, no
         string concat con input del usuario.
      10. No path traversal: `open(user_input)` o `Path(user_input)` sin
          validación de que esté dentro del directorio esperado.
      11. JWT/tokens NUNCA en logs structlog (filtrar con processors).

      ## Paso 3 — Greps útiles
        grep -rEn "\beval\(|\bexec\(|\bcompile\(" hubara_agency/src/
        grep -rEn "pickle\.loads|cPickle\.loads" hubara_agency/src/
        grep -rEn "yaml\.load\(" hubara_agency/src/ | grep -v "yaml\.safe_load\|yaml\.load\(.*Loader=yaml\.SafeLoader"
        grep -rEn "execute\(f['\"]|executemany\(f['\"]" hubara_agency/src/
        grep -rEn "shell=True" hubara_agency/src/
        grep -rEn "verify=False" hubara_agency/src/
        # Secrets hardcoded — usar caution, muchos false positives
        grep -rEnE "(sk-[A-Za-z0-9]{20,}|AIza[A-Za-z0-9]{30,}|ghp_[A-Za-z0-9]{30,}|Bearer\s+[A-Za-z0-9]{30,})" hubara_agency/src/
        # logs de env vars
        grep -rEn "logger\.(info|debug|warning).*os\.environ" hubara_agency/src/

      ## Paso 4 — Escribir findings
      Escribí a $ARTIFACTS_DIR/findings-security.md con el mismo formato.

  # ════════════════════════════════════════════════════════════════════
  # FASE 4 — Synthesize
  # ════════════════════════════════════════════════════════════════════

  - id: synthesize
    depends_on: [deha-compliance, pydantic-boundary, temporal-practices, test-coverage, security]
    trigger_rule: none_failed_min_one_success
    context: fresh
    allowed_tools: [Read, Write, Bash, Grep, Glob]
    idle_timeout: 600000
    prompt: |
      Sos el synthesizer. Consolidá los findings de los 5 agentes en un único reporte.

      ## Paso 1 — Cargar findings
      Leé con Read los archivos que existan (algunos pueden faltar si el classifier los skipeó):
        - $ARTIFACTS_DIR/findings-deha.md
        - $ARTIFACTS_DIR/findings-pydantic.md
        - $ARTIFACTS_DIR/findings-temporal.md
        - $ARTIFACTS_DIR/findings-tests.md
        - $ARTIFACTS_DIR/findings-security.md

      Si un archivo no existe, saltalo (el agente no corrió por el classifier).

      ## Paso 2 — Escribir summary

      Escribí a $ARTIFACTS_DIR/review-summary.md:

      # 🤖 Code review automático del PR (exoclaw / DEHA)

      ## Verdict
      <APPROVE | REQUEST_CHANGES | NEEDS_DISCUSSION>

      ## Stats
      - CRITICAL: N
      - HIGH: M
      - MEDIUM: K
      - LOW: J

      ## Top findings (ordenados por severity)

      ### CRITICAL — <title>
      - File: path:line
      - Agent: <deha-compliance | pydantic-boundary | temporal-practices | test-coverage | security>
      - Issue: ...
      - Fix:
        ```python
        # ...
        ```

      ### HIGH — <title>
      ...

      ## Findings por agente
      <agrupar findings que NO son CRITICAL/HIGH, una sección por agente>

      ---
      *🤖 Generado por `review-pr-exoclaw`. Auto-fix se ejecutará sobre CRITICAL/HIGH si los hay.*

      ## Paso 3 — Escribir flag para downstream

      Escribí a $ARTIFACTS_DIR/needs-fix.flag con SOLO una de estas palabras:
        - `yes` si hay al menos 1 CRITICAL o HIGH
        - `no` si todos son MEDIUM/LOW o no hay findings

  # ════════════════════════════════════════════════════════════════════
  # FASE 5 — Auto-fix CRITICAL/HIGH
  # ════════════════════════════════════════════════════════════════════

  - id: check-needs-fix
    bash: |
      if [ -f "$ARTIFACTS_DIR/needs-fix.flag" ]; then
        # Strip whitespace
        cat $ARTIFACTS_DIR/needs-fix.flag | tr -d '[:space:]'
        echo ""   # newline after
      else
        echo "no"
      fi
    depends_on: [synthesize]
    trigger_rule: all_done

  - id: auto-fix
    when: "$check-needs-fix.output == 'yes'"
    depends_on: [check-needs-fix]
    context: fresh
    allowed_tools: [Read, Write, Edit, Bash, Grep, Glob]
    idle_timeout: 1800000
    prompt: |
      Sos el auto-fixer. Tenés permitido modificar código pero SOLO para arreglar
      los findings CRITICAL/HIGH listados en $ARTIFACTS_DIR/review-summary.md.

      ## Reglas estrictas

      1. SOLO arreglá CRITICAL/HIGH. NUNCA toques MEDIUM/LOW (eso queda para revisión humana).
      2. SOLO modificá archivos que el PR original ya tocó. Lista en $ARTIFACTS_DIR/changed-files.txt.
         NUNCA editen archivos fuera de esa lista.
      3. PROHIBIDO editar (architecture sacrosanct — §11 del SKILL):
         - hubara_agency/tests/architecture/*
         - hubara_agency/.importlinter
         - R_JSON_FROZEN_EXEMPTIONS, R_HEARTBEAT_EXEMPTIONS dicts en conftest
         - cualquier `ignore_imports` en .importlinter
         Si un finding requiere editar uno de esos archivos, DEJÁ el finding sin
         fixear y documentalo en auto-fix-report.md con razón "requires_planner_update".
      4. Después de cada fix, corré los tests afectados:
           cd hubara_agency && uv run pytest tests/test_<archivo>.py -xvs
         Si los tests fallan, REVERTÍ tu cambio (git checkout <file>) y dejá ese finding sin fixear.
      5. NO escalates las fixes — si arreglar un finding requiere tocar 5 archivos extra,
         documentá el problema y dejá ese finding para humano.
      6. Máximo 1 intento por finding.

      ## Workflow

      1. Leé $ARTIFACTS_DIR/review-summary.md (lista de findings con severity).
      2. Leé $ARTIFACTS_DIR/changed-files.txt (whitelist de archivos editables).
      3. Para cada finding CRITICAL/HIGH:
         a. Verificá que el archivo del finding está en la whitelist Y NO es archivo arq protegido.
         b. Aplicá el Fix sugerido con la Edit tool.
         c. Corré test relevante con Bash. Si pasa, continuá. Si falla, revertí con
            `git checkout HEAD -- <file>`.
      4. Validación global:
           cd hubara_agency && uv run pytest tests/ --tb=no -q
           cd hubara_agency && uv run pytest tests/architecture/ -m architecture --tb=short
           cd hubara_agency && uv run ruff check src/
         Si alguno falla → REVERTÍ TODOS los cambios:
           git checkout HEAD -- hubara_agency/src
         Y escribí $ARTIFACTS_DIR/auto-fix-failed.flag con razón.
      5. Escribí $ARTIFACTS_DIR/auto-fix-report.md con:
         - Fixes aplicados (file + finding + status validation)
         - Fixes saltados (finding + razón: "test failed", "scope too broad", "requires_planner_update", etc.)

      NO hagas commit ni push. El siguiente nodo lo hace.

  - id: commit-fixes
    bash: |
      set -e
      set -o pipefail
      BRANCH=$(cat $ARTIFACTS_DIR/.branch)

      # Si auto-fix abortó por validación global, no commitear nada
      if [ -f "$ARTIFACTS_DIR/auto-fix-failed.flag" ]; then
        echo "auto_fix_aborted_no_commit"
        exit 0
      fi

      # Selectivo: solo src
      git add hubara_agency/src 2>/dev/null || true
      git reset HEAD .venv 2>/dev/null || true
      git reset HEAD hubara_agency/__pycache__ 2>/dev/null || true
      git reset HEAD hubara_agency/.pytest_cache 2>/dev/null || true
      git reset HEAD hubara_agency/.ruff_cache 2>/dev/null || true
      git reset HEAD hubara_agency/.import_linter_cache 2>/dev/null || true
      git reset HEAD hubara_agency/htmlcov 2>/dev/null || true
      git reset HEAD uv.lock 2>/dev/null || true

      if git diff --staged --quiet; then
        echo "no_fixes_applied"
        exit 0
      fi

      # Doble validación pre-commit (defensivo, ya validó el auto-fix)
      cd hubara_agency
      if ! uv run pytest tests/ --tb=no -q 2>&1 | tail -20 >&2; then
        cd ..
        echo "ERROR: tests rompieron tras auto-fix. Revirtiendo." >&2
        git checkout HEAD -- hubara_agency/src
        echo "auto_fix_reverted"
        exit 0
      fi
      cd ..

      git commit -m "review-bot: auto-fix CRITICAL/HIGH findings"

      # Push con retry si origin avanzó
      if ! git push origin "$BRANCH" 2>&1 | tail -5; then
        echo "push falló, intentando pull --rebase + retry" >&2
        git pull --rebase origin "$BRANCH" 2>&1 | tail -5 || true
        git push origin "$BRANCH" 2>&1 | tail -5 || {
          echo "push falló dos veces — commit local, no en origin" >&2
        }
      fi
      echo "auto_fix_pushed"
    when: "$check-needs-fix.output == 'yes'"
    depends_on: [auto-fix]
    timeout: 600000

  # ════════════════════════════════════════════════════════════════════
  # FASE 6 — Post comment al PR
  # ════════════════════════════════════════════════════════════════════

  - id: post-comment
    bash: |
      set -e
      PR_NUM=$(jq -r '.number' $ARTIFACTS_DIR/pr.json)

      cp $ARTIFACTS_DIR/review-summary.md $ARTIFACTS_DIR/pr-comment.md
      if [ -f $ARTIFACTS_DIR/auto-fix-report.md ]; then
        printf "\n\n---\n\n## 🔧 Auto-fix report\n\n" >> $ARTIFACTS_DIR/pr-comment.md
        cat $ARTIFACTS_DIR/auto-fix-report.md >> $ARTIFACTS_DIR/pr-comment.md
      fi

      gh pr comment "$PR_NUM" --body-file $ARTIFACTS_DIR/pr-comment.md
      echo "commented"
    depends_on: [synthesize, commit-fixes]
    trigger_rule: all_done
    retry:
      max_attempts: 2
      delay_ms: 5000
      on_error: transient
