name: implementar-tarea-frontend
description: |
  Implementa UNA tarea atómica del DAG producido por planificar-hu-frontend,
  end-to-end: escribe código React/TS, corre tests con Vitest, chequea las
  FSD rules (4 import rules + 14 anti-patterns), reporta status.

  **Use when**: ya corriste planificar-hu-frontend,
  frontend_dashboard/.frontend/plans/<id>/ está visible en main, y querés
  implementar UNA tarea específica. El input puede ser:
    - Ruta a un task file: frontend_dashboard/.frontend/plans/<id>/tareas/F<NN>-<slug>.md
    - Tupla "HU-id F<NN>": "HU-20260511-1430-foo F02"

  Si querés el pipeline auto end-to-end, usá `hu-frontend-pipeline`.

provider: claude
model: sonnet
interactive: true

nodes:
  # Determinista: localizar tarea + stage + validar depends_on
  - id: cargar-tarea
    bash: |
      set -e
      RAW=$ARGUMENTS

      # Resolver task file
      TASK_FILE=""
      HU_ID=""

      if [[ "$RAW" == *"tareas/F"*.md ]] || [[ "$RAW" == *.md ]]; then
        TASK_FILE="$RAW"
        # Extraer HU_ID del path: .../plans/<HU_ID>/tareas/F<NN>-*.md
        HU_ID=$(echo "$TASK_FILE" | grep -oE 'plans/[^/]+' | sed 's|^plans/||')
      else
        # Asume formato "HU-id F<NN>"
        HU_ID=$(echo "$RAW" | awk '{print $1}')
        F_ID=$(echo "$RAW" | awk '{print $2}')
        TASK_FILE=$(ls "frontend_dashboard/.frontend/plans/${HU_ID}/tareas/${F_ID}-"*.md 2>/dev/null | head -1)
      fi

      if [ -z "$TASK_FILE" ] || [ ! -f "$TASK_FILE" ]; then
        echo "FATAL: no encuentro task file para '$RAW'" >&2
        if [ -n "$HU_ID" ] && [ -d "frontend_dashboard/.frontend/plans/${HU_ID}/tareas" ]; then
          echo "Tareas disponibles en frontend_dashboard/.frontend/plans/${HU_ID}/tareas/:" >&2
          ls "frontend_dashboard/.frontend/plans/${HU_ID}/tareas/" >&2
        fi
        exit 1
      fi

      F_ID=$(basename "$TASK_FILE" | grep -oE '^F[0-9]+')

      # Stage inputs
      cp "$TASK_FILE" $ARTIFACTS_DIR/task.md
      cp "frontend_dashboard/.frontend/plans/${HU_ID}/plan-manifest.yaml" \
         $ARTIFACTS_DIR/plan-manifest.yaml
      [ -f "frontend_dashboard/.frontend/refinements/${HU_ID}-tech.md" ] && \
        cp "frontend_dashboard/.frontend/refinements/${HU_ID}-tech.md" \
           $ARTIFACTS_DIR/hu-refinada.md
      cp frontend_dashboard/.frontend/spinal-files.yaml $ARTIFACTS_DIR/spinal-files.yaml
      cp frontend_dashboard/.frontend/project-context.md $ARTIFACTS_DIR/project-context.md

      # Validar depends_on
      DEPS=$(awk -v fid="$F_ID" '
        /^  - id:/ {inblock=($3==fid)}
        inblock && /^    depends_on:/ {
          # extract list
          gsub(/^    depends_on: */, "")
          gsub(/[\[\]'"'"',]/, " ")
          print
          exit
        }' $ARTIFACTS_DIR/plan-manifest.yaml)

      for dep in $DEPS; do
        [ -z "$dep" ] && continue
        RESULT="frontend_dashboard/.frontend/results/${HU_ID}/${dep}-result.yaml"
        if [ ! -f "$RESULT" ] || ! grep -q '^status: passed' "$RESULT"; then
          echo "FATAL: depends_on no satisfecho — falta ${dep} (no hay result.yaml passed)" >&2
          echo "Acción: mergear ${dep} a main + re-lanzar este workflow" >&2
          exit 1
        fi
        # Validar que al menos un files_created está en el worktree
        CREATED=$(awk '/^files_created:/{found=1; next} found && /^  - /{print $2; next} found && /^[^ ]/{exit}' "$RESULT" | head -3)
        FOUND=false
        for f in $CREATED; do
          [ -f "$f" ] && FOUND=true && break
        done
        if [ "$FOUND" = "false" ] && [ -n "$CREATED" ]; then
          echo "FATAL: depends_on ${dep} reportó passed pero ninguno de sus files_created está en el worktree." >&2
          echo "       (¿no mergeaste a main?)" >&2
          exit 1
        fi
      done

      echo "HU id: ${HU_ID} | Task: ${F_ID} | depends_on validados ✓"
    timeout: 60000

  # AI iterativo: implementar con feedback humano
  - id: implementar
    depends_on: [cargar-tarea]
    idle_timeout: 1800000   # 30 min idle (la tarea puede ser larga)
    loop:
      interactive: true
      max_iterations: 5
      until: TAREA_OK
      skills:
        - frontend-implementer-archon
      gate_message: |
        Implementé la tarea. Revisá:
          - $ARTIFACTS_DIR/task-result.yaml (status + comandos + FSD rules + DoD)
          - Cambios de código en el worktree (corré `git diff` y `git status`)

        Status posibles:
          - passed: todo verde, listo para comitear y mergear
          - passed_with_warnings: funciona pero quedó algún DoD sin tildar
          - failed: algún comando de §10 rojo tras 3 reintentos
          - blocked: depends_on_missing | missing_dependency |
                    requires_planner_update | regression | command_timeout

        Respondé:
          - "ok" / "merge" / "listo" si status: passed y el código pinta bien
          - Cualquier otro comentario para iterar (fix, refactor, agregar test)
          - "blocked" si querés frenar acá y volver a planificar
      prompt: |
        Tarea a implementar: $ARTIFACTS_DIR/task.md
        Manifest completo (para resolver depends_on): $ARTIFACTS_DIR/plan-manifest.yaml
        Refinamiento (fallback context): $ARTIFACTS_DIR/hu-refinada.md (si existe)
        Project context (LEER PRIMERO): $ARTIFACTS_DIR/project-context.md
        Spinal files: $ARTIFACTS_DIR/spinal-files.yaml

        Feedback del humano en esta iteración: $LOOP_USER_INPUT

        Aplicá tu protocolo de implementación (skill frontend-implementer-archon).

        Reglas hard:
          - Mantenete dentro del §3 (Files affected) de task.md.
          - NO hagas commit / push / branch / rebase / tag. Archon maneja git.
          - Reportá en $ARTIFACTS_DIR/task-result.yaml con uno de los 4 status.
          - Si $LOOP_USER_INPUT pide cambiar task.md (scope expansion), marcá
            status: blocked, blocked_reason: requires_planner_update.
          - Las FSD rules (4 import rules + anti-patterns) se verifican
            MIENTRAS escribís, no después.
          - CWD-sensitive: todos los comandos de verificación se corren con
            `cd frontend_dashboard && npm test...` (ver project-context.md).

        Si la tarea quedó en status: passed o el humano aprobó:
        <promise>TAREA_OK</promise>

  # Determinista: persistir result + reportar comandos al operador
  - id: persistir-resultado
    depends_on: [implementar]
    bash: |
      set -e

      test -f $ARTIFACTS_DIR/task-result.yaml || {
        echo "FATAL: no encuentro $ARTIFACTS_DIR/task-result.yaml" >&2
        exit 1
      }

      # Helper: extraer campo YAML stripping comillas (status: "passed" o status: passed)
      yaml_get() {
        grep -m1 "^${2}:" "$1" 2>/dev/null | awk -F: '{print $2}' | sed 's/^ *//; s/ *$//; s/^["'\'']//; s/["'\'']$//'
      }

      HU_ID=$(yaml_get $ARTIFACTS_DIR/task-result.yaml hu_id)
      TASK_ID=$(yaml_get $ARTIFACTS_DIR/task-result.yaml task_id)
      STATUS=$(yaml_get $ARTIFACTS_DIR/task-result.yaml status)

      mkdir -p "frontend_dashboard/.frontend/results/${HU_ID}"
      cp $ARTIFACTS_DIR/task-result.yaml \
         "frontend_dashboard/.frontend/results/${HU_ID}/${TASK_ID}-result.yaml"

      # Contar files_created y files_modified
      FC=$(awk '/^files_created:/{found=1; next} found && /^  - /{c++; next} found && /^[^ ]/{exit} END{print c+0}' $ARTIFACTS_DIR/task-result.yaml)
      FM=$(awk '/^files_modified:/{found=1; next} found && /^  - /{c++; next} found && /^[^ ]/{exit} END{print c+0}' $ARTIFACTS_DIR/task-result.yaml)

      cat <<EOF
      ╔════════════════════════════════════════════════════════════════╗
      ║ Tarea ${TASK_ID} — Status: ${STATUS}
      ║ Files created: ${FC}   Files modified: ${FM}
      ╚════════════════════════════════════════════════════════════════╝
      EOF

      if [ "$STATUS" = "passed" ]; then
        cat <<EOF
      ✅ Listo. Comandos según modo:

      MODO STANDALONE (lanzaste esta tarea sola): commiteá TODO incluyendo spinal.
        git status
        git add <files_created> <files_modified> frontend_dashboard/.frontend/results/${HU_ID}/${TASK_ID}-result.yaml
        git commit -m "${HU_ID} ${TASK_ID}: <título>"
        git push   # o merge a main

      MODO ORQUESTADO (parte de un batch de implementar-hu-frontend):
      commiteá SOLO new files + result.yaml. Spinal files = throwaway (los reconstruye el merger).
        git status
        git add <files_created> frontend_dashboard/.frontend/results/${HU_ID}/${TASK_ID}-result.yaml
        # NO git add sobre spinal files
        git commit -m "${HU_ID} ${TASK_ID}: feature code (sin wiring)"
        git push
      EOF
      elif [ "$STATUS" = "passed_with_warnings" ]; then
        echo "⚠️  Funciona pero quedaron DoD items sin tildar. Listalos y decidí si iterar o aceptar deuda."
      elif [ "$STATUS" = "failed" ]; then
        echo "❌ Tests rojos tras 3 reintentos. Re-iterá:"
        echo "   archon workflow run implementar-tarea-frontend \"${HU_ID} ${TASK_ID}\""
      elif [ "$STATUS" = "blocked" ]; then
        BR=$(grep -m1 '^blocked_reason:' $ARTIFACTS_DIR/task-result.yaml | awk '{print $2}')
        echo "🛑 Bloqueado: ${BR}"
        case "$BR" in
          depends_on_missing) echo "   → mergeá upstream + re-lanzá";;
          missing_dependency) echo "   → agregá lib a package.json + re-lanzá";;
          requires_planner_update) echo "   → archon workflow run planificar-hu-frontend \"${HU_ID}\"";;
          regression) echo "   → revisar tests fallidos en otra parte del repo";;
          command_timeout) echo "   → diagnosticar a mano; partir tarea en planificar si es muy grande";;
        esac
      fi
    timeout: 30000
