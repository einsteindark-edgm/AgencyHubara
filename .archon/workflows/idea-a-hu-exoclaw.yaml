name: idea-a-hu-exoclaw
description: |
  Entry-point del flujo exoclaw: toma una idea de negocio en texto libre o
  un .md corto y la refina INTERACTIVAMENTE en una HU (historia de usuario)
  bien formada con título, narrativa Como/Quiero/Para, acceptance criteria
  en formato Given/When/Then, y out of scope explícito.

  Flujo simplificado (UNA sola approval explícita):
    1. AI refina tu idea en una HU completa (una pasada, sin iteración)
    2. Auto-publica el issue + card en Project (sin gate)
    3. ÚNICA approval: ¿lanzar `hu-exoclaw-pipeline` ahora? (~$0.50, 15-30 min)
       - Sí → arranca en background, pipeline actualiza el card en cada fase
       - No → terminás con el issue listo, lanzás pipeline a mano cuando quieras

  Si el draft AI te queda mal, podés:
    - Rechazar el approval del pipeline
    - Editar el issue manualmente en GitHub antes de lanzar
    - Borrar el issue y re-correr idea-a-hu-exoclaw con una idea más detallada

  **Use when**:
    - Tenés una idea de feature para un agente (sales_whatsapp, remarketing_whatsapp,
      catalog_sync) o para el dashboard backend pero no la armaste como HU formal.
    - Querés que el card en el Project board arranque desde "Idea refined"
      y vaya pasando por Refining → Refined → Planning → ... → Done.

  **Input** ($USER_MESSAGE):
    - Texto libre: "quiero que el agente de sales detecte imágenes de productos y las describa"
    - Ruta a un .md con notas más extensas

  **Pre-requisitos**:
    - `gh` autenticado con permisos de issue create.
    - (Opcional) `.archon/github-project-config.yaml` para Project sync.

  **Output**:
    - Issue creado en GitHub (URL impresa)
    - Card en el Project (status: "Idea refined") si Project está configurado
    - Draft local persistido en `hubara_agency/.exoclaw/drafts/` (para auditoría)
    - Si aprobaste el gate: `hu-exoclaw-pipeline` corriendo en background

provider: claude
model: sonnet
interactive: true  # tiene loop interactivo + 2 approval gates

worktree:
  enabled: false   # solo lee/escribe drafts, no muta código; sin worktree extra

nodes:
  # ════════════════════════════════════════════════════════════════════
  # FASE 0 — Pre-requisitos básicos
  # ════════════════════════════════════════════════════════════════════

  - id: check-prereqs
    bash: |
      set -e
      gh auth status >&2 2>&1 || { echo "FAIL_GH_AUTH"; exit 0; }
      command -v jq  >/dev/null || { echo "FAIL_NO_JQ"; exit 0; }

      # CRÍTICO: validar que el token gh tiene scope 'project' (Projects v2 API).
      # Sin esto, gh project item-add/edit/list fallan con
      # "missing required scopes [read:project]" y los nodos project-set-*
      # fallan SILENCIOSAMENTE (exit 0 con WARN al stdout).
      # Si el config opcional de Project no existe, no chequeamos scope.
      if [ -f .archon/github-project-config.yaml ]; then
        # GitHub Projects v2 requiere AMBOS scopes 'project' + 'read:project'.
        # Bug 2026-05-13 v2: `gh auth status` puede mostrar scopes CACHEADOS
        # que no reflejan el permiso real después de `gh auth refresh -s ...`
        # (falso-negativo). String matching no es confiable.
        # Solución: SMOKE TEST funcional contra el API real — listar 1 item.
        PN=$(grep '^project_number:' .archon/github-project-config.yaml | awk '{print $2}')
        PO=$(grep '^project_owner:' .archon/github-project-config.yaml | awk '{print $2}')
        if [ -n "$PN" ] && [ -n "$PO" ]; then
          if ! gh project item-list "$PN" --owner "$PO" --format json --limit 1 > /dev/null 2>&1; then
            echo "FAIL_GH_NO_PROJECT_SCOPE"
            exit 0
          fi
        fi
      fi

      echo "OK"
    timeout: 30000

  - id: cancel-bad-prereqs
    cancel: |
      Pre-requisitos faltantes: $check-prereqs.output

      Diagnóstico:
        FAIL_GH_AUTH            → gh auth login
        FAIL_NO_JQ              → brew install jq
        FAIL_GH_NO_PROJECT_SCOPE → gh auth refresh -s project,read:project
                                   (necesario para gh project item-add/edit/list)
    when: "$check-prereqs.output != 'OK'"
    depends_on: [check-prereqs]

  # ════════════════════════════════════════════════════════════════════
  # FASE 1 — Normalizar input (idea cruda → idea-original.md)
  # ════════════════════════════════════════════════════════════════════

  - id: normalize-input
    bash: |
      RAW="$ARGUMENTS"

      # Guard: input vacío o whitespace-only → output FAIL para que cancel-bad-input dispare
      TRIMMED=$(echo "$RAW" | tr -d '[:space:]')
      if [ -z "$TRIMMED" ]; then
        echo "FAIL_EMPTY_INPUT"
        exit 0
      fi

      if [ -f "$RAW" ]; then
        cp "$RAW" $ARTIFACTS_DIR/idea-original.md
      else
        echo "$RAW" > $ARTIFACTS_DIR/idea-original.md
      fi
      SIZE=$(wc -c < $ARTIFACTS_DIR/idea-original.md)
      if [ "$SIZE" -lt 20 ]; then
        echo "FAIL_TOO_SHORT_${SIZE}"
        exit 0
      fi
      echo "OK"
    depends_on: [check-prereqs]
    when: "$check-prereqs.output == 'OK'"
    timeout: 30000

  - id: cancel-bad-input
    cancel: "Input inválido: $normalize-input.output. Pasame una idea no vacía (mínimo 20 chars): archon workflow run idea-a-hu-exoclaw 'mi idea de feature'"
    when: "$normalize-input.output != 'OK'"
    depends_on: [normalize-input]

  # ════════════════════════════════════════════════════════════════════
  # FASE 2 — Refinar la idea a HU (UNA pasada del AI, sin loop)
  # ════════════════════════════════════════════════════════════════════
  # Diseño: el AI genera la HU en una sola pasada y el workflow procede
  # auto a publicar. Si el draft te queda mal, podés:
  # (a) rechazar el approval de "lanzar pipeline" (gate-lanzar-pipeline)
  # (b) editar el issue manualmente en GitHub antes de lanzar el pipeline
  # (c) borrar el issue y re-correr idea-a-hu-exoclaw con una idea más detallada
  # El único checkpoint humano es gate-lanzar-pipeline, mucho más adelante.

  - id: refinar-hu-producto
    depends_on: [normalize-input]
    when: "$normalize-input.output == 'OK'"
    idle_timeout: 600000  # 10 min para que el AI genere el draft
    allowed_tools: [Read, Write]
    prompt: |
      Sos un product owner experimentado de AgencyHubara, con foco en los
      agentes Python construidos sobre exoclaw-temporal (DEHA: Durable
      Execution + Honest Agent). Los proyectos relevantes son:
        - sales_whatsapp        — agente de ventas vía WhatsApp Business
        - remarketing_whatsapp  — agente de remarketing
        - catalog_sync          — sincronización de catálogos
        - dashboard (backend)   — FastAPI endpoints que orquestan a los agentes

      Tu input es una IDEA DE NEGOCIO. Tu output es UNA HU bien formada,
      en una sola pasada (sin iteración con el operador).

      ## Paso 1 — Cargar contexto

      Leé con Read tool:
        - $ARTIFACTS_DIR/idea-original.md (la idea original del operador)

      ## Paso 2 — Producir la HU

      Escribí $ARTIFACTS_DIR/hu-draft.md con esta estructura EXACTA (lo
      consume validate-hu y el resto del pipeline downstream):

        # <Título corto y accionable, ≤80 chars, sin punto final>

        Como **<rol del stakeholder, ej. "operador del backoffice", "cliente WhatsApp", "product owner del agente sales">**,
        quiero **<acción concreta>**,
        para **<beneficio claro de negocio>**.

        ## Acceptance criteria

        - **Given** <contexto inicial>, **when** <acción del usuario o evento>, **then** <resultado observable y testable>.
        - **Given** ..., **when** ..., **then** ...
        - (3 a 5 bullets en total, cada uno verificable)

        ## Out of scope

        - <qué NO hace este feature, lista explícita>
        - <más cosas que el operador podría asumir pero no entran>

        ## Notas técnicas (opcional)

        - **Agente afectado**: <sales_whatsapp | remarketing_whatsapp | catalog_sync | dashboard | platform>
        - <preferencias inferidas de la idea, p.ej. "reusar el tool fetch_user del platform">
        - <constraints conocidos, p.ej. "no debe romper R-DET — usar workflow.now() en vez de datetime.now()">

      ## Paso 3 — Reglas de calidad (verificá antes de salir)

      Asegurate de que el draft cumple:
        - Título accionable (verbo + objeto), no descriptivo
        - Narrativa Como/Quiero/Para con los 3 elementos
        - Cada AC empieza con "Given" y tiene When + Then
        - Out of scope lista al menos 2 cosas que el feature NO hace
        - Notas técnicas, si las hay, mencionan al menos qué agente está afectado
        - Documento > 200 bytes
        - Inferí lo que falte de la idea original — NO le preguntes al humano,
          NO uses placeholders tipo "<TBD>" o "<a definir>"

      Si la idea es ambigua, hacé tu mejor inferencia razonable. El humano
      revisará el draft completo recién cuando el pipeline le ponga el issue
      en GitHub — y ahí puede rechazar el approval de "lanzar pipeline" o
      editar el issue directamente.

      Terminás cuando hayas escrito el archivo (no necesitás emitir promise).

  # ════════════════════════════════════════════════════════════════════
  # FASE 3 — Validar estructura del HU draft
  # ════════════════════════════════════════════════════════════════════

  - id: validate-hu
    bash: |
      F=$ARTIFACTS_DIR/hu-draft.md
      test -f "$F" || { echo "FAIL_NOT_EXISTS"; exit 0; }
      [ $(wc -c < "$F") -gt 200 ] || { echo "FAIL_TOO_SHORT"; exit 0; }
      grep -qE '^#\s+\S' "$F" || { echo "FAIL_NO_TITLE"; exit 0; }
      grep -qiE 'como\s+' "$F" || { echo "FAIL_NO_NARRATIVE"; exit 0; }
      # AC: bullets Given/When/Then
      ac_count=$(grep -cE '^[[:space:]-]*\*?\*?Given' "$F" 2>/dev/null)
      ac_count=${ac_count:-0}
      [ $ac_count -ge 2 ] || { echo "FAIL_FEW_AC_$ac_count"; exit 0; }
      grep -qiE '^##.*scope' "$F" || { echo "FAIL_NO_SCOPE_SECTION"; exit 0; }
      echo "PASS"
    depends_on: [refinar-hu-producto]
    timeout: 10000

  - id: cancel-bad-hu
    cancel: "HU draft validation FAILED: $validate-hu.output. Re-lanzá: archon workflow run idea-a-hu-exoclaw '<tu idea>'"
    when: "$validate-hu.output != 'PASS'"
    depends_on: [validate-hu]

  # ════════════════════════════════════════════════════════════════════
  # FASE 4 — Persistir el draft (siempre, antes de cualquier publicación)
  # ════════════════════════════════════════════════════════════════════

  - id: save-draft
    bash: |
      set -e
      mkdir -p hubara_agency/.exoclaw/drafts
      DRAFT_PATH="hubara_agency/.exoclaw/drafts/idea-$(date -u +%Y%m%d-%H%M%S).md"
      cp $ARTIFACTS_DIR/hu-draft.md "$DRAFT_PATH"
      echo "$DRAFT_PATH"
    when: "$validate-hu.output == 'PASS'"
    depends_on: [validate-hu]

  # ════════════════════════════════════════════════════════════════════
  # FASE 5 — Publicar Issue + agregar al Project (auto, sin gate)
  # ════════════════════════════════════════════════════════════════════
  # Decisión de diseño: el "ok" del loop refinar-hu-producto YA implica
  # "el draft está aprobado para publicar". Sería redundante pedir otra
  # aprobación inmediatamente. La única approval explícita queda
  # `gate-lanzar-pipeline` (mucho más adelante, antes de gastar ~$0.50
  # y 15+ min en el pipeline completo).

  - id: crear-issue
    bash: |
      set -e
      # Extraer título: primera línea con "# " (sin el "# ")
      TITLE=$(grep -m1 '^# ' $ARTIFACTS_DIR/hu-draft.md | sed 's/^# //' | head -c 120)
      test -n "$TITLE" || { echo "FATAL: no extrajo título" >&2; exit 1; }

      # gh imprime SOLO la URL al stdout cuando no-interactive
      # NOTA: NO usamos `--label` porque el Project board es agnóstico al
      # dominio — un solo board para frontend/exoclaw/futuros pipelines.
      # El nodo `agregar-a-project` de abajo agrega el issue al board
      # explícitamente vía `gh project item-add`, sin depender del built-in
      # auto-add workflow del Project (que filtra por label).
      #
      # CRÍTICO: capturamos stdout + stderr + exit code separadamente.
      # `set -e` NO aborta en `var=$(failing_cmd)` — necesitamos check explícito.
      gh issue create \
        --title "$TITLE" \
        --body-file $ARTIFACTS_DIR/hu-draft.md \
        > "$ARTIFACTS_DIR/.gh-create.log" 2>&1
      GH_RC=$?
      if [ $GH_RC -ne 0 ]; then
        echo "FATAL: gh issue create falló (RC=$GH_RC):" >&2
        tail -10 "$ARTIFACTS_DIR/.gh-create.log" >&2
        exit 1
      fi

      # Validar que el output parece una URL de Issue de GitHub
      ISSUE_URL=$(cat "$ARTIFACTS_DIR/.gh-create.log" | grep -oE 'https://github\.com/[^ ]+/issues/[0-9]+' | head -1)
      if [ -z "$ISSUE_URL" ]; then
        echo "FATAL: gh issue create no produjo URL parseable. Output:" >&2
        cat "$ARTIFACTS_DIR/.gh-create.log" >&2
        exit 1
      fi

      # IMPORTANTE: persistir a archivo. $create-issue.output se PIERDE cuando
      # Archon reanuda el workflow tras una approval gate (bug conocido —
      # prior_success skipea el nodo pero no preserva stdout). Downstream
      # debe leer de $ARTIFACTS_DIR/.issue-url, no de la substitución.
      echo "$ISSUE_URL" > $ARTIFACTS_DIR/.issue-url
      echo "$ISSUE_URL"
    depends_on: [save-draft]
    retry:
      max_attempts: 2
      delay_ms: 5000
      on_error: transient
    timeout: 60000

  - id: agregar-a-project
    bash: |
      CFG=".archon/github-project-config.yaml"
      if [ ! -f "$CFG" ]; then
        echo "skipped no_config"
        exit 0
      fi

      # Leer URL del archivo persistido (sobrevive resumes); fallback a substitución
      if [ -f "$ARTIFACTS_DIR/.issue-url" ]; then
        ISSUE_URL=$(cat "$ARTIFACTS_DIR/.issue-url")
      else
        ISSUE_URL=$create-issue.output
      fi
      if [ -z "$ISSUE_URL" ]; then
        echo "WARN no issue URL — agregar-a-project no puede hacer nada"
        exit 0
      fi

      PN=$(grep '^project_number:' "$CFG" | awk '{print $2}')
      PO=$(grep '^project_owner:' "$CFG" | awk '{print $2}')
      PID=$(grep '^project_id:' "$CFG" | awk '{print $2}')
      FID=$(grep '^status_field_id:' "$CFG" | awk '{print $2}')

      # ── Step 1: item-add ──
      # Capturamos stdout + exit code separadamente (sin pipe a head, que rompe $?).
      # No usamos label en idea-a-hu-exoclaw (board agnóstico al dominio), pero
      # el built-in auto-add del Project podría levantar el issue por otra regla
      # configurada (ej. `is:issue is:open`). En ese caso ya estará — eso NO es error.
      gh project item-add "$PN" --owner "$PO" --url "$ISSUE_URL" > "$ARTIFACTS_DIR/.add.log" 2>&1
      ADD_RC=$?
      if [ $ADD_RC -ne 0 ]; then
        # CRÍTICO: detectar scope error específicamente. Project sync es
        # PARTE INTEGRAL del flujo — sin él perdemos visibilidad del estado
        # de las tasks en el board. Si llegamos acá sin scope, algo se
        # escapó del check-prereqs (token cambió entre nodos, race rara) —
        # tumbamos el workflow para que el operador arregle ANTES de crear
        # más issues huérfanos.
        if grep -qiE "missing required scopes|read:project|gh auth refresh" "$ARTIFACTS_DIR/.add.log"; then
          echo "FAIL_GH_SCOPE: el token gh no tiene 'project' + 'read:project'."
          echo "  → corré: gh auth refresh -s project,read:project"
          echo "  → después agregá el Issue al board manualmente:"
          echo "    gh project item-add <PROJECT_NUM> --owner <OWNER> --url $ISSUE_URL"
          echo "  → o re-lanzá hu-exoclaw-pipeline directamente con la URL del Issue (ya existe)"
          tail -3 "$ARTIFACTS_DIR/.add.log"
          exit 1   # FATAL: Project sync es esencial para visibilidad de tasks
        fi
        # Si el error es "already exists" / similar, seguimos. Otro error: warn.
        if grep -qiE "already|exists|duplicate" "$ARTIFACTS_DIR/.add.log"; then
          echo "item ya estaba en project (probablemente auto-add)"
        else
          echo "WARN item-add error (RC=$ADD_RC):"
          tail -3 "$ARTIFACTS_DIR/.add.log"
        fi
      else
        echo "item-add OK"
      fi

      # ── Step 2: encontrar el item id ──
      # Reintentamos 3x con backoff porque hay race con auto-add (el item puede
      # aparecer tras 1-2s).
      ITEM_ID=""
      for attempt in 1 2 3; do
        ITEM_ID=$(gh project item-list "$PN" --owner "$PO" --format json --limit 200 2>/dev/null \
          | jq -r --arg u "$ISSUE_URL" '.items[] | select(.content.url == $u) | .id' | head -1)
        if [ -n "$ITEM_ID" ]; then
          break
        fi
        sleep $((attempt * 2))
      done
      if [ -z "$ITEM_ID" ]; then
        echo "WARN item no encontrado en project tras 3 intentos. URL: $ISSUE_URL"
        exit 0
      fi
      echo "item_id=$ITEM_ID"

      # ── Step 3: obtener option ID de "Idea refined" del config ──
      OID=$(awk -F: '/^status_options:/{f=1; next} f && /^  "?Idea refined"?:/ {gsub(/^ +| +$/, "", $2); print $2; exit}' "$CFG")
      if [ -z "$OID" ]; then
        echo "WARN 'Idea refined' option no está en config — agregalo a status_options:"
        exit 0
      fi
      echo "option_id=$OID"

      # ── Step 4: item-edit con verificación REAL del exit code ──
      gh project item-edit --id "$ITEM_ID" --project-id "$PID" \
        --field-id "$FID" --single-select-option-id "$OID" \
        > "$ARTIFACTS_DIR/.edit.log" 2>&1
      EDIT_RC=$?
      if [ $EDIT_RC -ne 0 ]; then
        echo "FAIL item-edit (RC=$EDIT_RC):"
        tail -5 "$ARTIFACTS_DIR/.edit.log"
        echo ""
        echo "Posibles causas:"
        echo "  - El option_id $OID no existe en el project (renamed/recreated)"
        echo "  - El gh token no tiene scope 'project' (gh auth refresh -s project,read:project)"
        echo "  - El field_id $FID no es el Status del project"
        exit 0   # fail-soft: el card está en el project pero sin status
      fi

      echo "✅ status 'Idea refined' set en item $ITEM_ID"
    depends_on: [crear-issue]
    timeout: 90000

  - id: print-issue-info
    bash: |
      # Leer URL del archivo persistido (resume-safe)
      if [ -f "$ARTIFACTS_DIR/.issue-url" ]; then
        ISSUE_URL=$(cat "$ARTIFACTS_DIR/.issue-url")
      else
        ISSUE_URL=$create-issue.output
      fi
      PROJECT_STATUS=$agregar-a-project.output
      cat <<EOF

      ╔════════════════════════════════════════════════════════════════╗
      ║ ✅ Issue creado                                                 ║
      ║                                                                ║
      ║ URL:        ${ISSUE_URL}
      ║ Project:    ${PROJECT_STATUS}
      ║                                                                ║
      ║ El card aparece en el Project board con status "Idea refined". ║
      ║ Cuando arranque hu-exoclaw-pipeline va a pasar por:            ║
      ║   Refining → Refined → Planning → Planned → Implementing →     ║
      ║   Done — PR ready                                              ║
      ╚════════════════════════════════════════════════════════════════╝
      EOF
    depends_on: [crear-issue, agregar-a-project]
    # none_failed_min_one_success: requiere que crear-issue haya succeeded
    # (no skipped/failed); agregar-a-project puede haber fallado/skipeado
    # internamente (fail-soft) y igual imprimimos. Si crear-issue falló,
    # NO imprimimos resumen (no hay nada que reportar).
    trigger_rule: none_failed_min_one_success
    timeout: 5000

  # ════════════════════════════════════════════════════════════════════
  # FASE 6 — Gate ÚNICO: lanzar pipeline completo?
  # ════════════════════════════════════════════════════════════════════
  # Este es el único approval explícito del workflow. Acá decidís si:
  # (a) gastás ~$0.50 + 15-30 min en pipeline auto E2E (refinar técnico
  #     DEHA → planificar tareas → implementar secuencial → PR + review), o
  # (b) terminás acá con el issue creado y lanzás el pipeline más tarde.

  - id: gate-lanzar-pipeline
    depends_on: [print-issue-info]
    approval:
      message: |
        ✅ Issue publicado: $create-issue.output
        ✅ Card en el Project: "Idea refined"

        ─────────────────────────────────────────────────────────────────
        ¿Lanzo `hu-exoclaw-pipeline` AHORA con este issue?
        ─────────────────────────────────────────────────────────────────

        APROBAR → arranca en background (~$0.50, 15-30 min). Va a:
          1. refinar técnicamente (DEHA: 5 hard rules R-DET / R-JSON /
             R-STATELESS / R-HEARTBEAT / R-DIP + anti-patterns)
          2. planificar el DAG de tareas atómicas (DTOs + activities + tools)
          3. implementar tareas secuencialmente (uv run pytest entre cada una)
          4. validar (uv run pytest + tests/architecture/ + ruff check src/) en el branch
          5. abrir PR contra main
          6. disparar review automático (5 agentes especializados:
             deha-compliance / pydantic-boundary / temporal-practices /
             test-coverage / security)
          7. actualizar el card del Project en cada fase

        RECHAZAR → terminamos acá. El issue + card quedan listos. Lanzás
          el pipeline cuando quieras desde otra terminal:
            archon workflow run hu-exoclaw-pipeline "$create-issue.output"

  - id: lanzar-pipeline
    bash: |
      # CRÍTICO: leer URL del archivo persistido. La substitución
      # $create-issue.output se PIERDE cuando Archon reanuda tras la
      # approval gate de gate-lanzar-pipeline (crear-issue se marca
      # prior_success, su stdout queda vacío en la nueva sesión).
      if [ -f "$ARTIFACTS_DIR/.issue-url" ]; then
        ISSUE_URL=$(cat "$ARTIFACTS_DIR/.issue-url")
      else
        # Fallback: fresh run sin approval intermedia
        ISSUE_URL=$create-issue.output
      fi

      # Validar
      if [ -z "$ISSUE_URL" ]; then
        echo "FAIL_NO_ISSUE_URL crear-issue no produjo URL (ni archivo ni substitución)"
        exit 1
      fi
      if ! echo "$ISSUE_URL" | grep -qE '^https://github\.com/.+/issues/[0-9]+'; then
        echo "FAIL_INVALID_URL: ${ISSUE_URL}"
        exit 1
      fi

      LOG_FILE="$HOME/.archon/logs/pipeline-$(date +%s).log"
      mkdir -p "$HOME/.archon/logs"

      # env -u CLAUDECODE evita "may hang silently" del nested archon-in-claude-code
      (env -u CLAUDECODE ARCHON_SUPPRESS_NESTED_CLAUDE_WARNING=1 \
         nohup archon workflow run hu-exoclaw-pipeline "$ISSUE_URL" \
         > "$LOG_FILE" 2>&1 & disown) 2>/dev/null \
        && echo "pipeline_triggered_log=$LOG_FILE" \
        || echo "pipeline_trigger_failed_run_manually"
    depends_on: [gate-lanzar-pipeline]
    timeout: 10000

  - id: print-final-summary
    bash: |
      # Leer del archivo persistido (sobrevive resumes)
      if [ -f "$ARTIFACTS_DIR/.issue-url" ]; then
        ISSUE_URL=$(cat "$ARTIFACTS_DIR/.issue-url")
      else
        ISSUE_URL=$create-issue.output
      fi
      PIPELINE=$lanzar-pipeline.output
      cat <<EOF

      ╔════════════════════════════════════════════════════════════════╗
      ║ 🎉 Workflow completo                                            ║
      ║                                                                ║
      ║ Issue:     ${ISSUE_URL}
      ║ Pipeline:  ${PIPELINE}
      ║                                                                ║
      ║ Próximos pasos:                                                ║
      ║   1. Mirá el Project board — el card está en "Idea refined"    ║
      ║   2. Si el pipeline arrancó, va a ir actualizando el status    ║
