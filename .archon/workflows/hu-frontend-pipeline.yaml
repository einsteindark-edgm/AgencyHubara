name: hu-frontend-pipeline
description: |
  Super-pipeline AUTOMATIZADO end-to-end para una HU de FRONTEND (FSD).
  Encadena refinar → planificar → implementar (con paralelismo total)
  SIN gates humanos entre fases. Trabaja en un branch `hu/<HU-id>` aislado
  y al final crea un PR contra main para que el operador haga squash-merge.

  Opcionalmente, si existe frontend_dashboard/.frontend/github-project-config.yaml,
  actualiza el estado del GitHub Project card en cada fase.

  **Use when**: querés implementar una HU de frontend con la mínima
  intervención humana posible. El operador da un comando y va a buscar café.
  Si algo falla, el pipeline para y deja un card en estado "Blocked" con el
  motivo — el operador retoma con los workflows interactivos
  (refinar-hu-frontend, implementar-tarea-frontend, etc.).

  **Input** ($USER_MESSAGE):
    - URL de un GitHub Issue: `https://github.com/<owner>/<repo>/issues/<N>`
      (recomendado — el body del issue es la HU).
    - Ruta a un .md con la HU.
    - Texto plano de la HU.

  **Comportamiento clave**:
    1. Crea / checkea un branch `hu/<HU-id>` al inicio. Todos los commits
       del pipeline van a este branch — NO a main.
    2. Refina → commit a hu/<id> → planifica → commit a hu/<id> →
       implementa todos los batches → commit a hu/<id> después de cada
       batch consolidado → al final, crea PR de hu/<id> → main.
    3. Si una fase falla, el pipeline para. El branch hu/<id> queda con
       el progreso hecho hasta ese punto. El operador puede:
         - Retomar manualmente con el workflow interactivo correspondiente.
         - Mover el card del Project a "Needs review".
         - Cerrar el PR (si ya se creó) y reabrirlo después.

  **Worktrees**:
    - El pipeline corre en su propio worktree (creado por Archon al lanzar).
    - Para el fan-out paralelo de tareas, lanza N invocaciones de
      `implementar-tarea-frontend-auto` en BACKGROUND vía `archon workflow run ... &`
      seguido de `wait`. Cada subprocess crea su propio worktree —
      paralelismo real, no nesting.
    - El merger corre DENTRO del worktree del pipeline (es la "merge worktree").

  **Pre-requisitos**:
    - `gh` autenticado (para leer Issue + crear PR + opcionalmente
      actualizar Project).
    - `frontend_dashboard/.frontend/spinal-files.yaml` y `project-context.md`
      commiteados en main.
    - Los 4 skills frontend-*-archon instalados en `.claude/skills/`.

provider: claude
model: sonnet   # para refinar / planificar; subí a opus si el agente trabaja mejor
interactive: false   # CLAVE: pipeline corre sin gates humanos

nodes:
  # ════════════════════════════════════════════════════════════════════
  # FASE 0 — Bootstrap del pipeline
  # ════════════════════════════════════════════════════════════════════

  - id: bootstrap
    prompt: |
      Bootstrap del super-pipeline frontend.

      Paso 0.1 — Stageá el project context (siempre, para todas las skills):
        cp frontend_dashboard/.frontend/project-context.md $ARTIFACTS_DIR/project-context.md
        cp frontend_dashboard/.frontend/spinal-files.yaml  $ARTIFACTS_DIR/spinal-files.yaml
        Si alguno no existe, fallá con exit no-cero:
          "Falta <archivo>. Restaurar desde main antes de correr el pipeline."

      Paso 0.2 — Cargar config del GitHub Project (si existe):
        Si frontend_dashboard/.frontend/github-project-config.yaml existe:
          cp <ruta> $ARTIFACTS_DIR/github-project-config.yaml
          Marcá PROJECT_ENABLED=true.
        Si no existe:
          Marcá PROJECT_ENABLED=false. El pipeline corre igual pero NO
          actualiza ningún card de Project.

      Paso 0.3 — Resolver el input ($USER_MESSAGE):
        a. URL de Issue (`https://github.com/.+/issues/\d+`):
           - Extraé owner, repo, issue_number.
           - `gh issue view <url> --json title,body,number,url --jq '...'`
             para obtener title y body.
           - Escribí title + "\n\n" + body en $ARTIFACTS_DIR/hu-original.md
           - Guardá ISSUE_URL y ISSUE_NUMBER.
        b. Ruta a un .md o texto plano: tratalo como `refinar-hu-frontend`.
           - Si es ruta: cp <path> $ARTIFACTS_DIR/hu-original.md
           - Si es texto: escribilo a $ARTIFACTS_DIR/hu-original.md
           - ISSUE_URL queda vacío (no hay issue asociado).

      Paso 0.4 — Generar HU id (si todavía no lo tenemos):
        Mirá si la HU ya tiene un id en el body (línea `^HU id:` o
        `^# HU-...`). Si no, generá uno:
          HU-YYYYMMDD-<slug>
          donde slug = primeros 6-8 palabras del título, kebab-case,
          lowercase ASCII, sin acentos, max 40 chars.
        Guardá HU_ID.

      Paso 0.5 — Crear/cambiar a branch hu/<HU_ID>:
        cd <worktree-root>   # ya estás acá
        git fetch origin
        # Si el branch ya existe (re-corrida del pipeline para la misma HU):
        if git show-ref --verify --quiet refs/heads/hu/<HU_ID>; then
          git checkout hu/<HU_ID>
          git merge --ff-only origin/main || true  # incorporar progreso de main
        else
          git checkout -b hu/<HU_ID> origin/main
        fi
        Reportá la rama actual.

      Paso 0.6 — Setup de telemetría:
        Creá $ARTIFACTS_DIR/pipeline-state.yaml con:
          hu_id: <HU_ID>
          issue_url: <ISSUE_URL o "">
          branch: hu/<HU_ID>
          project_enabled: <true|false>
          started_at: <ISO 8601>
          current_phase: bootstrap
          phases_completed: []

      Paso 0.7 — Si PROJECT_ENABLED, mover el card a "Refining":
        Llamá al sub-helper de update de Project (ver Anexo A al final):
          set_project_status "Refining"
        Si falla el update del Project, NO falles el pipeline — solo
        reportá warning. El Project es opcional.

      Reportá: HU_ID, branch, modo (con issue / con archivo / con texto), project_enabled.
    allowed_tools: [Read, Write, Bash]

  # ════════════════════════════════════════════════════════════════════
  # FASE 1 — Refinar (auto, sin gates)
  # ════════════════════════════════════════════════════════════════════

  - id: refinar-auto
    depends_on: [bootstrap]
    skills:
      - frontend-tech-refiner-archon
    prompt: |
      FASE 1: Refinamiento técnico AUTOMATIZADO.

      Aplicá el protocolo del skill frontend-tech-refiner-archon UNA vez,
      con $LOOP_USER_INPUT = "" (sin feedback humano — es la primera y
      única pasada).

      Input: $ARTIFACTS_DIR/hu-original.md
      Output: $ARTIFACTS_DIR/hu-refinada.md

      Después de refinar, ejecutá la VALIDACIÓN AUTOMÁTICA (porque no hay
      humano que revise):

        Check 1 — Estructura: el archivo debe tener las 14 secciones del
                  template (§1 Scope ... §14 Implementation order).
        Check 2 — Acceptance criteria: §1 debe tener al menos 2 bullets en
                  formato Given/When/Then (o 2 puntos accionables).
        Check 3 — Entities + Features: al menos una de las dos secciones
                  (§3 o §4) debe declarar archivos a crear/modificar.
        Check 4 — FSD rules: §11 (Hard rules check) debe estar completo
                  para los rules que apliquen.
        Check 5 — Open questions: §12 puede tener questions abiertas. Si
                  hay >3 questions abiertas, el refinamiento es ambiguo
                  → marcá BLOCKED.

      Si TODOS los checks pasan:
        Persistí el refinamiento:
          mkdir -p frontend_dashboard/.frontend/refinements
          cp $ARTIFACTS_DIR/hu-original.md \
             frontend_dashboard/.frontend/refinements/<HU_ID>-original.md
          cp $ARTIFACTS_DIR/hu-refinada.md \
             frontend_dashboard/.frontend/refinements/<HU_ID>-tech.md

        Commit a hu/<HU_ID>:
          git add frontend_dashboard/.frontend/refinements/<HU_ID>-*.md
          git commit -m "<HU_ID>: refinamiento técnico (frontend, auto)"

        Actualizá pipeline-state.yaml:
          current_phase: planning
          phases_completed: [bootstrap, refining]

        Si PROJECT_ENABLED, set_project_status "Refined".

        Continuá.

      Si algún check falla:
        Escribí $ARTIFACTS_DIR/pipeline-error.yaml:
          phase: refining
          reason: validation_failed
          checks_failed: [<nombres>]
          remediation: |
            El refinamiento auto falló validación. El operador debe:
              archon workflow run refinar-hu-frontend "<HU_ID>"
            (versión interactiva) para iterar con feedback humano.
        Si PROJECT_ENABLED, set_project_status "Blocked: refinement needs review".
        Fallá el nodo con exit no-cero — el pipeline para acá.
    allowed_tools: [Read, Write, Edit, Bash]

  # ════════════════════════════════════════════════════════════════════
  # FASE 2 — Planificar (auto, sin gates)
  # ════════════════════════════════════════════════════════════════════

  - id: planificar-auto
    depends_on: [refinar-auto]
    skills:
      - frontend-task-planner-archon
    prompt: |
      FASE 2: Descomposición en tareas AUTOMATIZADA.

      Aplicá el protocolo del skill frontend-task-planner-archon UNA vez,
      con $LOOP_USER_INPUT = "" (sin feedback humano).

      Input:
        $ARTIFACTS_DIR/hu-refinada.md (output de FASE 1)
        $ARTIFACTS_DIR/hu-original.md (fallback context)
        $ARTIFACTS_DIR/spinal-files.yaml
      Output:
        $ARTIFACTS_DIR/plan-manifest.yaml
        $ARTIFACTS_DIR/tareas/F<NN>-<slug>.md (uno por tarea)

      Después de planificar, ejecutá VALIDACIÓN AUTOMÁTICA:

        Check 1 — Estructura: plan-manifest.yaml debe tener
                  `tasks:`, `parallel_batches:`, `totals:`.
        Check 2 — Cobertura: la unión de delivers_acceptance de todas las
                  tareas debe cubrir todos los AC del §1 del refinamiento
                  (sin huérfanos).
        Check 3 — DAG sin ciclos: validá con un toposort simple.
        Check 4 — Granularidad: ninguna tarea con estimated_loc > 300
                  ni < 30. Si hay alguna, marcá como WARNING (no bloqueante).
        Check 5 — Batches no vacíos: cada batch tiene ≥1 tarea.
        Check 6 — task_count ≤ 15 (umbral conservador para el pipeline
                  auto; si hay más, mejor que el operador revise).
        Check 7 — Para cada tarea, su archivo F<NN>-*.md existe en
                  $ARTIFACTS_DIR/tareas/.

      Si TODOS los checks (fatal) pasan:
        Persistí el plan:
          mkdir -p frontend_dashboard/.frontend/plans/<HU_ID>/tareas
          cp $ARTIFACTS_DIR/plan-manifest.yaml \
             frontend_dashboard/.frontend/plans/<HU_ID>/plan-manifest.yaml
          cp $ARTIFACTS_DIR/tareas/F*.md \
             frontend_dashboard/.frontend/plans/<HU_ID>/tareas/

        Commit a hu/<HU_ID>:
          git add frontend_dashboard/.frontend/plans/<HU_ID>/
          git commit -m "<HU_ID>: plan de tareas (frontend, auto, N features)"

        Actualizá pipeline-state.yaml:
          current_phase: implementing
          phases_completed: [bootstrap, refining, planning]
          task_count: <N>
          batch_count: <K>

        Si PROJECT_ENABLED:
          set_project_status "Planned"

          Opcional — crear sub-items en el Project (uno por tarea):
          Para cada tarea en el manifest:
            gh project item-create <project-id> \
              --owner <owner> \
              --title "<HU_ID> F<NN>: <título de la tarea>" \
              --body "Parent issue: <ISSUE_URL>; depends_on: <list>; batch: B<k>"
          (estos sub-items quedan como drafts; el pipeline los actualiza
           a "Implementing" / "Done" según avanza).

      Si algún check fatal falla:
        Escribí $ARTIFACTS_DIR/pipeline-error.yaml con
          phase: planning
          reason: validation_failed
          checks_failed: [<nombres>]
          remediation: archon workflow run planificar-hu-frontend "<HU_ID>"
        Si PROJECT_ENABLED, set_project_status "Blocked: plan needs review".
        Fallá el nodo.
    allowed_tools: [Read, Write, Edit, Bash]

  # ════════════════════════════════════════════════════════════════════
  # FASE 3 — Implementar todos los batches (auto, paralelo)
  # ════════════════════════════════════════════════════════════════════

  - id: implementar-batches
    depends_on: [planificar-auto]
    skills:
      - frontend-merger-archon
    prompt: |
      FASE 3: Implementación paralela AUTOMATIZADA.

      Leé frontend_dashboard/.frontend/plans/<HU_ID>/plan-manifest.yaml.
      Iterá sobre cada batch en `parallel_batches[]` EN ORDEN.

      Si PROJECT_ENABLED, set_project_status "Implementing".

      ──────────────────────────────────────────────────────────────────
      Para cada batch B<k> con tareas [F<NN1>, F<NN2>, ..., F<NNm>]:
      ──────────────────────────────────────────────────────────────────

      Paso 3.1 — Pre-flight: validar depends_on satisfechos
        Para cada F<NNi> del batch:
          Para cada F<X> en su depends_on:
            - Verificá que existe
              frontend_dashboard/.frontend/results/<HU_ID>/F<X>-result.yaml
              con status: passed.
            - Verificá que al menos un files_created de F<X> existe en el
              worktree.
        Si falta algo, NO debería pasar (estamos en orden topológico de
        batches; si pasa, hay un bug del planner — abortar).

      Paso 3.2 — Sub-items del Project a "Implementing" (si PROJECT_ENABLED):
        Para cada F<NNi> del batch:
          gh project item-edit <sub-item-id> --field-id <status-field> \
            --single-select-option-id <implementing-option-id>

      Paso 3.3 — Fan-out paralelo:
        Lanzá M invocaciones de implementar-tarea-frontend-auto en
        BACKGROUND, capturando sus PIDs y stdout/stderr:

          mkdir -p $ARTIFACTS_DIR/batch-logs
          for task_id in F<NN1> F<NN2> ... F<NNm>; do
            (
              archon workflow run implementar-tarea-frontend-auto \
                "<HU_ID> ${task_id}" \
                > $ARTIFACTS_DIR/batch-logs/B<k>-${task_id}.log 2>&1
            ) &
            echo "$! ${task_id}" >> $ARTIFACTS_DIR/batch-logs/B<k>-pids.txt
          done

          # Esperá a TODOS los hijos:
          wait

          Cada subprocess corre en SU PROPIO worktree (Archon worktree
          isolation lo garantiza). Los new files se escriben en ese
          worktree, y al final el subprocess persiste el result.yaml en
          frontend_dashboard/.frontend/results/<HU_ID>/ (pero en SU
          worktree, no en el nuestro).

      Paso 3.4 — Recolectar resultados:
        Después del `wait`, leé el último mensaje "AUTO_RESULT" de cada
        log y construí el inventario:
          for log in $ARTIFACTS_DIR/batch-logs/B<k>-F*.log; do
            grep "^AUTO_RESULT" $log | tail -1
          done > $ARTIFACTS_DIR/batch-logs/B<k>-summary.txt

        Verificá que TODAS las M tareas tengan status=passed.

      Paso 3.5 — Si alguna falló o quedó blocked:
        Identificá las tareas con status != passed.
        Para cada una:
          - Leé su log completo en $ARTIFACTS_DIR/batch-logs/B<k>-${task}.log
          - Imprimí un resumen del blocker (de las últimas 30 líneas).
        Escribí $ARTIFACTS_DIR/pipeline-error.yaml:
          phase: implementing
          batch: B<k>
          failed_tasks: [{id: F<NN>, status: <X>, blocker: <reason>}]
          remediation: |
            El pipeline está bloqueado en batch B<k>. El operador puede:
              1. Re-iterar la tarea problemática:
                 archon workflow run implementar-tarea-frontend "<HU_ID> F<NN>"
                 (versión interactiva, con feedback)
              2. Si requires_planner_update: re-planificar.
                 archon workflow run planificar-hu-frontend "<HU_ID>"
              3. Una vez resuelto, mergear la tarea a hu/<HU_ID> y
                 re-correr el pipeline desde donde quedó:
                 archon workflow run hu-frontend-pipeline "<HU_ID>"
        Si PROJECT_ENABLED, set_project_status "Blocked: B<k> needs review".
        Fallá el nodo.

      Paso 3.6 — TODAS las tareas del batch están en passed:
        Cada subprocess ya commiteó SU files_created + result.yaml en SU
        worktree y se las mergeó a... esperá, NO. Los subprocess NO hacen
        git push. Necesitamos traer su trabajo a NUESTRO worktree
        (hu/<HU_ID>).

        Para cada F<NN> del batch, los archivos creados están en
        SU worktree (~/.archon/worktrees/implementar-tarea-frontend-auto.<run-id>/...).
        Pero como `implementar-tarea-frontend-auto` NO commitea ni
        mergea, el camino más simple es:

        a. Cada subprocess persiste su result.yaml a
           frontend_dashboard/.frontend/results/<HU_ID>/F<NN>-result.yaml
           DENTRO de su worktree. Necesitamos esos archivos en el
           nuestro.

        b. Estrategia: leemos los logs (que ya capturaron el AUTO_RESULT),
           y a partir de los logs sabemos los paths de cada result.yaml
           en cada worktree. Los copiamos directamente del filesystem
           de cada worktree a nuestro worktree.

           Para cada F<NN>:
             # Encontrar el worktree del subprocess (Archon naming convention):
             SUBPROCESS_WT=$(ls -dt ~/.archon/worktrees/implementar-tarea-frontend-auto.* | head -1)
             # OJO: si lanzaste M en paralelo, este `head -1` puede colisionar.
             # Mejor: en Paso 3.3, capturá $ARCHON_WORKTREE_PATH de cada subprocess
             # (Archon imprime esto al arrancar el workflow). Guardalo en
             # $ARTIFACTS_DIR/batch-logs/B<k>-${task_id}-worktree.path.

             RESULT_FILE=$SUBPROCESS_WT/frontend_dashboard/.frontend/results/<HU_ID>/F<NN>-result.yaml
             mkdir -p frontend_dashboard/.frontend/results/<HU_ID>
             cp $RESULT_FILE frontend_dashboard/.frontend/results/<HU_ID>/F<NN>-result.yaml

             # También traer los files_created al worktree del pipeline:
             # Leer files_created del result.yaml y `cp` cada uno desde
             # el SUBPROCESS_WT al worktree del pipeline (preservando paths).
             # NO traer files_modified (esos son spinal — los reconstruye el merger).

        c. Commit en hu/<HU_ID>:
           git add frontend_dashboard/.frontend/results/<HU_ID>/F*-result.yaml
           git add <archivos new traídos>
           # NO `git add` sobre spinal files (pages/, app/providers/index.tsx,
           # index.css, barrels existentes) — esos los hace el merger.
           git commit -m "<HU_ID> B<k>: <N> tareas paralelas (pre-merger)"

      Paso 3.7 — Invocar al merger:
        Stage para el merger:
          mkdir -p $ARTIFACTS_DIR/batch-results
          rm -f $ARTIFACTS_DIR/batch-results/*.yaml
          cp frontend_dashboard/.frontend/results/<HU_ID>/F<NN1>-result.yaml \
             frontend_dashboard/.frontend/results/<HU_ID>/F<NN2>-result.yaml \
             ... \
             $ARTIFACTS_DIR/batch-results/
          (spinal-files.yaml y project-context.md ya están en $ARTIFACTS_DIR/
           desde el bootstrap.)

        Validá pre-condición del merger:
          Para cada spinal file declarado en spinal-files.yaml:
            git diff origin/main -- <spinal-file>
          Debería estar vacío. Si no, hay un bug — revertí con
            git checkout origin/main -- <spinal-files>
          y continuá.

        Ejecutá el protocolo del skill frontend-merger-archon
        DIRECTAMENTE (Step 1-3 del skill, con $USER_MESSAGE virtual
        = "B<k> [F<NN1>, F<NN2>, ..., F<NNm>]"). El skill ya está
        en tu contexto via `skills:`.

        El merger escribe $ARTIFACTS_DIR/merge-report.yaml y modifica
        los spinal files en este worktree.

      Paso 3.8 — Validar y commitear el merge:
        Leé $ARTIFACTS_DIR/merge-report.yaml.
        Si status: ok:
          git add <spinal-files modificados>
          git commit -m "<HU_ID> B<k>: merger consolidó <N> wiring_intents"

          # Test rápido — ¿el build todavía funciona?
          cd frontend_dashboard && npx tsc -b && cd ..
          # Si tsc falla, hay un bug de merge. Escribir pipeline-error.yaml.

          Si PROJECT_ENABLED:
            Para cada F<NN> del batch:
              gh project item-edit <sub-item-id-F<NN>> --field-id <status> \
                --single-select-option-id <done-option-id>

        Si status: partial o failed:
          Escribí pipeline-error.yaml con phase: merging, batch: B<k>,
          merge_report: <copia del report>.
          Si PROJECT_ENABLED, set_project_status "Blocked: B<k> merge failed".
          Fallá el nodo.

      Paso 3.9 — Avanzar al siguiente batch (loop).

      ──────────────────────────────────────────────────────────────────

      Cuando TODOS los batches están completos (todos los F<NN> con
      status: passed Y todos los merges con status: ok):

        Actualizá pipeline-state.yaml:
          current_phase: pr_creation
          phases_completed: [bootstrap, refining, planning, implementing]

        Continuá al siguiente nodo (crear-pr).
    allowed_tools: [Read, Write, Edit, Bash]

  # ════════════════════════════════════════════════════════════════════
  # FASE 4 — Crear PR y cerrar
  # ════════════════════════════════════════════════════════════════════

  - id: crear-pr
    depends_on: [implementar-batches]
    prompt: |
      FASE 4: Crear PR de hu/<HU_ID> → main y cerrar el pipeline.

      Paso 4.1 — Push el branch:
        git push -u origin hu/<HU_ID>

      Paso 4.2 — Construir el body del PR:
        - Resumen: título y descripción de la HU original (de
          frontend_dashboard/.frontend/refinements/<HU_ID>-original.md).
        - Tabla de tareas con su F<NN>, batch, files_created count.
          (Leer cada frontend_dashboard/.frontend/results/<HU_ID>/F*-result.yaml.)
        - Lista de spinal files modificados por los mergers.
        - Tests corridos: el último `npm test` resumen (si lo tenés en logs).
        - Si hay ISSUE_URL, agregar "Closes <ISSUE_URL>" para que GitHub
          auto-cierre el issue al merger el PR.

      Paso 4.3 — Crear el PR:
        gh pr create \
          --base main \
          --head hu/<HU_ID> \
          --title "<HU_ID>: <título corto desde refinements/<HU_ID>-tech.md>" \
          --body "$(cat $ARTIFACTS_DIR/pr-body.md)"

        Capturá la URL del PR.

      Paso 4.4 — Si PROJECT_ENABLED, actualizar card:
        Mover el card padre a "Done — PR ready":
          set_project_status "Done — PR ready"
        Agregar comentario al issue (si ISSUE_URL):
          gh issue comment <ISSUE_URL> --body "PR open: <PR_URL>"

      Paso 4.5 — Imprimí un resumen final (el operador esto SÍ lo lee):

        ╔════════════════════════════════════════════════════════════════╗
        ║ 🎉 Pipeline completo — HU <HU_ID>                              ║
        ║                                                                ║
        ║ Branch:      hu/<HU_ID>                                        ║
        ║ Tareas:      M de M completas                                  ║
        ║ Batches:     K consolidados                                    ║
        ║ Spinal files: <count>                                          ║
        ║                                                                ║
        ║ PR:          <PR_URL>                                          ║
        ║                                                                ║
        ║ Próximo paso del operador:                                     ║
        ║   1. Revisar el diff del PR                                    ║
        ║   2. Squash-merge si todo OK                                   ║
        ║   3. El issue se cierra automáticamente (Closes …)             ║
        ╚════════════════════════════════════════════════════════════════╝
    allowed_tools: [Read, Write, Bash]

# ════════════════════════════════════════════════════════════════════
# Anexo A — sub-helper set_project_status
# ════════════════════════════════════════════════════════════════════
# Las skills/nodes invocan este patrón inline para mover el card padre.
# Requiere que el config tenga: project_id, status_field_id, status_options[<name>].
#
# Bash idiomático:
#
#   PROJECT_ID=$(yq '.project_id' $ARTIFACTS_DIR/github-project-config.yaml)
#   FIELD_ID=$(yq '.status_field_id' $ARTIFACTS_DIR/github-project-config.yaml)
#   OPTION_ID=$(yq ".status_options.${STATUS_NAME}" $ARTIFACTS_DIR/github-project-config.yaml)
#
#   gh project item-edit \
#     --id <parent-card-id> \
#     --project-id $PROJECT_ID \
#     --field-id $FIELD_ID \
#     --single-select-option-id $OPTION_ID
#
# El parent-card-id se obtiene en el bootstrap:
#   - Si el input fue un Issue URL, buscar el item del Project que linkea ese issue
