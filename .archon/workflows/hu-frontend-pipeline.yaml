name: hu-frontend-pipeline
description: |
  Super-pipeline AUTOMATIZADO end-to-end para una HU de FRONTEND (FSD).
  Encadena refinar → planificar → implementar (UNA tarea a la vez, secuencial)
  sin gates humanos. Trabaja en un branch `hu/<HU-id>` aislado y al final
  crea un PR contra main para que el operador haga squash-merge.

  Opcionalmente, si existe frontend_dashboard/.frontend/github-project-config.yaml,
  actualiza el estado del GitHub Project card en cada fase (fail-soft).

  **Diseño de nodos** (siguiendo Archon best practices):
    - Trabajo determinista (cp, mkdir, git, npm, gh, parseo de YAML) → `bash:` o `script:`.
    - AI iterativo (refinar, planificar, implementar) → `loop:` con `skills:`.
    - Git operations en implementar → `loop.until_bash` (NO el AI), determinista.
    - Skip de fases ya completas → `when:` sobre output de bash de detección.
    - Fail-fast en errores de validación → `cancel:` con mensaje claro.
    - Updates al Project que no deben matar el pipeline → `trigger_rule: all_done`.

  **Modelo operacional — SECUENCIAL, no paralelo**:
    Todas las tareas corren en el worktree del pipeline, una a la vez,
    viendo los edits de las anteriores. Sin subprocesos. Sin merger.

  **Input** ($USER_MESSAGE):
    - URL de un GitHub Issue: `https://github.com/<owner>/<repo>/issues/<N>`
    - Ruta a un .md local con la HU
    - Texto plano de la HU
    - HU id existente (ej: "HU-20260511-1430-foo") para RETOMAR.

provider: claude
model: sonnet
interactive: false

worktree:
  enabled: true

nodes:
  # ════════════════════════════════════════════════════════════════════
  # FASE 0 — Pre-requisitos + resolución de input + branch + telemetría
  # ════════════════════════════════════════════════════════════════════

  - id: check-prereqs
    bash: |
      set -e
      echo "=== Pre-requisitos ===" >&2

      # gh autenticado
      gh auth status >&2 2>&1 || { echo "FAIL_GH_AUTH"; exit 0; }

      # Herramientas en PATH (en orden: la falla más visible primero)
      command -v node >/dev/null || { echo "FAIL_NO_NODE"; exit 0; }
      command -v npm  >/dev/null || { echo "FAIL_NO_NPM";  exit 0; }
      command -v bun  >/dev/null || { echo "FAIL_NO_BUN";  exit 0; }
      command -v jq   >/dev/null || { echo "FAIL_NO_JQ";   exit 0; }
      command -v git  >/dev/null || { echo "FAIL_NO_GIT";  exit 0; }

      # Convenciones del frontend committeadas en main
      for f in \
        frontend_dashboard/.frontend/spinal-files.yaml \
        frontend_dashboard/.frontend/project-context.md; do
        test -f "$f" || { echo "FAIL_MISSING_CONVENTION_${f##*/}"; exit 0; }
      done

      # 4 skills frontend
      for s in tech-refiner task-planner implementer merger; do
        test -f ".claude/skills/frontend-${s}-archon/SKILL.md" || {
          echo "FAIL_MISSING_SKILL_${s}"; exit 0;
        }
      done

      # package-lock.json para `npm ci`
      test -f frontend_dashboard/package-lock.json || {
        echo "FAIL_NO_LOCKFILE — frontend_dashboard/package-lock.json requerido para npm ci"
        exit 0
      }

      # node_modules — instalar VIA npm ci si falta (NO modifica el lockfile)
      if [ ! -d "frontend_dashboard/node_modules" ]; then
        echo "node_modules ausente — corriendo npm ci (puede tardar 30s)" >&2
        (cd frontend_dashboard && npm ci --no-audit --no-fund) >&2 || {
          echo "FAIL_NPM_CI"; exit 0;
        }
      fi

      # Verificar que el remote origin existe y es alcanzable
      git ls-remote origin HEAD >/dev/null 2>&1 || {
        echo "FAIL_NO_ORIGIN_OR_NETWORK"; exit 0;
      }

      echo "OK"
    timeout: 180000

  - id: cancel-bad-prereqs
    cancel: "Pre-requisitos no cumplidos: $check-prereqs.output. Diagnóstico: gh auth login (FAIL_GH_AUTH), brew install jq bun (FAIL_NO_*), commit .frontend/* a main (FAIL_MISSING_*), npm install para regenerar lockfile (FAIL_NO_LOCKFILE), revisar conectividad/credenciales push (FAIL_NO_ORIGIN_OR_NETWORK)."
    when: "$check-prereqs.output != 'OK'"
    depends_on: [check-prereqs]

  - id: stage-shared-files
    bash: |
      set -e
      cp frontend_dashboard/.frontend/project-context.md $ARTIFACTS_DIR/project-context.md
      cp frontend_dashboard/.frontend/spinal-files.yaml  $ARTIFACTS_DIR/spinal-files.yaml
      if [ -f frontend_dashboard/.frontend/github-project-config.yaml ]; then
        cp frontend_dashboard/.frontend/github-project-config.yaml \
           $ARTIFACTS_DIR/github-project-config.yaml
        echo "PROJECT_ENABLED"
      else
        echo "PROJECT_DISABLED"
      fi
    depends_on: [check-prereqs]
    when: "$check-prereqs.output == 'OK'"

  - id: resolve-input
    bash: |
      set -e
      RAW="$ARGUMENTS"

      # Guard: input vacío o whitespace-only → emitir error explícito.
      # Sin este check, el flujo cae al branch "plain_text" con TITLE/BODY vacíos
      # y el pipeline genera un HU_ID "HU-...-no-title" que después rompe.
      TRIMMED=$(echo "$RAW" | tr -d '[:space:]')
      if [ -z "$TRIMMED" ]; then
        jq -n '{"type":"error","error":"empty_input"}'
        exit 0
      fi

      if [[ "$RAW" =~ ^https://github\.com/.+/issues/[0-9]+$ ]]; then
        TYPE="issue_url"
        if ! gh issue view "$RAW" --json title,body,number,state > $ARTIFACTS_DIR/issue.json 2>/dev/null; then
          jq -n '{"type":"error","error":"cannot_fetch_issue"}'
          exit 0
        fi
        STATE=$(jq -r '.state' $ARTIFACTS_DIR/issue.json)
        if [ "$STATE" != "OPEN" ]; then
          jq -n --arg state "$STATE" '{"type":"error","error":"issue_not_open","state":$state}'
          exit 0
        fi
        TITLE=$(jq -r '.title' $ARTIFACTS_DIR/issue.json)
        BODY=$(jq -r '.body' $ARTIFACTS_DIR/issue.json)
        ISSUE_URL="$RAW"
      elif [[ "$RAW" =~ ^HU-[0-9]{8}-[0-9]{4,6}-.+ ]]; then
        # Aceptá tanto HHMM (legacy, 4 dígitos) como HHMMSS (nuevo, 6 dígitos)
        TYPE="hu_id_resume"
        ISSUE_URL=""
        TITLE="RESUME: $RAW"
        BODY=""
        HU_ID_OVERRIDE="$RAW"
      elif [[ -f "$RAW" ]]; then
        TYPE="local_file"
        TITLE=$(grep -m1 '^# ' "$RAW" | sed 's/^# //' | head -c 200)
        TITLE="${TITLE:-$(head -c 100 "$RAW")}"
        BODY=$(cat "$RAW")
        ISSUE_URL=""
      else
        TYPE="plain_text"
        TITLE=$(echo "$RAW" | head -c 120)
        BODY="$RAW"
        ISSUE_URL=""
      fi

      jq -n \
        --arg type "$TYPE" \
        --arg title "$TITLE" \
        --arg body "$BODY" \
        --arg issue_url "$ISSUE_URL" \
        --arg hu_id_override "${HU_ID_OVERRIDE:-}" \
        '{type:$type, title:$title, body:$body, issue_url:$issue_url, hu_id_override:$hu_id_override}'
    depends_on: [stage-shared-files]

  - id: cancel-bad-input
    cancel: "No pude resolver el input: $resolve-input.output. Si es un Issue, validá que esté abierto: gh issue view <url>."
    when: "$resolve-input.output.type == 'error'"
    depends_on: [resolve-input]

  - id: gen-hu-id
    script: |
      const input = $resolve-input.output;

      let huId;
      if (input.type === 'hu_id_resume' && input.hu_id_override) {
        huId = input.hu_id_override;
      } else {
        // Slug del título, kebab-case, ASCII, max 40 chars.
        // No depende de iconv (que varía macOS vs Linux); usa Normalize + filtro.
        const slug = (input.title || 'untitled')
          .normalize('NFKD')
          .replace(/\p{Diacritic}/gu, '')
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-+|-+$/g, '')
          .slice(0, 40)
          .replace(/-$/, '');

        const now = new Date();
        const iso = now.toISOString();
        const datePart = iso.slice(0, 10).replace(/-/g, '');  // YYYYMMDD
        // HHMMSS para evitar colisiones si dos pipelines arrancan en el mismo minuto
        const timePart = iso.slice(11, 19).replace(/:/g, ''); // HHMMSS

        huId = 'HU-' + datePart + '-' + timePart + '-' + (slug || 'no-title');
      }

      const out = {
        hu_id: huId,
        branch: 'hu/' + huId,
        title: input.title,
        body: input.body,
        issue_url: input.issue_url,
        type: input.type,
        refinement_path: 'frontend_dashboard/.frontend/refinements/' + huId + '-tech.md',
        original_path:   'frontend_dashboard/.frontend/refinements/' + huId + '-original.md',
        plan_dir:        'frontend_dashboard/.frontend/plans/' + huId,
        results_dir:     'frontend_dashboard/.frontend/results/' + huId,
      };
      console.log(JSON.stringify(out));
    runtime: bun
    depends_on: [resolve-input]

  - id: setup-branch
    bash: |
      set -e
      HU_ID=$(echo $gen-hu-id.output | jq -r '.hu_id')
      BRANCH=$(echo $gen-hu-id.output | jq -r '.branch')
      TYPE=$(echo $gen-hu-id.output | jq -r '.type')
      ORIGINAL_PATH=$(echo $gen-hu-id.output | jq -r '.original_path')

      git fetch origin --prune

      # Lock anti-concurrencia: si origin/hu/<id> tiene un commit en los
      # últimos 5 min, asumimos que otro pipeline está corriendo.
      if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
        LAST_COMMIT_TS=$(git log -1 --format=%ct "origin/$BRANCH" 2>/dev/null || echo 0)
        NOW=$(date -u +%s)
        AGE=$((NOW - LAST_COMMIT_TS))
        if [ "$AGE" -lt 300 ]; then
          echo "WARN: origin/$BRANCH tuvo un commit hace ${AGE}s. Otro pipeline puede estar activo." >&2
          echo "Continuando igual — si hay race, el push fallará al final." >&2
        fi

        # Crear branch local desde origin (worktree es fresh)
        git checkout -b "$BRANCH" "origin/$BRANCH" || {
          # Si ya existe localmente (raro en Archon worktree), fast-forward
          git checkout "$BRANCH"
          git pull --ff-only origin "$BRANCH"
        }
        echo "RESUMED"
      else
        git checkout -b "$BRANCH" "origin/main"
        git push -u origin "$BRANCH"
        echo "FRESH"
      fi

      # Limpiar HU id existente en BODY antes de prepend (defensivo)
      BODY_CLEAN=$(echo $gen-hu-id.output | jq -r '.body' | grep -v '^HU id:' || true)
      TITLE=$(echo $gen-hu-id.output | jq -r '.title')

      if [ "$TYPE" = "hu_id_resume" ] && [ -f "$ORIGINAL_PATH" ]; then
        cp "$ORIGINAL_PATH" $ARTIFACTS_DIR/hu-original.md
      else
        {
          echo "HU id: $HU_ID"
          echo
          echo "# $TITLE"
          echo
          echo "$BODY_CLEAN"
        } > $ARTIFACTS_DIR/hu-original.md
      fi
    depends_on: [gen-hu-id]

  - id: detect-resume-state
    bash: |
      HU_ID=$(echo $gen-hu-id.output | jq -r '.hu_id')
      REFINEMENT="frontend_dashboard/.frontend/refinements/${HU_ID}-tech.md"
      MANIFEST="frontend_dashboard/.frontend/plans/${HU_ID}/plan-manifest.yaml"

      already_refined=false
      already_planned=false
      [ -f "$REFINEMENT" ] && already_refined=true
      [ -f "$MANIFEST" ] && already_planned=true

      jq -n \
        --arg ar "$already_refined" \
        --arg ap "$already_planned" \
        '{already_refined: $ar, already_planned: $ap}'
    depends_on: [setup-branch]

  - id: project-set-refining
    bash: |
      CFG="$ARTIFACTS_DIR/github-project-config.yaml"
      [ -f "$CFG" ] || { echo "skipped"; exit 0; }
      ISSUE_URL=$(echo $gen-hu-id.output | jq -r '.issue_url')
      [ -z "$ISSUE_URL" ] || [ "$ISSUE_URL" = "null" ] && { echo "skipped"; exit 0; }
      PN=$(grep '^project_number:' "$CFG" | awk '{print $2}')
      PO=$(grep '^project_owner:' "$CFG" | awk '{print $2}')
      PID=$(grep '^project_id:' "$CFG" | awk '{print $2}')
      FID=$(grep '^status_field_id:' "$CFG" | awk '{print $2}')
      OID=$(awk '/^status_options:/{f=1; next} f && /^  Refining:/{print $2; exit}' "$CFG")
      [ -z "$OID" ] && { echo "warn no Refining option"; exit 0; }
      II=$(gh project item-list "$PN" --owner "$PO" --format json 2>/dev/null \
        | jq -r --arg u "$ISSUE_URL" '.items[] | select(.content.url == $u) | .id' | head -1)
      [ -z "$II" ] && { echo "warn item not in project"; exit 0; }
      gh project item-edit --id "$II" --project-id "$PID" \
        --field-id "$FID" --single-select-option-id "$OID" 2>&1 | head -3 || true
      echo "set Refining ok"
    depends_on: [setup-branch]
    trigger_rule: all_done

  # ════════════════════════════════════════════════════════════════════
  # FASE 1 — Refinar
  # ════════════════════════════════════════════════════════════════════

  - id: load-refinement-if-resume
    bash: |
      HU_ID=$(echo $gen-hu-id.output | jq -r '.hu_id')
      cp "frontend_dashboard/.frontend/refinements/${HU_ID}-tech.md" \
         "$ARTIFACTS_DIR/hu-refinada.md"
      echo "loaded"
    when: "$detect-resume-state.output.already_refined == 'true'"
    depends_on: [detect-resume-state]

  - id: refinar-auto
    when: "$detect-resume-state.output.already_refined == 'false'"
    depends_on: [detect-resume-state]
    idle_timeout: 300000
    loop:
      max_iterations: 2
      until: REFINED
      fresh_context: true
      skills:
        - frontend-tech-refiner-archon
      prompt: |
        Aplicá el protocolo del skill frontend-tech-refiner-archon.

        Inputs:
          - $ARTIFACTS_DIR/hu-original.md  (la HU)
          - $ARTIFACTS_DIR/project-context.md  (LEER PRIMERO)

        Output esperado:
          - $ARTIFACTS_DIR/hu-refinada.md  (refinement completo)

        $LOOP_USER_INPUT puede contener feedback de la 1ª iteración si la
        validación posterior detectó problemas; aplicalo de forma incremental.

        Cuando termines: <promise>REFINED</promise>

  - id: validate-refinement
    bash: |
      F=$ARTIFACTS_DIR/hu-refinada.md
      test -f "$F" || { echo "FAIL_NOT_EXISTS"; exit 0; }
      [ $(wc -c < "$F") -gt 500 ] || { echo "FAIL_TOO_SHORT"; exit 0; }
      grep -q '^HU id:' "$F" || { echo "FAIL_NO_HU_ID"; exit 0; }

      sections=0
      for sec in Scope Acceptance Entities Features Tests Risks; do
        grep -qi "$sec" "$F" && sections=$((sections+1))
      done
      [ $sections -ge 3 ] || { echo "FAIL_FEW_SECTIONS"; exit 0; }

      # POSIX-safe: [[:space:]] en vez de \s
      ac_count=$(grep -cE '^[[:space:]-]*(AC-?[0-9]|Given|When|Then|- )' "$F" || true)
      [ $ac_count -ge 2 ] || { echo "FAIL_FEW_AC"; exit 0; }

      echo "PASS"
    depends_on: [refinar-auto, load-refinement-if-resume]
    trigger_rule: all_done

  - id: cancel-bad-refinement
    cancel: |
      Refinement validation FAILED ($validate-refinement.output) en branch $gen-hu-id.output.branch.
      Opciones para retomar:
        (a) Edití el Issue original con más detalle/contexto + borralo y lanzá idea-a-hu-frontend de nuevo.
        (b) Escribí el refinement a mano en frontend_dashboard/.frontend/refinements/$gen-hu-id.output.hu_id-tech.md,
            commit + push a la branch hu/<HU_ID>, re-lanzá: archon workflow run hu-frontend-pipeline "$gen-hu-id.output.hu_id"
            (el bootstrap detecta el refinement persistido y salta FASE 1).
    when: "$validate-refinement.output != 'PASS'"
    depends_on: [validate-refinement]

  - id: commit-refinement
    bash: |
      set -e
      HU_ID=$(echo $gen-hu-id.output | jq -r '.hu_id')
      BRANCH=$(echo $gen-hu-id.output | jq -r '.branch')

      mkdir -p frontend_dashboard/.frontend/refinements
      cp $ARTIFACTS_DIR/hu-original.md \
         "frontend_dashboard/.frontend/refinements/${HU_ID}-original.md"
      cp $ARTIFACTS_DIR/hu-refinada.md \
         "frontend_dashboard/.frontend/refinements/${HU_ID}-tech.md"

      git add "frontend_dashboard/.frontend/refinements/${HU_ID}-"*.md
      if ! git diff --staged --quiet; then
        git commit -m "${HU_ID}: refinamiento técnico (frontend, auto)"
        git push origin "$BRANCH"
        echo "committed"
      else
        echo "no_changes"
      fi
    when: "$validate-refinement.output == 'PASS'"
    depends_on: [validate-refinement]

  - id: project-set-refined
    bash: |
      CFG="$ARTIFACTS_DIR/github-project-config.yaml"
      [ -f "$CFG" ] || { echo "skipped"; exit 0; }
      ISSUE_URL=$(echo $gen-hu-id.output | jq -r '.issue_url')
      [ -z "$ISSUE_URL" ] || [ "$ISSUE_URL" = "null" ] && { echo "skipped"; exit 0; }
      PN=$(grep '^project_number:' "$CFG" | awk '{print $2}')
      PO=$(grep '^project_owner:' "$CFG" | awk '{print $2}')
      PID=$(grep '^project_id:' "$CFG" | awk '{print $2}')
      FID=$(grep '^status_field_id:' "$CFG" | awk '{print $2}')
      OID=$(awk '/^status_options:/{f=1; next} f && /^  Refined:/{print $2; exit}' "$CFG")
      [ -z "$OID" ] && exit 0
      II=$(gh project item-list "$PN" --owner "$PO" --format json 2>/dev/null \
        | jq -r --arg u "$ISSUE_URL" '.items[] | select(.content.url == $u) | .id' | head -1)
      [ -z "$II" ] && exit 0
      gh project item-edit --id "$II" --project-id "$PID" \
        --field-id "$FID" --single-select-option-id "$OID" 2>&1 | head -3 || true
      echo "set Refined ok"
    depends_on: [commit-refinement]
    trigger_rule: all_done

  # ════════════════════════════════════════════════════════════════════
  # FASE 2 — Planificar
  # ════════════════════════════════════════════════════════════════════

  - id: load-plan-if-resume
    bash: |
      HU_ID=$(echo $gen-hu-id.output | jq -r '.hu_id')
      PLAN_DIR="frontend_dashboard/.frontend/plans/${HU_ID}"
      cp "$PLAN_DIR/plan-manifest.yaml" "$ARTIFACTS_DIR/plan-manifest.yaml"
      mkdir -p $ARTIFACTS_DIR/tareas
      cp "$PLAN_DIR/tareas/F"*.md $ARTIFACTS_DIR/tareas/
      echo "loaded"
    when: "$detect-resume-state.output.already_planned == 'true'"
    depends_on: [commit-refinement, load-refinement-if-resume]
    trigger_rule: none_failed_min_one_success

  - id: planificar-auto
    when: "$detect-resume-state.output.already_planned == 'false'"
    depends_on: [commit-refinement, load-refinement-if-resume]
    trigger_rule: none_failed_min_one_success
    idle_timeout: 300000
    loop:
      max_iterations: 2
      until: PLANNED
      fresh_context: true
      skills:
        - frontend-task-planner-archon
      prompt: |
        Aplicá el protocolo del skill frontend-task-planner-archon.

        Inputs:
          - $ARTIFACTS_DIR/hu-refinada.md   (refinement, output de FASE 1)
          - $ARTIFACTS_DIR/hu-original.md   (fallback)
          - $ARTIFACTS_DIR/spinal-files.yaml
          - $ARTIFACTS_DIR/project-context.md  (LEER PRIMERO)

        Output esperado:
          - $ARTIFACTS_DIR/plan-manifest.yaml
          - $ARTIFACTS_DIR/tareas/F<NN>-<slug>.md

        $LOOP_USER_INPUT vacío en iter 1; feedback de validación en iter 2.

        Cuando termines: <promise>PLANNED</promise>

  - id: validate-plan
    bash: |
      M=$ARTIFACTS_DIR/plan-manifest.yaml
      test -f "$M" || { echo "FAIL_NO_MANIFEST"; exit 0; }
      [ $(wc -c < "$M") -gt 300 ] || { echo "FAIL_TOO_SHORT"; exit 0; }
      grep -q '^tasks:' "$M" || { echo "FAIL_NO_TASKS_SECTION"; exit 0; }
      grep -q '^parallel_batches:' "$M" || { echo "FAIL_NO_BATCHES"; exit 0; }

      # grep -c siempre imprime un número (0 si no matchea). NO usar `|| echo 0`
      # porque grep -c con 0 matches imprime "0" Y exit 1 → captura sería "0\n0".
      task_count=$(grep -cE '^  - id: F[0-9]+' "$M" 2>/dev/null)
      task_count=${task_count:-0}
      [ "$task_count" -ge 1 ] || { echo "FAIL_NO_TASKS"; exit 0; }
      [ "$task_count" -le 12 ] || { echo "FAIL_TOO_MANY_TASKS_$task_count"; exit 0; }

      for tid in $(grep -oE '^  - id: F[0-9]+' "$M" | awk '{print $3}'); do
        ls "$ARTIFACTS_DIR/tareas/${tid}-"*.md >/dev/null 2>&1 || { echo "FAIL_MISSING_TASK_FILE_$tid"; exit 0; }
      done

      echo "PASS"
    depends_on: [planificar-auto, load-plan-if-resume]
    trigger_rule: all_done

  - id: cancel-bad-plan
    cancel: |
      Plan validation FAILED ($validate-plan.output) en branch $gen-hu-id.output.branch.
      Opciones para retomar:
        (a) Edití el refinement (frontend_dashboard/.frontend/refinements/$gen-hu-id.output.hu_id-tech.md)
            con menos tareas o más claridad, commit + push, re-lanzá: archon workflow run hu-frontend-pipeline "$gen-hu-id.output.hu_id"
        (b) Escribí el plan-manifest.yaml + tareas a mano en frontend_dashboard/.frontend/plans/$gen-hu-id.output.hu_id/,
            commit + push, re-lanzá pipeline (bootstrap salta FASE 1 + 2 si los archivos están).
    when: "$validate-plan.output != 'PASS'"
    depends_on: [validate-plan]

  - id: commit-plan
    bash: |
      set -e
      HU_ID=$(echo $gen-hu-id.output | jq -r '.hu_id')
      BRANCH=$(echo $gen-hu-id.output | jq -r '.branch')

      mkdir -p "frontend_dashboard/.frontend/plans/${HU_ID}/tareas"
      cp $ARTIFACTS_DIR/plan-manifest.yaml \
         "frontend_dashboard/.frontend/plans/${HU_ID}/plan-manifest.yaml"
      cp $ARTIFACTS_DIR/tareas/F*.md \
         "frontend_dashboard/.frontend/plans/${HU_ID}/tareas/"

      N=$(ls "frontend_dashboard/.frontend/plans/${HU_ID}/tareas/" | wc -l | tr -d ' ')

      git add "frontend_dashboard/.frontend/plans/${HU_ID}/"
      if ! git diff --staged --quiet; then
        git commit -m "${HU_ID}: plan de tareas (frontend, auto, ${N} tareas)"
        git push origin "$BRANCH"
        echo "committed_${N}"
      else
        echo "no_changes"
      fi
    when: "$validate-plan.output == 'PASS'"
    depends_on: [validate-plan]

  - id: project-set-planned
    bash: |
      CFG="$ARTIFACTS_DIR/github-project-config.yaml"
      [ -f "$CFG" ] || { echo "skipped"; exit 0; }
      ISSUE_URL=$(echo $gen-hu-id.output | jq -r '.issue_url')
      [ -z "$ISSUE_URL" ] || [ "$ISSUE_URL" = "null" ] && { echo "skipped"; exit 0; }
      PN=$(grep '^project_number:' "$CFG" | awk '{print $2}')
      PO=$(grep '^project_owner:' "$CFG" | awk '{print $2}')
      PID=$(grep '^project_id:' "$CFG" | awk '{print $2}')
      FID=$(grep '^status_field_id:' "$CFG" | awk '{print $2}')
      OID=$(awk '/^status_options:/{f=1; next} f && /^  Planned:/{print $2; exit}' "$CFG")
      [ -z "$OID" ] && exit 0
      II=$(gh project item-list "$PN" --owner "$PO" --format json 2>/dev/null \
        | jq -r --arg u "$ISSUE_URL" '.items[] | select(.content.url == $u) | .id' | head -1)
      [ -z "$II" ] && exit 0
      gh project item-edit --id "$II" --project-id "$PID" \
        --field-id "$FID" --single-select-option-id "$OID" 2>&1 | head -3 || true
      echo "set Planned ok"
    depends_on: [commit-plan]
    trigger_rule: all_done

  # ════════════════════════════════════════════════════════════════════
  # FASE 3 — Implementar tareas
  # ════════════════════════════════════════════════════════════════════
  # El AI solo escribe código. Las git operations entre iteraciones las
  # hace `until_bash` (determinista). Cuando until_bash detecta que todas
  # las tareas están done, exit 0 → loop termina.

  - id: project-set-implementing
    bash: |
      CFG="$ARTIFACTS_DIR/github-project-config.yaml"
      [ -f "$CFG" ] || { echo "skipped"; exit 0; }
      ISSUE_URL=$(echo $gen-hu-id.output | jq -r '.issue_url')
      [ -z "$ISSUE_URL" ] || [ "$ISSUE_URL" = "null" ] && { echo "skipped"; exit 0; }
      PN=$(grep '^project_number:' "$CFG" | awk '{print $2}')
      PO=$(grep '^project_owner:' "$CFG" | awk '{print $2}')
      PID=$(grep '^project_id:' "$CFG" | awk '{print $2}')
      FID=$(grep '^status_field_id:' "$CFG" | awk '{print $2}')
      OID=$(awk '/^status_options:/{f=1; next} f && /^  Implementing:/{print $2; exit}' "$CFG")
      [ -z "$OID" ] && exit 0
      II=$(gh project item-list "$PN" --owner "$PO" --format json 2>/dev/null \
        | jq -r --arg u "$ISSUE_URL" '.items[] | select(.content.url == $u) | .id' | head -1)
      [ -z "$II" ] && exit 0
      gh project item-edit --id "$II" --project-id "$PID" \
        --field-id "$FID" --single-select-option-id "$OID" 2>&1 | head -3 || true
      echo "set Implementing ok"
    depends_on: [commit-plan]
    trigger_rule: all_done

  - id: implementar-secuencial
    depends_on: [commit-plan]
    idle_timeout: 1800000
    loop:
      max_iterations: 30
      until: NEVER_AI_SIGNAL  # nunca usamos signal del AI; until_bash decide cuándo parar
      fresh_context: true
      skills:
        - frontend-implementer-archon
      # until_bash corre DESPUÉS de cada iteración AI. Si retorna 0, loop termina.
      # Acá hacemos todas las git operations (NO el AI).
      until_bash: |
        set +e

        # CRITICAL: obtener HU_ID del gen-hu-id node, NO de `ls plans/` (que puede
        # tener múltiples HUs ya mergeados a main). $gen-hu-id.output es auto-shell-quoted.
        HU_ID=$(echo $gen-hu-id.output | jq -r '.hu_id')
        if [ -z "$HU_ID" ] || [ "$HU_ID" = "null" ]; then
          echo "ERROR: no se pudo extraer HU_ID de gen-hu-id.output" >&2
          exit 0
        fi
        BRANCH="hu/${HU_ID}"
        RESULTS_DIR="frontend_dashboard/.frontend/results/${HU_ID}"
        mkdir -p "$RESULTS_DIR"

        # Helper: extraer campo de YAML stripping comillas (yaml puede tener `status: "passed"` o `status: passed`)
        yaml_get() {
          grep -m1 "^${2}:" "$1" 2>/dev/null | awk -F: '{print $2}' | sed 's/^ *//; s/ *$//; s/^["'\'']//; s/["'\'']$//'
        }

        # ¿El AI escribió task-result.yaml en esta iteración?
        if [ -f "$ARTIFACTS_DIR/task-result.yaml" ]; then
          STATUS=$(yaml_get "$ARTIFACTS_DIR/task-result.yaml" status)
          TASK_ID=$(yaml_get "$ARTIFACTS_DIR/task-result.yaml" task_id)

          if [ -z "$TASK_ID" ]; then
            echo "ERROR: task-result.yaml sin task_id" >&2
            rm -f "$ARTIFACTS_DIR/task-result.yaml"
            exit 1
          fi

          cp "$ARTIFACTS_DIR/task-result.yaml" "${RESULTS_DIR}/${TASK_ID}-result.yaml"

          git add frontend_dashboard/src 2>/dev/null || true
          git add "$RESULTS_DIR/${TASK_ID}-result.yaml" 2>/dev/null || true
          git add frontend_dashboard/.frontend/refinements/ 2>/dev/null || true

          git reset HEAD frontend_dashboard/node_modules 2>/dev/null || true
          git reset HEAD frontend_dashboard/dist 2>/dev/null || true
          git reset HEAD frontend_dashboard/.vite 2>/dev/null || true
          git reset HEAD frontend_dashboard/coverage 2>/dev/null || true
          git reset HEAD frontend_dashboard/package-lock.json 2>/dev/null || true

          if ! git diff --staged --quiet; then
            git commit -m "${HU_ID} ${TASK_ID}: status=${STATUS} (auto)"
            # Push con retry: si origin avanzó (concurrency), pull --rebase y reintentar
            git push origin "$BRANCH" > /tmp/push-$$.log 2>&1
            PUSH_RC=$?
            tail -5 /tmp/push-$$.log >&2 || true
            if [ "$PUSH_RC" -ne 0 ]; then
              echo "push falló, intentando pull --rebase + retry" >&2
              git pull --rebase origin "$BRANCH" 2>&1 | tail -5 >&2 || true
              git push origin "$BRANCH" 2>&1 | tail -5 >&2 || \
                echo "WARN: push falló dos veces — commit local, no en origin" >&2
            fi
            rm -f /tmp/push-$$.log
          fi

          # ═══ MANEJO DE FALLOS ═══
          # Si la tarea falló, decidir: ¿retry transient o permanent failure?
          if [ "$STATUS" != "passed" ]; then
            BR=$(yaml_get "$ARTIFACTS_DIR/task-result.yaml" blocked_reason)
            ISSUE_URL=$(echo $gen-hu-id.output | jq -r '.issue_url')

            # ¿Es transient? Solo retry-eable si timeout o regression (potencialmente flaky)
            IS_TRANSIENT=false
            case "$BR" in
              command_timeout|regression) IS_TRANSIENT=true ;;
            esac

            RETRY_FILE="$ARTIFACTS_DIR/retries-${TASK_ID}.count"
            RETRIES=$(cat "$RETRY_FILE" 2>/dev/null || echo 0)
            MAX_RETRIES=1

            if [ "$IS_TRANSIENT" = "true" ] && [ "$RETRIES" -lt "$MAX_RETRIES" ]; then
              # ════ AUTO-RETRY ════
              NEW_RETRIES=$((RETRIES + 1))
              echo "$NEW_RETRIES" > "$RETRY_FILE"

              # Remover result.yaml persistido para que AI lo vea como pending
              rm -f "${RESULTS_DIR}/${TASK_ID}-result.yaml"
              # Revertir cambios uncommitted al worktree (el commit fallido ya está en branch)
              git checkout HEAD -- frontend_dashboard/src 2>/dev/null || true

              # Comment en el Issue avisando el retry
              if [ -n "$ISSUE_URL" ] && [ "$ISSUE_URL" != "null" ]; then
                cat > "$ARTIFACTS_DIR/retry-comment.md" <<COMMENT
        ⚠️ **Auto-retry ${NEW_RETRIES}/${MAX_RETRIES} en tarea \`${TASK_ID}\`**

        - Status detectado: \`${STATUS}\`
        - Razón: \`${BR:-unknown}\` (clasificada como transient)
        - Acción: re-implementando la tarea con fresh-context. El pipeline sigue.
        COMMENT
                gh issue comment "$ISSUE_URL" --body-file "$ARTIFACTS_DIR/retry-comment.md" 2>&1 | tail -3 >&2 || true
              fi

              # Marca para que el bloque de éxito sepa que es retry-success
              touch "$ARTIFACTS_DIR/retries-${TASK_ID}.success-comment.pending"

              echo "TASK ${TASK_ID} ${STATUS}/${BR}: AUTO-RETRY ${NEW_RETRIES}/${MAX_RETRIES}" >&2
              rm -f "$ARTIFACTS_DIR/task-result.yaml" "$ARTIFACTS_DIR/task.md"
              exit 1   # loop continua, AI re-implementa esta tarea
            fi

            # ════ PERMANENT FAILURE ════
            # (no transient, o retries agotados)

            cat > "$ARTIFACTS_DIR/pipeline-error.yaml" <<EOF
        phase: implementing
        failed_task: ${TASK_ID}
        failed_status: ${STATUS}
        blocked_reason: ${BR:-unknown}
        retries_attempted: ${RETRIES}/${MAX_RETRIES}
        branch: ${BRANCH}
        remediation: |
          Ver el comment en el Issue ${ISSUE_URL} con los comandos exactos para retomar.
        EOF

            # Comment detallado en el Issue con los comandos exactos
            if [ -n "$ISSUE_URL" ] && [ "$ISSUE_URL" != "null" ]; then
              cat > "$ARTIFACTS_DIR/failure-comment.md" <<COMMENT
        ❌ **Pipeline frenado en tarea \`${TASK_ID}\`**

        | Campo | Valor |
        |---|---|
        | Status | \`${STATUS}\` |
        | Razón | \`${BR:-unknown}\` |
        | Auto-retries usados | \`${RETRIES}/${MAX_RETRIES}\` |
        | Branch | \`${BRANCH}\` |
        | HU id | \`${HU_ID}\` |

        ---

        ## Cómo retomar

        ### Opción A — Debug a mano + smart-resume del pipeline

        \`\`\`bash
        # Desde tu repo local:
        git fetch origin
        git checkout ${BRANCH}

        # Diagnostico:
        cd frontend_dashboard
        npm test       # ver qué test falla
        npx tsc -b     # ver errores de tipo
        # ... fixeá el código en frontend_dashboard/src/... ...

        # Cuando esté verde:
        cd ..
        git add frontend_dashboard/src
        git commit -m "fix(${TASK_ID}): <descripción del fix>"
        git push origin ${BRANCH}

        # Re-lanzá pipeline desde una terminal NORMAL (no Claude Code):
        cd /Users/edgm/Documents/Projects/AgencyHubara
        archon workflow run hu-frontend-pipeline "${HU_ID}"
        \`\`\`

        El pipeline retomará automáticamente desde la próxima tarea pendiente
        (smart-resume vía \`detect-resume-state\`).

        ### Opción B — Re-planificar la HU (si está mal planteada)

        \`\`\`bash
        # Editar el refinement o el plan a mano:
        \$EDITOR frontend_dashboard/.frontend/refinements/${HU_ID}-tech.md
        \$EDITOR frontend_dashboard/.frontend/plans/${HU_ID}/plan-manifest.yaml

        git add frontend_dashboard/.frontend/
        git commit -m "fix(${HU_ID}): replan"
        git push origin ${BRANCH}

        archon workflow run hu-frontend-pipeline "${HU_ID}"
        \`\`\`

        ### Opción C — Abandonar esta HU

        Cerrá el issue. El branch \`${BRANCH}\` queda en origin como referencia
        del intento (podés borrar luego con \`git push origin --delete ${BRANCH}\`).

        ---
        🤖 Status del card movido a \`Blocked\` en el Project board.
        COMMENT
              gh issue comment "$ISSUE_URL" --body-file "$ARTIFACTS_DIR/failure-comment.md" 2>&1 | tail -3 >&2 || true
            fi

            # Setear Project status a "Blocked"
            CFG="$ARTIFACTS_DIR/github-project-config.yaml"
            if [ -f "$CFG" ] && [ -n "$ISSUE_URL" ] && [ "$ISSUE_URL" != "null" ]; then
              PN=$(grep '^project_number:' "$CFG" | awk '{print $2}')
              PO=$(grep '^project_owner:' "$CFG" | awk '{print $2}')
              PID=$(grep '^project_id:' "$CFG" | awk '{print $2}')
              FID=$(grep '^status_field_id:' "$CFG" | awk '{print $2}')
              OID=$(awk '/^status_options:/{f=1; next} f && /^  Blocked:/{print $2; exit}' "$CFG")
              if [ -n "$OID" ]; then
                II=$(gh project item-list "$PN" --owner "$PO" --format json --limit 100 2>/dev/null \
                  | jq -r --arg u "$ISSUE_URL" '.items[] | select(.content.url == $u) | .id' | head -1)
                if [ -n "$II" ]; then
                  gh project item-edit --id "$II" --project-id "$PID" \
                    --field-id "$FID" --single-select-option-id "$OID" 2>&1 | head -3 >&2 || true
                fi
              fi
            fi

            echo "TASK ${TASK_ID} PERMANENT FAILURE (${STATUS}/${BR}). Pipeline para." >&2
            exit 0
          fi

          # ════ ÉXITO: limpiar retry counter si había + cleanup ════
          rm -f "$ARTIFACTS_DIR/retries-${TASK_ID}.count" 2>/dev/null || true

          # Si esta tarea había fallado antes y ahora pasó (auto-retry exitoso), avisar
          if [ -f "$ARTIFACTS_DIR/retries-${TASK_ID}.success-comment.flag" ]; then
            # ya posteamos el comment de éxito; nada que hacer
            :
          elif [ -f "$ARTIFACTS_DIR/retries-${TASK_ID}.success-comment.pending" ]; then
            ISSUE_URL=$(echo $gen-hu-id.output | jq -r '.issue_url')
            if [ -n "$ISSUE_URL" ] && [ "$ISSUE_URL" != "null" ]; then
              gh issue comment "$ISSUE_URL" --body "✅ Auto-retry exitoso en tarea \`${TASK_ID}\`. Pipeline continúa." 2>&1 | tail -3 >&2 || true
              touch "$ARTIFACTS_DIR/retries-${TASK_ID}.success-comment.flag"
            fi
            rm -f "$ARTIFACTS_DIR/retries-${TASK_ID}.success-comment.pending"
          fi

          # Limpiar artifacts para próxima iteración
          rm -f "$ARTIFACTS_DIR/task-result.yaml"
          rm -f "$ARTIFACTS_DIR/task.md"
        fi

        # Check: ¿todas las tareas done?
        MANIFEST="frontend_dashboard/.frontend/plans/${HU_ID}/plan-manifest.yaml"
        # grep -c siempre imprime un número; no necesita `|| echo 0` (que pega "0\n0")
        TOTAL=$(grep -cE '^  - id: F[0-9]+' "$MANIFEST" 2>/dev/null)
        TOTAL=${TOTAL:-0}
        PASSED=$(find "$RESULTS_DIR" -name 'F*-result.yaml' -exec grep -l '^status: passed' {} + 2>/dev/null | wc -l | tr -d ' ')
        PASSED=${PASSED:-0}
        echo "Progreso: ${PASSED}/${TOTAL}" >&2

        if [ "$PASSED" -ge "$TOTAL" ] && [ "$TOTAL" -gt 0 ]; then
          echo "ALL TASKS DONE" >&2
          exit 0
        fi

        exit 1   # loop continúa
      prompt: |
        SOLO escribís código. Las git operations las hace `until_bash` después
        de tu iteración.

        Setup (cada iteración):
          HU_ID=$(ls frontend_dashboard/.frontend/plans/ | head -1)
          MANIFEST="frontend_dashboard/.frontend/plans/${HU_ID}/plan-manifest.yaml"
          RESULTS_DIR="frontend_dashboard/.frontend/results/${HU_ID}"

        Paso A — Encontrar la próxima tarea pendiente:
          Iterá parallel_batches[] del manifest en orden. Dentro de cada
          batch, iterá tasks[] en orden de F-id ascendente. La primera
          tarea cuyo result.yaml NO existe en $RESULTS_DIR (o no tiene
          status:passed) es la próxima.

          Si NO hay tarea pendiente, no hagas nada (no escribas task-result.yaml).
          until_bash detectará que TOTAL == PASSED y terminará el loop.

        Paso B — Implementar la tarea:
          1. Cargar inputs a $ARTIFACTS_DIR:
             cp "$MANIFEST" "$ARTIFACTS_DIR/plan-manifest.yaml"
             cp "frontend_dashboard/.frontend/plans/${HU_ID}/tareas/${TASK_ID}-"*.md "$ARTIFACTS_DIR/task.md"
             cp "frontend_dashboard/.frontend/refinements/${HU_ID}-tech.md" "$ARTIFACTS_DIR/hu-refinada.md"
          2. Aplicar protocolo del skill frontend-implementer-archon:
             - escribir código + tests en el worktree (frontend_dashboard/src/...)
             - correr los §10 verification commands (cd frontend_dashboard && npm test ...)
             - escribir $ARTIFACTS_DIR/task-result.yaml con status

        Paso C — NO hagas commit / push / git add.
          until_bash se encarga después de esta iteración.

        Paso D — Si tu tarea falló (status != passed), igual escribí
          task-result.yaml con el status. until_bash detecta y para el loop.

        No emitas <promise> — el loop termina por `until_bash exit 0`.

  # ════════════════════════════════════════════════════════════════════
  # FASE 4 — Validación final + PR
  # ════════════════════════════════════════════════════════════════════

  - id: check-pipeline-error
    bash: |
      if [ -f $ARTIFACTS_DIR/pipeline-error.yaml ]; then
        echo "=== pipeline-error.yaml ===" >&2
        cat $ARTIFACTS_DIR/pipeline-error.yaml >&2
        echo "HAS_ERROR"
      else
        echo "OK"
      fi
    depends_on: [implementar-secuencial]
    trigger_rule: all_done

  - id: cancel-on-implement-error
    cancel: |
      Pipeline INCOMPLETO en FASE 3. Branch $gen-hu-id.output.branch pusheado con todo el progreso hasta la tarea fallida.
      Ver $ARTIFACTS_DIR/pipeline-error.yaml (logueado al stderr de check-pipeline-error) para detalles y remediation.
      En general: editá el código del branch para arreglar la tarea fallida, commit + push, re-lanzá:
        archon workflow run hu-frontend-pipeline "$gen-hu-id.output.hu_id"
      (smart-resume continúa desde la próxima tarea pendiente).
    when: "$check-pipeline-error.output == 'HAS_ERROR'"
    depends_on: [check-pipeline-error]

  - id: final-validation
    bash: |
      # CRITICAL: pipefail — sin esto, exit code es de `tail` (siempre 0)
      # y un test rojo pasa como PASS silenciosamente.
      set -o pipefail
      cd frontend_dashboard
      echo "=== npm test ===" >&2
      npm test 2>&1 | tail -30 >&2 || { echo "FAIL_NPM_TEST"; exit 0; }
      echo "=== npx tsc -b ===" >&2
      npx tsc -b 2>&1 | tail -30 >&2 || { echo "FAIL_TSC"; exit 0; }
      echo "=== npm run build ===" >&2
      npm run build 2>&1 | tail -30 >&2 || { echo "FAIL_BUILD"; exit 0; }
      echo "PASS"
    timeout: 600000
    when: "$check-pipeline-error.output == 'OK'"
    depends_on: [check-pipeline-error]

  - id: cancel-on-final-validation-fail
    cancel: "Validación final pre-PR FALLÓ ($final-validation.output). Branch $gen-hu-id.output.branch tiene una regresión que ningún test §10 individual capturó. Investigar a mano: cd frontend_dashboard && npm test"
    when: "$final-validation.output != 'PASS'"
    depends_on: [final-validation]

  - id: build-pr-body
    script: |
      import { readFileSync, readdirSync, existsSync } from 'fs';
      import { writeFile } from 'fs/promises';
      import { join } from 'path';

      const huInfo = $gen-hu-id.output;
      const huId = huInfo.hu_id;
      const artifactsDir = "$ARTIFACTS_DIR";

      const refinementOriginal = 'frontend_dashboard/.frontend/refinements/' + huId + '-original.md';
      const resultsDir = 'frontend_dashboard/.frontend/results/' + huId;

      let summary = '';
      if (existsSync(refinementOriginal)) {
        const raw = readFileSync(refinementOriginal, 'utf-8');
        summary = raw.split('\n').slice(0, 20).join('\n');
      }

      let tasksTable = '';
      if (existsSync(resultsDir)) {
        const files = readdirSync(resultsDir).filter(f => f.endsWith('-result.yaml')).sort();
        for (const f of files) {
          const taskId = f.replace('-result.yaml', '');
          const content = readFileSync(join(resultsDir, f), 'utf-8');
          const statusMatch = content.match(/^status: *(\w+)/m);
          const status = statusMatch ? statusMatch[1] : 'unknown';
          const filesCount = (content.match(/^  - src\//gm) || []).length;
          tasksTable += '- [' + status + '] ' + taskId + ' (' + filesCount + ' files)\n';
        }
      }

      const issueUrl = huInfo.issue_url;
      const closesLine = (issueUrl && issueUrl !== 'null' && issueUrl !== '')
        ? ('\n\nCloses ' + issueUrl + '\n')
        : '';

      const body =
        '## Summary\n\n' +
        summary + '\n\n' +
        '## Tasks implemented\n\n' +
        tasksTable + '\n' +
        '## Test plan\n\n' +
        '- [ ] Revisar el diff archivo por archivo\n' +
        '- [ ] cd frontend_dashboard && npm test\n' +
        '- [ ] cd frontend_dashboard && npm run build\n' +
        '- [ ] Smoke test: cd frontend_dashboard && npm run dev y validar UX manualmente\n' +
        closesLine + '\n' +
        '🤖 Generado por hu-frontend-pipeline\n';

      await writeFile(artifactsDir + '/pr-body.md', body);
      console.log('written ' + body.length + ' bytes');
    runtime: bun
    when: "$final-validation.output == 'PASS'"
    depends_on: [final-validation]

  - id: create-pr
    bash: |
      set -e
      HU_ID=$(echo $gen-hu-id.output | jq -r '.hu_id')
      BRANCH=$(echo $gen-hu-id.output | jq -r '.branch')
      TITLE=$(echo $gen-hu-id.output | jq -r '.title' | head -c 70)

      # Push final asegurado (idempotente)
      git push origin "$BRANCH" 2>&1 | tail -5

      # CRÍTICO: --body-file en vez de --body "$(cat ...)" — pr-body.md
      # tiene backticks que bash interpretaría como command substitution.
      PR_URL=$(gh pr create \
        --base main \
        --head "$BRANCH" \
        --title "${HU_ID}: ${TITLE}" \
        --body-file "$ARTIFACTS_DIR/pr-body.md")

      echo "$PR_URL"
    when: "$final-validation.output == 'PASS'"
    depends_on: [build-pr-body]
    retry:
      max_attempts: 2
      delay_ms: 5000
      on_error: transient

  - id: project-set-done
    bash: |
      CFG="$ARTIFACTS_DIR/github-project-config.yaml"
      [ -f "$CFG" ] || { echo "skipped"; exit 0; }
      ISSUE_URL=$(echo $gen-hu-id.output | jq -r '.issue_url')
      [ -z "$ISSUE_URL" ] || [ "$ISSUE_URL" = "null" ] && { echo "skipped"; exit 0; }
      PN=$(grep '^project_number:' "$CFG" | awk '{print $2}')
      PO=$(grep '^project_owner:' "$CFG" | awk '{print $2}')
      PID=$(grep '^project_id:' "$CFG" | awk '{print $2}')
      FID=$(grep '^status_field_id:' "$CFG" | awk '{print $2}')
      OID=$(awk -F: '/^status_options:/{f=1; next} f && /Done.*PR ready/ {gsub(/^ +| +$/, "", $2); print $2; exit}' "$CFG")
      [ -z "$OID" ] && exit 0
      II=$(gh project item-list "$PN" --owner "$PO" --format json 2>/dev/null \
        | jq -r --arg u "$ISSUE_URL" '.items[] | select(.content.url == $u) | .id' | head -1)
      [ -z "$II" ] && exit 0
      gh project item-edit --id "$II" --project-id "$PID" \
        --field-id "$FID" --single-select-option-id "$OID" 2>&1 | head -3 || true
      echo "set Done ok"
    depends_on: [create-pr]
    trigger_rule: all_done

  - id: trigger-review
    bash: |
      # Disparar el review automático en background. Best-effort:
      # si el nesting falla, el operador ve el comando en el summary.
      PR_URL=$create-pr.output
      LOG_FILE="$HOME/.archon/logs/review-trigger-$(date +%s).log"
      mkdir -p "$HOME/.archon/logs"

      # CRITICAL: unset CLAUDECODE para evitar la advertencia de nested-claude-code
      # y el riesgo de "workflows hang silently". archon detecta esa env var del
      # parent y warns; con env -u CLAUDECODE el subprocess no la hereda.
      # ARCHON_SUPPRESS_NESTED_CLAUDE_WARNING=1 silencia el warning igualmente
      # por si CLAUDECODE se setea desde otro lado.
      (env -u CLAUDECODE ARCHON_SUPPRESS_NESTED_CLAUDE_WARNING=1 \
         nohup archon workflow run review-pr-frontend "$PR_URL" > "$LOG_FILE" 2>&1 & disown) 2>/dev/null \
        && echo "review_triggered_log=$LOG_FILE" \
        || echo "review_trigger_failed_run_manually"
    depends_on: [create-pr]
    timeout: 10000

  - id: print-summary
    bash: |
      HU_ID=$(echo $gen-hu-id.output | jq -r '.hu_id')
      PR_URL=$create-pr.output
      RESULTS_DIR="frontend_dashboard/.frontend/results/${HU_ID}"
      TASKS_DONE=$(find "$RESULTS_DIR" -name 'F*-result.yaml' 2>/dev/null | wc -l | tr -d ' ')
      REVIEW_STATUS=$trigger-review.output

      cat <<EOF
      ╔════════════════════════════════════════════════════════════════╗
      ║ 🎉 Pipeline completo — HU ${HU_ID}                              ║
      ║                                                                ║
      ║ Branch:      hu/${HU_ID}
      ║ Tareas:      ${TASKS_DONE} implementadas
      ║ PR:          ${PR_URL}
      ║                                                                ║
      ║ Auto-review: ${REVIEW_STATUS}
      ║                                                                ║
      ║ Próximos pasos:                                                ║
      ║   1. Esperá ~3-5 min al comment del review-bot en el PR        ║
      ║   2. Si dice "verdict: APPROVE" → squash-merge                 ║
      ║   3. Si "REQUEST_CHANGES" → revisá findings + decidí           ║
      ║   4. El issue se cierra automáticamente (Closes …)             ║
      ║                                                                ║
      ║ Review NO arrancó? Lanzalo a mano:                             ║
      ║   archon workflow run review-pr-frontend "${PR_URL}"
      ╚════════════════════════════════════════════════════════════════╝
      EOF
    depends_on: [trigger-review]
