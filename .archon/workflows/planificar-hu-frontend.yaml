name: planificar-hu-frontend
description: |
  Descompone un refinamiento técnico de FRONTEND (FSD: Vite + React 19 +
  TanStack Query + Zod + Tailwind v4) en un DAG de tareas atómicas end-to-end
  (feature vertical slices), listas para que implementar-tarea-frontend
  ejecute una por una.

  **Use when**: ya corriste refinar-hu-frontend y
  frontend_dashboard/.frontend/refinements/<id>-tech.md está visible en main.
  El input puede ser:
    - HU id (ej: "HU-20260511-1430-foo")
    - Ruta a un archivo de refinamiento (frontend_dashboard/.frontend/refinements/<id>-tech.md)

  Si querés un pipeline automatizado end-to-end SIN gates humanos, usá
  `hu-frontend-pipeline` en su lugar.

provider: claude
model: sonnet
interactive: true

nodes:
  # Determinista: localizar refinement, copiarlo + dependencias al $ARTIFACTS_DIR
  - id: cargar-refinamiento
    bash: |
      set -e
      RAW="$ARGUMENTS"

      # Resolver ruta del refinement
      if [[ "$RAW" == *.md ]] || [[ "$RAW" == */* ]]; then
        REF_PATH="$RAW"
      else
        # Tratarlo como HU id
        REF_PATH="frontend_dashboard/.frontend/refinements/${RAW}-tech.md"
      fi

      if [ ! -f "$REF_PATH" ]; then
        echo "FATAL: no encuentro refinement: $REF_PATH" >&2
        echo "" >&2
        echo "Refinements disponibles en frontend_dashboard/.frontend/refinements/:" >&2
        ls frontend_dashboard/.frontend/refinements/*.md 2>/dev/null || echo "  (directorio vacío)" >&2
        exit 1
      fi

      # Validar shape (mínimo: línea HU id)
      grep -q '^HU id:' "$REF_PATH" || {
        echo "FATAL: $REF_PATH no parece un refinement válido (falta HU id)" >&2
        exit 1
      }

      # Extraer HU_ID
      HU_ID=$(grep -m1 '^HU id:' "$REF_PATH" | sed 's/^HU id: *//' | tr -d ' ')

      # Stagear todos los inputs que el planner skill necesita
      cp "$REF_PATH" $ARTIFACTS_DIR/hu-refinada.md
      [ -f "frontend_dashboard/.frontend/refinements/${HU_ID}-original.md" ] && \
        cp "frontend_dashboard/.frontend/refinements/${HU_ID}-original.md" \
           $ARTIFACTS_DIR/hu-original.md

      # spinal-files.yaml y project-context.md son obligatorios
      for f in spinal-files.yaml project-context.md; do
        test -f "frontend_dashboard/.frontend/$f" || {
          echo "FATAL: falta frontend_dashboard/.frontend/$f" >&2
          exit 1
        }
        cp "frontend_dashboard/.frontend/$f" "$ARTIFACTS_DIR/$f"
      done

      SIZE=$(wc -c < $ARTIFACTS_DIR/hu-refinada.md)
      echo "HU id: ${HU_ID} | refinement: ${SIZE} bytes cargado"
    timeout: 30000

  # AI iterativo: planificar con feedback humano
  - id: planificar
    depends_on: [cargar-refinamiento]
    idle_timeout: 600000
    loop:
      interactive: true
      max_iterations: 8
      until: PLAN_APROBADO
      skills:
        - frontend-task-planner-archon
      gate_message: |
        Descompuse el refinamiento en tareas atómicas. Revisá:
          - $ARTIFACTS_DIR/plan-manifest.yaml (el DAG con depends_on + parallel_batches)
          - $ARTIFACTS_DIR/tareas/F<NN>-*.md (una por feature)

        Respondé:
          - "aprobado" / "ok" / "go" si el plan está listo
          - Cualquier otro comentario para iterar:
              * split: "partí F03 en dos tareas"
              * merge: "uní F02 y F04 — son la misma feature"
              * scope: "F05 debe incluir también el caso X"
              * add: "falta una tarea para la migración Y"
              * remove: "F07 está fuera de scope"
              * deps: "F06 también depende de F02"
      prompt: |
        Refinamiento técnico aprobado: $ARTIFACTS_DIR/hu-refinada.md
        HU original (fallback): $ARTIFACTS_DIR/hu-original.md (si existe)
        Project context (LEER PRIMERO): $ARTIFACTS_DIR/project-context.md
        Spinal files convention: $ARTIFACTS_DIR/spinal-files.yaml

        Feedback del humano en esta iteración: $LOOP_USER_INPUT

        Aplicá tu protocolo de descomposición (skill
        frontend-task-planner-archon).

        Si $ARTIFACTS_DIR/plan-manifest.yaml ya existe de una iteración
        previa, leélo + leé todos los archivos en $ARTIFACTS_DIR/tareas/
        e incorporá el feedback de forma INCREMENTAL — modificá solo las
        tareas afectadas, no regeneres todo el plan. Incrementá el campo
        `iteration` del manifest header.

        Validá antes de devolver:
          - DAG sin ciclos
          - Cobertura completa de criterios de aceptación (§1 del refinamiento)
          - Max ~3 deps directas por tarea
          - Granularidad: 50-300 LOC por tarea
          - Cada tarea cruza todas las capas FSD que toca
          - Cada tarea declara correctamente affects_new_files vs
            affects_spinal_files según spinal-files.yaml

        Si el humano aprobó:
        <promise>PLAN_APROBADO</promise>

  # Determinista: persistir plan + reportar comandos git
  - id: persistir-plan
    depends_on: [planificar]
    bash: |
      set -e

      # Extraer HU id del manifest
      HU_ID=$(grep -m1 '^hu_id:' $ARTIFACTS_DIR/plan-manifest.yaml | awk '{print $2}')
      [ -n "$HU_ID" ] || { echo "FATAL: no encuentro hu_id en plan-manifest.yaml" >&2; exit 1; }

      mkdir -p "frontend_dashboard/.frontend/plans/${HU_ID}/tareas"
      cp $ARTIFACTS_DIR/plan-manifest.yaml \
         "frontend_dashboard/.frontend/plans/${HU_ID}/plan-manifest.yaml"
      cp $ARTIFACTS_DIR/tareas/F*.md \
         "frontend_dashboard/.frontend/plans/${HU_ID}/tareas/"

      N=$(ls "frontend_dashboard/.frontend/plans/${HU_ID}/tareas/" | wc -l | tr -d ' ')

      # Reportar batches del manifest
      BATCHES=$(awk '/^parallel_batches:/{found=1; next} found && /^  - batch_id:/{batch=$3} found && /^    tasks:/{getline; print batch ": " $0}' $ARTIFACTS_DIR/plan-manifest.yaml | head -20)

      cat <<EOF
      ╔════════════════════════════════════════════════════════════════╗
      ║ ✅ Plan persistido                                              ║
      ║                                                                ║
      ║ HU id:        ${HU_ID}
      ║ # tareas:     ${N}
      ║ Files:        frontend_dashboard/.frontend/plans/${HU_ID}/
      ╚════════════════════════════════════════════════════════════════╝

      Parallel batches:
      ${BATCHES}

      📋 Comando para activar en main:

        git add frontend_dashboard/.frontend/plans/${HU_ID}/
        git commit -m "${HU_ID}: plan de tareas (frontend) aprobado (${N} features)"
        git push   # o merge según convención

      ▶ Siguiente paso — elegí una opción:

        # Opción A: orquestador interactivo (batches paralelos, terminales manuales)
        archon workflow run implementar-hu-frontend "${HU_ID}"

        # Opción B: tarea por tarea (modo standalone)
        archon workflow run implementar-tarea-frontend "${HU_ID} F01"
        archon workflow run implementar-tarea-frontend "${HU_ID} F02"
        # ...

        # Opción C: pipeline auto end-to-end (sin gates)
        archon workflow run hu-frontend-pipeline "${HU_ID}"
      EOF
    timeout: 30000
