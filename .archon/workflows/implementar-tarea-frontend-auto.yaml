name: implementar-tarea-frontend-auto
description: |
  Variante NO-INTERACTIVA de implementar-tarea-frontend, diseñada para ser
  lanzada en BACKGROUND por el super-pipeline `hu-frontend-pipeline`. Hace
  exactamente lo mismo que `implementar-tarea-frontend` pero:

    - Sin gates humanos: el skill corre UNA pasada, sin loop interactivo.
    - Sin `interactive: true`: no espera input; Archon corre el workflow
      hasta el final automáticamente.
    - Sin reintentos a nivel workflow: si el skill reporta status != passed,
      el workflow termina (el pipeline orquestador decide si reintenta).

  El input es idéntico al interactivo: "<HU-id> F<NN>" o path a un task.md.

  **Use when**: solo invocado desde `hu-frontend-pipeline` u otro orquestador
  automático. NO lo uses directamente como operador — para eso usá
  `implementar-tarea-frontend` (con gates).

  **Produces (efímero, en $ARTIFACTS_DIR)**:
    - task.md, plan-manifest.yaml, hu-refinada.md, project-context.md, spinal-files.yaml
    - task-result.yaml con status: passed | passed_with_warnings | failed | blocked

  **Produce en el worktree**:
    - Código de producción en src/{entities,features,pages,shared,app}/, tests/
    - frontend_dashboard/.frontend/results/<HU-id>/F<NN>-result.yaml (snapshot)

  **Diferencia vs implementar-tarea-frontend**:
    - El nodo `implementar` NO usa `loop:` — es un único prompt al skill.
    - El skill puede iterar internamente (auto-retry sobre fallos de tests
      transitorios hasta 3 veces) pero no espera input humano.
    - Al terminar, persistir-resultado SOLO escribe el archivo; no imprime
      "comandos sugeridos" — el pipeline orquestador lee el result.yaml.

provider: claude
model: sonnet
interactive: false   # CLAVE: este workflow corre sin gates humanos

nodes:
  - id: cargar-tarea
    prompt: |
      Identificá la tarea desde $USER_MESSAGE y prepará $ARTIFACTS_DIR.

      Paso 1 — Resolver la ruta de la tarea:
        a. Si $USER_MESSAGE contiene "tareas/F" o termina en ".md",
           tratalo como ruta directa.
        b. Si parece "<HU-id> F<NN>", buscá
           frontend_dashboard/.frontend/plans/<HU-id>/tareas/F<NN>-*.md
           (con glob).
        c. Si no existe, fallá con exit no-cero y mensaje claro.

      Paso 2 — Copiar inputs a $ARTIFACTS_DIR:
        cp <ruta-task> $ARTIFACTS_DIR/task.md
        cp frontend_dashboard/.frontend/plans/<HU-id>/plan-manifest.yaml $ARTIFACTS_DIR/plan-manifest.yaml
        cp frontend_dashboard/.frontend/refinements/<HU-id>-tech.md $ARTIFACTS_DIR/hu-refinada.md  # si existe
        cp frontend_dashboard/.frontend/spinal-files.yaml $ARTIFACTS_DIR/spinal-files.yaml
        cp frontend_dashboard/.frontend/project-context.md $ARTIFACTS_DIR/project-context.md

      Paso 3 — Validar depends_on:
        Para cada F-id en depends_on del manifest:
          - Verificá que frontend_dashboard/.frontend/results/<HU-id>/<F-id>-result.yaml exista
            con status: passed.
          - Verificá que al menos un archivo de files_created exista en el worktree.
        Si falla, escribí $ARTIFACTS_DIR/task-result.yaml con:
          status: blocked
          blocked_reason: depends_on_missing
          blockers: [{kind: depends_on_missing, detail: "..."}]
        Y fallá el nodo con exit no-cero (el pipeline lo va a leer).

      Paso 4 — Reportá HU id, task id, depends_on validados, files affected.
    allowed_tools: [Read, Write, Bash, Grep, Glob]

  - id: implementar
    depends_on: [cargar-tarea]
    skills:
      - frontend-implementer-archon
    prompt: |
      Modo: AUTOMATIZADO (sin gates humanos).

      Tarea a implementar: $ARTIFACTS_DIR/task.md
      Manifest completo: $ARTIFACTS_DIR/plan-manifest.yaml
      Refinamiento (fallback context): $ARTIFACTS_DIR/hu-refinada.md (si existe)
      Project context (LEER PRIMERO): $ARTIFACTS_DIR/project-context.md

      Aplicá tu protocolo completo (skill frontend-implementer-archon):
        - Step 1: Load context (sibling files, depends_on landed, deps).
        - Step 2: Plan implementation order.
        - Step 3: Implement (write code, match repo style, FSD rules WHILE writing).
        - Step 4: Verify (run all §10 commands; if a §10 command fails, retry
                  internally up to 3 times before declaring failed; if a
                  regression appears, declare blocked: regression).
        - Step 5: Report — write $ARTIFACTS_DIR/task-result.yaml.

      Reglas hard (idénticas al modo interactivo):
        - Mantenete dentro del §3 (Files affected) de task.md.
        - NO hagas commit / push / branch / rebase / tag. Archon maneja git.
        - Reportá status: passed | passed_with_warnings | failed | blocked.
        - Si la tarea requiere cambiar task.md, marcá blocked:
          requires_planner_update.
        - Las FSD rules son hard — una violación es bug, fixeala antes de
          reportar passed.
        - Comandos de verificación con `cd frontend_dashboard && npm test...`

      NO hay $LOOP_USER_INPUT en este modo — corré UNA pasada y reportá.
      El pipeline orquestador es el que decide si re-lanza este workflow
      con feedback diferente o si para el batch entero.

      Al terminar, asegurate de que $ARTIFACTS_DIR/task-result.yaml existe
      con un status válido. Si no podés determinar el status, escribilo como
      failed con un blocker explicando por qué.
    allowed_tools: [Read, Write, Edit, Bash, Grep, Glob]

  - id: persistir-resultado
    depends_on: [implementar]
    prompt: |
      Modo: AUTOMATIZADO — persistí el resultado sin comentarios para el operador.

      Paso 1 — Validá que $ARTIFACTS_DIR/task-result.yaml exista. Si no
        existe (el skill no lo escribió, error catastrófico), creá uno con:
          status: failed
          blocked_reason: other
          blockers: [{kind: missing_result, detail: "skill terminó sin escribir task-result.yaml"}]

      Paso 2 — Leé hu_id, task_id, status del result.yaml.

      Paso 3 — Persistí el snapshot en el repo:
        mkdir -p frontend_dashboard/.frontend/results/<hu_id>
        cp $ARTIFACTS_DIR/task-result.yaml \
           frontend_dashboard/.frontend/results/<hu_id>/<task_id>-result.yaml

      Paso 4 — Imprimí UNA línea de resumen estructurada (parsable por el pipeline):
        AUTO_RESULT hu_id=<hu_id> task_id=<task_id> status=<status>

      NO hagas commit, NO sugieras pasos al operador, NO imprimas
      banner-art. El pipeline orquestador es el único consumidor.
    allowed_tools: [Read, Write, Bash]
