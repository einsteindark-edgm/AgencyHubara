name: review-pr-frontend
description: |
  Code review especializado para PRs de FRONTEND (FSD: Vite + React 19 +
  TanStack Query + Zod + Tailwind v4). Inspirado en archon-smart-pr-review
  pero con 5 agentes específicos del stack: FSD compliance, Zod boundary,
  React/TanStack Query best practices, test coverage, security.

  **Use when**:
    - Lanzado automáticamente por hu-frontend-pipeline después de crear el PR
    - Lanzado manualmente: `archon workflow run review-pr-frontend "<PR_URL>"`

  **Flujo**:
    1. fetch PR + diff → escribe $ARTIFACTS_DIR/pr.json, diff.patch, changed-files.txt
    2. classifier (haiku) lee esos archivos y decide qué agentes correr
    3. agentes especializados corren en paralelo (sonnet) — solo los relevantes
    4. synthesize (sonnet) consolida findings en un comment de PR
    5. auto-fix CRITICAL/HIGH (sonnet) modifica código + commit + push
    6. post-comment al PR con findings + summary del auto-fix

  **Costo aprox**: $0.04-0.10 por PR según tamaño (classifier decide).

provider: claude
model: sonnet
interactive: false

worktree:
  enabled: true

nodes:
  # ════════════════════════════════════════════════════════════════════
  # FASE 1 — Setup: fetch PR + checkout branch + diff
  # ════════════════════════════════════════════════════════════════════

  - id: fetch-pr
    bash: |
      set -e
      RAW="$ARGUMENTS"

      PR_NUM=$(echo "$RAW" | grep -oE '[0-9]+' | head -1)
      if [ -z "$PR_NUM" ]; then
        echo "FAIL_NO_PR_NUMBER" >&2
        exit 1
      fi

      gh pr view "$PR_NUM" --json number,title,body,headRefName,baseRefName,state,additions,deletions,changedFiles,files,url \
        > $ARTIFACTS_DIR/pr.json

      STATE=$(jq -r '.state' $ARTIFACTS_DIR/pr.json)
      if [ "$STATE" != "OPEN" ]; then
        echo "FAIL_PR_NOT_OPEN_$STATE"
        exit 0
      fi

      # Emitir resumen corto para el log y como guía rápida a downstream
      TITLE=$(jq -r '.title' $ARTIFACTS_DIR/pr.json)
      BRANCH=$(jq -r '.headRefName' $ARTIFACTS_DIR/pr.json)
      ADDS=$(jq -r '.additions' $ARTIFACTS_DIR/pr.json)
      DELS=$(jq -r '.deletions' $ARTIFACTS_DIR/pr.json)
      CHANGED=$(jq -r '.changedFiles' $ARTIFACTS_DIR/pr.json)

      jq -r '.headRefName' $ARTIFACTS_DIR/pr.json > $ARTIFACTS_DIR/.branch
      jq -r '.url' $ARTIFACTS_DIR/pr.json > $ARTIFACTS_DIR/.pr-url

      echo "PR_NUM=$PR_NUM BRANCH=$BRANCH TITLE='$TITLE' CHANGED=$CHANGED +$ADDS/-$DELS"
    timeout: 30000

  - id: checkout-branch
    bash: |
      set -e
      BRANCH=$(cat $ARTIFACTS_DIR/.branch)
      git fetch origin --prune
      git checkout -B "$BRANCH" "origin/$BRANCH"
      echo "checked out $BRANCH"
    depends_on: [fetch-pr]
    timeout: 30000

  - id: fetch-diff
    bash: |
      set -e
      PR_NUM=$(jq -r '.number' $ARTIFACTS_DIR/pr.json)
      gh pr diff "$PR_NUM" > $ARTIFACTS_DIR/diff.patch
      # Solo paths del frontend (descartar otros files si los hubiera)
      jq -r '.files[].path' $ARTIFACTS_DIR/pr.json | grep '^frontend_dashboard/' > $ARTIFACTS_DIR/changed-files.txt || true
      LINES=$(wc -l < $ARTIFACTS_DIR/diff.patch)
      FILES=$(wc -l < $ARTIFACTS_DIR/changed-files.txt | tr -d ' ')
      echo "diff_lines=$LINES files=$FILES"
    depends_on: [fetch-pr]
    timeout: 30000

  # ════════════════════════════════════════════════════════════════════
  # FASE 2 — Classifier (haiku, lee archivos via Read tool)
  # ════════════════════════════════════════════════════════════════════

  - id: classify
    depends_on: [fetch-diff]
    model: haiku
    allowed_tools: [Read, Bash]
    output_format:
      type: object
      properties:
        run_fsd_compliance:    {type: string, enum: ["true", "false"]}
        run_type_zod_boundary: {type: string, enum: ["true", "false"]}
        run_react_practices:   {type: string, enum: ["true", "false"]}
        run_test_coverage:     {type: string, enum: ["true", "false"]}
        run_test_quality:      {type: string, enum: ["true", "false"]}
        run_security:          {type: string, enum: ["true", "false"]}
        complexity:            {type: string, enum: ["trivial", "small", "medium", "large"]}
        reasoning:             {type: string}
      required: [run_fsd_compliance, run_type_zod_boundary, run_react_practices, run_test_coverage, run_test_quality, run_security, complexity, reasoning]
    prompt: |
      Sos un classifier de PRs frontend. Tu tarea: leer el contexto del PR y
      decidir qué agentes de review correr.

      ## Paso 1 — Leer contexto
      Usá la Read tool para abrir:
        - $ARTIFACTS_DIR/pr.json (metadata: title, body, additions, deletions, changedFiles)
        - $ARTIFACTS_DIR/changed-files.txt (paths tocados)
        - $ARTIFACTS_DIR/diff.patch (diff completo; con 500-1000 líneas alcanza)

      Stats del fetch-pr (resumen rápido): $fetch-pr.output
      Stats del fetch-diff (resumen rápido): $fetch-diff.output

      ## Paso 2 — Reglas para cada agente

      - **fsd_compliance**: SIEMPRE corre si hay cualquier archivo .ts/.tsx tocado en
        frontend_dashboard/src/. Verifica las 4 import rules FSD (downward only) y los
        14 anti-patterns (no rogue fetch, no cross-feature imports, no deep imports,
        Zod boundary, Tailwind token naming, etc.)

      - **type_zod_boundary**: Corre si el diff toca entities/*/api.ts, entities/*/contracts.ts,
        o cualquier archivo que use apiClient. Verifica que cada fetch tenga schema.parse(),
        que no haya `any` en respuestas API, que los tipos de model.ts y contracts.ts estén alineados.

      - **react_practices**: Corre si el diff toca features/*/ui/*.tsx, features/*/model/*.ts,
        o pages/. Verifica useState vs useQuery, dependencies de useEffect, key props,
        rules of hooks, no fetch en componentes/páginas.

      - **test_coverage**: Corre si el diff agrega/modifica código en entities o features.
        Verifica que cada feature/entity nuevo tenga al menos 1 test. SKIP si el diff es
        solo CSS/markdown/config.

      - **test_quality**: Corre SIEMPRE que el diff agregue o modifique
        archivos bajo `frontend_dashboard/e2e/` o `*.test.ts(x)`. Es el agente que
        audita la calidad de los tests escritos por el implementer — detecta
        aserciones triviales (`expect(true).toBe(true)`, asserts vacíos),
        tests sin verificaciones reales, specs Playwright sin navegación o sin
        `expect(...).toBeVisible()` después de una acción del usuario. Critical
        para evitar "tests-tontos-que-pasan".

      - **security**: Corre si el diff toca: dangerouslySetInnerHTML, env vars,
        endpoints nuevos, manejo de tokens/secrets, formularios sin validación. SKIP si
        el diff es puramente cosmético.

      ## Paso 3 — Clasificá la complejidad

      - **trivial**: <50 LOC, 1-3 files, cambios cosméticos (typos, formatting)
      - **small**: 50-200 LOC, 3-6 files, lógica simple
      - **medium**: 200-500 LOC, 6-12 files, features nuevos
      - **large**: >500 LOC, 12+ files, refactor cross-cutting

      Respondé con tu razonamiento + flags en el JSON estructurado.

  # ════════════════════════════════════════════════════════════════════
  # FASE 3 — Agentes de review en paralelo
  # ════════════════════════════════════════════════════════════════════

  - id: fsd-compliance
    when: "$classify.output.run_fsd_compliance == 'true'"
    depends_on: [classify, checkout-branch]
    context: fresh
    skills:
      - frontend-feature-sliced
    allowed_tools: [Read, Bash, Grep, Glob, Write]
    idle_timeout: 600000
    prompt: |
      Sos un reviewer especializado en Feature-Sliced Design (FSD). El skill
      `frontend-feature-sliced` cargado en tu contexto define las 4 import rules
      + 14 anti-patterns que validás.

      ## Paso 1 — Cargar contexto
      Leé con Read:
        - $ARTIFACTS_DIR/pr.json (title, body)
        - $ARTIFACTS_DIR/changed-files.txt (paths tocados)
        - $ARTIFACTS_DIR/diff.patch (diff completo)

      ## Paso 2 — Encontrar violaciones FSD

      Greps útiles (correr con Bash):
        grep -rEn "fetch\(" frontend_dashboard/src/features frontend_dashboard/src/pages frontend_dashboard/src/app
        grep -rEn "from ['\"]@/features/[^'\"]+/(ui|model)/" frontend_dashboard/src/features
        grep -rEn "from ['\"]@/features/" frontend_dashboard/src/features | grep -vE "^frontend_dashboard/src/features/([a-z-]+)/[^:]+:.*from ['\"]@/features/\1"
        grep -rEn "useState.*useEffect.*fetch" frontend_dashboard/src/features frontend_dashboard/src/pages

      Para cada hallazgo:
        - Severity: CRITICAL / HIGH / MEDIUM / LOW
        - File:line: dónde está el problema
        - Rule violated: cuál de las 4 import rules o 14 anti-patterns
        - Why it matters: 1-2 líneas
        - Fix suggestion: código exacto que arreglaría el problema

      ## Paso 3 — Escribir findings

      Escribí a $ARTIFACTS_DIR/findings-fsd.md con este formato:

      # FSD Compliance Findings

      ## Summary
      Verdict: APPROVE | REQUEST_CHANGES | NEEDS_DISCUSSION
      Findings: N (X CRITICAL, Y HIGH, Z MEDIUM, W LOW)

      ## Findings

      ### CRITICAL: <title>
      - File: path:line
      - Rule: rule name
      - Issue: ...
      - Fix:
        ```ts
        // ...
        ```

      (Repetir por finding)

      Si no encontrás violaciones, escribí el archivo con verdict APPROVE y "No findings".

  - id: type-zod-boundary
    when: "$classify.output.run_type_zod_boundary == 'true'"
    depends_on: [classify, checkout-branch]
    context: fresh
    allowed_tools: [Read, Bash, Grep, Glob, Write]
    idle_timeout: 600000
    prompt: |
      Sos un reviewer especializado en TypeScript + Zod boundary safety.

      ## Mandato
      En este stack, CADA `apiClient.get<unknown>(...)` o `apiClient.post<unknown>(...)`
      DEBE estar seguido de `schema.parse(raw)`. El compile-time `<unknown>` es
      placeholder; Zod es enforcement runtime. Sin Zod, un cambio de backend
      pasa por TS y rompe en runtime.

      ## Paso 1 — Cargar contexto
      Leé con Read:
        - $ARTIFACTS_DIR/pr.json
        - $ARTIFACTS_DIR/changed-files.txt
        - $ARTIFACTS_DIR/diff.patch

      ## Paso 2 — Reglas que validás
      1. Cada `apiClient.get/post/put/delete<unknown>` tiene `<schema>.parse()` o `.safeParse()` después.
      2. Ningún `apiClient.get<SomeType>(...)` (compile-time type, sin Zod) — anti-pattern.
      3. Los tipos en `entities/<x>/model.ts` están alineados con los schemas en `contracts.ts`.
      4. Ningún `any` en respuestas de API.
      5. `useQuery` declara `queryKey` desde `<x>Keys` factory, no hardcoded.

      Greps útiles:
        grep -rEn "apiClient\.(get|post|put|delete)<" frontend_dashboard/src/entities
        grep -rEn "\.parse\(|safeParse\(" frontend_dashboard/src/entities
        grep -rEn ": *any\b|as any\b" frontend_dashboard/src/entities

      ## Paso 3 — Escribir findings
      Escribí a $ARTIFACTS_DIR/findings-zod.md con el mismo formato que findings-fsd.md.

  - id: react-practices
    when: "$classify.output.run_react_practices == 'true'"
    depends_on: [classify, checkout-branch]
    context: fresh
    allowed_tools: [Read, Bash, Grep, Glob, Write]
    idle_timeout: 600000
    prompt: |
      Sos un reviewer especializado en React 19 + TanStack Query.

      ## Paso 1 — Cargar contexto
      Leé con Read:
        - $ARTIFACTS_DIR/pr.json
        - $ARTIFACTS_DIR/changed-files.txt
        - $ARTIFACTS_DIR/diff.patch

      ## Paso 2 — Reglas que validás
      1. `useState` NO se usa para server data (eso es TanStack Query).
      2. `useEffect` con deps incompletas (no incluye toda variable usada en el body).
      3. `key` prop en mapeos `.map(...)`: presente y estable (no índice salvo lista inmutable).
      4. Rules of hooks: no hooks dentro de condicionales, loops, o nested functions.
      5. No `fetch(...)` en componentes ni páginas — todo HTTP va por entities/*/api.ts.
      6. No `useState + useEffect + fetch` patrón (anti-pattern manual data fetching).
      7. `useMemo` y `useCallback` solo si hay dependencia downstream que se beneficia.
      8. No mutación de objetos/arrays en state (siempre `setState(prev => ...)`).

      ## Paso 3 — Escribir findings
      Escribí a $ARTIFACTS_DIR/findings-react.md con el mismo formato.

  - id: test-coverage
    when: "$classify.output.run_test_coverage == 'true'"
    depends_on: [classify, checkout-branch]
    context: fresh
    allowed_tools: [Read, Bash, Grep, Glob, Write]
    idle_timeout: 600000
    prompt: |
      Sos un reviewer de cobertura de tests para el frontend.

      ## Paso 1 — Cargar contexto
      Leé con Read:
        - $ARTIFACTS_DIR/pr.json
        - $ARTIFACTS_DIR/changed-files.txt
        - $ARTIFACTS_DIR/diff.patch

      ## Paso 2 — Reglas
      1. Cada `entities/<x>/api.ts` nuevo o modificado debería tener `api.test.tsx`
         con: enabled/disabled state, success+Zod parsing, error.
      2. Cada `entities/<x>/filters.ts` nuevo debería tener `filters.test.ts` con
         tabla true/false.
      3. Cada `features/<x>/model/use<Y>.ts` con lógica derivada (filters, transforms)
         debería tener `useY.test.ts` con `renderHook` + `act`.
      4. Cada `features/<x>/ui/<X>.tsx` con conditional rendering complejo o
         interacciones debería tener `<X>.test.tsx` con RTL.
      5. Tests usan `QueryClientProvider` con `retry: false` para evitar leaks.
      6. Mocks de fetch via `vi.stubGlobal("fetch", fetchMock)` + cleanup en afterEach.

      Para cada archivo nuevo en changed-files.txt sin test acompañante: REPORTAR.

      ## Paso 3 — Escribir findings
      Escribí a $ARTIFACTS_DIR/findings-tests.md con el mismo formato.

  - id: security
    when: "$classify.output.run_security == 'true'"
    depends_on: [classify, checkout-branch]
    context: fresh
    allowed_tools: [Read, Bash, Grep, Glob, Write]
    idle_timeout: 600000
    prompt: |
      Sos un reviewer de seguridad frontend.

      ## Paso 1 — Cargar contexto
      Leé con Read:
        - $ARTIFACTS_DIR/pr.json
        - $ARTIFACTS_DIR/changed-files.txt
        - $ARTIFACTS_DIR/diff.patch

      ## Paso 2 — Reglas que validás
      1. No `dangerouslySetInnerHTML` sin sanitización (DOMPurify, etc.).
      2. No hardcoded API keys, tokens, passwords en el código fuente.
      3. Env vars sensibles NUNCA en código frontend (`VITE_*` es público al cliente).
      4. Inputs de usuario sanitizados antes de render o pasados a `dangerously*`.
      5. No `eval(...)` ni `new Function(...)` con input del usuario.
      6. Links externos con `rel="noopener noreferrer"` si `target="_blank"`.
      7. URLs construidas con `URLSearchParams` en vez de string concat (evita inyección).
      8. `localStorage`/`sessionStorage` no guarda tokens sensibles (XSS los expone).

      ## Paso 3 — Escribir findings
      Escribí a $ARTIFACTS_DIR/findings-security.md.

  - id: test-quality
    when: "$classify.output.run_test_quality == 'true'"
    depends_on: [classify, checkout-branch]
    context: fresh
    allowed_tools: [Read, Bash, Grep, Glob, Write]
    idle_timeout: 600000
    prompt: |
      Sos un reviewer especializado en CALIDAD de los tests (Vitest unit tests
      y Playwright E2E specs) escritos por el implementer. Tu mandato es
      detectar "tests tontos" que pasan trivialmente pero no prueban el feature.

      ## Mandato
      El pipeline le pide al implementer que escriba al menos 1 spec por task
      bajo `frontend_dashboard/e2e/<feature>/` (Playwright) + tests unit
      `*.test.tsx` adyacentes al código. Sin un revisor humano que mire los
      tests, es trivial escribir aserciones que pasan siempre y dar la
      ilusión de cobertura. Tu trabajo es atrapar esos patrones ANTES de que
      lleguen a main.

      ## Paso 1 — Cargar contexto
      Leé con Read:
        - $ARTIFACTS_DIR/pr.json
        - $ARTIFACTS_DIR/changed-files.txt
        - $ARTIFACTS_DIR/diff.patch

      Y los archivos nuevos / modificados bajo `frontend_dashboard/e2e/` o
      `*.test.ts(x)` (extraídos del diff). Leelos COMPLETOS.

      ## Paso 2 — Anti-patterns que detectás (cada uno es CRITICAL o HIGH)

      ### CRITICAL: aserción tautológica
      Patrones:
        - `expect(true).toBe(true)`, `expect(1).toBe(1)`, `expect(true).toBeTruthy()`
        - `expect(<x>).toEqual(<x>)` (comparada consigo misma)
        - `expect(<literal>).toBe(<mismo literal>)`
      Estos tests siempre pasan. No prueban nada.

      ### CRITICAL: Playwright spec sin interacción ni assert
      Patrón: `await page.goto("/")` SIN ningún `await expect(...)` después.
      Solo visitar una URL no prueba que el feature funciona.

      ### CRITICAL: test sin asserts
      Un test que llama código pero no tiene `expect(...)`, `assert(...)`,
      `vi.assert*`, ni `.toHaveBeenCalledWith(...)`. Solo "ejecutar sin error"
      no es prueba.

      ### HIGH: Playwright que muta state sin verificar el resultado
      Patrón: `await page.click("button")` SIN `await expect(...).toBeVisible()`
      después que verifique que el click produjo el resultado esperado.

      ### HIGH: feature bajo test completamente mockeado
      Si el test mockea el módulo que se supone que está siendo probado
      (ej. en `useUploadWizard.test.ts`, mockear `useUploadWizard` y asertar
      sobre el mock), el test verifica que el mock funciona, no que el feature
      funciona. Mockear DEPENDENCIAS está bien; mockear el feature bajo test no.

      ### HIGH: assert sobre el mock, no sobre el output observable
      Patrón: `expect(mockFn).toHaveBeenCalled()` SIN aserción adicional sobre
      el DOM, sobre el state visible, o sobre el resultado retornado.

      ### MEDIUM: spec Playwright que usa solo `page.locator(...)` sin Role/Text
      Selectores frágiles como `.locator(".btn-primary").first()` son
      vulnerables a refactors CSS. Preferir `page.getByRole("button", { name: ... })`
      o `page.getByText(...)`. NO es bloqueador pero degrada mantenibilidad.

      ### MEDIUM: ausencia de `process.env.API_URL` en specs que tocan backend
      Si el spec hace `request.get("http://localhost:8000/...")` hardcoded,
      no respeta el puerto random del pipeline → falla en concurrencia.
      Debe usar `process.env.API_URL ?? "http://localhost:8000"`.

      ### LOW: nombres genéricos que sugieren falta de foco
      `test("works")`, `test("renders")`, `test("smoke test")` — si los tests
      tienen estos nombres, probablemente no estén asertando el comportamiento
      del feature en particular.

      ## Paso 3 — Greps útiles

      grep -nE "expect\(true\)\.toBe\(true\)|expect\(1\)\.toBe\(1\)" frontend_dashboard/e2e/ frontend_dashboard/src/
      grep -rnE "await page\.goto\(" frontend_dashboard/e2e/ | head -20
      # Para cada spec, leelo y verificá que después del goto haya al menos un `expect(...)`.
      grep -nE "http://localhost:8000" frontend_dashboard/e2e/

      Para "tests sin asserts" leé el archivo de manera estructurada: cada
      `test(..., async () => {...})` debe tener al menos un `expect(`.

      ## Paso 4 — Escribir findings

      Escribí a $ARTIFACTS_DIR/findings-test-quality.md con el mismo formato
      que findings-fsd.md, agrupando por archivo.

      Verdict guidance:
        - 1+ CRITICAL → REQUEST_CHANGES
        - HIGH only → REQUEST_CHANGES con discreción del operador
        - MEDIUM only → NEEDS_DISCUSSION
        - LOW only → APPROVE con sugerencias

      Si no encontrás violaciones, escribí APPROVE pero NO seas indulgente —
      los tests tontos son comunes y costosos en main.

  # ════════════════════════════════════════════════════════════════════
  # FASE 4 — Synthesize
  # ════════════════════════════════════════════════════════════════════

  - id: synthesize
    depends_on: [fsd-compliance, type-zod-boundary, react-practices, test-coverage, test-quality, security]
    trigger_rule: none_failed_min_one_success
    context: fresh
    allowed_tools: [Read, Write, Bash, Grep, Glob]
    idle_timeout: 600000
    prompt: |
      Sos el synthesizer. Consolidá los findings de los 5 agentes en un único reporte.

      ## Paso 1 — Cargar findings
      Leé con Read los archivos que existan (algunos pueden faltar si el classifier los skipeó):
        - $ARTIFACTS_DIR/findings-fsd.md
        - $ARTIFACTS_DIR/findings-zod.md
        - $ARTIFACTS_DIR/findings-react.md
        - $ARTIFACTS_DIR/findings-tests.md
        - $ARTIFACTS_DIR/findings-test-quality.md
        - $ARTIFACTS_DIR/findings-security.md

      Si un archivo no existe, saltalo (el agente no corrió por el classifier).

      ## Paso 2 — Escribir summary

      Escribí a $ARTIFACTS_DIR/review-summary.md:

      # 🤖 Code review automático del PR

      ## Verdict
      <APPROVE | REQUEST_CHANGES | NEEDS_DISCUSSION>

      ## Stats
      - CRITICAL: N
      - HIGH: M
      - MEDIUM: K
      - LOW: J

      ## Top findings (ordenados por severity)

      ### CRITICAL — <title>
      - File: path:line
      - Agent: <fsd-compliance | type-zod-boundary | react-practices | test-coverage | security>
      - Issue: ...
      - Fix:
        ```ts
        // ...
        ```

      ### HIGH — <title>
      ...

      ## Findings por agente
      <agrupar findings que NO son CRITICAL/HIGH, una sección por agente>

      ---
      *🤖 Generado por `review-pr-frontend`. Auto-fix se ejecutará sobre CRITICAL/HIGH si los hay.*

      ## Paso 3 — Escribir flag para downstream

      Escribí a $ARTIFACTS_DIR/needs-fix.flag con SOLO una de estas palabras:
        - `yes` si hay al menos 1 CRITICAL o HIGH
        - `no` si todos son MEDIUM/LOW o no hay findings

  # ════════════════════════════════════════════════════════════════════
  # FASE 5 — Auto-fix CRITICAL/HIGH
  # ════════════════════════════════════════════════════════════════════

  - id: check-needs-fix
    bash: |
      if [ -f "$ARTIFACTS_DIR/needs-fix.flag" ]; then
        # Strip whitespace
        cat $ARTIFACTS_DIR/needs-fix.flag | tr -d '[:space:]'
        echo ""   # newline after
      else
        echo "no"
      fi
    depends_on: [synthesize]
    trigger_rule: all_done

  - id: auto-fix
    when: "$check-needs-fix.output == 'yes'"
    depends_on: [check-needs-fix]
    context: fresh
    allowed_tools: [Read, Write, Edit, Bash, Grep, Glob]
    idle_timeout: 1800000
    prompt: |
      Sos el auto-fixer. Tenés permitido modificar código pero SOLO para arreglar
      los findings CRITICAL/HIGH listados en $ARTIFACTS_DIR/review-summary.md.

      ## Reglas estrictas

      1. SOLO arreglá CRITICAL/HIGH. NUNCA toques MEDIUM/LOW (eso queda para revisión humana).
      2. SOLO modificá archivos que el PR original ya tocó. Lista en $ARTIFACTS_DIR/changed-files.txt.
         NUNCA editen archivos fuera de esa lista.
      3. Después de cada fix, corré los tests afectados:
           cd frontend_dashboard && npm test -- <path-relevante>
         Si los tests fallan, REVERTÍ tu cambio (git checkout <file>) y dejá ese finding sin fixear.
      4. NO escalates las fixes — si arreglar un finding requiere tocar 5 archivos extra,
         documentá el problema y dejá ese finding para humano.
      5. Máximo 1 intento por finding.

      ## Workflow

      1. Leé $ARTIFACTS_DIR/review-summary.md (lista de findings con severity).
      2. Leé $ARTIFACTS_DIR/changed-files.txt (whitelist de archivos editables).
      3. Para cada finding CRITICAL/HIGH:
         a. Verificá que el archivo del finding está en la whitelist.
         b. Aplicá el Fix sugerido con la Edit tool.
         c. Corré test relevante con Bash. Si pasa, continuá. Si falla, revertí con
            `git checkout HEAD -- <file>`.
      4. Validación global:
           cd frontend_dashboard && npm test
           cd frontend_dashboard && npx tsc -b
           cd frontend_dashboard && npm run build
         Si alguno falla → REVERTÍ TODOS los cambios:
           git checkout HEAD -- frontend_dashboard/src
         Y escribí $ARTIFACTS_DIR/auto-fix-failed.flag con razón.
      5. Escribí $ARTIFACTS_DIR/auto-fix-report.md con:
         - Fixes aplicados (file + finding + status validation)
         - Fixes saltados (finding + razón: "test failed", "scope too broad", etc.)

      NO hagas commit ni push. El siguiente nodo lo hace.

  - id: commit-fixes
    bash: |
      set -e
      set -o pipefail
      BRANCH=$(cat $ARTIFACTS_DIR/.branch)

      # Si auto-fix abortó por validación global, no commitear nada
      if [ -f "$ARTIFACTS_DIR/auto-fix-failed.flag" ]; then
        echo "auto_fix_aborted_no_commit"
        exit 0
      fi

      # Selectivo: solo src
      git add frontend_dashboard/src 2>/dev/null || true
      git reset HEAD frontend_dashboard/node_modules 2>/dev/null || true
      git reset HEAD frontend_dashboard/dist 2>/dev/null || true
      git reset HEAD frontend_dashboard/.vite 2>/dev/null || true
      git reset HEAD frontend_dashboard/package-lock.json 2>/dev/null || true

      if git diff --staged --quiet; then
        echo "no_fixes_applied"
        exit 0
      fi

      # Doble validación pre-commit (defensivo, ya validó el auto-fix)
      cd frontend_dashboard
      if ! npm test 2>&1 | tail -20 >&2; then
        cd ..
        echo "ERROR: tests rompieron tras auto-fix. Revirtiendo." >&2
        git checkout HEAD -- frontend_dashboard/src
        echo "auto_fix_reverted"
        exit 0
      fi
      cd ..

      git commit -m "review-bot: auto-fix CRITICAL/HIGH findings"

      # Push con retry si origin avanzó
      if ! git push origin "$BRANCH" 2>&1 | tail -5; then
        echo "push falló, intentando pull --rebase + retry" >&2
        git pull --rebase origin "$BRANCH" 2>&1 | tail -5 || true
        git push origin "$BRANCH" 2>&1 | tail -5 || {
          echo "push falló dos veces — commit local, no en origin" >&2
        }
      fi
      echo "auto_fix_pushed"
    when: "$check-needs-fix.output == 'yes'"
    depends_on: [auto-fix]
    timeout: 600000

  # ════════════════════════════════════════════════════════════════════
  # FASE 6 — Post comment al PR
  # ════════════════════════════════════════════════════════════════════

  - id: post-comment
    bash: |
      set -e
      PR_NUM=$(jq -r '.number' $ARTIFACTS_DIR/pr.json)

      cp $ARTIFACTS_DIR/review-summary.md $ARTIFACTS_DIR/pr-comment.md
      if [ -f $ARTIFACTS_DIR/auto-fix-report.md ]; then
        printf "\n\n---\n\n## 🔧 Auto-fix report\n\n" >> $ARTIFACTS_DIR/pr-comment.md
        cat $ARTIFACTS_DIR/auto-fix-report.md >> $ARTIFACTS_DIR/pr-comment.md
      fi

      gh pr comment "$PR_NUM" --body-file $ARTIFACTS_DIR/pr-comment.md
      echo "commented"
    depends_on: [synthesize, commit-fixes]
    trigger_rule: all_done
    retry:
      max_attempts: 2
      delay_ms: 5000
      on_error: transient
