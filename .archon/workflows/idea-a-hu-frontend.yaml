name: idea-a-hu-frontend
description: |
  Entry-point del flujo frontend: toma una idea de negocio en texto libre o
  un .md corto y la refina INTERACTIVAMENTE en una HU (historia de usuario)
  bien formada con título, narrativa Como/Quiero/Para, acceptance criteria
  en formato Given/When/Then, y out of scope explícito.

  Flujo simplificado (UNA sola approval explícita):
    1. AI refina tu idea en una HU completa (una pasada, sin iteración)
    2. Auto-publica el issue + card en Project (sin gate)
    3. ÚNICA approval: ¿lanzar `hu-frontend-pipeline` ahora? (~$0.50, 15-30 min)
       - Sí → arranca en background, pipeline actualiza el card en cada fase
       - No → terminás con el issue listo, lanzás pipeline a mano cuando quieras

  Si el draft AI te queda mal, podés:
    - Rechazar el approval del pipeline
    - Editar el issue manualmente en GitHub antes de lanzar
    - Borrar el issue y re-correr idea-a-hu-frontend con una idea más detallada

  **Use when**:
    - Tenés una idea de feature pero no la armaste como HU formal.
    - Querés que el card en el Project board arranque desde "Idea refined"
      y vaya pasando por Refining → Refined → Planning → ... → Done.

  **Input** ($USER_MESSAGE):
    - Texto libre: "quiero filtrar sesiones por tag para encontrar conversas rápido"
    - Ruta a un .md con notas más extensas

  **Pre-requisitos**:
    - `gh` autenticado con permisos de issue create.
    - (Opcional) `frontend_dashboard/.frontend/github-project-config.yaml` para Project sync.

  **Output**:
    - Issue creado en GitHub (URL impresa)
    - Card en el Project (status: "Idea refined") si Project está configurado
    - Draft local persistido en `frontend_dashboard/.frontend/drafts/` (para auditoría)
    - Si aprobaste el gate: `hu-frontend-pipeline` corriendo en background

provider: claude
model: sonnet
interactive: true  # tiene loop interactivo + 2 approval gates

worktree:
  enabled: false   # solo lee/escribe drafts, no muta código; sin worktree extra

nodes:
  # ════════════════════════════════════════════════════════════════════
  # FASE 0 — Pre-requisitos básicos
  # ════════════════════════════════════════════════════════════════════

  - id: check-prereqs
    bash: |
      set -e
      gh auth status >&2 2>&1 || { echo "FAIL_GH_AUTH"; exit 0; }
      command -v jq  >/dev/null || { echo "FAIL_NO_JQ"; exit 0; }
      echo "OK"
    timeout: 30000

  - id: cancel-bad-prereqs
    cancel: "Pre-requisitos faltantes: $check-prereqs.output. (gh auth login / brew install jq)"
    when: "$check-prereqs.output != 'OK'"
    depends_on: [check-prereqs]

  # ════════════════════════════════════════════════════════════════════
  # FASE 1 — Normalizar input (idea cruda → idea-original.md)
  # ════════════════════════════════════════════════════════════════════

  - id: normalize-input
    bash: |
      RAW="$ARGUMENTS"

      # Guard: input vacío o whitespace-only → output FAIL para que cancel-bad-input dispare
      TRIMMED=$(echo "$RAW" | tr -d '[:space:]')
      if [ -z "$TRIMMED" ]; then
        echo "FAIL_EMPTY_INPUT"
        exit 0
      fi

      if [ -f "$RAW" ]; then
        cp "$RAW" $ARTIFACTS_DIR/idea-original.md
      else
        echo "$RAW" > $ARTIFACTS_DIR/idea-original.md
      fi
      SIZE=$(wc -c < $ARTIFACTS_DIR/idea-original.md)
      if [ "$SIZE" -lt 20 ]; then
        echo "FAIL_TOO_SHORT_${SIZE}"
        exit 0
      fi
      echo "OK"
    depends_on: [check-prereqs]
    when: "$check-prereqs.output == 'OK'"
    timeout: 30000

  - id: cancel-bad-input
    cancel: "Input inválido: $normalize-input.output. Pasame una idea no vacía (mínimo 20 chars): archon workflow run idea-a-hu-frontend 'mi idea de feature'"
    when: "$normalize-input.output != 'OK'"
    depends_on: [normalize-input]

  # ════════════════════════════════════════════════════════════════════
  # FASE 2 — Refinar la idea a HU (UNA pasada del AI, sin loop)
  # ════════════════════════════════════════════════════════════════════
  # Diseño: el AI genera la HU en una sola pasada y el workflow procede
  # auto a publicar. Si el draft te queda mal, podés:
  # (a) rechazar el approval de "lanzar pipeline" (gate-lanzar-pipeline)
  # (b) editar el issue manualmente en GitHub antes de lanzar el pipeline
  # (c) borrar el issue y re-correr idea-a-hu-frontend con una idea más detallada
  # El único checkpoint humano es gate-lanzar-pipeline, mucho más adelante.

  - id: refinar-hu-producto
    depends_on: [normalize-input]
    when: "$normalize-input.output == 'OK'"
    idle_timeout: 600000  # 10 min para que el AI genere el draft
    allowed_tools: [Read, Write]
    prompt: |
      Sos un product owner experimentado del dashboard de AgencyHubara
      (frontend FSD: Vite + React 19 + TanStack Query + Zod + Tailwind v4).

      Tu input es una IDEA DE NEGOCIO. Tu output es UNA HU bien formada,
      en una sola pasada (sin iteración con el operador).

      ## Paso 1 — Cargar contexto

      Leé con Read tool:
        - $ARTIFACTS_DIR/idea-original.md (la idea original del operador)

      ## Paso 2 — Producir la HU

      Escribí $ARTIFACTS_DIR/hu-draft.md con esta estructura EXACTA (lo
      consume validate-hu y el resto del pipeline downstream):

        # <Título corto y accionable, ≤80 chars, sin punto final>

        Como **<rol del usuario del dashboard, ej. "operador del dashboard">**,
        quiero **<acción concreta>**,
        para **<beneficio claro de negocio>**.

        ## Acceptance criteria

        - **Given** <contexto inicial>, **when** <acción del usuario>, **then** <resultado observable y testable>.
        - **Given** ..., **when** ..., **then** ...
        - (3 a 5 bullets en total, cada uno verificable)

        ## Out of scope

        - <qué NO hace este feature, lista explícita>
        - <más cosas que el operador podría asumir pero no entran>

        ## Notas técnicas (opcional)

        - <preferencias inferidas de la idea, p.ej. "reusar el componente Pill ya existente">
        - <constraints conocidos>

      ## Paso 3 — Reglas de calidad (verificá antes de salir)

      Asegurate de que el draft cumple:
        - Título accionable (verbo + objeto), no descriptivo
        - Narrativa Como/Quiero/Para con los 3 elementos
        - Cada AC empieza con "Given" y tiene When + Then
        - Out of scope lista al menos 2 cosas que el feature NO hace
        - Documento > 200 bytes
        - Inferí lo que falte de la idea original — NO le preguntes al humano,
          NO uses placeholders tipo "<TBD>" o "<a definir>"

      Si la idea es ambigua, hacé tu mejor inferencia razonable. El humano
      revisará el draft completo recién cuando el pipeline le ponga el issue
      en GitHub — y ahí puede rechazar el approval de "lanzar pipeline" o
      editar el issue directamente.

      Terminás cuando hayas escrito el archivo (no necesitás emitir promise).

  # ════════════════════════════════════════════════════════════════════
  # FASE 3 — Validar estructura del HU draft
  # ════════════════════════════════════════════════════════════════════

  - id: validate-hu
    bash: |
      F=$ARTIFACTS_DIR/hu-draft.md
      test -f "$F" || { echo "FAIL_NOT_EXISTS"; exit 0; }
      [ $(wc -c < "$F") -gt 200 ] || { echo "FAIL_TOO_SHORT"; exit 0; }
      grep -qE '^#\s+\S' "$F" || { echo "FAIL_NO_TITLE"; exit 0; }
      grep -qiE 'como\s+' "$F" || { echo "FAIL_NO_NARRATIVE"; exit 0; }
      # AC: bullets Given/When/Then
      ac_count=$(grep -cE '^[[:space:]-]*\*?\*?Given' "$F" 2>/dev/null)
      ac_count=${ac_count:-0}
      [ $ac_count -ge 2 ] || { echo "FAIL_FEW_AC_$ac_count"; exit 0; }
      grep -qiE '^##.*scope' "$F" || { echo "FAIL_NO_SCOPE_SECTION"; exit 0; }
      echo "PASS"
    depends_on: [refinar-hu-producto]
    timeout: 10000

  - id: cancel-bad-hu
    cancel: "HU draft validation FAILED: $validate-hu.output. Re-lanzá: archon workflow run idea-a-hu-frontend '<tu idea>'"
    when: "$validate-hu.output != 'PASS'"
    depends_on: [validate-hu]

  # ════════════════════════════════════════════════════════════════════
  # FASE 4 — Persistir el draft (siempre, antes de cualquier publicación)
  # ════════════════════════════════════════════════════════════════════

  - id: save-draft
    bash: |
      set -e
      mkdir -p frontend_dashboard/.frontend/drafts
      DRAFT_PATH="frontend_dashboard/.frontend/drafts/idea-$(date -u +%Y%m%d-%H%M%S).md"
      cp $ARTIFACTS_DIR/hu-draft.md "$DRAFT_PATH"
      echo "$DRAFT_PATH"
    when: "$validate-hu.output == 'PASS'"
    depends_on: [validate-hu]

  # ════════════════════════════════════════════════════════════════════
  # FASE 5 — Publicar Issue + agregar al Project (auto, sin gate)
  # ════════════════════════════════════════════════════════════════════
  # Decisión de diseño: el "ok" del loop refinar-hu-producto YA implica
  # "el draft está aprobado para publicar". Sería redundante pedir otra
  # aprobación inmediatamente. La única approval explícita queda
  # `gate-lanzar-pipeline` (mucho más adelante, antes de gastar ~$0.50
  # y 15+ min en el pipeline completo).

  - id: crear-issue
    bash: |
      set -e
      # Extraer título: primera línea con "# " (sin el "# ")
      TITLE=$(grep -m1 '^# ' $ARTIFACTS_DIR/hu-draft.md | sed 's/^# //' | head -c 120)
      test -n "$TITLE" || { echo "FATAL: no extrajo título" >&2; exit 1; }

      # gh imprime SOLO la URL al stdout cuando no-interactive
      # --label frontend-hu: el auto-add workflow del Project levanta esta label
      # y agrega el issue al board automáticamente (built-in workflow).
      ISSUE_URL=$(gh issue create \
        --title "$TITLE" \
        --body-file $ARTIFACTS_DIR/hu-draft.md \
        --label "frontend-hu")

      # IMPORTANTE: persistir a archivo. $create-issue.output se PIERDE cuando
      # Archon reanuda el workflow tras una approval gate (bug conocido —
      # prior_success skipea el nodo pero no preserva stdout). Downstream
      # debe leer de $ARTIFACTS_DIR/.issue-url, no de la substitución.
      echo "$ISSUE_URL" > $ARTIFACTS_DIR/.issue-url
      echo "$ISSUE_URL"
    depends_on: [save-draft]
    retry:
      max_attempts: 2
      delay_ms: 5000
      on_error: transient
    timeout: 60000

  - id: agregar-a-project
    bash: |
      CFG="frontend_dashboard/.frontend/github-project-config.yaml"
      if [ ! -f "$CFG" ]; then
        echo "skipped no_config — para activar, crear frontend_dashboard/.frontend/github-project-config.yaml"
        exit 0
      fi

      # Leer URL del archivo persistido (sobrevive resumes); fallback a substitución
      if [ -f "$ARTIFACTS_DIR/.issue-url" ]; then
        ISSUE_URL=$(cat "$ARTIFACTS_DIR/.issue-url")
      else
        ISSUE_URL=$create-issue.output
      fi
      PN=$(grep '^project_number:' "$CFG" | awk '{print $2}')
      PO=$(grep '^project_owner:' "$CFG" | awk '{print $2}')
      PID=$(grep '^project_id:' "$CFG" | awk '{print $2}')
      FID=$(grep '^status_field_id:' "$CFG" | awk '{print $2}')

      # Agregar el issue al project
      gh project item-add "$PN" --owner "$PO" --url "$ISSUE_URL" 2>&1 | head -3 || {
        echo "warn item-add falló — ¿gh tiene scope 'project'? gh auth refresh -s project"
        exit 0
      }

      # Buscar el item id del recién agregado
      ITEM_ID=$(gh project item-list "$PN" --owner "$PO" --format json --limit 100 2>/dev/null \
        | jq -r --arg u "$ISSUE_URL" '.items[] | select(.content.url == $u) | .id' | head -1)
      [ -z "$ITEM_ID" ] && { echo "warn item not found after add"; exit 0; }

      # Set status = "Idea refined"
      OID=$(awk -F: '/^status_options:/{f=1; next} f && /^  "?Idea refined"?:/ {gsub(/^ +| +$/, "", $2); print $2; exit}' "$CFG")
      if [ -z "$OID" ]; then
        echo "warn 'Idea refined' option not in config — agregalo a status_options:"
        exit 0
      fi

      gh project item-edit --id "$ITEM_ID" --project-id "$PID" \
        --field-id "$FID" --single-select-option-id "$OID" 2>&1 | head -3 || true
      echo "set Idea refined ok"
    depends_on: [crear-issue]
    # Sin trigger_rule: all_done. Si crear-issue falla/skipea, este nodo
    # NO debe correr (no tiene issue para agregar). El fail-soft del
    # Project sync vive ADENTRO del bash (con `|| true`), no a nivel
    # nodo. Default all_success → si crear-issue falla, este skipea.
    timeout: 60000

  - id: print-issue-info
    bash: |
      # Leer URL del archivo persistido (resume-safe)
      if [ -f "$ARTIFACTS_DIR/.issue-url" ]; then
        ISSUE_URL=$(cat "$ARTIFACTS_DIR/.issue-url")
      else
        ISSUE_URL=$create-issue.output
      fi
      PROJECT_STATUS=$agregar-a-project.output
      cat <<EOF

      ╔════════════════════════════════════════════════════════════════╗
      ║ ✅ Issue creado                                                 ║
      ║                                                                ║
      ║ URL:        ${ISSUE_URL}
      ║ Project:    ${PROJECT_STATUS}
      ║                                                                ║
      ║ El card aparece en el Project board con status "Idea refined". ║
      ║ Cuando arranque hu-frontend-pipeline va a pasar por:           ║
      ║   Refining → Refined → Planning → Planned → Implementing →     ║
      ║   Done — PR ready                                              ║
      ╚════════════════════════════════════════════════════════════════╝
      EOF
    depends_on: [crear-issue, agregar-a-project]
    # none_failed_min_one_success: requiere que crear-issue haya succeeded
    # (no skipped/failed); agregar-a-project puede haber fallado/skipeado
    # internamente (fail-soft) y igual imprimimos. Si crear-issue falló,
    # NO imprimimos resumen (no hay nada que reportar).
    trigger_rule: none_failed_min_one_success
    timeout: 5000

  # ════════════════════════════════════════════════════════════════════
  # FASE 6 — Gate ÚNICO: lanzar pipeline completo?
  # ════════════════════════════════════════════════════════════════════
  # Este es el único approval explícito del workflow. Acá decidís si:
  # (a) gastás ~$0.50 + 15-30 min en pipeline auto E2E (refinar técnico
  #     FSD → planificar tareas → implementar secuencial → PR + review), o
  # (b) terminás acá con el issue creado y lanzás el pipeline más tarde.

  - id: gate-lanzar-pipeline
    depends_on: [print-issue-info]
    approval:
      message: |
        ✅ Issue publicado: $create-issue.output
        ✅ Card en el Project: "Idea refined"

        ─────────────────────────────────────────────────────────────────
        ¿Lanzo `hu-frontend-pipeline` AHORA con este issue?
        ─────────────────────────────────────────────────────────────────

        APROBAR → arranca en background (~$0.50, 15-30 min). Va a:
          1. refinar técnicamente (FSD: 4 import rules + 14 anti-patterns)
          2. planificar el DAG de tareas atómicas
          3. implementar tareas secuencialmente (npm test entre cada una)
          4. validar (npm test + tsc -b + npm run build) en el branch
          5. abrir PR contra main
          6. disparar review automático (5 agentes especializados)
          7. actualizar el card del Project en cada fase

        RECHAZAR → terminamos acá. El issue + card quedan listos. Lanzás
          el pipeline cuando quieras desde otra terminal:
            archon workflow run hu-frontend-pipeline "$create-issue.output"

  - id: lanzar-pipeline
    bash: |
      # CRÍTICO: leer URL del archivo persistido. La substitución
      # $create-issue.output se PIERDE cuando Archon reanuda tras la
      # approval gate de gate-lanzar-pipeline (crear-issue se marca
      # prior_success, su stdout queda vacío en la nueva sesión).
      if [ -f "$ARTIFACTS_DIR/.issue-url" ]; then
        ISSUE_URL=$(cat "$ARTIFACTS_DIR/.issue-url")
      else
        # Fallback: fresh run sin approval intermedia
        ISSUE_URL=$create-issue.output
      fi

      # Validar
      if [ -z "$ISSUE_URL" ]; then
        echo "FAIL_NO_ISSUE_URL crear-issue no produjo URL (ni archivo ni substitución)"
        exit 1
      fi
      if ! echo "$ISSUE_URL" | grep -qE '^https://github\.com/.+/issues/[0-9]+'; then
        echo "FAIL_INVALID_URL: ${ISSUE_URL}"
        exit 1
      fi

      LOG_FILE="$HOME/.archon/logs/pipeline-$(date +%s).log"
      mkdir -p "$HOME/.archon/logs"

      # env -u CLAUDECODE evita "may hang silently" del nested archon-in-claude-code
      (env -u CLAUDECODE ARCHON_SUPPRESS_NESTED_CLAUDE_WARNING=1 \
         nohup archon workflow run hu-frontend-pipeline "$ISSUE_URL" \
         > "$LOG_FILE" 2>&1 & disown) 2>/dev/null \
        && echo "pipeline_triggered_log=$LOG_FILE" \
        || echo "pipeline_trigger_failed_run_manually"
    depends_on: [gate-lanzar-pipeline]
    timeout: 10000

  - id: print-final-summary
    bash: |
      # Leer del archivo persistido (sobrevive resumes)
      if [ -f "$ARTIFACTS_DIR/.issue-url" ]; then
        ISSUE_URL=$(cat "$ARTIFACTS_DIR/.issue-url")
      else
        ISSUE_URL=$create-issue.output
      fi
      PIPELINE=$lanzar-pipeline.output
      cat <<EOF

      ╔════════════════════════════════════════════════════════════════╗
      ║ 🎉 Workflow completo                                            ║
      ║                                                                ║
      ║ Issue:     ${ISSUE_URL}
      ║ Pipeline:  ${PIPELINE}
      ║                                                                ║
      ║ Próximos pasos:                                                ║
      ║   1. Mirá el Project board — el card está en "Idea refined"    ║
      ║   2. Si el pipeline arrancó, va a ir actualizando el status    ║
      ║      automáticamente (revisá en ~3-5 min)                      ║
      ║   3. Cuando termine, vas a ver un PR + un comment del review   ║
      ║   4. Si "pipeline_trigger_failed_run_manually": lanzalo a mano:║
      ║      archon workflow run hu-frontend-pipeline "${ISSUE_URL}"
      ╚════════════════════════════════════════════════════════════════╝
      EOF
    depends_on: [lanzar-pipeline]
    timeout: 5000
