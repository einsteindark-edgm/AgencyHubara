name: refinar-hu-frontend
description: |
  Refina técnicamente una historia de usuario de FRONTEND (FSD: Vite + React 19 +
  TanStack Query + Zod + Tailwind v4) hasta que el humano la apruebe, y persiste
  el refinamiento en frontend_dashboard/.frontend/refinements/ para que
  planificar-hu-frontend lo pueda leer en el siguiente worktree.

  **Use when**: tenés una HU de frontend para refinar técnicamente. El input puede ser:
    - Ruta a un archivo .md con la HU detallada
    - Texto plano describiendo la HU
    - URL de un GitHub Issue (formato `https://github.com/owner/repo/issues/N`)

  Si querés un pipeline automatizado end-to-end SIN gates humanos, usá
  `hu-frontend-pipeline` en su lugar.

provider: claude
model: sonnet
interactive: true   # tiene loop interactive: true — requerido para web UI

nodes:
  # Determinista: stagear archivos + resolver input al hu-original.md
  - id: preparar-input
    bash: |
      set -e
      # Stage del project context (los skills lo leen primero)
      test -f frontend_dashboard/.frontend/project-context.md || {
        echo "FATAL: falta frontend_dashboard/.frontend/project-context.md — restaurar desde main" >&2
        exit 1
      }
      cp frontend_dashboard/.frontend/project-context.md $ARTIFACTS_DIR/project-context.md

      RAW="$ARGUMENTS"

      # Detectar tipo de input
      if [[ "$RAW" =~ ^https://github\.com/.+/issues/[0-9]+$ ]]; then
        # URL de Issue
        gh issue view "$RAW" --json title,body --jq '.title + "\n\n" + .body' \
          > $ARTIFACTS_DIR/hu-original.md
      elif [[ -f "$RAW" ]]; then
        cp "$RAW" $ARTIFACTS_DIR/hu-original.md
      elif [[ -n "$RAW" ]]; then
        echo "$RAW" > $ARTIFACTS_DIR/hu-original.md
      else
        echo "FATAL: input vacío" >&2
        exit 1
      fi

      SIZE=$(wc -c < $ARTIFACTS_DIR/hu-original.md)
      [ "$SIZE" -gt 50 ] || {
        echo "FATAL: hu-original.md tiene solo $SIZE bytes — input demasiado corto" >&2
        exit 1
      }

      echo "input preparado ($SIZE bytes)"
    timeout: 30000

  # AI iterativo: refinar con feedback humano hasta aprobación
  - id: refinar
    depends_on: [preparar-input]
    idle_timeout: 600000   # 10 min idle por iteración (el humano puede tardar)
    loop:
      interactive: true
      max_iterations: 10
      until: HU_APROBADA
      skills:
        - frontend-tech-refiner-archon
      gate_message: |
        He refinado la HU. Revisá $ARTIFACTS_DIR/hu-refinada.md y respondé:
        - "aprobada" o "ok" si está lista
        - Cualquier otro comentario para que itere con tu feedback
      prompt: |
        HU original (visión de producto): $ARTIFACTS_DIR/hu-original.md
        Project context (LEER PRIMERO): $ARTIFACTS_DIR/project-context.md

        Feedback del humano en esta iteración: $LOOP_USER_INPUT

        Aplicá tu protocolo de refinamiento técnico (skill
        frontend-tech-refiner-archon).

        Si existe $ARTIFACTS_DIR/hu-refinada.md de una iteración previa,
        leélo e incorporá el feedback de forma incremental — no rehagas
        todo, solo modificá las secciones afectadas. Acordate de
        incrementar el contador `Iteration` del header.

        Escribí la versión refinada en $ARTIFACTS_DIR/hu-refinada.md.

        Si el humano aprobó (dijo "aprobada", "ok", "go", "listo", etc.):
        <promise>HU_APROBADA</promise>

  # Determinista: extraer HU id + persistir + reportar comandos git al operador
  - id: persistir-refinamiento
    depends_on: [refinar]
    bash: |
      set -e

      # Extraer HU id del refinement
      HU_ID=$(grep -m1 '^HU id:' $ARTIFACTS_DIR/hu-refinada.md | sed 's/^HU id: *//' | tr -d ' ')

      if [ -z "$HU_ID" ] || [ "$HU_ID" = "(noidprovided)" ]; then
        # Generar uno con timestamp
        TITLE=$(grep -m1 -oE '^Tech refinement.*— .*' $ARTIFACTS_DIR/hu-refinada.md \
          | sed -E 's/^.*— //' | head -c 80)
        SLUG=$(echo "$TITLE" \
          | iconv -f utf-8 -t ascii//TRANSLIT 2>/dev/null \
          | tr '[:upper:]' '[:lower:]' \
          | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' \
          | cut -c1-40 \
          | sed 's/-$//')
        HU_ID="HU-$(date -u +%Y%m%d-%H%M)-${SLUG:-untitled}"
      fi

      mkdir -p frontend_dashboard/.frontend/refinements
      cp $ARTIFACTS_DIR/hu-original.md \
         "frontend_dashboard/.frontend/refinements/${HU_ID}-original.md"
      cp $ARTIFACTS_DIR/hu-refinada.md \
         "frontend_dashboard/.frontend/refinements/${HU_ID}-tech.md"

      cat <<EOF
      ╔════════════════════════════════════════════════════════════════╗
      ║ ✅ Refinamiento persistido                                      ║
      ║                                                                ║
      ║ HU id:    ${HU_ID}
      ║ Files:    frontend_dashboard/.frontend/refinements/${HU_ID}-{original,tech}.md
      ╚════════════════════════════════════════════════════════════════╝

      📋 Comando para activar en main:

        git add frontend_dashboard/.frontend/refinements/${HU_ID}-*.md
        git commit -m "${HU_ID}: refinamiento técnico (frontend) aprobado"
        git push   # o merge según convención

      ▶ Siguiente workflow:

        archon workflow run planificar-hu-frontend "${HU_ID}"
      EOF
    timeout: 30000
