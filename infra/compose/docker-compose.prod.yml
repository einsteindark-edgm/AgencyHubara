# docker-compose de PRODUCCIÓN — corre en la caja EC2 de cada tenant.
#
# Diferencias vs el local (hubara_agency/docker-compose.local.yml):
#   • NO hay db/temporal/temporal-ui  → se usa Temporal Cloud (TEMPORAL_* del .env).
#   • NO hay `include` de SigNoz       → SigNoz vive en su propia caja (OTLP por red).
#   • Las imágenes son de GHCR (${HUBARA_IMAGE}), no `build:`.
#   • Todo el env viene de `.env`, renderizado desde SSM por backend-deploy.yml.
#   • Caddy hace de reverse-proxy con auto-TLS sobre el dominio del tenant.
#
# Lo despliega .github/workflows/backend-deploy.yml (scp + docker compose up -d).
# Mantener los workers en sync con `scripts/render-compose.py` (ver infra/README):
# este archivo es MANUAL — un worker nuevo en un manifest NO aparece acá solo.

name: hubara-prod

x-app: &app
  image: ${HUBARA_IMAGE}
  working_dir: /app/hubara_agency
  env_file: .env
  restart: unless-stopped
  depends_on:
    litellm:
      condition: service_healthy

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    command: caddy reverse-proxy --from ${CADDY_DOMAIN} --to api:8000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  litellm:
    image: ghcr.io/berriai/litellm:v1.86.2
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    <<: *app
    command: ["python", "run_api.py"]
    # Sin `ports:` público — Caddy lo fronta. Expuesto solo en la red del compose.
    expose:
      - "8000"
    volumes:
      - /mnt/hubara-vault:/app/hubara_vault
      - ./plugins:/app/frontend_dashboard/src/plugins:ro

  worker-catalog-sync:
    <<: *app
    command: ["python", "-m", "src.plugins.catalog.workers.sync"]
    volumes:
      - /mnt/hubara-vault:/app/hubara_vault

  worker-chats-sales:
    <<: *app
    command: ["python", "-m", "src.plugins.chats.workers.sales"]
    volumes:
      - /mnt/hubara-vault:/app/hubara_vault

  worker-chats-remarketing:
    <<: *app
    command: ["python", "-m", "src.plugins.chats.workers.remarketing"]
    volumes:
      - /mnt/hubara-vault:/app/hubara_vault

  worker-reengagement-cycle:
    <<: *app
    command: ["python", "-m", "src.plugins.reengagement.workers.cycle"]
    volumes:
      - /mnt/hubara-vault:/app/hubara_vault

  worker-order-sentinel-cycle:
    <<: *app
    command: ["python", "-m", "src.plugins.order_sentinel.workers.cycle"]
    environment:
      # El ejecutor/enriquecimiento hablan con la API por HTTP — el service
      # en ESTE compose se llama `api` (el default del código es el nombre
      # del compose local, PM-003: sin esto el ciclo era skipped_empty eterno).
      HUBARA_API_BASE_URL: http://api:8000
    volumes:
      - /mnt/hubara-vault:/app/hubara_vault

  worker-chats-sales_eval:
    <<: *app
    command: ["python", "-m", "src.plugins.chats.workers.sales_eval"]
    volumes:
      - /mnt/hubara-vault:/app/hubara_vault

  worker-chats-post_sale_return:
    <<: *app
    command: ["python", "-m", "src.plugins.chats.workers.post_sale_return"]
    # PostSaleReturnWorkflow: schedule diario (21:00 Bogotá) que devuelve al
    # bot de ventas las COMPRA_EXITOSA pagadas Y ENTREGADAS abiertas en humano.
    environment:
      # Gate de entrega: consulta el estado real de la orden vía la API —
      # el service en ESTE compose se llama `api` (el default del código es
      # el nombre del compose local; mismo patrón que order_sentinel).
      HUBARA_API_BASE_URL: http://api:8000
    volumes:
      - /mnt/hubara-vault:/app/hubara_vault

  worker-eta-eta:
    <<: *app
    command: ["python", "-m", "src.plugins.eta.workers.eta"]
    volumes:
      - /mnt/hubara-vault:/app/hubara_vault

  worker-orders-reconcile:
    <<: *app
    command: ["python", "-m", "src.plugins.orders.workers.reconcile"]
    volumes:
      - /mnt/hubara-vault:/app/hubara_vault

  worker-marketing-campaigns:
    <<: *app
    command: ["python", "-m", "src.plugins.marketing.workers.campaigns"]
    # CampaignSendWorkflow: envíos de campañas directas (sección Marketing).
    # Vault completo: _campaigns/ (historial) + wa_*/ (audiencia + touches).
    volumes:
      - /mnt/hubara-vault:/app/hubara_vault

volumes:
  # hubara-vault ya NO es un volumen Docker: vive en el EBS dedicado montado en
  # /mnt/hubara-vault (bind mount por servicio, SEC-09-full). El volumen viejo
  # (hubara-prod_hubara-vault) queda intacto como red de seguridad del rollback
  # — ver infra/VAULT_EBS_MIGRATION_PLAN.md §6.
  caddy-data:   # certs de Let's Encrypt — persistir para no re-emitir en cada deploy.
  caddy-config:
