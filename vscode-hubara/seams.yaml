# Costuras cross-sistema (§2.6 del plan): hoy ningún builder emite edges
# entre System Map y GraphAgents, así que arrancan DECLARADAS acá — una
# fuente explícita y honesta, no auto-detectada (F7 candidato: escanear usos
# de `graphagentskit`/execution-ids como hace el system map con
# `get_task_queue(...)`).
#
# Formato: from/to son ids NAMESPACED (`hub:` = System Map, `ga:` = GraphAgents),
# tal cual namespaceGraph() los produce (prefijo + id crudo del nodo, p. ej.
# `hub:plugin:ads`, `ga:agent:ads-analytics`). Una costura cuyo from/to no
# resuelve contra el grafo actual se reporta como "rota" — NUNCA rompe el
# merge del workspace.
#
# Cada entrada acá debe ser VERIFICABLE en el código vivo, no aspiracional.
# Guard en CI: hubara_agency/tests/platform/test_graphagents_seams.py — todo
# `launcher.dispatch("<agent>")` LITERAL en un plugin exige su seam acá, y
# toda seam debe resolver contra plugin.yaml + manifests de GraphAgents reales.
# Verificado 2026-07-07: hubara_agency/src/plugins/ads/runs/{conductor,
# orchestrator,launcher,boto3_launcher}.py lanza y trackea el pod CTWA en
# GraphAgents (agent:ads-analytics, taskgraph ads-analytics.taskgraph.yaml).

seams:
  - id: ads-analytics-pod
    from: hub:plugin:ads
    to: ga:agent:ads-analytics
    label: "pod CTWA (runs/conductor.py)"
    kind: launches
  # Verificado 2026-07-10: src/plugins/reengagement/agent/cycle/activities/
  # __init__.py — dispatch_window_strategist_activity despierta la caja y
  # despacha el snapshot al agente (ciclo del Temporal Schedule cada 45 min).
  - id: window-strategist-cycle
    from: hub:plugin:reengagement
    to: ga:agent:window-strategist
    label: "ciclo reactivación (cycle/activities)"
    kind: launches
  # Verificado 2026-07-10: src/plugins/order_sentinel/agent/cycle/activities/
  # __init__.py — dispatch_order_sentinel_activity despacha el snapshot de
  # conversaciones HUMANO+orden (ciclo diario 01:00 UTC).
  - id: order-sentinel-cycle
    from: hub:plugin:order_sentinel
    to: ga:agent:order-sentinel
    label: "ciclo estados de pedido (cycle/activities)"
    kind: launches
