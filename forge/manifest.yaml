      - "hubara_agency/tests/platform/test_whatsapp_send_template.py"
      - "hubara_agency/tests/test_handoff_template_endpoints.py"
      - "frontend_dashboard/src/plugins/chats/frontend/features/chats-conversation/ui/ChatsComposer.test.tsx"
      - "frontend_dashboard/src/plugins/chats/frontend/entities/handoff/model/templatePreview.test.ts"
    from: "te escribe Liliana, asesora de Hubara,"
