    files: ["android_operator/release/**", "docs/mobile-native/**"]
    from: "Hubara Operador"
    to: "{{company}} Operador"
  - id: app-operador-firebase           # proyecto Firebase / llave de subida en los runbooks
    files: ["android_operator/**", "docs/mobile-native/**"]
    from: "hubara-operador"
    to: "{{slug}}-operador"
  - id: app-operador-privacy-tfvars
    files: ["android_operator/release/**"]
    from: "tenants.hubara."
    to: "tenants.{{slug}}."
