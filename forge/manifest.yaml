    # /opt/graphagents protegido por preserve_tokens
    files:
      - "infra/compose/graphagents/render-env-from-ssm.sh"
      - "infra/robotocore/test-local.sh"
      - "infra/terraform/platform/modules/graphagents-secrets/**"
      - "infra/terraform/compute/modules/graphagents-instance/**"
    from: "/graphagents"
    to: "/{{slug}}-graphagents"
  - id: ws-readme-config
    files: ["infra/whatsapp-provisioning/**"]
    from: "tenants/hubara.env"
    to: "tenants/{{slug}}.env"
  # ── genéricos al final ──────────────────────────────────────────────────
  - id: ssm-vincenzo                     # asserts de robotocore sobre el 2.º tenant de la madre
    files: ["infra/robotocore/**"]
    from: "/hubara/vincenzo/"
    to: "{{ssm_prefix}}/{{slug}}/"
  - id: ssm-tests-infra                  # tests del bootstrap de secretos
    files: ["hubara_agency/tests/infra/**"]
    from: "/hubara/nuevo/"
    to: "{{ssm_prefix}}/nuevo/"
  - id: lab-tenants-tests                # el bloque lab del compute tfvars nombra al tenant
    files: ["hubara_agency/tests/infra/test_lab_box_iam.py"]
    from: 'tenants\s*=\s*\["hubara"\]'
    to: 'tenants\s*=\s*\["{{slug}}"\]'
  - id: ssm-prefix
    files:
      - "infra/terraform/**"
      - "infra/compose/render-env-from-ssm.sh"
      - "infra/scripts/**"
      - "infra/robotocore/**"
      - "infra/whatsapp-provisioning/**"
    from: "/hubara/"
    to: "{{ssm_prefix}}/"
  - id: ssm-prefix-sin-slash            # DEFAULT_PREFIX = "/hubara"
    files: ["infra/scripts/**"]
    from: '"/hubara"'
    to: '"{{ssm_prefix}}"'
  - id: image-ghcr                      # ghcr.io/.../agencyhubara:sha
    files: [".github/workflows/*.yml", "infra/terraform/compute/**"]
    from: "agencyhubara:"
    to: "{{image}}:"
  - id: image-repo-default
    files: ["infra/terraform/compute/**"]
    from: "ghcr.io/einsteindark-edgm/agencyhubara"
    to: "ghcr.io/{{repo_owner}}/{{image}}"
  - id: prefijo-recursos                # agencyhubara-* y dlm-agencyhubara
    files: ["infra/terraform/**", "infra/scripts/**", "infra/robotocore/**", "infra/compose/**", "docs/mobile-native/**"]
    from: "agencyhubara"
    to: "{{prefix}}"
  - id: caja-laboratorio               # /hubara-lab/* (SSM) — único A NIVEL CUENTA.
    # El namespace Temporal y el proyecto compose `hubara-lab` viven DENTRO de
    # la caja (nombre del motor; el guard del worker lo exige): no se tocan.
    # DESPUÉS de prefijo-recursos ("agencyhubara-lab" = bucket/rol/SG).
    files: ["**"]
    from: "/hubara-lab"
    to: "/{{slug}}-lab"
  - id: nombre-proyecto-titulo          # descripciones/comentarios en tf/scripts
    files: ["infra/terraform/**", "infra/scripts/**", "infra/robotocore/**"]
    from: "AgencyHubara"
    to: "{{repo_name}}"

# Renames de paths (dirs o archivos), post-replacements.
renames:
  - from: "hubara_agency/src/plugins/chats/agent/sales/workspace/skills/hubara_catalog"
    to: "hubara_agency/src/plugins/chats/agent/sales/workspace/skills/{{slug}}_catalog"
  - from: "hubara_agency/src/plugins/chats/agent/remarketing/workspace/skills/hubara_catalog"
    to: "hubara_agency/src/plugins/chats/agent/remarketing/workspace/skills/{{slug}}_catalog"

# Datos del cliente Hubara / docs de otros clientes — NO viajan a terceros.
deletes:
  - "infra/whatsapp-provisioning/tenants/hubara.env.example"
  - "hubara_agency/hubara_vault"
  - "hubara_agency/scripts/inject_snapshot_products.py"
  - "docs/cartagena"
  - "MULTI_TENANT_COMMERCE_ARCHITECTURE.md"
  - "MOBILE_CHATS_PLAN_fable.md"
  - "ADR-2026-06-05-multi-tenant-commerce-architecture.md"
  - "VINCENZO_SPLIT_PLAN.md"
  - "infra/INFRASTRUCTURE.md"          # describe la infra VIVA de Hubara (EIP, cuenta, IDs)
  - "infra/DEPLOY_RUNBOOK.md"          # ídem — NEXT_STEPS.md del clon lo reemplaza
  - "infra/SERVICIOS_AWS_Y_SCHEDULERS.md"
  - "infra/PENDING_IMPLEMENTATION.md"
  - "infra/VAULT_EBS_MIGRATION_PLAN.md"  # plan de migración del vault VIVO de Hubara (vol/EBS IDs, pasos op)
  - "SECURITY_AUDIT_fable.md"          # auditoría interna de Hubara con hallazgos ancla archivo:línea
  # App Tauri (congelada; la reemplaza la App Operador nativa android_operator/,
  # docs/mobile-native F5 = retirarla). Su identidad (com.hubara.dashboard,
  # "Hubara Dashboard") está cableada en el proyecto Android generado: el clon
  # no la hereda — su app es la nativa con applicationId propio.
  - ".github/workflows/forge-gates.yml"   # forge/ no viaja: el gate fallaría en cada PR del clon
  - "MBA_PRODUCTION_ROADMAP.md"            # bitácora operativa de MBA en Hubara (IDs reales, agente id)
  - "frontend_dashboard/src-tauri"
  - "frontend_dashboard/MOBILE_ANDROID_RUNBOOK.md"

# Paquetes de decisión (PAQUETES_DE_DECISION.md). La INTELIGENCIA del motor
# (preguntas a Jev, umbrales, política del turno) es del motor y viaja; el
# DOMINIO (`domain.yaml`: nombre, despedida, ejemplos que ve el agente) es el
# concepto de la tienda y sale del bundle del cliente (clients/<slug>/domain.yaml,
# sembrado por `init` desde templates/sales_domain.yaml.tpl).
#   default: el del código (store_pack.DEFAULT_BUNDLE) — tests y dev local.
#   store:   el que corre HOY la tienda madre (`tenants.hubara.lab.decisions_bundle`
#            en infra/terraform/platform/tenants.auto.tfvars); el clon arranca
#            con este y su Terraform lo nombra. Un test exige que coincidan:
#            promover ventas-N en Hubara = actualizar esta línea.
# Las demás carpetas de `dir` (experimentos de la tienda madre) no viajan.
decision_bundles:
  dir: "hubara_agency/src/plugins/chats/shared/decisions/bundles"
  default: ventas
  store: ventas-4

# Archivos REGENERADOS desde forge/templates/ (no editados).
templates:
  "infra/terraform/platform/tenants.auto.tfvars": platform_tenants.auto.tfvars.tpl
  "infra/terraform/platform/project.auto.tfvars": project.auto.tfvars.tpl
  "infra/terraform/compute/tenants.auto.tfvars": compute_tenants.auto.tfvars.tpl
  "infra/whatsapp-provisioning/tenants/{{slug}}.env.example": whatsapp_tenant.env.example.tpl
  "NEXT_STEPS.md": NEXT_STEPS.md.tpl
  # el vault se scrubbea (deletes) pero el dir debe existir para el boot dev
  "hubara_agency/hubara_vault/.gitkeep": gitkeep.tpl

# Overlay de personalidad: el workspace del clon se REEMPLAZA COMPLETO por el
# bundle clients/<slug>/workspace/<agent>/ (el workspace ES del cliente).
# skills/catalog/ del bundle se instala como skills/<slug>_catalog/.
workspace_overlay:
  agents:
    sales: "hubara_agency/src/plugins/chats/agent/sales/workspace"
    remarketing: "hubara_agency/src/plugins/chats/agent/remarketing/workspace"
    # Meta Business Agent: otra estructura (agent.yaml + skills/<title>.md), por
    # eso trae su propio `required`. Es la voz del cliente en MBA: se reemplaza
    # completo desde clients/<slug>/workspace/mba_sales/.
    mba_sales:
      path: "hubara_agency/src/plugins/mba/agents/sales"
      required:
        - agent.yaml
        - skills/persona-y-tono.md
    # Agente de seguimiento de pedidos (avisos ETA): su identidad y el negocio
    # que describe (USER.md) son del cliente — le habla al cliente final.
    eta:
      path: "hubara_agency/src/plugins/eta/agent/eta/workspace"
      required:
        - IDENTITY.md
        - SOUL.md
        - AGENTS.md
        - TOOLS.md
        - USER.md
  catalog_skill_dirname: catalog
  required:
    - IDENTITY.md
    - SOUL.md
    - TOOLS.md
    - skills/catalog/SKILL.md

