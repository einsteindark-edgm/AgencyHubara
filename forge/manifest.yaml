  # sintéticos del mismo largo (los tests que los comparan siguen coherentes).
  # También en scan.forbidden. ──────────────────────────────────────────────
  - id: meta-phone-number-id
    files: ["**"]
    from: "1234091093112024"
    to: "1000000000000002"
  - id: meta-ad-account
    files: ["**"]
    from: "1010393601284112"
    to: "1000000000000003"
  - id: meta-phone-number-id-viejo
    files: ["**"]
    from: "2507823826404263"
    to: "1000000000000004"
  - id: meta-flow-id
    files: ["**"]
    from: "951293630651590"
    to: "100000000000005"
  - id: meta-catalog-id-2
    files: ["**"]
    from: "1468134707823015"
    to: "1000000000000006"
  - id: catalog-skill                   # el skill de catálogo del overlay se instala como <slug>_catalog
    files: ["hubara_agency/src/plugins/chats/agent/**", "hubara_agency/tests/**"]
    from: "hubara_catalog"
    to: "{{slug}}_catalog"
  - id: flow-name
    files: ["infra/whatsapp-provisioning/definitions/*.json"]
    from: "Hubara — Datos de envío"
    to: "{{company}} — Datos de envío"
  - id: plantilla-seguimiento-humano      # human_followup_utility_v1: la asesora
    # y la marca son del cliente. Mismo texto en definitions (lo que se somete a
    # Meta), catálogo (guard de drift) y los tests/fixtures que lo renderizan.
    files:
      - "infra/whatsapp-provisioning/definitions/*.json"
