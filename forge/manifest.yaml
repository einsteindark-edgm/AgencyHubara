# Manifest de forge — clasificación EXHAUSTIVA de cada literal "hubara" del repo.
#
# Regla de oro (VINCENZO_SPLIT_PLAN.md §5): "hubara" es DOS cosas —
#   · nombre del MOTOR  (hubara_agency/, HubaraSalesSessionWorkflow, HUBARA_*):
#     se CONSERVA (allow_tokens) para que el cherry-pick de fixes entre repos
#     siga siendo mecánico.
#   · nombre del CLIENTE (prefijos AWS, SSM, marca del agente, IDs de Meta):
#     se REEMPLAZA / BORRA / TEMPLA.
# Todo literal nuevo del cliente que aparezca en el repo madre DEBE clasificarse
# acá — el scanner (tiers abajo) falla en el clon si queda algo sin clasificar.
version: 1

# No viaja al clon (se poda post-export). El clonador NO viaja al clon.
copy_exclude:
  - forge

# Identificadores del MOTOR que contienen "Hubara" con la MISMA capitalización
# que la marca: se enmascaran durante replacements e init para que ninguna
# regla los toque. Renombrarlos a medias rompe el dispatch del clon — el
# dispatcher, los workers, shared/contracts, tests y el plugin.yaml del
# frontend los referencian FUERA del scope de marca-en-agente.
preserve_tokens:
  - "HubaraSalesSessionWorkflow"
  - "HubaraEtaSessionWorkflow"
  - "HubaraRemarketingWorkflow"
  # path DENTRO de la caja GraphAgents — debe coincidir entre cloud-init,
  # deploy workflow y render script; las reglas de /graphagents no lo tocan
  - "/opt/graphagents"

# Reemplazos de texto plano, EN ORDEN (los compuestos van antes que los simples
# para que "/opt/hubara" no lo corrompa la regla de "/hubara/", etc.).
# files = globs sobre el path relativo del clon. Vars entre {{ }}.
replacements:
  # ── compuestos primero ──────────────────────────────────────────────────
  - id: matrix-backend-con-comentario
    files: [".github/workflows/*.yml"]
    from: "tenant: [hubara]   # sumá vincenzo cuando tenga su caja + secretos"
    to: "tenant: [{{slug}}]"
  - id: matrix-multi
    files: [".github/workflows/*.yml"]
    from: "tenant: [hubara, vincenzo]"
    to: "tenant: [{{slug}}]"
  - id: matrix-single
    files: [".github/workflows/*.yml"]
    from: "tenant: [hubara]"
    to: "tenant: [{{slug}}]"
  - id: prefijo-y-tenant-juntos          # agencyhubara-hubara (verify/robotocore/comments tf, runbooks de la app)
    files: ["infra/robotocore/**", "infra/scripts/**", "infra/terraform/**", "docs/mobile-native/**"]
    from: "agencyhubara-hubara"
    to: "{{prefix}}-{{slug}}"
  - id: bootstrap-tenant-flag            # ejemplos de uso en aws_bootstrap
    files: ["infra/scripts/**"]
    from: "--tenant hubara "
    to: "--tenant {{slug}} "
  - id: bootstrap-tenant-flag-docs       # runbooks de la App Operador (push/Play)
    files: ["docs/mobile-native/**"]
    from: "--tenant hubara"
    to: "--tenant {{slug}}"
  - id: secrets-env-file
    files: ["infra/scripts/**", "infra/whatsapp-provisioning/**"]
    from: "secrets.hubara.env"
    to: "secrets.{{slug}}.env"
  - id: ssh-key-file
    files: ["infra/scripts/**"]
    from: ".ssh/hubara_ops"
    to: ".ssh/{{slug}}_ops"
  - id: sizing-comment
    files: ["infra/terraform/compute/**"]
    from: "Hubara ~4GB → t3.medium ; Vincenzo ~8GB → t3.large (mapeo del doc §4)."
    to: "sizing por cliente — t3.large por defecto."
  - id: graphagents-image-comment
    files: ["infra/terraform/compute/**"]
    from: "(≠ la de hubara)"
    to: "(≠ la de la app)"
  - id: temporal-ns-comment
    files: ["infra/terraform/temporal-cloud/**"]
    from: "(hubara, vincenzo)"
    to: "({{slug}})"
  - id: temporal-ns-default
    files: ["infra/terraform/temporal-cloud/**"]
    from: '["hubara", "vincenzo"]'
    to: '["{{slug}}"]'
  - id: cognito-domain-comment
    files: ["infra/terraform/platform/modules/auth/**"]
    from: "<tenant>-hubara.auth."
    to: "{{prefix}}-<tenant>.auth."
  - id: ssm-doble-hubara                 # /hubara/hubara/... (verify hardcodeado, READMEs)
    files: ["infra/**"]
    from: "/hubara/hubara/"
    to: "{{ssm_prefix}}/{{slug}}/"
  - id: opt-hubara                      # + infra/scripts: bot_control.sh corre en la caja (2026-10-06)
    files: ["infra/compose/**", "infra/terraform/compute/**", ".github/workflows/*.yml", "infra/scripts/**"]
    from: "/opt/hubara"
    to: "/opt/{{slug}}"
  - id: tmp-deploy
    files: [".github/workflows/*.yml"]
    from: "/tmp/hubara-deploy"
    to: "/tmp/{{slug}}-deploy"
  - id: compose-project
    files: ["infra/compose/**", "infra/terraform/compute/**"]
    from: "hubara-prod"
    to: "{{slug}}-prod"
  - id: vault-volume
    files: ["infra/compose/**", "infra/terraform/compute/**"]
    from: "hubara-vault"
    to: "{{slug}}-vault"
  - id: gh-repo
    files: ["infra/terraform/**", "infra/scripts/**", "docs/mobile-native/**"]
    from: "einsteindark-edgm/AgencyHubara"
    to: "{{repo}}"
  - id: dlm-tag
    files: ["infra/terraform/compute/**"]
    from: 'Backup = "daily"'
    to: 'Backup = "daily-{{slug}}"'
  - id: reference-id
    files: ["hubara_agency/src/plugins/chats/agent/**"]
    from: "HUB-hubara-"
    to: "{{ref_prefix}}-{{slug}}-"
  - id: instagram-marca                 # el handle de Instagram de Hubara ES su
    # dominio: sin esta regla (antes de dominio-marca) quedaría
    # instagram.com/<dominio-del-cliente>
    files: ["**"]
    from: "instagram.com/hubara.com.co"
    to: "instagram.com/{{instagram}}"
  - id: dominio-marca
    # global: el dominio del cliente también vive en platform code (meta_catalog
    # dtos/mapper, media_url), docs y features — lo encontró el ratchet E2E
    files: ["**"]
    from: "hubara.com.co"
    to: "{{primary_domain}}"
  - id: telefono-ejemplo
    # número de ejemplo recurrente en docstrings/prompts del motor (línea de
    # prueba real de hubara) — se normaliza a uno sintético en el clon
    files: ["**"]
    from: "wa_573125671604"
    to: "wa_573000000000"
  - id: telefono-ejemplo-2
    # segundo número REAL que entró al motor con el fix del leak de
    # deliberación (#192: sanitizer, send_policy, workflow_helpers, agentkit,
    # remarketing + sus tests y docs) — se normaliza a OTRO sintético para
    # que los tests que distinguen dos clientes sigan distinguiéndolos
    files: ["**"]
    from: "wa_573229041190"
    to: "wa_573000000001"
  - id: nequi-default-vacio             # la llave Nequi de HUBARA no puede ser el
    # default del clon: el bot del cliente le pediría a sus clientes pagarle a
    # Hubara. Vacío = sin pago anticipado (fail-closed) hasta que la tienda
    # ponga su llave en Terraform (tenants.<t>.store.payment_nequi_number →
    # SSM PAYMENT_NEQUI_NUMBER, NEXT_STEPS.md F3). ANTES de telefono-nequi-crudo.
    files: ["hubara_agency/src/plugins/chats/agent/sales/config/payments.py"]
    from: 'PAYMENT_NEQUI_NUMBER_DEFAULT = "3229041190"'
    to: 'PAYMENT_NEQUI_NUMBER_DEFAULT = ""  # {{company}}: tenants.<t>.store.payment_nequi_number (Terraform)'
  - id: nequi-flow-envio                # el Flow de datos de envío (se publica en
    # Meta con `whatsapp_provision.py flows`): la llave de Hubara no viaja; el
    # cliente recibe sus datos de pago al registrar el pedido
    files: ["hubara_agency/docs/whatsapp_flows/*.json"]
    from: "Nequi o llave 3229041190."
    to: "Nequi o llave (te enviamos los datos al registrar el pedido)."
  - id: telefono-operador-formatos     # el mismo número del operador en
    # formatos sin `wa_` (tests de resolución de teléfono, ETA, comentarios)
    files: ["**"]
    from: "312-567-1604"
    to: "300-000-0000"
  - id: telefono-operador-espacios
    files: ["**"]
    from: "312 567 1604"
    to: "300 000 0000"
  - id: telefono-operador-crudo
    files: ["**"]
    from: "3125671604"
    to: "3000000000"
  - id: telefono-nequi-espacio          # "+57 322 9041190" (comentarios del catálogo)
    files: ["**"]
    from: "322 9041190"
    to: "300 0000001"
  - id: telefono-nequi-crudo            # la llave Nequi de Hubara en tests,
    # fixtures y comentarios. El VALOR que usa el bot vive en el dominio de
    # la tienda (domain.yaml: commerce), que el clon recibe del cliente.
    files: ["**"]
    from: "3229041190"
    to: "3000000001"
  # ── App Operador nativa (android_operator/): el applicationId es único en
  # Google Play y en el proyecto Firebase — el clon publica SU app. El
  # namespace Kotlin `com.hubara.operator` es del motor y no se toca. ──────
  - id: app-operador-id
    files: ["**"]
    from: "com.acktos.operator"
    to: "{{android_app_id}}"
