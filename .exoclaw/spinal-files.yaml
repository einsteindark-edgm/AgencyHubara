# Spinal files declaration
#
# Spinal files are files that MULTIPLE atomic features will modify (not create).
# They are the "skeleton" of the codebase — registries, factories, catalogs,
# shared DTOs — so by definition they are conflict-prone when N features are
# implemented in parallel.
#
# The exoclaw-task-planner-archon skill reads this file to:
#   - classify each task's §3 files as `affects_new_files` vs `affects_spinal_files`
#   - compute parallel_batches such that no two tasks in the same batch share
#     a spinal file
#
# The exoclaw-implementer-archon skill reads this file to:
#   - know which files to ALSO declare wiring_intents for (in addition to
#     editing them locally for tests)
#
# The exoclaw-merger-archon skill reads this file to:
#   - know which files to consolidate via wiring_intents (and which to merge
#     normally with git's 3-way merge)
#
# Each entry declares:
#   - path: relative path from repo root (supports globs)
#   - kind: the semantic kind of insertions this file accepts. Determines how
#     the merger combines wiring_intents.
#     Supported kinds:
#       - python_registry: function-call lines in a known block (e.g., register_tool_extension(...))
#       - python_factory_module: top-level @lru_cache factory functions
#       - python_dataclass_module: top-level @dataclass(frozen=True) classes
#       - python_workflow_list: items in workflows=[...] / activities=[...] lists
#       - markdown_section_append: append new ## sections under a heading anchor
#       - markdown_list_append: append items to a known bullet list
#   - anchor: optional regex / string the merger uses to locate the insertion
#     point. If omitted, defaults to end-of-file (or end-of-block for python).
#
# This file is per-repo. For multi-agent repos, list every agent's spinal files
# (one entry per file). The planner/merger filters by path prefix when needed.

version: 1

spinal_files:
  # Worker registration — every new tool/activity/workflow adds itself here
  - path: src/*/worker.py
    kind: python_workflow_list
    anchors:
      workflows: "workflows=["
      activities: "activities=["
      tool_extensions: "register_tool_extension("

  # Composition factories — every new tool/use case/state adapter adds a factory
  - path: src/*/composition.py
    kind: python_factory_module
    # No anchor needed; merger appends factories at end of file in alphabetical
    # order of factory name, after consolidating their imports.

  # Boundary DTOs — multiple features may add new @dataclass DTOs
  - path: src/*/contracts.py
    kind: python_dataclass_module
    # No anchor; merger groups DTOs by topic comment if present, else appends.

  # Cross-agent contracts (multi-agent repos only)
  - path: src/platform/contracts.py
    kind: python_dataclass_module

  # Workspace tool catalog — every new tool adds a ## section
  - path: workspace/TOOLS.md
    kind: markdown_section_append
    anchors:
      tools_section: "^## Tools"
      # The merger appends ### subsections under "## Tools"

  # Workspace identity/persona files — appended deltas
  - path: workspace/IDENTITY.md
    kind: markdown_section_append

  - path: workspace/SOUL.md
    kind: markdown_section_append

  - path: workspace/AGENTS.md
    kind: markdown_section_append

  # Workflow prompts module — shared constants
  - path: src/*/prompts.py
    kind: python_factory_module
    # Constants are top-level assignments; merger appends in alphabetical order.

# Default behavior for files NOT listed here:
#   - If a task's §3 marks the file as `new` → no conflict possible (each task
#     in its own worktree creates its own new file under a unique path).
#   - If a task's §3 marks the file as `modify` and the file is NOT spinal →
#     the planner will warn and require the operator to either:
#       (a) declare it spinal here, or
#       (b) refactor the plan so only one task touches it
#     The planner refuses to compute parallel batches that touch undeclared
#     non-spinal modify files (the merger has no rule to combine them).
