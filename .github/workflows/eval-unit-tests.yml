name: Eval Unit Tests

# Corre los UNIT EVAL del harness de calidad del Asesor de Ventas en cada PR a la
# rama principal. Son tests DETERMINISTAS (sin juez LLM, sin red): redacción PII,
# reconstrucción de conversaciones, métricas deterministas (saludo/estilo), rúbrica
# del guion, selección/muestreo, auto-curación (parte pura) y el API de curación.
#
# Los tests que necesitan un juez LLM vivo (`tests/evals/test_sales_goldens.py`,
# gated por RUN_EVAL_TESTS) se SALTEAN solos en CI — no se gatea el merge con un
# juez ruidoso. Este job es un required check: si falla, el PR no se puede mergear.

on:
  pull_request:
    branches: [main, master]

# Permisos para el reporte (Job Summary), el comentario en el PR y las anotaciones.
permissions:
  contents: read
  checks: write
  pull-requests: write

# Un PR que recibe pushes seguidos cancela el run anterior.
concurrency:
  group: eval-unit-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-eval:
    name: Unit eval (harness DeepEval)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11" # mismo Python que prod (Dockerfile FROM uv:python3.11)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Sin `--extra evals`: los tests deterministas NO necesitan deepeval, y los
      # módulos del harness son importables sin él (guards). Más rápido + estable.
      - name: Sync deps (workspace, sin extra evals)
        run: uv sync --frozen

      - name: Run unit eval tests
        working-directory: hubara_agency
        run: uv run pytest tests/evals/ -v --junit-xml=../eval-results.xml

      # Reporte VISUAL "qué se evaluó": resultados + las 9 métricas de calidad + el
      # golden dataset (escenarios + resultado esperado) + los invariantes del guion.
      # Va al Job Summary del run. `if: always()` → también se ve cuando algo falla.
      - name: Reporte visual (qué se evaluó + resultados)
        if: always()
        working-directory: hubara_agency
        run: |
          uv run python scripts/eval_ci_report.py ../eval-results.xml \
            | tee ../eval-report.md >> "$GITHUB_STEP_SUMMARY"

      # Mismo reporte como comentario (sticky: se actualiza, no spamea) en el PR,
      # para verlo sin entrar a Actions.
      - name: Comentar el reporte en el PR
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: eval-report
          path: eval-report.md

      # Anotaciones inline en los tests que fallan (la línea exacta en el diff).
      # `annotate_only` + `detailed_summary: false` → no duplica el resumen (ese ya
      # lo da el reporte visual). `fail_on_failure` por si pytest no hubiera fallado.
      - name: Anotaciones inline en tests fallidos
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: eval-results.xml
          annotate_only: true
          detailed_summary: false
          include_passed: false
          fail_on_failure: true
          require_tests: true
