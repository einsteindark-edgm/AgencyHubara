# Backend (API + 6 workers + LiteLLM + Caddy) → GHCR → cajas EC2 por tenant.
# Coincide con INFRASTRUCTURE.md §3.3-3.8 + la prod compose en infra/compose/.
#
# Flujo: build imagen única (Dockerfile raíz) → push a GHCR → por tenant:
#   resolver IP del host (output de ../terraform/compute) → SSH → render .env
#   desde SSM (instance profile) → docker compose pull && up -d.
#
# Secrets/vars requeridos:
#   secret EC2_SSH_KEY           clave privada del key pair (var ssh_public_key en compute)
#   var    AWS_REGION, AWS_TERRAFORM_ROLE_ARN, TF_STATE_BUCKET, TF_STATE_LOCK_TABLE
name: Backend deploy

on:
  push:
    branches: [main]
    paths:
      - "hubara_agency/**"
      - "exoclaw-temporal/**"
      - "Dockerfile"
      - "infra/compose/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write   # push a GHCR

# Un deploy a la vez: merges en ráfaga se ENCOLAN en vez de correr en paralelo
# contra la misma caja (los force-recreate entrelazados chocan el name
# allocation de litellm y dejan el stack a medias — outage 2026-08-31, 6
# merges en ~1 min). cancel-in-progress: false porque cancelar un deploy a
# mitad es lo que deja containers renombrados huérfanos; GitHub colapsa los
# pendientes al último SHA, así que el HEAD igual gana.
concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Image ref (lowercase)
        id: meta
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${OWNER}/agencyhubara:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # buildx con driver docker-container → necesario para el cache export (type=gha).
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tenant: [hubara]   # sumá vincenzo cuando tenga su caja + secretos
    steps:
      - uses: actions/checkout@v4

      # Resolver IP del host + endpoint OTLP desde el state de compute.
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_TF_READONLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.14.9"
          terraform_wrapper: false

      - name: Resolver host
        id: host
        working-directory: infra/terraform/compute
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}" \
            -backend-config="key=compute/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true"
          IP="$(terraform output -json app_hosts | jq -r '.["${{ matrix.tenant }}"].public_ip')"
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          # OTLP es OPCIONAL: si no desplegaste SigNoz, ese output no existe → queda
          # vacío (el render cae a ConsoleSpanExporter). El `|| true` evita que el
          # `set -e` de Actions aborte el step y deje la IP sin setear.
          OTLP="$(terraform output -json observability_host 2>/dev/null | jq -r '.otlp_grpc // empty' 2>/dev/null || true)"
          echo "otlp=${OTLP:+http://$OTLP}" >> "$GITHUB_OUTPUT"

      # Copiar artefactos de deploy a la caja.
      - name: Copiar compose + scripts + manifests
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ steps.host.outputs.ip }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "infra/compose/docker-compose.prod.yml,infra/compose/render-env-from-ssm.sh,exoclaw-temporal/litellm_config.yaml,frontend_dashboard/src/plugins"
          target: "/tmp/hubara-deploy"
          strip_components: 0

      - name: Deploy (render .env desde SSM + compose up)
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          HUBARA_IMAGE: ${{ needs.build.outputs.image }}
          OTEL_ENDPOINT: ${{ steps.host.outputs.otlp }}
          GHCR_OWNER: ${{ github.repository_owner }}
        with:
          host: ${{ steps.host.outputs.ip }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: HUBARA_IMAGE,OTEL_ENDPOINT,GHCR_OWNER
          script: |
            set -euo pipefail
            sudo mkdir -p /opt/hubara
            sudo chown -R ec2-user:ec2-user /opt/hubara
            cp /tmp/hubara-deploy/infra/compose/docker-compose.prod.yml /opt/hubara/docker-compose.yml
            cp /tmp/hubara-deploy/infra/compose/render-env-from-ssm.sh    /opt/hubara/
            cp /tmp/hubara-deploy/exoclaw-temporal/litellm_config.yaml    /opt/hubara/litellm_config.yaml
            cd /opt/hubara
            chmod +x render-env-from-ssm.sh
            HUBARA_IMAGE="$HUBARA_IMAGE" OTEL_ENDPOINT="$OTEL_ENDPOINT" ./render-env-from-ssm.sh
            GHCR_TOKEN="$(grep '^GHCR_PULL_TOKEN=' .env | cut -d= -f2-)"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_OWNER" --password-stdin
            docker compose pull
            # Manifests DESPUÉS del pull y SIN `rm -rf` del directorio: `./plugins`
            # es el bind mount de `api` (/app/frontend_dashboard/src/plugins). Si se
            # borra y recrea el dir mientras el container viejo sigue corriendo (p.ej.
            # el login a GHCR falló y nunca llegamos al `up -d`), el mount queda
            # apuntando al inode viejo y `GET /api/agents` devuelve `{"agents":[]}`
            # aunque `GET /` siga listando plugins (incidente 2026-09-04, token GHCR
            # vencido). Vaciar el contenido conserva el inode; hacerlo tras el pull
            # garantiza que el `up -d` que sigue recrea los containers.
            mkdir -p /opt/hubara/plugins
            find /opt/hubara/plugins -mindepth 1 -delete
            cp -r /tmp/hubara-deploy/frontend_dashboard/src/plugins/. /opt/hubara/plugins/
            # litellm: recrear SIEMPRE desde cero — su config es un bind-mount
            # y `up -d` no recrea el container cuando solo cambió el CONTENIDO
            # del archivo (imagen/definición idénticas) → seguiría sirviendo
            # el config viejo en memoria. Caso: alias gemini-multimodal.
            # `rm -sf` + `up -d` en vez de `--force-recreate`: compose remueve
            # por labels TODOS los containers del servicio, incluidos los
            # renombrados '<id>_<nombre>' que deja un recreate interrumpido y
            # que chocan el name allocation del siguiente (outage 2026-08-31,
            # deploys concurrentes). Sin nombres hardcodeados acá (gate de
            # forge). El resto del stack espera su healthcheck
            # (depends_on: service_healthy), así que el orden es seguro.
            docker compose rm -sf litellm
            docker compose up -d litellm
            docker compose up -d --remove-orphans
            docker image prune -f
