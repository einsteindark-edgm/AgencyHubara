# Build del dashboard (Vite) por tenant → S3 + invalidación de CloudFront.
# Coincide con INFRASTRUCTURE.md §3.1.
#
# Lee la config de build (bucket, distribution id, api_url) del OUTPUT de Terraform
# `build_config` (fuente única) usando el rol amplio de solo-lectura del state; el
# upload usa el rol angosto de deploy. Sin llaves estáticas (OIDC).
#
# Agregar un tenant = sumarlo a la matriz Y a tenants.auto.tfvars.
name: Frontend deploy

on:
  push:
    branches: [main]
    paths: ["frontend_dashboard/**", ".github/workflows/frontend-deploy.yml"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tenant: [hubara, vincenzo]
    steps:
      - uses: actions/checkout@v4

      # 1) Leer build_config del state (rol amplio, solo lectura acá).
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Resolver config del tenant
        id: cfg
        working-directory: infra/terraform/platform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}" \
            -backend-config="key=platform/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true"
          CFG="$(terraform output -json build_config | jq -r '.["${{ matrix.tenant }}"]')"
          echo "bucket=$(echo "$CFG" | jq -r .bucket)"       >> "$GITHUB_OUTPUT"
          echo "dist=$(echo "$CFG" | jq -r .distribution_id)" >> "$GITHUB_OUTPUT"
          echo "api_url=$(echo "$CFG" | jq -r .api_url)"      >> "$GITHUB_OUTPUT"
          # Cognito (OIDC): el frontend exige login si VITE_COGNITO_* están seteadas.
          # authority = issuer del pool (region + user_pool_id). SIN esto el build
          # sale sin auth → el dashboard rompe contra la API (que sí exige JWT).
          echo "cognito_authority=https://cognito-idp.$(echo "$CFG" | jq -r .region).amazonaws.com/$(echo "$CFG" | jq -r .user_pool_id)" >> "$GITHUB_OUTPUT"
          echo "cognito_client_id=$(echo "$CFG" | jq -r .app_client_id)" >> "$GITHUB_OUTPUT"

      # 2) Build del frontend con el VITE_API_URL del tenant.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend_dashboard/package-lock.json

      - name: Build
        working-directory: frontend_dashboard
        env:
          VITE_API_URL: ${{ steps.cfg.outputs.api_url }}
          VITE_COGNITO_AUTHORITY: ${{ steps.cfg.outputs.cognito_authority }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.cfg.outputs.cognito_client_id }}
          # VITE_COGNITO_REDIRECT_URI: opcional — default a `${window.location.origin}/callback`
          #   en runtime (= la URL de CloudFront). Registrar ese callback en el app client.
          # VITE_OTEL_EXPORTER_URL: opcional — solo si exponés el collector a browsers (ver doc §3.10).
        run: |
          npm ci
          npm run build

      # 3) Subir a S3 + invalidar CloudFront (rol angosto de deploy).
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync + invalidate
        run: |
          aws s3 sync frontend_dashboard/dist "s3://${{ steps.cfg.outputs.bucket }}" --delete
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.cfg.outputs.dist }}" \
            --paths "/*"
