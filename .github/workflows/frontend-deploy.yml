# Build del dashboard (Vite) por tenant → S3 + invalidación de CloudFront.
# Coincide con INFRASTRUCTURE.md §3.1.
#
# Lee la config de build (bucket, distribution id, api_url) del OUTPUT de Terraform
# `build_config` (fuente única) usando el rol amplio de solo-lectura del state; el
# upload usa el rol angosto de deploy. Sin llaves estáticas (OIDC).
#
# Agregar un tenant = sumarlo a la matriz Y a tenants.auto.tfvars.
name: Frontend deploy

on:
  push:
    branches: [main]
    # android_operator/screens/: las pantallas de la App Operador que define el servidor salen con este deploy.
    paths: ["frontend_dashboard/**", "android_operator/screens/**", ".github/workflows/frontend-deploy.yml"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Un deploy a la vez: merges en ráfaga se ENCOLAN en vez de correr en paralelo
# contra el mismo bucket. Dos `s3 sync --delete` solapados se borran entre sí
# los assets hasheados y queda un index.html apuntando a un entry que ya no
# existe → CloudFront devuelve el fallback SPA (text/html) para el .js →
# dashboard en blanco con ambos runs en "success" (incidente 2026-09-18, runs
# 35361542201 + 35361559934). cancel-in-progress: false porque cancelar un sync
# a mitad deja el bucket a medias; GitHub colapsa los pendientes al último SHA,
# así que el HEAD igual gana. Mismo guard que backend-deploy.yml.
concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tenant: [hubara, vincenzo]
    steps:
      - uses: actions/checkout@v4

      # 1) Leer build_config del state (rol amplio, solo lectura acá).
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_TF_READONLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.14.9"
          terraform_wrapper: false

      - name: Resolver config del tenant
        id: cfg
        working-directory: infra/terraform/platform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}" \
            -backend-config="key=platform/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true"
          CFG="$(terraform output -json build_config | jq -r '.["${{ matrix.tenant }}"]')"
          echo "bucket=$(echo "$CFG" | jq -r .bucket)"       >> "$GITHUB_OUTPUT"
          echo "dist=$(echo "$CFG" | jq -r .distribution_id)" >> "$GITHUB_OUTPUT"
          echo "api_url=$(echo "$CFG" | jq -r .api_url)"      >> "$GITHUB_OUTPUT"
          # Cognito (OIDC): el frontend exige login si VITE_COGNITO_* están seteadas.
          # authority = issuer del pool (region + user_pool_id). SIN esto el build
          # sale sin auth → el dashboard rompe contra la API (que sí exige JWT).
          echo "cognito_authority=https://cognito-idp.$(echo "$CFG" | jq -r .region).amazonaws.com/$(echo "$CFG" | jq -r .user_pool_id)" >> "$GITHUB_OUTPUT"
          echo "cognito_client_id=$(echo "$CFG" | jq -r .app_client_id)" >> "$GITHUB_OUTPUT"
          # App Operador (Android): región de Cognito y el bloque `mobile` del tenant (vacío si aún no hay apply).
          echo "region=$(echo "$CFG" | jq -r .region)" >> "$GITHUB_OUTPUT"
          echo "mobile_privacy_url=$(echo "$CFG" | jq -r '.mobile.privacy_url // ""')" >> "$GITHUB_OUTPUT"
          echo "mobile_min_version=$(echo "$CFG" | jq -r '.mobile.min_version_code // 0')" >> "$GITHUB_OUTPUT"

      # 2) Build del frontend con el VITE_API_URL del tenant.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend_dashboard/package-lock.json

      - name: Build
        working-directory: frontend_dashboard
        env:
          VITE_API_URL: ${{ steps.cfg.outputs.api_url }}
          VITE_COGNITO_AUTHORITY: ${{ steps.cfg.outputs.cognito_authority }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.cfg.outputs.cognito_client_id }}
          # VITE_COGNITO_REDIRECT_URI: opcional — default a `${window.location.origin}/callback`
          #   en runtime (= la URL de CloudFront). Registrar ese callback en el app client.
          # VITE_OTEL_EXPORTER_URL: opcional — solo si exponés el collector a browsers (ver doc §3.10).
        run: |
          npm ci
          npm run build

      # 2b) Configuración de la App Operador: la app solo trae fija la URL <cloudfront>/mobile/config.json y de aquí
      #     aprende a qué backend ir (api_url), Cognito, la política de privacidad y la versión mínima. Mismos valores
      #     que el build del dashboard: cambiar api_url en Terraform + este deploy = la app va al servidor nuevo sin
      #     publicar otra versión. Receta: docs/mobile-native/publicar-en-google-play.html.
      - name: Configuración de la App Operador (mobile/config.json)
        env:
          API_URL: ${{ steps.cfg.outputs.api_url }}
          REGION: ${{ steps.cfg.outputs.region }}
          CLIENT_ID: ${{ steps.cfg.outputs.cognito_client_id }}
          PRIVACY_URL: ${{ steps.cfg.outputs.mobile_privacy_url }}
          MIN_VERSION: ${{ steps.cfg.outputs.mobile_min_version }}
        run: |
          mkdir -p frontend_dashboard/dist/mobile
          jq -n --arg api "$API_URL" --arg region "$REGION" --arg client "$CLIENT_ID" --arg privacy "$PRIVACY_URL" \
            --argjson min "${MIN_VERSION:-0}" \
            '{version: 1, api_base_url: $api, cognito_region: $region, cognito_client_id: $client, min_version_code: $min}
             + (if $privacy == "" then {} else {privacy_url: $privacy} end)' \
            > frontend_dashboard/dist/mobile/config.json
          cat frontend_dashboard/dist/mobile/config.json

      # 2c) Pantallas de la App Operador (Server-Driven UI): los archivos de android_operator/screens/ quedan en
      #     <cloudfront>/mobile/screens/, junto a config.json, y la app los baja de ahí. Una pantalla nueva o cambiada
      #     sale con este deploy, SIN publicar otra versión en Google Play. La CI de Android (ScreensRepoTest) ya los
      #     validó en el PR contra el catálogo de la app; aquí solo se revisa que sean JSON. Los esquemas del editor
      #     (*.schema.json) no se publican. Guía: android_operator/screens/README.md.
      - name: Pantallas de la App Operador (mobile/screens/)
        run: |
          mkdir -p frontend_dashboard/dist/mobile/screens
          for f in android_operator/screens/*.json; do
            case "$f" in *.schema.json) continue ;; esac
            jq empty "$f"
            cp "$f" frontend_dashboard/dist/mobile/screens/
          done
          ls frontend_dashboard/dist/mobile/screens

      # 3) Subir a S3 + invalidar CloudFront (rol angosto de deploy).
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync + invalidate
        run: |
          aws s3 sync frontend_dashboard/dist "s3://${{ steps.cfg.outputs.bucket }}" --delete
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.cfg.outputs.dist }}" \
            --paths "/*"
