# Golden Eval — corre el AGENTE DE VENTAS REAL + JUEZ REAL contra el golden set.
#
# Cuándo corre (Ciclo Colossus F4, 2026-11-03):
#   • A mano (workflow_dispatch) desde la pestaña Actions, con sus entradas.
#   • En cada PR que toca cómo vende el bot (paquetes de decisión, prompts del
#     asesor) o cómo trabajan los agentes del ciclo (CLAUDE.md, .claude/skills):
#     deja UN comentario con el resumen y lo actualiza en cada corrida.
#   • Cada domingo a las 06:00 de Bogotá (11:00 UTC), con el paquete que corre
#     la tienda.
# NO es un gate de PR (el agente+juez son no-deterministas) — es un reporte de
# scores. Una corrida nueva del mismo PR (o rama) cancela la anterior.
#
# REQUIERE estos GitHub Secrets (Settings -> Secrets and variables -> Actions):
#   DEEPSEEK_API_KEY  — el modelo del agente (igual que prod)
#   GEMINI_API_KEY    — el modelo del juez (igual que SigNoz)
# (Opcional LITELLM_MASTER_KEY si tu litellm_config.yaml valida master key.)
# Sin ellos (p.ej. un PR desde un fork, que no recibe secretos) el job se salta
# sin fallar.
#
# Fidelidad: el agente corre su loop real con tools reales, pero los puertos de
# ESCRITURA quedan stub (no se setean MEDUSA_REGION_ID/SALES_CHANNEL_ID ->
# StubOrderRegistration) y NO se corre el flush de envíos -> cero órdenes/mensajes
# reales. El catálogo viene del snapshot committeado (catalog_snapshot.json).
# Los escenarios son sintéticos: el reporte puede ir en un PR del repo público.
name: Golden Eval (agente real · juez real)

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "id(s) de escenario, separados por coma (opcional; default = los 61)"
        required: false
      category:
        description: "categoría (opcional): apertura|descubrimiento|recomendacion|objeciones|objeciones_avanzadas|escalation|cierre|cierre_edge|robustez|estilo|real|desvio|indecision|adversarial|formato|catalogo_edge"
        required: false
      limit:
        description: "correr solo los primeros N (opcional)"
        required: false
      repeat:
        description: "correr cada escenario N veces (trending; default 1)"
        required: false
      no_judge:
        description: "true = solo behaviors deterministas, sin juez LLM (rápido y barato)"
        required: false
        type: boolean
        default: false
      bundle:
        description: "paquete de decisión (opcional; vacío = el del código, ventas). Para evaluar lo que corre la tienda, el que nombra Terraform (tenants.<t>.lab.decisions_bundle)"
        required: false
  pull_request:
    paths:
      - "hubara_agency/src/plugins/chats/shared/decisions/bundles/**"
      - "hubara_agency/src/plugins/chats/agent/sales/workspace/**"
      - "hubara_agency/src/plugins/chats/agent/sales/prompts.py"
      - "CLAUDE.md"
      - ".claude/skills/**"
  schedule:
    # Domingos 11:00 UTC = 06:00 Bogotá (UTC−5).
    - cron: "0 11 * * 0"

concurrency:
  group: golden-eval-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Sin llaves de los modelos no hay qué correr: el job del eval queda
  # «skipped» (no rojo). Pasa con los PR desde un fork, que no reciben secretos.
  llaves:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - name: ¿Hay llaves de los modelos?
        id: check
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$DEEPSEEK_API_KEY" ] && [ -n "$GEMINI_API_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Golden eval saltado: faltan DEEPSEEK_API_KEY o GEMINI_API_KEY (PR desde un fork o repo sin secretos)." >> "$GITHUB_STEP_SUMMARY"
          fi

  golden-eval:
    needs: llaves
    if: needs.llaves.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # El comentario con el resumen en el PR (y la lista de archivos del PR).
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Paquete de decisión a evaluar
        id: bundle
        env:
          EVENT: ${{ github.event_name }}
          INPUT_BUNDLE: ${{ inputs.bundle }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # A mano: la entrada `bundle` (vacía = el del código, ventas). En el
          # cron y en los PR: el que corre la tienda, el `decisions_bundle` del
          # tenant hubara en Terraform (tenants.auto.tfvars). Si el PR toca UN
          # solo paquete, ese paquete (es el que cambió).
          bundles=hubara_agency/src/plugins/chats/shared/decisions/bundles
          if [ "$EVENT" = "workflow_dispatch" ]; then
            bundle="$INPUT_BUNDLE"
          else
            bundle=$(awk '/^  hubara = \{/,/^  \}/' infra/terraform/platform/tenants.auto.tfvars \
              | sed -n 's/^ *decisions_bundle *= *"\([a-z0-9-]*\)".*/\1/p' | head -1)
            if [ "$EVENT" = "pull_request" ]; then
              touched=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' \
                | sed -n "s#^$bundles/\([a-z0-9-]*\)/.*#\1#p" | sort -u)
              if [ "$(printf '%s\n' "$touched" | grep -c .)" = "1" ] && [ -d "$bundles/$touched" ]; then
                bundle="$touched"
              fi
            fi
          fi
          if [ -n "$bundle" ] && ! printf '%s' "$bundle" | grep -Eq '^[a-z][a-z0-9-]{0,39}$'; then
            echo "paquete inválido: $bundle" >&2
            exit 1
          fi
          echo "id=$bundle" >> "$GITHUB_OUTPUT"

      - name: Levantar litellm (modelos reales)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          docker run -d --name litellm -p 4000:4000 \
            -v "${{ github.workspace }}/exoclaw-temporal/litellm_config.yaml:/app/config.yaml:ro" \
            -e DEEPSEEK_API_KEY -e GEMINI_API_KEY \
            ghcr.io/berriai/litellm:v1.86.2@sha256:cae1ac3492d6d0bea69c26f4485381624e073eb753f3534ae7703a4204a4ce6b --config /app/config.yaml --port 4000
          echo "Esperando litellm…"
          for i in $(seq 1 40); do
            if curl -sf http://localhost:4000/health/liveliness >/dev/null 2>&1; then
              echo "litellm listo tras ${i} intentos"; break; fi
            sleep 3
          done
          curl -sf http://localhost:4000/health/liveliness || (docker logs litellm | tail -40; exit 1)

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.11"

      - name: Instalar deps (con evals)
        working-directory: hubara_agency
        run: uv sync --frozen --extra evals

      - name: Correr golden-eval
        working-directory: hubara_agency
        env:
          API_BASE_LLMLITE: http://localhost:4000
          LITELLM_API_KEY: sk-litellm-proxy-local
          OTEL_SDK_DISABLED: "true"
          GOLDEN_EVAL_VAULT: /tmp/golden_eval_vault
          EVAL_JUDGE_MODEL: litellm_proxy/gemini-pro-judge
          # El paquete de decisión que evalúa (PAQUETES_DE_DECISION.md §9). Por
          # env y no en el script: es texto del operador.
          SALES_DECISIONS_BUNDLE: ${{ steps.bundle.outputs.id }}
          # Las entradas de la corrida a mano (vacías en un PR o en el cron).
          IN_SCENARIO: ${{ inputs.scenario }}
          IN_CATEGORY: ${{ inputs.category }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_REPEAT: ${{ inputs.repeat }}
          IN_NO_JUDGE: ${{ inputs.no_judge }}
        run: |
          echo "Paquete de decisión: ${SALES_DECISIONS_BUNDLE:-ventas (el del código)}" >> "$GITHUB_STEP_SUMMARY"
          ARGS=()
          if [ -n "$IN_SCENARIO" ]; then ARGS+=(--scenario "$IN_SCENARIO"); fi
          if [ -n "$IN_CATEGORY" ]; then ARGS+=(--category "$IN_CATEGORY"); fi
          if [ -n "$IN_LIMIT" ]; then ARGS+=(--limit "$IN_LIMIT"); fi
          if [ -n "$IN_REPEAT" ]; then ARGS+=(--repeat "$IN_REPEAT"); fi
          if [ "$IN_NO_JUDGE" = "true" ]; then ARGS+=(--no-judge); fi
          set -o pipefail
          uv run --extra evals python scripts/golden_eval.py "${ARGS[@]}" \
            --report-md /tmp/report.md --json /tmp/golden.json 2>&1 | tee /tmp/golden.log
          # el reporte lindo (agrupado por categoría) va al resumen del run
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comentar el resumen en el PR
        # Un solo comentario por PR: lo busca por el marcador y lo actualiza.
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUNDLE: ${{ steps.bundle.outputs.id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -s /tmp/report.md ]; then
            echo "Sin reporte (la corrida no llegó al final): no se comenta."
            exit 0
          fi
          marker='<!-- golden-eval-report -->'
          {
            echo "$marker"
            awk '/^## Detalle/ { exit } { print }' /tmp/report.md
            echo
            echo "Paquete de decisión evaluado: \`${BUNDLE:-ventas}\`. El detalle por escenario y el scorecard están en [la corrida]($RUN_URL)."
            echo
            echo "_Es un reporte, no un check obligatorio: el agente y el juez no son deterministas. Se actualiza en cada corrida._"
          } > /tmp/comment.md
          id=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@/tmp/comment.md > /dev/null
            echo "comentario $id actualizado"
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@/tmp/comment.md > /dev/null
            echo "comentario nuevo"
          fi

      - name: Subir log + json + reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-eval-resultados
          path: |
            /tmp/golden.log
            /tmp/golden.json
            /tmp/report.md
