model_list:
  - model_name: deepseek-v4-flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: "os.environ/DEEPSEEK_API_KEY"
      override_raw_request_params:
      api_key: "os.environ/DEEPSEEK_API_KEY"
    
  - model_name: gemini-backup
    litellm_params:
      model: gemini/gemini-3.1-flash-lite-preview
      api_key: "os.environ/GEMINI_API_KEY"
      override_raw_request_params:
      api_key: "os.environ/GEMINI_API_KEY"

  # Juez frontier del golden-eval: Gemini Pro 3.1 — independiente del agente
  # (DeepSeek) y mucho más fuerte que el flash-lite (que daba falsos negativos,
  # ej. no_hallucination 0.0 -> 1.0 con un juez capaz). Misma GEMINI_API_KEY.
  - model_name: gemini-pro-judge
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: "os.environ/GEMINI_API_KEY"

  # Multimodal de soporte del chat de sales (audio + visión): transcribe
  # notas de voz y describe/clasifica imágenes inbound; el texto se reinyecta
  # al agente text-only (DeepSeek). Consumido por
  # hubara_agency/src/platform/{audio,vision}/litellm_adapter.py como
  # `litellm_proxy/gemini-multimodal`. Flash-Lite estable (no preview): barato
  # y suficiente para STT + clasificación de comprobantes.
  - model_name: gemini-multimodal
    litellm_params:
      model: gemini/gemini-2.5-flash-lite
      api_key: "os.environ/GEMINI_API_KEY"

router_settings:
  # 'simple-shuffle' es la estrategia estándar. 
  # Como cada model_name tiene solo un proveedor, siempre elegirá ese.
  routing_strategy: simple-shuffle
  num_retries: 1
  # El failover se activa aquí: si falla 'deepseek-v4-flash', salta a 'gemini-backup'
  fallbacks: [{"deepseek-v4-flash": ["gemini-backup"]}]
  drop_params: True