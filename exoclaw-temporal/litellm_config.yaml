model_list:
  # Alias del AGENTE (sales + remarketing) — DEFAULT_LLM_MODEL apunta acá.
  #
  # THINKING APAGADO A PROPÓSITO (2026-08-05). Para un chat de ventas con
  # restricciones duras (no vosear, no inventar productos fuera del catálogo,
  # guion por etapa) el razonamiento explícito DEGRADA el seguimiento de
  # instrucciones: "When Thinking Fails" (NeurIPS 2025) mide que 13 de 14
  # modelos empeoran en IFEval con CoT porque el razonamiento desvía la
  # atención de los tokens de la restricción. Los números propios de DeepSeek
  # dicen lo mismo para nuestro perfil: Non-Think→Think High compra +33 en
  # LiveCodeBench pero sólo +3.4 en MMLU-Pro. No vendemos código.
  #
  # POR QUÉ ACÁ Y NO EN registries.py — medido contra la API real:
  #   thinking ausente             → DeepSeek razona IGUAL (default del server)
  #   thinking {"type":"enabled"}  → razona
  #   thinking {"type":"disabled"} → NO razona (reasoning_tokens=None)
  # y litellm sólo sabe emitir "enabled": su DeepSeekChatConfig.map_openai_params
  # tiene una whitelist que descarta cualquier otro valor de thinking /
  # reasoning_effort. `extra_body` es el ÚNICO canal que llega crudo al upstream
  # (no pasa por el mapper) — y GANA sobre el reasoning_effort del caller.
  # Sacar `reasoning_effort` del código SIN esto habría sido un PLACEBO.
  #
  # Guard: hubara_agency/tests/platform/test_llm_thinking_disabled.py asierta el
  # BODY que sale (no el YAML) montando este model_list en un litellm.Router.
  #
  # MODELO UPSTREAM = `deepseek-flash` (DeepSeek-V4.1-Flash, 2026-09-10). El
  # nombre del alias (`deepseek-v4-flash`) se CONSERVA a propósito: es la clave
  # de DEFAULT_LLM_MODEL, de deploy/openlit/pricing.json y de los dashboards
  # SigNoz. Lo que cambia es el id que recibe api.deepseek.com: el viejo
  # `deepseek-v4-flash` quedó RETIRADO y sólo rutea "temporalmente" a V4.1
  # Flash; `deepseek-v4-pro` rutea a V4.1 Flash desde el 2026-09-14 (12:00
  # Beijing) hasta que salga V4.1 Pro. Fuente: api-docs.deepseek.com/quick_start/
  # pricing (notas 1 y 2). Guard del id: test_llm_thinking_disabled.py.
  #
  - model_name: deepseek-v4-flash
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: "os.environ/DEEPSEEK_API_KEY"
      extra_body:
        thinking:
          type: disabled

  # Mismo modelo CON thinking (el default del servidor, sin extra_body). Existe
  # para dos cosas: el brazo B del golden eval (`scripts/golden_eval.py` con
  # DEFAULT_LLM_MODEL=deepseek/deepseek-v4-flash-thinking) y rollback por env
  # sin tocar el proxy ni redeployar.
  - model_name: deepseek-v4-flash-thinking
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: "os.environ/DEEPSEEK_API_KEY"

  # FALLBACK CONVERSACIONAL del agente (router_settings.fallbacks, abajo) y
  # default de CUSTOMER_SUMMARY_MODEL (hubara_agency/src/platform/config.py).
  # Atiende CLIENTES con tool-calling cuando DeepSeek falla → el id upstream
  # tiene que ser ESTABLE: nunca `-preview` / `-exp` / `-latest` (lección L-23).
  #
  # Hasta 2026-09-18 apuntaba a `gemini-3.1-flash-lite-preview`, que la tabla
  # oficial da por APAGADO desde el 2026-05-25 (aviso de ~2,5 semanas). Medido
  # en prod ese día: seguía contestando 200 sólo porque Google lo redirige en
  # silencio al GA (`modelVersion=gemini-3.1-flash-lite`) — una cortesía sin
  # fecha. Como los dos consumidores tragan el error (el fallback sólo se usa
  # cuando DeepSeek ya falló; `llm_summary` es never-raises), el día que corten
  # el redirect NADIE se habría enterado.
  #
  # POR QUÉ 3.5 y no `gemini-3.1-flash-lite`: el 3.1 GA ya tiene shutdown
  # publicado (2027-05-07, reemplazo = este mismo 3.5) — migrar ahí era agendar
  # esta misma tarea otra vez. El 3.5 es GA (2026-07-21), sin fecha de shutdown,
  # y es el más capaz de la línea flash-lite, que es lo que importa en un
  # fallback que conversa y llama tools. Costo de lista: $0.30 in / $2.50 out
  # por 1M (3.1: $0.25 / $1.50); sólo se paga cuando DeepSeek falla + resúmenes.
  #
  # Probado con el MISMO litellm del proxy de prod (v1.86.2) y la key real:
  # texto plano, tool call, ida y vuelta del tool call propio, y — el caso real
  # del failover — un historial con tool calls hechos por DeepSeek (sin thought
  # signature de Gemini): los cuatro OK, ~0,5–0,8 s.
  #
  # Guard: hubara_agency/tests/platform/test_litellm_model_ids_stable.py.
  # Fuente de fechas: ai.google.dev/gemini-api/docs/deprecations.
  - model_name: gemini-backup
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: "os.environ/GEMINI_API_KEY"

  # Juez frontier del golden-eval: Gemini Pro 3.1 — independiente del agente
  # (DeepSeek) y mucho más fuerte que el flash-lite (que daba falsos negativos,
  # ej. no_hallucination 0.0 -> 1.0 con un juez capaz). Misma GEMINI_API_KEY.
  - model_name: gemini-pro-judge
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: "os.environ/GEMINI_API_KEY"

  # Multimodal de soporte del chat de sales (audio + visión): transcribe
  # notas de voz y describe/clasifica imágenes inbound; el texto se reinyecta
  # al agente text-only (DeepSeek). Consumido por
  # hubara_agency/src/platform/{audio,vision}/litellm_adapter.py como
  # `litellm_proxy/gemini-multimodal`. Flash-Lite estable (no preview): barato
  # y suficiente para STT + clasificación de comprobantes.
  - model_name: gemini-multimodal
    litellm_params:
      model: gemini/gemini-2.5-flash-lite
      api_key: "os.environ/GEMINI_API_KEY"

  # SUCESOR de gemini-multimodal (2026-10-05), en el failover de abajo. 2.5
  # Flash-Lite no tiene fecha de apagado, pero Google ya lo limita a cuentas
  # que lo usaban ("we are limiting access to the 2.5 models to users who have
  # actively used them in the past", tabla de deprecations del 2026-10-01): una
  # cuenta o un proyecto nuevo (el silo de un cliente) recibe 403/404. Sin
  # sucesor, cada foto y cada nota de voz fallaría en silencio. 3.5 Flash-Lite
  # es el reemplazo que recomienda Google: estable, sin fecha de apagado, lee
  # imagen y audio. Cuesta más ($0.30/$2.50 por 1M contra $0.10/$0.40; el audio
  # cuesta lo mismo, $0.30) y piensa en "minimal" por defecto: por eso es
  # sucesor y no reemplazo, hasta medir en el laboratorio cuál sigue. Alias
  # propio (no reusar gemini-backup ni gemini-photo-match: otro propósito).
  # Guard: test_an_alias_on_an_access_limited_id_falls_over_to_a_successor.
  - model_name: gemini-multimodal-successor
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: "os.environ/GEMINI_API_KEY"

  # Fotos del cliente contra el catálogo (2026-09-30): cuando la foto no trae
  # un nombre, un código o un enlace que se lea, se buscan los 5 productos más
  # parecidos por embedding de imagen y un verificador dice cuál es el mismo
  # diseño, o ninguno. Consumidos por
  # hubara_agency/src/platform/vision/{embeddings,photo_match}.py.
  #
  # `gemini-embedding-2`: multimodal (imagen → vector de 768), GA desde el
  # 2026-04-22 y sin fecha de apagado. Probado con este mismo litellm (v1.86.2):
  # el vector que devuelve es idéntico al de la API de Gemini directa (coseno
  # 1,0), o sea que la imagen viaja como imagen. Cambiar el modelo de este
  # alias invalida el índice de fotos guardado: el índice lo nota (vuelve a
  # medir una imagen de control) y se rehace solo.
  - model_name: gemini-embedding
    litellm_params:
      model: gemini/gemini-embedding-2
      api_key: "os.environ/GEMINI_API_KEY"

  # Verificador: foto del cliente + hoja con los 5 candidatos → número o null.
  # `gemini-3.5-flash-lite` (el mismo id estable del fallback): 74 de 74 casos
  # en dos corridas (capturas, otra foto del mismo diseño, trampas y candidatos
  # sin el producto verdadero), mediana ~2 s, máximo 5,7 s, ~US$0,0008 por
  # foto. `gemini-3.1-flash-lite` también acertó pero tuvo esperas de 20–50 s y
  # se apaga el 2027-05-07.
  - model_name: gemini-photo-match
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: "os.environ/GEMINI_API_KEY"

router_settings:
  # 'simple-shuffle' es la estrategia estándar. 
  # Como cada model_name tiene solo un proveedor, siempre elegirá ese.
  routing_strategy: simple-shuffle
  num_retries: 1
  # El failover se activa aquí: si falla 'deepseek-v4-flash', salta a 'gemini-backup';
  # si Google niega 2.5 Flash-Lite a 'gemini-multimodal', atiende su sucesor.
  fallbacks: [{"deepseek-v4-flash": ["gemini-backup"]}, {"deepseek-v4-flash-thinking": ["gemini-backup"]}, {"gemini-multimodal": ["gemini-multimodal-successor"]}]
  drop_params: True