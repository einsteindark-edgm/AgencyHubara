# CASO del FLUJO rediseñado (2026-09-25): la campaña Halloween analizada SOLA, con el drill-down.
# El seed es lo que deposita el central con `?campaign_id=`: Graph /insights diario de ESA campaña,
# las ventas CONFIRMADAS atribuidas a sus chats por día de inicio del chat (días sin venta en 0 —
# nunca se excluyen), entities vacío y el `campaign_breakdown` (segmento → anuncio → chats con su
# tarjeta y el estado del pedido; datos reales de prod sin teléfonos). El replay corre los 7
# agentes; el golden es un snapshot PINEADO verificado contra test_ctwa_scorecard_golden y
# test_ctwa_report_scorecard (veredicto no escalar, tarjeta «Chatea con nosotros», QA reconcilia).
# Nota: /insights diario y el breakdown se tomaron con minutos de diferencia (gasto 147.775 vs 148.446).
