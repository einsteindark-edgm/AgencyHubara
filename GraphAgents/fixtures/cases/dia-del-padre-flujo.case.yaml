    sales:
      - { date: "2026-06-15", total_orders: 12, total_revenue: 600000 }
      - { date: "2026-06-16", total_orders: 4, total_revenue: 150000 }
  entities_payload: { $ref: fixtures/mcp_ad_entities.json }
