# (suppress). Espejo de la matriz compartida con hubara (reengagement_matrix_golden.json,
# guard de checksum en ambos repos). impl(**seed), sin ports.
id: parse-conversations-fases
title: parse-conversations · una conversación por fase
target: tool:parse-conversations
seed:
  payload:
    now_ms: 1716700000000
    conversations:
      - session_id: wa_csw
        service_window_expires_at_ms: 1716703600000
        ctwa_window_expires_at_ms: 1716696400000
        lead: { tag: INTERESADO, engaged: true }
      - session_id: wa_ctwa_hook
        service_window_expires_at_ms: 1716696400000
        ctwa_window_expires_at_ms: 1716703600000
        lead: { tag: INTERESADO, has_order_draft: true, is_ctwa_lead: true }
