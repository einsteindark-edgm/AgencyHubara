# Capability agent (archetype: extractor) — extrae y normaliza insights de la
# Meta Marketing API. Referenciable por `agent://meta-insights@1` y publicable
# hacia AFUERA (otro sistema lo consume por MCP / execution-id).
name: meta-insights
description: Extrae y normaliza insights de campañas de la Meta Marketing API.
archetype: extractor
certification: C1

# ext (GraphAgents): el StateGraph que implementa la capability.
capability: graphs.meta_insights:build
# ext: datos SOLO por el ConnectorKit (G-PORT).
consumes: [meta_marketing_api]

# ext (GraphAgents): el contrato I/O declarado (G-CONTRACT) — ver graphs/meta_insights.py.
contract:
  inputs:
    account_id: {type: string, required: true}
    since: {type: string, required: true}
    until: {type: string, required: true}
  outputs:
    campaigns: {type: array, description: "spend/revenue/roas por campana"}
    total_spend: {type: number}
    total_revenue: {type: number}
    blended_roas: {type: number}

# se puede invocar como tool de otro agente, y se publica hacia afuera.
exposes_as_tool: true
publish:
  as: mcp

tools: []
