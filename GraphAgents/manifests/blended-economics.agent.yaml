# Agente de catálogo (archetype: analyzer) — el corazón. Compone 3 tools agnósticas:
# merge por fecha + las 5 métricas + el diagnóstico. Sin LLM (eso es el reporter).
name: blended-economics
description: Analiza el blend CTWA — merge por fecha + las 5 unit-economics + el diagnóstico determinista.
archetype: analyzer
certification: C2

capability: graphs.blended_economics:build

# ext (GraphAgents): el contrato I/O declarado (G-CONTRACT) — ver graphs/blended_economics.py.
contract:
  inputs:
    currency: {type: string, required: true, description: "la moneda de los insights (guard COP-only)"}
    insights: {type: array, required: true, description: "insights CTWA por dia (de ctwa-insights)"}
    sales: {type: array, required: true, description: "ventas normalizadas por dia (de sales-ledger)"}
  outputs:
    currency: {type: string}
    days: {type: array, description: "el blend por dia con metrics + diagnosis"}
    period: {type: object, description: "el agregado del periodo (o null sin dias en comun)"}
    unmatched: {type: object, description: "{meta_only, sales_only} — fechas sin match"}

exposes_as_tool: true

tools:
  - uses: merge-by-date@1
    with:
      payload: $state.feeds
  - uses: blended-unit-economics@1
    with:
      payload: $state.totals
  - uses: diagnose@1
    with:
      payload: $state.metrics
