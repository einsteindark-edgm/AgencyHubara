# Agente de catálogo (archetype: analyzer). Referenciable por `agent://roas-cac@1`
# desde cualquier task graph, y exponible como tool de otro agente.
name: roas-cac
description: Analiza ROAS/CAC y sugiere realocación de presupuesto.
archetype: analyzer
certification: C2

capability: graphs.roas_cac:build
# (sin `consumes`: roas-cac NO usa un port — su análisis sale de la tool recommend-budget;
# declarar meta_marketing_api era stale e inexacto, cert-review.)

# ext (GraphAgents): el contrato I/O declarado (G-CONTRACT) — ver graphs/roas_cac.py.
contract:
  inputs:
    adsets: {type: array, required: true, description: "[{id, roas}] por adset"}
    total_budget: {type: number, required: true, description: "presupuesto total a repartir"}
  outputs:
    allocations: {type: array, description: "[{id, budget}] sugerido"}
    analyzed_adsets: {type: integer}

# el agente puede invocarse como tool de otro agente (agent-as-tool).
exposes_as_tool: true

tools:
  # toma la tool agnóstica del catálogo y la bindea al state del agente (G-BIND).
  - uses: recommend-budget@1
    with:
      adsets: $state.adsets
      total_budget: $state.total_budget
