# Agente de catálogo (archetype: extractor). Extrae insights CTWA de Graph /insights:
# RECIBE el JSON (lo deposita el central; el agente no llama a Meta → inbaneable) y lo
# colapsa a nivel cuenta por día. Referenciable por agent://ctwa-insights@1.
name: ctwa-insights
description: Extrae y normaliza insights CTWA de Graph /insights (recibe el JSON; colapsa a cuenta por día).
archetype: extractor
certification: C2

capability: graphs.ctwa_insights:build

# ext (GraphAgents): el contrato I/O DECLARADO (G-CONTRACT) — hace al agente conectable
# con validación desde el explorer. inputs = lo que run() exige del estado; outputs =
# las claves que emite al acc (verificado contra graphs/ctwa_insights.py + su golden).
contract:
  inputs:
    payload: {type: object, required: true, description: "el envelope crudo de Graph /insights (lo deposita el central)"}
  outputs:
    currency: {type: string, description: "la moneda de la cuenta (COP)"}
    insights: {type: array, description: "insights CTWA colapsados a cuenta por dia"}

exposes_as_tool: true

tools:
  # la tool agnóstica del catálogo, bindeada al state del agente (G-BIND).
  - uses: meta-ads-insights@1
    with:
      payload: $state.payload
