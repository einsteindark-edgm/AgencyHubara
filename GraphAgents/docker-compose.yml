# Levanta TODO el stack de GraphAgents:
#   postgres     — estado durable de AgentSpan (Conductor)
#   agentspan    — el runtime durable (server, :6767) — imagen oficial
#   graphagents  — nuestra app; SIRVE la API del viewer en :8900 (la UI visual
#                  es Acktos Studio, la extensión de VS Code en vscode-hubara/)
#
# Quickstart:
#   cp .env.example .env        # (opcional) poné tu OPENAI/ANTHROPIC/META keys
#   docker compose up                      # TODA la suite → la API en http://localhost:8900/api/*
#   docker compose up -d agentspan         # (solo) el runtime real (:6767)
#   GH_TOKEN=$(gh auth token) docker compose up   # con 'publicar' habilitado (commit+push+PR)
#   # hola mundo / CLI on-demand (no levantan un server):
#   docker compose run --rm graphagents uv run python hello_world.py
#   docker compose run --rm graphagents uv run python -m sdk.cli list-tools
name: graphagents

services:
  postgres:
    image: "${POSTGRES_IMAGE:-postgres:16-alpine}"
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-agentspan}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-changeme}"
      POSTGRES_DB: "${POSTGRES_DB:-agentspan}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-agentspan}\" -d \"$${POSTGRES_DB:-agentspan}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  agentspan:
    image: "${AGENTSPAN_IMAGE:-agentspan/server:latest}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${AGENTSPAN_PORT:-6767}:6767"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AGENTSPAN_MASTER_KEY: "${AGENTSPAN_MASTER_KEY:-}"
      SPRING_PROFILES_ACTIVE: "postgres"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-agentspan}"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:-agentspan}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:-changeme}"
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:--Xms512m -Xmx1536m -XX:+UseG1GC -XX:MaxGCPauseMillis=200}"
      LOGGING_LEVEL_ROOT: "${LOGGING_LEVEL_ROOT:-WARN}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"

  # La app GraphAgents. En la suite su proceso persistente es la API del viewer
  # en :8900 (`viewer/server.py::api_route`) — la MISMA lógica que Acktos Studio
  # consume por stdio (`viewer/bridge.py`): grafo, cases, run-local, trace,
  # conectar/desconectar con contratos, guardar producción y PUBLICAR (commit
  # quirúrgico → push → PR con gh). El CMD del Dockerfile ya es `python -m
  # viewer.server`; el hola mundo y la CLI son on-demand (`docker compose run
  # --rm graphagents uv run …`).
  # (Solo la API, sin arrastrar agentspan: `docker compose up --no-deps graphagents`.)
  #
  # PUBLICAR desde el container necesita:
  #   1. el bind-mount de la RAÍZ del monorepo (abajo) — ahí vive el .git; montar solo
  #      GraphAgents/ deja al publish sin repo. ⚠ Requiere un checkout NORMAL: en un git
  #      worktree el .git es un archivo con path absoluto del host y no resuelve adentro.
  #   2. GH_TOKEN — en local: `GH_TOKEN=$(gh auth token) docker compose up` (o en .env).
  #      Sin token, la API anda igual; publicar degrada con error legible.
  graphagents:
    build: .
    depends_on:
      - agentspan
    ports:
      - "${VIEWER_PORT:-8900}:8900"  # la API del viewer → http://localhost:8900/api/*
    environment:
      AGENTSPAN_SERVER_URL: "http://agentspan:6767"
      GRAPHAGENTS_RUNTIME: "${GRAPHAGENTS_RUNTIME:-local}"  # local | agentspan (G1+)
      META_ACCESS_TOKEN: "${META_ACCESS_TOKEN:-}"
      META_AD_ACCOUNT_ID: "${META_AD_ACCOUNT_ID:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # --- publicar desde el explorer (commit + push + PR) ---
      GH_TOKEN: "${GH_TOKEN:-}"  # gh lo toma solo; el entrypoint lo registra como credential helper de git
      GIT_AUTHOR_NAME: "${GIT_AUTHOR_NAME:-hubara-explorer}"
      GIT_AUTHOR_EMAIL: "${GIT_AUTHOR_EMAIL:-explorer@hubara.local}"
      GIT_COMMITTER_NAME: "${GIT_COMMITTER_NAME:-hubara-explorer}"
      GIT_COMMITTER_EMAIL: "${GIT_COMMITTER_EMAIL:-explorer@hubara.local}"
    volumes:
      # la RAÍZ del monorepo (no solo GraphAgents/): el .git que el publish necesita.
      # Sigue siendo bind-mount de dev: editás un manifest y el catálogo se refleja.
      - ..:/workspace
    working_dir: /workspace/GraphAgents

volumes:
  postgres_data:
