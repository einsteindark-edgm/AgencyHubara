<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GraphAgents · explorer</title>
<link rel="stylesheet" href="https://unpkg.com/@xyflow/react@12.3.5/dist/style.css" />
<style>
  :root {
    --bg: #fbfbfa; --surface: #fff; --line: #e7e5e0; --ink: #2c2c2a; --muted: #6b6a66;
    --agent: #6f63d6; --tool: #d8743a; --port: #1d9e8f;
    --c-ok: #1f9d57; --c-warn: #bd8410; --c-info: #2f7fc0; --c-none: #b14a4a;
    --st-running:#6f63d6; --st-done:#1f9d57; --st-failed:#c0392b; --st-pending:#b8b6ae;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1a1a18; --surface:#232320; --line:#36352f; --ink:#ecebe6; --muted:#a3a29b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background:var(--bg); color:var(--ink); font-size:14px; }
  .app { display:grid; grid-template-columns: 248px 1fr 320px; grid-template-rows:auto 1fr; height:100vh; }
  header { grid-column:1/-1; display:flex; align-items:center; gap:14px; padding:10px 16px;
           border-bottom:1px solid var(--line); background:var(--surface); flex-wrap:wrap; }
  header .brand { font-weight:500; font-size:15px; display:flex; align-items:center; gap:8px; }
  header .dot { width:10px;height:10px;border-radius:3px;background:var(--agent); }
  header input { flex:1; min-width:160px; padding:7px 10px; border:1px solid var(--line);
                 border-radius:8px; background:var(--bg); color:var(--ink); font-size:13px; }
  .legend { display:flex; gap:10px; align-items:center; font-size:11px; color:var(--muted); flex-wrap:wrap; }
  .chip { display:inline-flex; align-items:center; gap:5px; }
  .sw { width:10px;height:10px;border-radius:3px;display:inline-block; }
  aside { border-right:1px solid var(--line); background:var(--surface); overflow:auto; padding:12px; }
  aside.right { border-right:0; border-left:1px solid var(--line); }
  .sec { font-size:11px; color:var(--muted); margin:4px 2px 8px; letter-spacing:.02em; display:flex; justify-content:space-between; align-items:center; }
  .card { display:flex; align-items:center; gap:8px; padding:7px 8px; border:1px solid var(--line);
          border-radius:8px; margin-bottom:7px; cursor:pointer; background:var(--surface); }
  .card:hover { border-color:#bbb; }
  .card.active { border-color:var(--ink); box-shadow:0 0 0 1px var(--ink) inset; }
  .card .ic { width:9px;height:24px;border-radius:3px;flex:none; }
  .card .nm { flex:1; min-width:0; }
  .card .nm b { font-weight:500; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:12.5px; }
  .card .nm span { font-size:10.5px; color:var(--muted); }
  .badge { font-size:10px; padding:1px 6px; border-radius:5px; flex:none; font-weight:500; }
  main { position:relative; overflow:hidden; }
  #flow { width:100%; height:100%; }
  .err { position:absolute; inset:auto 12px 12px; background:#fdecec; color:#8a1f1f; border:1px solid #f3b9b9;
         padding:8px 12px; border-radius:8px; font-size:12px; z-index:10; }
  .loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; }
  /* nodo custom de React Flow */
  .rfnode { border:2px solid var(--line); border-radius:9px; background:var(--surface); padding:6px 10px;
            min-width:120px; max-width:190px; box-shadow:0 1px 2px rgba(0,0,0,.05); }
  .rfnode .nlabel { font-weight:500; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rfnode .nsub { font-size:10px; color:var(--muted); display:flex; gap:6px; align-items:center; }
  .rfnode.sel { box-shadow:0 0 0 2px var(--ink); }
  .rfnode .acc-l { width:8px; height:8px; border-radius:2px; display:inline-block; }
  .rfnode .nms { font-size:9.5px; font-weight:500; }
  .rf-handle { opacity:0; }
  .react-flow__attribution { font-size:9px; opacity:.4; }
  .insp h2 { font-size:15px; margin:2px 0 2px; font-weight:500; }
  .insp .meta { font-size:12px; color:var(--muted); margin-bottom:10px; }
  .insp .row { display:flex; justify-content:space-between; gap:8px; font-size:12px; padding:5px 0; border-top:1px solid var(--line); }
  .insp .row span:first-child { color:var(--muted); }
  .insp .k { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11px; }
  .pills { display:flex; flex-wrap:wrap; gap:5px; margin:8px 0; }
  .empty { color:var(--muted); font-size:13px; padding:24px 6px; text-align:center; }
  button { font:inherit; font-size:12px; padding:6px 12px; border:1px solid var(--line); border-radius:8px;
           background:var(--bg); color:var(--ink); cursor:pointer; }
  button:hover { border-color:#999; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  select, textarea { font:inherit; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); }
  .run textarea { width:100%; min-height:46px; font-family:ui-monospace,Menlo,monospace; font-size:11px; padding:6px; }
  pre.out { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px;
            font-size:11px; white-space:pre-wrap; word-break:break-word; max-height:220px; overflow:auto; }
  ol.flowsteps { list-style:none; margin:0; padding:0; }
  ol.flowsteps li { position:relative; padding:6px 0 6px 28px; border-top:1px solid var(--line); font-size:12.5px; }
  ol.flowsteps li:first-child { border-top:0; }
  ol.flowsteps .ord { position:absolute; left:0; top:6px; width:19px; height:19px; border-radius:50%;
    background:var(--agent); color:#fff; font-size:11px; font-weight:500; display:flex; align-items:center; justify-content:center; }
  ol.flowsteps .ag { font-weight:500; }
  ol.flowsteps .amut { font-size:10.5px; color:var(--muted); }
  ol.flowsteps .bnd { font-family:ui-monospace,Menlo,monospace; font-size:10.5px; color:var(--port); margin-top:2px; }
  ol.flowsteps li.clk { cursor:pointer; border-radius:6px; }
  ol.flowsteps li.clk:hover { background:var(--bg); }
  ol.flowsteps .stbadge { font-size:10px; padding:1px 6px; border-radius:5px; font-weight:500; white-space:nowrap; }
  .fleet .frow { display:flex; align-items:center; gap:7px; padding:6px 7px; border:1px solid var(--line);
    border-radius:7px; margin-bottom:6px; cursor:pointer; font-size:11.5px; }
  .fleet .frow:hover { border-color:#bbb; }
  .fleet .fdot { width:8px; height:8px; border-radius:50%; flex:none; }
  .fleet .fname { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:500; }
</style>
</head>
<body>
<div id="root"><div class="loading">cargando el explorer…</div></div>

<script type="module">
import React, { useState, useEffect, useCallback, useMemo, useRef } from 'https://esm.sh/react@18.3.1';
import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
import htm from 'https://esm.sh/htm@3';
import { ReactFlow, Background, Controls, MiniMap, Handle, Position }
  from 'https://esm.sh/@xyflow/react@12.3.5?deps=react@18.3.1,react-dom@18.3.1';
import dagre from 'https://esm.sh/@dagrejs/dagre@1.1.4';

const html = htm.bind(React.createElement);
const CERTCOLOR = { C3:'#1f9d57', C2:'#1f9d57', C1:'#bd8410', C0:'#2f7fc0', none:'#b14a4a' };
const certColor = c => CERTCOLOR[c] || '#9a988f';
const KIND_COLOR = { agent:'var(--agent)', tool:'var(--tool)', port:'var(--port)' };
const ST_COLOR = { done:'var(--st-done)', running:'var(--st-running)', failed:'var(--st-failed)', pending:'var(--st-pending)', other:'#9a988f' };
const ST_HEX = { done:'#1f9d57', running:'#6f63d6', failed:'#c0392b', pending:'#b8b6ae', other:'#9a988f' };
const bindShort = inputs => Object.values(inputs||{}).map(v => String(v).replace('$state.','')).join(', ');
const ROLE_SYM = { default_branch:'▶', branch:'○', fan_out:'∥', step:'', single:'' };
const api = (p) => fetch(p).then(r => r.json());

// --- layout DAG (dagre) — se calcula UNA vez por grafo y se cachea (no por tick de estado) ---
const NODE_W = 168, NODE_H = 46;
function layoutGraph(nodes, edges){
  const g = new dagre.graphlib.Graph(); g.setGraph({ rankdir:'TB', nodesep:26, ranksep:64 });
  g.setDefaultEdgeLabel(() => ({}));
  const ids = new Set(nodes.map(n => n.id));
  nodes.forEach(n => g.setNode(n.id, { width:NODE_W, height:NODE_H }));
  edges.forEach(e => { if(ids.has(e.source) && ids.has(e.target)) g.setEdge(e.source, e.target); });
  dagre.layout(g);
  const pos = {};
  nodes.forEach(n => { const p = g.node(n.id); pos[n.id] = { x: p.x - NODE_W/2, y: p.y - NODE_H/2 }; });
  return pos;
}

// --- nodo custom: muestra kind, cert, y el ESTADO VIVO (borde + ms) cuando hay trace --------
function FlowNode({ data, selected }){
  const n = data.n, rt = data.runtime;
  const accent = KIND_COLOR[n.kind] || '#999';
  const border = rt ? ST_HEX[rt.status] : (n.kind==='port' ? '#0f7a6e' : certColor(n.certification));
  const sub = n.kind === 'tool' ? `tool · ${n.side_effect||''}`
            : n.kind === 'port' ? 'port'
            : (n.archetype || 'agente') + (n.strategy ? ' · ' + n.strategy : '');
  return html`
    <div class=${'rfnode' + (selected ? ' sel' : '')}
         style=${{ borderColor: border, borderWidth: rt && rt.status==='running' ? 3 : 2 }}>
      <${Handle} type="target" position=${Position.Top} className="rf-handle" />
      <div class="nlabel" style=${{ color: accent }}>${n.label}</div>
      <div class="nsub">
        <span>${sub}</span>
        ${rt && rt.ms != null && html`<span class="nms" style=${{ color: ST_HEX[rt.status] }}>${rt.ms}ms</span>`}
        ${rt && rt.retries ? html`<span class="nms" style=${{ color:'#c0392b' }}>↻${rt.retries}</span>` : null}
        ${n.group ? html`<span class="acc-l" style=${{ background:'#9b9994' }} title=${n.group}></span>` : null}
      </div>
      <${Handle} type="source" position=${Position.Bottom} className="rf-handle" />
    </div>`;
}
const NODE_TYPES = { ga: FlowNode };

// --- el grafo (React Flow) -----------------------------------------------------------------
function Graph({ graph, selected, onSelect, trace, plan }){
  const pos = useMemo(() => layoutGraph(graph.nodes, graph.edges), [graph]);
  const runtimeByAgent = useMemo(() => {
    const m = {};
    if(trace && trace.steps) trace.steps.forEach(s => { if(s.agent) m['agent:'+s.agent] = s.runtime; });
    return m;
  }, [trace]);
  // FOCO: al elegir un supervisor, atenuar lo que NO participa de su plan (clave a escala).
  const participants = useMemo(() => {
    if(!plan || !plan.steps) return null;
    const s = new Set(plan.steps.filter(x => x.agent).map(x => 'agent:'+x.agent));
    if(selected) s.add(selected);
    return s;
  }, [plan, selected]);

  const rfNodes = useMemo(() => graph.nodes.map(n => ({
    id: n.id, type:'ga', position: pos[n.id] || { x:0, y:0 },
    data: { n, runtime: runtimeByAgent[n.id] || null }, selected: n.id === selected,
    style: participants && !participants.has(n.id) ? { opacity:0.16 } : undefined,
  })), [graph, pos, runtimeByAgent, selected, participants]);

  const ids = useMemo(() => new Set(graph.nodes.map(n => n.id)), [graph]);
  const rfEdges = useMemo(() => graph.edges
    .filter(e => ids.has(e.source) && ids.has(e.target))
    .map((e,i) => {
      const dim = participants && !participants.has(e.source);
      return {
        id:'e'+i, source:e.source, target:e.target,
        label: e.kind==='agent' ? (e.strategy||'agent') : e.kind==='consumes' ? 'consume' : 'uses',
        animated: !!runtimeByAgent[e.target] && runtimeByAgent[e.target].status==='running',
        style: { stroke:'#9aa0a6', strokeWidth:1.4, opacity: dim ? 0.12 : 1 },
        labelStyle: { fontSize:9, fill:'#86837c' }, labelBgStyle:{ fill:'var(--bg)' },
        markerEnd: { type:'arrowclosed', width:14, height:14, color:'#9aa0a6' },
      };
    }), [graph, ids, runtimeByAgent, participants]);

  return html`<${ReactFlow}
      nodes=${rfNodes} edges=${rfEdges} nodeTypes=${NODE_TYPES}
      onNodeClick=${(_, node) => onSelect(node.id)}
      onPaneClick=${() => onSelect(null)}
      fitView minZoom=${0.05} onlyRenderVisibleElements=${true} nodesDraggable=${false}
      proOptions=${{ hideAttribution:false }}>
    <${Background} gap=${22} color="#d9d7d0" />
    <${Controls} showInteractive=${false} />
    <${MiniMap} pannable zoomable nodeColor=${n => KIND_COLOR[(n.data?.n?.kind)] || '#999'} />
  </${ReactFlow}>`;
}

// --- catálogo (izq) ------------------------------------------------------------------------
function Catalog({ graph, q, selected, onSelect }){
  const match = n => !q || n.label.toLowerCase().includes(q.toLowerCase()) ||
    (n.tags||[]).some(t => t.toLowerCase().includes(q.toLowerCase())) || (n.archetype||'').includes(q.toLowerCase());
  const order = { supervisor:0, extractor:1, analyzer:2, reporter:3 };
  const agents = graph.nodes.filter(n => n.kind==='agent').sort((a,b)=>(order[a.archetype]??9)-(order[b.archetype]??9));
  const tools = graph.nodes.filter(n => n.kind==='tool').sort((a,b)=>a.label.localeCompare(b.label));
  const Card = (n) => {
    const cert = n.kind==='port' ? null : html`<span class="badge"
      style=${{ background: certColor(n.certification)+'22', color: certColor(n.certification) }}>${n.certification}</span>`;
    const sub = n.kind==='tool' ? `${n.side_effect}${n.approval_required?' · ⚠':''}`
      : (n.archetype||'') + (n.group?` · ${n.group==='demo'?'demo':'variante'}`:'') + (n.publish?` · publish:${n.publish}`:'');
    if(!match(n)) return null;
    return html`<div key=${n.id} class=${'card'+(n.id===selected?' active':'')} onClick=${()=>onSelect(n.id)}>
      <span class="ic" style=${{ background: KIND_COLOR[n.kind] }}></span>
      <span class="nm"><b>${n.label}</b><span>${sub}</span></span>${cert}</div>`;
  };
  return html`<aside class="left">
    <div class="sec">AGENTES</div>
    ${agents.map(Card)}
    <div class="sec" style=${{ marginTop:'12px' }}>TOOLS · palette</div>
    ${tools.map(Card)}
  </aside>`;
}

// --- panel de flota (ejecuciones) ----------------------------------------------------------
function Fleet({ onPick }){
  const [runs, setRuns] = useState([]); const [live, setLive] = useState(true); const [err, setErr] = useState('');
  useEffect(() => {
    let on = true, timer = null;
    const tick = async () => {
      try {
        const recent = await api('/api/runs?limit=12');
        const running = await api('/api/runs?running=1&limit=50');
        if(!on) return;
        const ids = new Set((running.runs||[]).map(r=>r.execution_id));
        const merged = [...(running.runs||[]), ...(recent.runs||[]).filter(r=>!ids.has(r.execution_id))];
        setRuns(merged); setErr(running.error||recent.error||'');
      } catch(e){ if(on) setErr(String(e.message||e)); }
      if(on) timer = setTimeout(tick, 2500);  // poll de flota: 1 request RUNNING + recientes
    };
    tick();
    return () => { on = false; if(timer) clearTimeout(timer); };
  }, []);
  const nRunning = runs.filter(r => String(r.status).toUpperCase()==='RUNNING').length;
  return html`<div class="fleet">
    <div class="sec"><span>FLOTA · ejecuciones</span><span style=${{ color: nRunning?'var(--st-running)':'var(--muted)' }}>${nRunning} activas</span></div>
    ${err && html`<div style=${{ fontSize:'11px', color:'var(--muted)', padding:'4px 2px' }}>sin server :6767</div>`}
    ${runs.length===0 && !err && html`<div style=${{ fontSize:'11px', color:'var(--muted)', padding:'4px 2px' }}>sin ejecuciones</div>`}
    ${runs.map(r => html`<div key=${r.execution_id} class="frow" onClick=${()=>onPick(r)}>
      <span class="fdot" style=${{ background: ST_HEX[(String(r.status).toUpperCase()==='RUNNING')?'running':(String(r.status).toUpperCase()==='FAILED'?'failed':'done')] }}></span>
      <span class="fname">${r.agent}</span>
      <span style=${{ fontSize:'10px', color:'var(--muted)' }}>${String(r.status||'').toLowerCase()}</span>
    </div>`)}
  </div>`;
}

// --- inspector (der): contrato + plan + trace vivo + correr ---------------------------------
function Inspector({ graph, node, plan, trace, onSelect, onRun, onLoadTrace, nodeState, onNodeState }){
  if(!node) return html`<aside class="right insp"><div class="empty">Elegí un nodo del canvas, del catálogo o de la flota.</div></aside>`;
  const isSup = node.kind==='agent' && node.archetype==='supervisor';
  const head = node.kind==='tool' ? `tool · ${node.side_effect} · v${node.version}`
    : node.kind==='port' ? 'connector port' : isSup ? `${node.archetype} · ${node.strategy}` : `${node.archetype}`;
  const pill = (t,c='var(--muted)') => html`<span class="badge" style=${{ background:c+'1f', color:c }}>${t}</span>`;
  const fwd = graph.edges.filter(e=>e.source===node.id && e.kind==='uses').map(e=>e.target.replace(/^\w+:/,''));
  const rev = graph.edges.filter(e=>e.target===node.id).map(e=>e.source.replace(/^\w+:/,''));
  const live = (trace && trace.steps) ? trace : null;
  const wfc = live ? (ST_COLOR[String(live.workflow_status).toLowerCase()]||'var(--muted)') : null;
  const stratTxt = { sequential:'cadena en orden', router:'rutea a UNO (default = 1º)', parallel:'fan-out + join' };
  return html`<aside class="right insp">
    <h2>${node.label}</h2><div class="meta">${head}</div>
    <div class="pills">
      ${node.kind!=='port' && pill(node.certification, certColor(node.certification))}
      ${node.declared_cert && node.declared_cert!==node.certification && pill('declara '+node.declared_cert,'#bd8410')}
      ${node.exposes_as_tool && pill('expone como tool','var(--agent)')}
      ${node.publish && pill('publish: '+node.publish,'var(--port)')}
      ${node.group && pill(node.group==='demo'?'demo':'variante','#9b9994')}
      ${node.approval_required && pill('approval','#b14a4a')}
      ${node.idempotent===false && pill('no idempotente','#b14a4a')}
    </div>
    ${node.description && html`<div class="meta">${node.description}</div>`}
    ${node.capability && html`<div class="row"><span>capability</span><span class="k">${node.capability}</span></div>`}
    ${node.contract && html`<div class="row"><span>contrato</span><span class="k">${node.contract}</span></div>`}
    ${node.tags && node.tags.length>0 && html`<div class="row"><span>tags</span><span>${node.tags.join(', ')}</span></div>`}
    ${node.consumes && node.consumes.length>0 && html`<div class="row"><span>consume</span><span class="k">${node.consumes.join(', ')}</span></div>`}
    ${fwd.length>0 && html`<div class="row"><span>usa</span><span>${fwd.join(', ')}</span></div>`}
    ${rev.length>0 && html`<div class="row"><span>usado por</span><span>${rev.join(', ')}</span></div>`}

    ${isSup && plan && plan.steps && plan.steps.length>0 && html`
      <div class="sec" style=${{ marginTop:'14px' }}>FLUJO DE EJECUCIÓN · ${plan.strategy}
        ${live && html`<span style=${{ color:wfc }}>▶ ${live.workflow_status}</span>`}</div>
      <div class="meta" style=${{ margin:'-2px 0 8px' }}>
        ${live ? 'estado por-nodo de Conductor — click en un paso para ver su acc.'
               : (stratTxt[plan.strategy]||plan.strategy)+' — nº = orden, ← binding de estado.'}</div>
      <ol class="flowsteps">
        ${plan.steps.map((s,i) => {
          const rt = live && live.steps[i] ? live.steps[i].runtime : null;
          const oc = rt ? ST_HEX[rt.status] : '';
          if(!s.agent) return html`<li key=${i} style=${{ color:'var(--muted)' }}>
            <span class="ord" style=${{ background: oc||'var(--muted)' }}>⋈</span> join
            ${rt && html`<span class="stbadge" style=${{ background:oc+'22', color:oc }}>${rt.status}</span>`}</li>`;
          const ord = (ROLE_SYM[s.role]||'') + (s.role==='step'? s.order : '');
          const tag = s.role==='default_branch'?'default':s.role==='branch'?'branch':s.role==='fan_out'?'concurrente':'';
          const extra = rt ? [rt.ms!=null?rt.ms+' ms':'', rt.retries?('↻'+rt.retries):''].filter(Boolean).join(' · ') : '';
          const clickable = !!(rt && rt.task_id);
          return html`<li key=${i} class=${clickable?'clk':''} onClick=${clickable ? (()=>onNodeState(s.agent, rt.task_id)) : null}>
            <span class="ord" style=${{ background: oc||undefined }}>${ord||'•'}</span>
            <span class="ag" style=${{ cursor: live?'default':'pointer', borderBottom: live?'none':'1px dotted var(--muted)' }}
              onClick=${live ? null : ((ev)=>{ ev.stopPropagation(); onSelect('agent:'+s.agent); })}>${s.agent}</span>
            <span class="amut">${s.archetype||''}${tag?' · '+tag:''}</span>
            ${rt && html`<span class="stbadge" style=${{ background:oc+'22', color:oc }}>${rt.status}</span>`}
            ${extra && html`<span class="amut"> ${extra}</span>`}
            ${(bindShort(s.inputs) && !live) && html`<div class="bnd">← ${bindShort(s.inputs)}</div>`}
          </li>`;
        })}
      </ol>
      <div style=${{ display:'flex', gap:'8px', alignItems:'center', marginTop:'8px', flexWrap:'wrap' }}>
        <button onClick=${()=>onLoadTrace(node.label)}>${live?'recargar':'trace en vivo'} ▸</button></div>
      ${nodeState!=null && html`<pre class="out" style=${{ marginTop:'8px' }}>${
        typeof nodeState==='string' ? nodeState : JSON.stringify(nodeState, null, 2)}</pre>`}`}

    ${node.kind==='agent' && !isSup && (!node.consumes || node.consumes.length===0) && html`
      <${RunBox} agent=${node.label} onRun=${onRun} />`}
    ${node.kind==='agent' && node.consumes && node.consumes.length>0 && html`
      <div class="meta" style=${{ marginTop:'12px' }}>▸ consume ${node.consumes.join(', ')} — corré con vendor fixture en tests/integration.</div>`}
  </aside>`;
}

function RunBox({ agent, onRun }){
  const [input, setInput] = useState('{ "name": "mundo" }');
  const [runtime, setRuntime] = useState('local');
  const [status, setStatus] = useState(''); const [out, setOut] = useState(null); const [res, setRes] = useState(null);
  const go = async () => {
    let body; try { body = JSON.parse(input||'{}'); } catch(e){ setStatus('input no es JSON válido'); return; }
    setStatus(runtime==='agentspan'?'corriendo en AgentSpan…':'corriendo…'); setOut(null); setRes(null);
    const r = await onRun(agent, body, runtime);
    setStatus(`${r.status}${r.id?' · '+r.id:''}${r.runtime==='agentspan'?' · AgentSpan':''}`);
    setOut(r.output ?? r.error); setRes(r);
  };
  return html`<div class="run" style=${{ marginTop:'14px' }}>
    <div class="sec" style=${{ margin:'0 0 6px' }}>CORRER</div>
    <textarea value=${input} onChange=${e=>setInput(e.target.value)}></textarea>
    <div style=${{ display:'flex', gap:'8px', marginTop:'8px', alignItems:'center', flexWrap:'wrap' }}>
      <select value=${runtime} onChange=${e=>setRuntime(e.target.value)} style=${{ fontSize:'12px', padding:'5px 8px' }}>
        <option value="local">LocalRuntime</option><option value="agentspan">AgentSpan · durable</option></select>
      <button onClick=${go}>correr ▸</button>
      <span style=${{ fontSize:'11px', color:'var(--muted)' }}>${status}</span>
    </div>
    ${out!=null && html`<pre class="out" style=${{ marginTop:'8px' }}>${JSON.stringify(out, null, 2)}</pre>`}
    ${res && res.runtime==='agentspan' && res.id && res.status==='completed' && html`
      <div style=${{ fontSize:'11px', marginTop:'6px' }}>ejecución durable en el
        <a href="http://localhost:6767" target="_blank" style=${{ color:'var(--port)' }}>visor de AgentSpan (:6767)</a>
        · <span class="k">${res.id}</span></div>`}
  </div>`;
}

// --- App -----------------------------------------------------------------------------------
function App(){
  const [graph, setGraph] = useState({ nodes:[], edges:[] });
  const [q, setQ] = useState('');
  const [selected, setSelected] = useState(null);
  const [plan, setPlan] = useState(null);
  const [trace, setTrace] = useState(null);
  const [nodeState, setNodeState] = useState(null);
  const [err, setErr] = useState('');
  const traceTimer = useRef(null);
  const byId = id => graph.nodes.find(n => n.id === id);
  const node = selected ? byId(selected) : null;

  useEffect(() => { api('/api/graph').then(setGraph).catch(e => setErr(String(e.message||e))); }, []);

  const stopPoll = () => { if(traceTimer.current){ clearTimeout(traceTimer.current); traceTimer.current = null; } };
  const isSup = n => n && n.kind==='agent' && n.archetype==='supervisor';

  const select = useCallback(async (id) => {
    setSelected(id); setPlan(null); setTrace(null); setNodeState(null); stopPoll();
    const n = id ? graph.nodes.find(x => x.id === id) : null;
    if(isSup(n)){ try { setPlan(await api('/api/plan?agent='+encodeURIComponent(n.label))); } catch(e){} }
  }, [graph]);

  const loadTrace = useCallback(async (eid, supLabel) => {
    stopPoll();
    if(supLabel){ const id = 'agent:'+supLabel; setSelected(id); setNodeState(null);
      try { setPlan(await api('/api/plan?agent='+encodeURIComponent(supLabel))); } catch(e){} }
    let t; try { t = await api('/api/trace?execution_id='+encodeURIComponent(eid)); } catch(e){ return; }
    if(!t || !t.steps) return;
    setTrace(t);
    if(String(t.workflow_status).toUpperCase()==='RUNNING')
      traceTimer.current = setTimeout(() => loadTrace(eid), 700);  // poll de FOCO mientras corre
  }, []);

  const onLoadTrace = useCallback(async (agentLabel) => {
    const r = await api('/api/runs?limit=50');
    const mine = (r.runs||[]).filter(x => x.agent === agentLabel);
    if(mine.length) loadTrace(mine[0].execution_id, agentLabel);
  }, [loadTrace]);

  const onPickRun = useCallback((run) => loadTrace(run.execution_id, run.agent), [loadTrace]);

  const onRun = useCallback(async (agent, input, runtime) => {
    const r = await fetch('/api/run', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ agent, input, runtime }) }).then(x => x.json());
    if(r.runtime==='agentspan' && r.id && isSup(graph.nodes.find(n=>n.id==='agent:'+agent))) loadTrace(r.id, agent);
    return r;
  }, [graph, loadTrace]);

  const onNodeState = useCallback(async (agent, taskId) => {
    if(!trace) return; setNodeState('cargando estado…');
    try { const d = await api('/api/node-state?execution_id='+encodeURIComponent(trace.execution_id)+'&task_id='+encodeURIComponent(taskId));
      setNodeState(d.acc ?? d.error ?? '(sin estado)'); } catch(e){ setNodeState('error: '+e.message); }
  }, [trace]);

  useEffect(() => () => stopPoll(), []);

  return html`<div class="app">
    <header>
      <span class="brand"><span class="dot"></span> GraphAgents · explorer</span>
      <input placeholder="buscar tool, agente, tag…" value=${q} onInput=${e=>setQ(e.target.value)} />
      <div class="legend">
        <span class="chip"><span class="sw" style=${{ background:'var(--agent)' }}></span>agente</span>
        <span class="chip"><span class="sw" style=${{ background:'var(--tool)' }}></span>tool</span>
        <span class="chip"><span class="sw" style=${{ background:'var(--port)' }}></span>port</span>
        <span style=${{ opacity:.5 }}>·</span>
        <span class="chip"><span class="sw" style=${{ background:'var(--st-running)' }}></span>running</span>
        <span class="chip"><span class="sw" style=${{ background:'var(--st-done)' }}></span>done</span>
        <span class="chip"><span class="sw" style=${{ background:'var(--st-failed)' }}></span>failed</span>
      </div>
    </header>
    <${Catalog} graph=${graph} q=${q} selected=${selected} onSelect=${select} />
    <main>
      ${graph.nodes.length===0 && html`<div class="loading">${err ? 'no pude leer /api/graph — ¿corre el server?' : 'cargando grafo…'}</div>`}
      <div id="flow">${graph.nodes.length>0 && html`<${Graph} graph=${graph} selected=${selected} onSelect=${select} trace=${trace} plan=${plan} />`}</div>
    </main>
    <div style=${{ display:'flex', flexDirection:'column', overflow:'hidden', borderLeft:'1px solid var(--line)' }}>
      <aside class="right" style=${{ borderLeft:0, borderBottom:'1px solid var(--line)', maxHeight:'34%', flex:'none' }}>
        <${Fleet} onPick=${onPickRun} />
      </aside>
      <${Inspector} graph=${graph} node=${node} plan=${plan} trace=${trace}
        onSelect=${select} onRun=${onRun} onLoadTrace=${onLoadTrace} nodeState=${nodeState} onNodeState=${onNodeState} />
    </div>
  </div>`;
}

createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
