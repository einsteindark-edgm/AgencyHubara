# nginx config para system_explorer en docker.
#
# - Sirve dist/ estático desde /usr/share/nginx/html
# - Proxy /api/* → servicio `api` del docker-compose (FastAPI en puerto 8000)
# - SPA fallback: cualquier ruta no-matched cae a index.html (React Router style)
# - Caching: assets con hash en filename → cache 1 año; index.html → no-cache

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No cache para index.html — siempre fetch fresh para que el user vea
    # la última versión sin tener que limpiar cache
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Assets hasheados (vite) → cache largo (immutable)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Proxy API → backend FastAPI
    # `hubara-api` es el service name en docker-compose.base.yml
    location /api/ {
        proxy_pass http://hubara-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Timeouts amplios — el endpoint /graph puede tardar con muchos plugins
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # SPA fallback: cualquier otra ruta cae a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck path
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
