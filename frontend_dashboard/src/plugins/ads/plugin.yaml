id: ads
version: 0.1.0
archetype: full_stack  # P-29 (frontend completo (entities/features) + api de agregación local)
display_name: Ads Analytics
description: |
  Análisis de campañas Meta Ads → WhatsApp (CTWA). KPIs de ROAS/CAC, embudo
  de conversión, distribución por estado, serie diaria y conversaciones
  atribuidas. Backend self-contained (`/api/ads`) que deriva las campañas del
  vault (origin/last_touch del ingest WhatsApp); extraído de chats.

depends_on: []

frontend:
  entry: ./frontend
  contributes:
    sections:
      - { key: ads, label: Ads, order: 6, icon: megaphone }
    sidebar:
      - { route: /ads, label: Ads, icon: megaphone }

# Backend self-contained (extraído de chats — PLUGIN_CONTRACT.md §5.2). Lee el
# vault (origin/last_touch que persiste el ingest de WhatsApp) vía platform; no
# importa de ningún plugin sibling. Agregación en `src.plugins.ads.aggregation`,
# clasificación de estado en `src.plugins.ads.classification`.
api:
  python_module: src.plugins.ads.api
  prefix: /api/ads
  tags: [Ads]

wiring_intents:
  env_vars_required: []
