id: ads
version: 0.1.0
archetype: full_stack  # P-29 (frontend completo (entities/features) + api de agregación local)
display_name: Ads Analytics
description: |
  Análisis de campañas Meta Ads → WhatsApp (CTWA). KPIs de ROAS/CAC, embudo
  de conversión, distribución por estado, serie diaria y conversaciones
  atribuidas. Backend self-contained (`/api/ads`) que deriva las campañas del
  vault (origin/last_touch del ingest WhatsApp); extraído de chats.

depends_on: []

frontend:
  entry: ./frontend
  contributes:
    sections:
      - { key: ads, label: Ads, order: 6, icon: megaphone }
    sidebar:
      - { route: /ads, label: Ads, icon: megaphone }

# Backend self-contained (extraído de chats — PLUGIN_CONTRACT.md §5.2). Lee el
# vault (origin/last_touch que persiste el ingest de WhatsApp) vía platform; no
# importa de ningún plugin sibling. Agregación en `src.plugins.ads.aggregation`,
# clasificación de estado en `src.plugins.ads.classification`.
api:
  # `python_module` queda como ancla simbólica; con `legacy_routers` presente el
  # loader lo ignora y registra cada router explícito (src/main.py §_bootstrap_routers).
  python_module: src.plugins.ads.api
  prefix: /api/ads
  tags: [Ads]
  legacy_routers:
    # Router agregado del plugin (campañas del vault + análisis IA + /meta protegido:
    # status/insights/disconnect/gestión). PROTEGIDO con require_auth.
    - { module: src.plugins.ads.api, prefix: /api/ads, tags: [Ads] }
    # OAuth login + callback — PÚBLICO: el browser/Meta los invocan SIN bearer de
    # Cognito; la seguridad del callback es el `state` HMAC (PUBLIC_ROUTER=True).
    - { module: src.plugins.ads.api.meta_public, prefix: /api/ads/meta, tags: [Ads] }

wiring_intents:
  # OAuth + Marketing API de Meta (botón "Conectar con Meta"). El token vive
  # server-side en SSM SecureString (`/hubara/<tenant>/meta/oauth`); el App Secret
  # NUNCA se loguea. Sin estas vars, `/api/ads/meta/login` responde 503 y el
  # dashboard degrada limpio (insights → {connected:false}).
  env_vars_required:
    - META_APP_ID            # ID de la Meta App propia (Facebook Login + Marketing API)
    - META_APP_SECRET        # App Secret (solo backend; rotar si se expone)
    - META_OAUTH_REDIRECT_URI  # https://<backend>/api/ads/meta/callback (whitelistear en FB Login)
    # Opcionales (con default): META_OAUTH_SCOPES (default "ads_read"),
    # META_ADS_TENANT (default "hubara"), AWS_REGION (para SSM).
