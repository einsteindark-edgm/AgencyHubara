id: agents_admin
version: 0.1.0
display_name: Agents
description: UI de los agentes reales del sistema (lista, prompts, inspector). Lee los agentes de los manifests + el contenido vivo de sus workspaces vía GET /api/agents.

depends_on: []

# ── Frontend ───────────────────────────────────────────────────────────
# El shell renderiza la `Page` del plugin cuando section==="agent".
frontend:
  entry: ./frontend
  contributes:
    sections:
      - { key: agent, label: Agents, order: 5, icon: wand }
    sidebar:
      - { route: /agents, label: Agents, icon: wand }

# ── API REST (consumido por main.py) ────────────────────────────────────
# `agents_admin` aporta un endpoint propio: GET /api/agents devuelve los
# agentes reales del sistema + el contenido VIVO de sus workspaces
# (IDENTITY/SOUL/AGENTS/USER/TOOLS.md). El router descubre los agentes
# genéricamente desde los manifests (workers con bloque `dashboard:`) — no
# hardcodea ningún plugin. Ver src/plugins/agents_admin/service.py.
api:
  python_module: src.plugins.agents_admin.api
  prefix: /api/agents
  tags: [Agents]

# Sin `agent:` — agents_admin no corre workers Temporal; solo lee y expone los
# agentes que SÍ los corren (declarados en otros manifests).

wiring_intents:
  # No requiere recursos compartidos por ahora.
  env_vars_required: []
