id: agents_admin
version: 0.1.0
display_name: Agents
description: UI de gestión de agentes (lista, prompts, inspector) + endpoint GET /api/agents_admin que expone workers agénticos con workspace de prompts.

agentic: false  # agents_admin es el lector, no un agente conversacional

depends_on: []

# ── Frontend ───────────────────────────────────────────────────────────
# El shell renderiza la `Page` del plugin cuando section==="agent".
frontend:
  entry: ./frontend
  contributes:
    sections:
      - { key: agent, label: Agents, order: 5, icon: wand }
    sidebar:
      - { route: /agents, label: Agents, icon: wand }

# ── API REST ───────────────────────────────────────────────────────────
api:
  python_module: src.plugins.agents_admin.api.routes
  prefix: /api/agents_admin
  tags: [AgentsAdmin]

# Sin `agent:` — plugin sin workers Temporal (Template B).

wiring_intents:
  # No requiere recursos compartidos por ahora.
  env_vars_required: []
