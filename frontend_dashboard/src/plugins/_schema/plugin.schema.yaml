# JSON Schema (en formato YAML) para validar `plugin.yaml`.
#
# Cada plugin de AgencyHubara declara este manifest en
# `frontend_dashboard/src/plugins/<id>/plugin.yaml`. Es la única fuente
# de verdad consumida por:
#
#   1. `frontend_dashboard/scripts/plugins-sync.ts` → genera
#      `src/app/plugin-registry.generated.ts`.
#   2. `hubara_agency/src/main.py` (PR3+) → auto-discovery de routers FastAPI.
#   3. `hubara_agency/src/run_workers.py` (PR3+) → meta-launcher de workers.
#
# Solo `id` y `version` son obligatorios. Todo lo demás es opcional según
# qué capas habite el plugin (ver PLUGIN_ARCHITECTURE.md §4).

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://agencyhubara.dev/schemas/plugin.schema.yaml"
title: AgencyHubara Plugin Manifest
type: object
required: [id, version]
additionalProperties: false

properties:
  id:
    type: string
    description: |
      Identificador único del plugin (matches directory name). Convención:
      snake_case si tiene múltiples palabras (e.g. agents_admin, catalog_sync).
      Importante: el id se usa también como segmento de import path Python
      (`src.plugins.<id>`), por lo que NO puede contener guion medio.
    pattern: "^[a-z][a-z0-9_]*$"

  version:
    type: string
    description: SemVer del plugin
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+(-[a-z0-9.]+)?$"

  display_name:
    type: string
    description: Nombre para mostrar en UI

  description:
    type: string

  depends_on:
    type: array
    description: |
      IDs de otros plugins requeridos — SOLO dependencias DURAS (P-DEPS,
      PLUGIN_CONTRACT.md §4): el plugin NO funciona sin ellas (típicamente el
      provider de un `consumes:`/cast, o una capability que hoy vive en otro
      plugin, ej. eta→chats por el ingest de WhatsApp). ENFORCED AL BOOT
      (P-6): los 3 loaders (main.py, run_workers.py, plugins-sync.ts) llaman
      validate_enabled() — habilitar este plugin sin sus deps mata el proceso
      con mensaje accionable. Las transitions cross-plugin son SOFT y NO van
      acá (el dispatcher las skipea si el target está apagado — P-SKIP).
    items:
      type: string
    default: []

  consumes:
    type: array
    description: |
      Casts declarados (canal 3, PLUGIN_CONTRACT.md §5.3) — la ÚNICA forma de
      consumir DATOS de otro plugin. Cada entry: el provider DEBE estar en
      depends_on, y `cast` apunta a un módulo real bajo este plugin (el cast
      corre SERVER-SIDE: el frontend del consumidor solo llama
      /api/<este-id>/*). Gate P-14 valida forma + existencia del cast.
      Ejemplos vivos: chats (order@v1 → order-ref vía api/order_actions),
      agents_admin (evals@v1 vía api/evals).
    items:
      type: object
      properties:
        provider: { type: string, description: plugin id del dueño del contrato (∈ depends_on) }
        contract: { type: string, description: contrato versionado que el provider publica (ej. order@v1) }
        into: { type: string, description: nombre de la entity/vista LOCAL del consumidor }
        cast: { type: string, description: path relativo al plugin del módulo cast (ej. api/order_actions) }
      required: [provider, contract, into, cast]
    default: []

  agentic:
    type: boolean
    description: |
      Marca que el plugin alberga agentes conversacionales con workspace
      de prompts (IDENTITY.md, SOUL.md, TOOLS.md, AGENTS.md, USER.md).
      Solo los plugins con agentic=true aparecen en GET /api/agents
      (agents_admin) — HONRADO por el código desde F1 (refactor fable):
      discover_agents() filtra por este flag + ENABLED_PLUGINS. El gate P-17
      exige coherencia: agentic=true ⟺ ≥1 worker con bloque `dashboard:`.
      Aplica independientemente de si el plugin tiene sección `agent:` —
      un plugin puede tener workers Temporal no conversacionales (e.g. catalog).
    default: false

  # ── Frontend (consumido por scripts/plugins-sync.ts) ────────────────
  frontend:
    type: object
    additionalProperties: false
    properties:
      entry:
        type: string
        description: Path relativo al manifest, apunta al index.ts del frontend
        default: "./frontend"
      contributes:
        type: object
        additionalProperties: false
        properties:
          sidebar:
            type: array
            items:
              type: object
              required: [route, label]
              properties:
                route: { type: string }
                label: { type: string }
                icon: { type: string }
                badge_query: { type: string }
          sections:
            type: array
            description: Secciones del shell macOS (consumidas por Toolbar/Dashboard)
            items:
              type: object
              required: [key, label]
              properties:
                key: { type: string }
                label: { type: string }
                order: { type: integer }
                icon:
                  type: string
                  description: |
                    Nombre del icon en `frontend_dashboard/src/shared/ui/Icon.tsx`.
                    Si no existe, el Toolbar fallback a `bot` con un warning en consola.
          dashboard_widgets:
            type: array
            items:
              type: object
              required: [id, position]
              properties:
                id: { type: string }
                position: { type: string }

  # ── API REST (consumido por main.py) ────────────────────────────────
  # Política del loader (ver hubara_agency/src/main.py:_bootstrap_routers):
  #   - Si `legacy_routers` está presente y no vacío, GANA: cada entry se
  #     registra con su prefix/tags propios. `python_module` se ignora aunque
  #     exponga un `router`. Sirve a casos como `chats` donde `api/__init__.py`
  #     no agrega un router unificado y hay 3 sub-routers con prefijos
  #     heterogéneos.
  #   - Si solo `python_module` está y expone `router`, se registra ése con
  #     el `prefix`/`tags` del manifest (default `/api/<id>`, `[<id>]`).
  #   - Si `python_module` no expone `router` y no hay `legacy_routers`, el
  #     plugin no contribuye HTTP — log debug + sigue arrancando.
  #   - Si hay error de import, fail-fast (el boot rompe).
  api:
    type: object
    additionalProperties: false
    properties:
      python_module:
        type: string
        description: |
          Módulo Python que exporta `router` (e.g. `src.plugins.chats.api`).
          IGNORADO cuando `legacy_routers` está presente (ver política arriba).
      prefix:
        type: string
        description: Prefijo de URL (e.g. `/api/chats`). Solo aplica a `python_module`.
      tags:
        type: array
        items: { type: string }
      legacy_routers:
        type: array
        description: |
          Routers múltiples cuando un solo `python_module` no alcanza (caso
          `chats` con 3 sub-routers de prefijos distintos). Cada entry tiene
          su propio prefix/tags. GANA sobre `python_module` si ambos están.
        items:
          type: object
          required: [module]
          properties:
            module: { type: string }
            prefix: { type: string }
            tags:
              type: array
              items: { type: string }
      migrations:
        type: string
        description: Path al directorio de migrations (alembic env per-plugin)

  # ── Agente Temporal (opcional) ──────────────────────────────────────
  agent:
    type: object
    additionalProperties: false
    properties:
      python_module:
        type: string
        description: Módulo que exporta WORKFLOWS, ACTIVITIES, TOOL_FACTORIES
      worker_module:
        type: string
        description: Módulo singular con main() — alternativa a `workers`
      workers:
        type: array
        description: |
          Lista de workers Temporal del plugin. Cada entry es la única fuente de
          verdad para su task queue + deployment (k8s + docker-compose se
          generan desde aquí — ver scripts/render-compose.py).
        items:
          type: object
          required: [name, module, task_queue]
          properties:
            name:
              type: string
              description: Nombre interno del worker dentro del plugin (e.g. "sales").
            module:
              type: string
              description: |
                Python module path del worker (debe exponer `async def main()`
                cuya PRIMERA línea sea `ensure_plugin_enabled("<plugin-id>")`
                — self-gate P-21, src.platform.plugin_runtime; el gate de
                conformance lo verifica por AST).
            owns_route:
              type: string
              description: |
                Ruta de conversación (`active_route` en metadata.json) que este
                worker POSEE — route registry F6 (src/platform/routing.py). El
                ruteo de inbounds la resuelve genéricamente: ningún agente
                nombra a otro, y las rutas core (ventas/remarketing/humano) no
                son registrables. Requiere `route_workflow_id_template`. Gate
                P-18: el registry resuelve + las transitions de otros manifests
                que targetean a este worker usan SU prefijo + el ruteo de chats
                no puede hardcodear ninguno.
            route_workflow_id_template:
              type: string
              description: |
                Template del workflow id de sesión del dueño de la ruta — DEBE
                contener "{session_id}" (ej. "eta-{session_id}"). Es la ÚNICA
                copia del template en el sistema: el registry la usa para rutear
                inbounds y P-18 ata a su prefijo los workflow_id_template de
                las transitions que targetean este worker.
            task_queue:
              type: string
              description: |
                Temporal task queue string (e.g. "queue-sales-agent"). El worker
                escucha aquí; los dispatchers que arrancan workflows en esta
                queue la leen del manifest via `src.platform.plugin_manifest.get_task_queue`.
                Convención: prefijo "queue-" + nombre descriptivo.
              pattern: "^[a-z][a-z0-9-]*$"
            workflow_classes:
              type: array
              description: |
                Nombres canónicos de los workflows que este worker registra. Cada
                entry es el `__name__` (o el `name=` decorator) de la clase
                Workflow Python.

                Permite que dispatchers cross-agent arranquen workflows POR
                STRING (Temporal acepta tanto class como string) sin importar la
                clase del sibling — desbloquea R-DIP #10 sin excepciones.

                Si el worker NO declara workflow_classes, las invocaciones
                cross-agent fallan con WorkflowClassNotDeclaredError. Convención:
                el primer entry es el "main" workflow del worker.

                Ejemplo: ["HubaraSalesSessionWorkflow"], ["RemarketingWorkflow"].
              items:
                type: string
                pattern: "^[A-Z][A-Za-z0-9]*$"
            emits:
              type: array
              description: |
                Eventos de completion / transición que el workflow puede emitir
                durante o al final de su ejecución. El dispatcher de
                src.platform.orchestration matchea estos contra `transitions[]`
                para arrancar el siguiente nodo declarativamente.

                Cada entry es el nombre canónico del dataclass del evento (e.g.
                "SalesSessionCompletionEvent"). El evento DEBE estar definido en
                `src.plugins.<plugin>.shared.contracts.events` (o en
                `src.platform.contracts` para eventos cross-plugin) como
                @dataclass(frozen=True) — R-JSON.

                Si un workflow NO emite eventos (terminal), declarar `emits: []`
                explícitamente.

                Ver ADR-2026-05-20-declarative-orchestration §3.
              items:
                type: string
                pattern: "^[A-Z][A-Za-z0-9]*Event$"
            transitions:
              type: array
              description: |
                Transiciones declarativas que el dispatcher ejecuta cuando este
                worker emite un evento. Cada entry es una regla:
                `on_event + when (matcher simple) + action (target)`.

                El dispatcher (`src.platform.orchestration.dispatcher.dispatch_event_activity`)
                lee este array, evalúa `when` (igualdad de campos simples),
                y para cada match ejecuta `action` — sin que el workflow source
                conozca el target. Esto desacopla siblings completamente.

                Cada transición tiene id único (para logs/traces).

                Reglas de matching `when`:
                  - keys del dict son campos del evento (debe existir el atributo)
                  - values son matchers literales (string, int, bool, null)
                  - todos los pares deben matchear (AND)
                  - `when: {}` matchea todos los eventos del tipo `on_event`

                Ver ADR-2026-05-20-declarative-orchestration §4.
              items:
                type: object
                required: [id, on_event, action]
                additionalProperties: false
                properties:
                  id:
                    type: string
                    description: |
                      Identificador único de la transición dentro del worker
                      (para logs / traces / system_map labels). snake_case.
                    pattern: "^[a-z][a-z0-9_]*$"
                  on_event:
                    type: string
                    description: |
                      Nombre canónico del evento que dispara la transición.
                      DEBE matchear un entry de `emits[]` del MISMO worker.
                    pattern: "^[A-Z][A-Za-z0-9]*Event$"
                  when:
                    type: object
                    description: |
                      Matcher simple. Igualdad de campos del evento. AND de
                      todos los pares. `{}` = matchea cualquiera. NO se eval-ea
                      código — solo `getattr(event, key) == value`.

                      Para lógica compleja: el workflow setea el campo
                      apropiado y el matcher checa el campo ya calculado.
                    additionalProperties:
                      oneOf:
                        - { type: string }
                        - { type: integer }
                        - { type: boolean }
                        - { type: "null" }
                  action:
                    type: object
                    description: Qué hacer cuando matchea la transición.
                    required: [via, target_workflow]
                    additionalProperties: false
                    properties:
                      via:
                        type: string
                        description: Mecanismo Temporal usado.
                        enum:
                          - start_workflow                # falla si ya existe
                          - start_workflow_with_replace   # termina existente RUNNING, arranca nuevo
                          - ensure_running                # noop si RUNNING; arranca si no
                          - signal                        # signal a existing handle
                      target_plugin:
                        type: string
                        description: |
                          Plugin owner del worker target. Opcional — default =
                          mismo plugin que el caller. Cross-plugin debe declararse.
                      target_worker:
                        type: string
                        description: |
                          Nombre del worker target (debe existir en su plugin).
                      target_workflow:
                        type: string
                        description: |
                          Nombre del workflow target (debe estar en
                          `workflow_classes[]` del worker target).
                        pattern: "^[A-Z][A-Za-z0-9]*$"
                      signal_name:
                        type: string
                        description: |
                          Solo para `via: signal` — nombre del signal handler
                          en el workflow target (e.g. "send_message").
                      workflow_id_template:
                        type: string
                        description: |
                          Plantilla del workflow_id. Tokens: `{session_id}`,
                          `{event.<field>}`. Default: `{event.session_id}` si
                          el evento lo tiene; sino requerido explícito.
                      input_mapping:
                        type: object
                        description: |
                          Map de campos del workflow target → expresión del
                          evento. Path simple: `$.field_name` o `$` (todo).
                          Si se omite, el dispatcher pasa el evento completo
                          como single arg.
                        additionalProperties:
                          type: string
                      start_delay_field:
                        type: string
                        description: |
                          Solo `start_workflow*` — nombre del campo del evento
                          que contiene segundos de delay (e.g. "delay_seconds").
                          Si está, se aplica `start_delay=timedelta(seconds=v)`.
            invokes:
              type: array
              description: |
                LEGACY — declaración documental solo. Reemplazada por
                `transitions[]` declarativas (ADR-2026-05-20). Conservada para
                compat con system_map drift detector durante la migración.
              items:
                type: object
                required: [worker]
                additionalProperties: false
                properties:
                  plugin:
                    type: string
                    description: |
                      Plugin owner del worker target. Opcional — default = mismo
                      plugin que el caller. Para cross-plugin, declarar explícito.
                  worker:
                    type: string
                    description: Nombre del worker target (debe existir en su plugin).
                  via:
                    type: string
                    description: Mecanismo Temporal usado para la invocación.
                    enum:
                      - start_workflow
                      - start_child_workflow
                      - signal
                      - get_workflow_handle
                      - continue_as_new
                  when:
                    type: string
                    description: |
                      Docstring corto de la condición (para humanos). NO se evalúa.
                      Ejemplo: "tag=INTERESADO al cerrar venta".
            deployment:
              type: object
              description: |
                Hint para auto-generar el K8s deployment del worker (script
                pendiente — hoy se mantienen los manifests a mano y un test
                invariante verifica paridad).
              additionalProperties: false
              properties:
                replicas: { type: integer, minimum: 1 }
                cpu_request: { type: string }
                cpu_limit: { type: string }
                memory_request: { type: string }
                memory_limit: { type: string }
                strategy:
                  type: string
                  enum: [RollingUpdate, Recreate]
                  description: Recreate para single-writer (ver catalog).
                env_secrets:
                  type: array
                  description: Lista de env vars que se inyectan desde Secrets de K8s.
                  items:
                    type: object
                    required: [var]
                    properties:
                      var: { type: string }
                      secret: { type: string }
                      key: { type: string }
            compose:
              type: object
              description: |
                Hint para auto-generar el service en docker-compose.local.yml
                (via scripts/render-compose.py). El operador no edita
                docker-compose.local.yml a mano — se regenera desde aquí.
              additionalProperties: false
              properties:
                env:
                  type: object
                  description: Map de env vars → valor (string o "${HOST_VAR}").
                  additionalProperties:
                    type: string
                volumes:
                  type: array
                  description: Lista de volumes a montar (formato compose).
                  items: { type: string }
                depends_on:
                  type: array
                  description: |
                    Services que este worker requiere up antes de arrancar
                    (matcheado por nombre exacto del service en docker-compose).
                  items: { type: string }
      task_queue:
        type: string
        description: Default task queue del modo (opcional)
      mode:
        type: string
        enum: [session_based, turn_based]
      graph_spec:
        type: string
        description: Path a LangGraph spec (deferred — ver §10 contrato)

  # ── Jobs programados (opcional) ─────────────────────────────────────
  jobs:
    type: array
    items:
      type: object
      required: [id, schedule, handler]
      properties:
        id: { type: string }
        schedule: { type: string, description: "Crontab string" }
        handler: { type: string, description: "Python module:function" }

  # ── Wiring intents (cosas que tocan archivos centrales) ─────────────
  wiring_intents:
    type: object
    additionalProperties: true
    properties:
      db_tables:
        type: array
        items: { type: string }
      s3_buckets:
        type: array
        items: { type: string }
      filesystem_volumes:
        type: array
        items: { type: string }
      env_vars_required:
        type: array
        items: { type: string }

  # ── Permisos cross-plugin (opcional) ────────────────────────────────
  permissions:
    type: object
    additionalProperties: false
    properties:
      reads:
        type: array
        items: { type: string }
      writes:
        type: array
        items: { type: string }
