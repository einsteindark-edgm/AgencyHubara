# JSON Schema (en formato YAML) para validar `plugin.yaml`.
#
# Cada plugin de AgencyHubara declara este manifest en
# `frontend_dashboard/src/plugins/<id>/plugin.yaml`. Es la única fuente
# de verdad consumida por:
#
#   1. `frontend_dashboard/scripts/plugins-sync.ts` → genera
#      `src/app/plugin-registry.generated.ts`.
#   2. `hubara_agency/src/main.py` (PR3+) → auto-discovery de routers FastAPI.
#   3. `hubara_agency/src/run_workers.py` (PR3+) → meta-launcher de workers.
#
# Solo `id` y `version` son obligatorios. Todo lo demás es opcional según
# qué capas habite el plugin (ver PLUGIN_ARCHITECTURE.md §4).

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://agencyhubara.dev/schemas/plugin.schema.yaml"
title: AgencyHubara Plugin Manifest
type: object
required: [id, version]
additionalProperties: false

properties:
  id:
    type: string
    description: |
      Identificador único del plugin (matches directory name). Convención:
      snake_case si tiene múltiples palabras (e.g. agents_admin, catalog_sync).
      Importante: el id se usa también como segmento de import path Python
      (`src.plugins.<id>`), por lo que NO puede contener guion medio.
    pattern: "^[a-z][a-z0-9_]*$"

  version:
    type: string
    description: SemVer del plugin
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+(-[a-z0-9.]+)?$"

  display_name:
    type: string
    description: Nombre para mostrar en UI

  description:
    type: string

  depends_on:
    type: array
    description: IDs de otros plugins requeridos
    items:
      type: string
    default: []

  # ── Frontend (consumido por scripts/plugins-sync.ts) ────────────────
  frontend:
    type: object
    additionalProperties: false
    properties:
      entry:
        type: string
        description: Path relativo al manifest, apunta al index.ts del frontend
        default: "./frontend"
      contributes:
        type: object
        additionalProperties: false
        properties:
          sidebar:
            type: array
            items:
              type: object
              required: [route, label]
              properties:
                route: { type: string }
                label: { type: string }
                icon: { type: string }
                badge_query: { type: string }
          sections:
            type: array
            description: Secciones del shell macOS (consumidas por Toolbar/Dashboard)
            items:
              type: object
              required: [key, label]
              properties:
                key: { type: string }
                label: { type: string }
                order: { type: integer }
                icon:
                  type: string
                  description: |
                    Nombre del icon en `frontend_dashboard/src/shared/ui/Icon.tsx`.
                    Si no existe, el Toolbar fallback a `bot` con un warning en consola.
          dashboard_widgets:
            type: array
            items:
              type: object
              required: [id, position]
              properties:
                id: { type: string }
                position: { type: string }

  # ── API REST (consumido por main.py) ────────────────────────────────
  # Política del loader (ver hubara_agency/src/main.py:_bootstrap_routers):
  #   - Si `legacy_routers` está presente y no vacío, GANA: cada entry se
  #     registra con su prefix/tags propios. `python_module` se ignora aunque
  #     exponga un `router`. Sirve a casos como `chats` donde `api/__init__.py`
  #     no agrega un router unificado y hay 3 sub-routers con prefijos
  #     heterogéneos.
  #   - Si solo `python_module` está y expone `router`, se registra ése con
  #     el `prefix`/`tags` del manifest (default `/api/<id>`, `[<id>]`).
  #   - Si `python_module` no expone `router` y no hay `legacy_routers`, el
  #     plugin no contribuye HTTP — log debug + sigue arrancando.
  #   - Si hay error de import, fail-fast (el boot rompe).
  api:
    type: object
    additionalProperties: false
    properties:
      python_module:
        type: string
        description: |
          Módulo Python que exporta `router` (e.g. `src.plugins.chats.api`).
          IGNORADO cuando `legacy_routers` está presente (ver política arriba).
      prefix:
        type: string
        description: Prefijo de URL (e.g. `/api/chats`). Solo aplica a `python_module`.
      tags:
        type: array
        items: { type: string }
      legacy_routers:
        type: array
        description: |
          Routers múltiples cuando un solo `python_module` no alcanza (caso
          `chats` con 3 sub-routers de prefijos distintos). Cada entry tiene
          su propio prefix/tags. GANA sobre `python_module` si ambos están.
        items:
          type: object
          required: [module]
          properties:
            module: { type: string }
            prefix: { type: string }
            tags:
              type: array
              items: { type: string }
      migrations:
        type: string
        description: Path al directorio de migrations (alembic env per-plugin)

  # ── Agente Temporal (opcional) ──────────────────────────────────────
  agent:
    type: object
    additionalProperties: false
    properties:
      python_module:
        type: string
        description: Módulo que exporta WORKFLOWS, ACTIVITIES, TOOL_FACTORIES
      worker_module:
        type: string
        description: Módulo singular con main() — alternativa a `workers`
      workers:
        type: array
        description: |
          Lista de workers Temporal del plugin. Cada entry es la única fuente de
          verdad para su task queue + deployment (k8s + docker-compose se
          generan desde aquí — ver scripts/render-compose.py).
        items:
          type: object
          required: [name, module, task_queue]
          properties:
            name:
              type: string
              description: Nombre interno del worker dentro del plugin (e.g. "sales").
            module:
              type: string
              description: Python module path del worker (debe exponer `async def main()`).
            task_queue:
              type: string
              description: |
                Temporal task queue string (e.g. "queue-sales-agent"). El worker
                escucha aquí; los dispatchers que arrancan workflows en esta
                queue la leen del manifest via `src.platform.plugin_manifest.get_task_queue`.
                Convención: prefijo "queue-" + nombre descriptivo.
              pattern: "^[a-z][a-z0-9-]*$"
            deployment:
              type: object
              description: |
                Hint para auto-generar el K8s deployment del worker (script
                pendiente — hoy se mantienen los manifests a mano y un test
                invariante verifica paridad).
              additionalProperties: false
              properties:
                replicas: { type: integer, minimum: 1 }
                cpu_request: { type: string }
                cpu_limit: { type: string }
                memory_request: { type: string }
                memory_limit: { type: string }
                strategy:
                  type: string
                  enum: [RollingUpdate, Recreate]
                  description: Recreate para single-writer (ver catalog).
                env_secrets:
                  type: array
                  description: Lista de env vars que se inyectan desde Secrets de K8s.
                  items:
                    type: object
                    required: [var]
                    properties:
                      var: { type: string }
                      secret: { type: string }
                      key: { type: string }
            compose:
              type: object
              description: |
                Hint para auto-generar el service en docker-compose.local.yml
                (via scripts/render-compose.py). El operador no edita
                docker-compose.local.yml a mano — se regenera desde aquí.
              additionalProperties: false
              properties:
                env:
                  type: object
                  description: Map de env vars → valor (string o "${HOST_VAR}").
                  additionalProperties:
                    type: string
                volumes:
                  type: array
                  description: Lista de volumes a montar (formato compose).
                  items: { type: string }
                depends_on:
                  type: array
                  description: |
                    Services que este worker requiere up antes de arrancar
                    (matcheado por nombre exacto del service en docker-compose).
                  items: { type: string }
      task_queue:
        type: string
        description: Default task queue del modo (opcional)
      mode:
        type: string
        enum: [session_based, turn_based]
      graph_spec:
        type: string
        description: Path a LangGraph spec (deferred — ver §10 contrato)

  # ── Jobs programados (opcional) ─────────────────────────────────────
  jobs:
    type: array
    items:
      type: object
      required: [id, schedule, handler]
      properties:
        id: { type: string }
        schedule: { type: string, description: "Crontab string" }
        handler: { type: string, description: "Python module:function" }

  # ── Wiring intents (cosas que tocan archivos centrales) ─────────────
  wiring_intents:
    type: object
    additionalProperties: true
    properties:
      db_tables:
        type: array
        items: { type: string }
      s3_buckets:
        type: array
        items: { type: string }
      filesystem_volumes:
        type: array
        items: { type: string }
      env_vars_required:
        type: array
        items: { type: string }

  # ── Permisos cross-plugin (opcional) ────────────────────────────────
  permissions:
    type: object
    additionalProperties: false
    properties:
      reads:
        type: array
        items: { type: string }
      writes:
        type: array
        items: { type: string }
