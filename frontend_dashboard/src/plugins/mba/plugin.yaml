# Manifest de mba — generado por `hubara create plugin` (F-SDK-3).
# Contrato: PLUGIN_CONTRACT.md · schema: ../_schema/plugin.schema.yaml
# Regla de oro: campo nuevo ⇒ schema + modelo tipado + check (mismo PR).
id: mba
version: 0.1.0
archetype: full_stack  # P-29: el TCK audita esta identidad de por vida
display_name: Meta Business Agent
# Dependencias FUNCIONALES (L-18: el edge del System Map sale SOLO de acá y P-6
# las exige al habilitar el plugin):
# - chats: las connector tools escriben en las conversaciones que chats posee
#   (set_order_slot → draft, manage_conversation_tag → tag, escalate_to_human →
#   route=humano) y el webhook `standby` de MBA lo recibe el ingest de chats.
# - orders: register_order / check_order_status / verify_order_for_checkout
#   delegan en el ciclo de vida de pedidos.
# - catalog: search_products / list_categories / get_product_by_handle leen el
#   snapshot del catálogo.
depends_on: [chats, orders, catalog]
# Canal 3 (PLUGIN_CONTRACT §5.3) — casting declarado. Las 4 connector tools de
# ESCRITURA delegan al contrato `session-actions@v1` que chats publica bajo
# `/api/chats/session-actions/{session_key}/{draft,order,tag,escalate}`; el
# cast (`src.plugins.mba.api.chats_cast`) va por castkit en modo service
# (Meta autentica con X-API-Key: no hay bearer que portar).
consumes:
  - provider: chats
    contract: session-actions@v1
    into: session-ref
    cast: api/chats_cast
description: |
  Meta Business Agent: la configuración REAL que se envía al agente hospedado por Meta
  (skills, conocimiento, connector tools, UI skills, settings) autorada en agents/<id>/,
  los endpoints del connector que MBA invoca, y la sección del dashboard que lo muestra.

# ── Frontend ───────────────────────────────────────────────────────────
frontend:
  entry: ./frontend
  contributes:
    sections:
      - { key: mba, label: Meta Business Agent, order: 90, icon: bot }
    sidebar:
      - { route: /mba, label: Meta Business Agent, icon: bot }

# ── API REST ────────────────────────────────────────────────────────────
api:
  python_module: src.plugins.mba.api
  prefix: /api/mba
  tags: [Meta Business Agent]
  # Dos routers bajo el mismo prefijo: el plano de gestión (protegido) y las
  # connector tools que invoca Meta (PUBLIC_ROUTER + API key propia).
  legacy_routers:
    - { module: src.plugins.mba.api, prefix: /api/mba, tags: [Meta Business Agent] }
    - { module: src.plugins.mba.api.connector, prefix: /api/mba, tags: [MBA connector] }
