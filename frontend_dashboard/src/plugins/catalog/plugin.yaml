id: catalog
version: 0.1.0
archetype: sync  # P-29 (pipeline source→sink: Medusa → snapshot local → Meta Catalog)
display_name: Catalog Sync
description: Sincronización del catálogo de productos (Medusa → snapshot filesystem). Worker Temporal disparado por schedule o manualmente; el frontend muestra jobs + permite disparar syncs.

depends_on: []

# ── Frontend ───────────────────────────────────────────────────────────
frontend:
  entry: ./frontend
  contributes:
    sections:
      - { key: upload, label: Catalog, order: 4, icon: pkg }
    sidebar:
      - { route: /catalog, label: Catalog, icon: pkg }

# ── API HTTP ───────────────────────────────────────────────────────────
# El dashboard dispara + observa el sync vía estos endpoints. El handler usa
# get_temporal_client() para arrancar/consultar el CatalogSyncWorkflow (un
# endpoint HTTP NO es workflow ni tool, así que R-DIP lo permite). El worker
# también se puede disparar standalone desde scripts/trigger_catalog_sync.py.
api:
  python_module: src.plugins.catalog.api
  prefix: /api/catalog
  tags: [Catalog]

# ── Agente Temporal ────────────────────────────────────────────────────
# Single worker en CATALOG_SYNC_QUEUE. CRITICAL: 1 replica only — race en
# os.replace si hay múltiples writers (ver k8s/aws-produccion/worker-catalog-sync.yaml).
agent:
  python_module: src.plugins.catalog.agent
  workers:
    - name: sync
      module: src.plugins.catalog.workers.sync
      task_queue: queue-catalog-sync
      deployment:
        replicas: 1                       # CRITICAL: single writer (race en os.replace)
        strategy: Recreate                # evita dos pods escribiendo durante rollout
        cpu_request: 100m
        memory_request: 256Mi
        env_secrets:
          - { var: MEDUSA_BASE_URL,        secret: hubara-medusa-secret, key: MEDUSA_BASE_URL }
          - { var: MEDUSA_ADMIN_TOKEN,     secret: hubara-medusa-secret, key: MEDUSA_ADMIN_TOKEN }
          - { var: META_CATALOG_ID,        secret: hubara-meta-secret,   key: META_CATALOG_ID }
          - { var: META_SYSTEM_USER_TOKEN, secret: hubara-meta-secret,   key: META_SYSTEM_USER_TOKEN }
      compose:
        env:
          TEMPORAL_URL: temporal:7233
          WORKSPACE_VAULT_DIR: /app/hubara_vault
          CATALOG_SNAPSHOT_DIR: /app/hubara_vault/catalog
          CATALOG_MAX_AGE_MINUTES: "30"
          MEDUSA_BASE_URL: ${MEDUSA_BASE_URL}
          MEDUSA_ADMIN_TOKEN: ${MEDUSA_ADMIN_TOKEN}
          # Meta Commerce Catalog (HU-002 Parte B) — push paso 3 del workflow.
          # Si no están seteados en host .env, el push hace graceful skip.
          # Ver hubara_agency/docs/META_CATALOG_SETUP.md.
          META_CATALOG_ID: ${META_CATALOG_ID}
          META_SYSTEM_USER_TOKEN: ${META_SYSTEM_USER_TOKEN}
        volumes:
          - hubara-vault-local:/app/hubara_vault
        depends_on:
          - temporal

wiring_intents:
  filesystem_volumes:
    - hubara-vault                       # subPath catalog/
  env_vars_required:
    - TEMPORAL_URL
    - CATALOG_SNAPSHOT_DIR
    - MEDUSA_BASE_URL
    - MEDUSA_ADMIN_TOKEN
  env_vars_optional:
    - META_CATALOG_ID
    - META_SYSTEM_USER_TOKEN          # sin estos, push paso 3 hace graceful skip
