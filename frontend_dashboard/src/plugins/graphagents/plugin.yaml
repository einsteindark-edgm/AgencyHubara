id: graphagents
version: 0.1.0
archetype: full_stack  # P-29 (frontend completo + api del buzón; el agente real vive en GraphAgents, fuera del monorepo)
display_name: GraphAgents
description: >-
  Buzón del dashboard para los agentes de análisis de Meta Ads (GraphAgents/LangGraph).
  El usuario elige un agente del selector, edita el JSON de entrada pre-cargado, dispara
  un run y ve el progreso EN VIVO por SSE (running → awaiting_approval → completed/failed)
  con HITL (aprobar/rechazar) y el resultado. Equivalente al viewer de GraphAgents pero
  desde el dashboard de prod. Backend self-contained: el buzón (`/api/graphagents`) pollea
  Conductor de la caja GraphAgents y republica al `DashboardEventBus` (dominio `graphagents`).

# El plugin NO declara `depends_on`: el puente al runtime de GraphAgents es HTTP
# (poll de Conductor + execution-id), no una dep de plugin del monorepo. El frontend
# solo habla con `/api/graphagents/*`.
depends_on: []

frontend:
  entry: ./frontend
  contributes:
    sections:
      # `order: 7` = siguiente libre (chats=1, orders=2, eta=3, catalog=4,
      # agents_admin=5, ads=6). `icon: bot` existe en el set base de
      # `src/shared/ui/Icon.tsx` (sin fallback en consola).
      - { key: graphagents, label: GraphAgents, order: 7, icon: bot }
    sidebar:
      - { route: /graphagents, label: GraphAgents, icon: bot }

# ── API REST ────────────────────────────────────────────────────────────
# Backend self-contained (ya implementado — NO lo toca esta HU). Sirve el buzón:
# catálogo de agentes (selector + JSON de ejemplo), disparo de runs, snapshot del
# record, SSE en vivo por run y el resume del HITL. R-DIP: el módulo importa de
# `src.platform.events` (bus in-proc) + sus propios `runs/*`, NO de otro plugin.
api:
  python_module: src.plugins.graphagents.api
  prefix: /api/graphagents
  tags: [GraphAgents]

wiring_intents:
  env_vars_required: []
  env_vars_optional:
    - GRAPHAGENTS_CONDUCTOR_URL   # default http://localhost:6767 (REST de la caja)
