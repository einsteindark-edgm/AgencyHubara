id: orders
version: 0.2.0
display_name: Orders
description: Tablero kanban de órdenes (estados + filtros + inspector). Backend conectado a Medusa v2 (`/admin/orders` + `/admin/draft-orders`) via `OrderQueryPort` — los datos vivos del registro de ventas (Sales agent `register_order` tool) se ven aquí.

depends_on: []

frontend:
  entry: ./frontend
  contributes:
    sections:
      - { key: orders, label: Orders, order: 2, icon: workflow }
    sidebar:
      - { route: /orders, label: Orders, icon: workflow }

# Backend: router FastAPI sirviendo el kanban desde Medusa. R-DIP: el módulo
# importa del platform/ (port + composition) y NO de otro plugin sibling.
api:
  python_module: src.plugins.orders.api
  prefix: /api/orders
  tags: [Orders]

wiring_intents:
  env_vars_required:
    # Lectura — basta con base_url + auth para que el dashboard liste
    # órdenes. Si están vacíos, el endpoint devuelve `catalog_available:
    # false` + lista vacía (no rompe el dashboard, pinta estado vacío).
    - MEDUSA_BASE_URL
    - MEDUSA_ADMIN_TOKEN
