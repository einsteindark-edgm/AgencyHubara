id: orders
version: 0.2.0
archetype: full_stack  # P-29 (frontend completo + api + workers de background (no conversacionales))
display_name: Orders
description: Tablero kanban de órdenes (estados + filtros + inspector). Backend conectado a Medusa v2 (`/admin/orders` + `/admin/draft-orders`) via `OrderQueryPort` — los datos vivos del registro de ventas (Sales agent `register_order` tool) se ven aquí.

depends_on: []

frontend:
  entry: ./frontend
  contributes:
    sections:
      - { key: orders, label: Orders, order: 2, icon: workflow }
    sidebar:
      - { route: /orders, label: Orders, icon: workflow }

# Backend: router FastAPI sirviendo el kanban desde Medusa. R-DIP: el módulo
# importa del platform/ (port + composition) y NO de otro plugin sibling.
api:
  python_module: src.plugins.orders.api
  prefix: /api/orders
  tags: [Orders]

# ── Agente Temporal ────────────────────────────────────────────────────
# Worker de reconciliación (premortem F2+K1): al boot asegura un Temporal
# Schedule que dispara OrderReconciliationWorkflow cada N min para reintentar
# los pedidos que NO llegaron a Medusa (Medusa caído durante el cierre). El
# barrido es idempotente (reconcile_one no duplica drafts), así que single
# replica + overlap=SKIP alcanza.
agent:
  python_module: src.plugins.orders.agent
  workers:
    - name: reconcile
      module: src.plugins.orders.workers.reconcile
      task_queue: queue-orders-reconcile
      # ── Orquestación declarativa (ADR-2026-05-20) — disparo del Agente ETA ──
      # La orders API emite `OrderStageChangedEvent` tras cada transición de
      # stage (PATCH .../schedule → preparing, PATCH .../stage, POST .../cancel).
      # El dispatcher lo rutea acá: `preparing` ARRANCA el workflow de
      # seguimiento ETA (eta/eta); el resto lo SIGNALEA (`notify_stage_change`).
      # Si no hay workflow ETA corriendo, el signal devuelve NOT_FOUND y el
      # dispatcher lo absorbe como no-op (`dispatcher._is_not_found`).
      # NOTA: el emisor real es la HTTP API (no el proceso `reconcile`), pero las
      # transiciones se declaran bajo este worker porque es el agente del plugin
      # `orders` que orquesta el ciclo de vida del pedido — el dispatcher las
      # busca por (source_plugin, source_worker) = (orders, reconcile). Mismo
      # patrón que el ingest HTTP de chats emitiendo con source_worker=sales.
      emits:
        - OrderStageChangedEvent
      transitions:
        - id: order_preparing_starts_eta
          on_event: OrderStageChangedEvent
          when:
            to_stage: preparing
          action:
            via: start_workflow_with_replace
            target_plugin: eta
            target_worker: eta
            target_workflow: HubaraEtaSessionWorkflow
            workflow_id_template: "eta-{event.session_id}"
            input_mapping:
              session_id: "$.session_id"
              order_id: "$.order_id"
              to_stage: "$.to_stage"
        - id: order_ready_notifies_eta
          on_event: OrderStageChangedEvent
          when:
            to_stage: ready
          action:
            via: signal_with_start
            target_plugin: eta
            target_worker: eta
            target_workflow: HubaraEtaSessionWorkflow
            workflow_id_template: "eta-{event.session_id}"
            signal_name: notify_stage_change
            input_mapping:
              session_id: "$.session_id"
              order_id: "$.order_id"
              to_stage: "$.to_stage"
        - id: order_shipping_notifies_eta
          on_event: OrderStageChangedEvent
          when:
            to_stage: shipping
          action:
            via: signal_with_start
            target_plugin: eta
            target_worker: eta
            target_workflow: HubaraEtaSessionWorkflow
            workflow_id_template: "eta-{event.session_id}"
            signal_name: notify_stage_change
            input_mapping:
              session_id: "$.session_id"
              order_id: "$.order_id"
              to_stage: "$.to_stage"
        - id: order_delivered_notifies_eta
          on_event: OrderStageChangedEvent
          when:
            to_stage: delivered
          action:
            via: signal_with_start
            target_plugin: eta
            target_worker: eta
            target_workflow: HubaraEtaSessionWorkflow
            workflow_id_template: "eta-{event.session_id}"
            signal_name: notify_stage_change
            input_mapping:
              session_id: "$.session_id"
              order_id: "$.order_id"
              to_stage: "$.to_stage"
        - id: order_cancelled_notifies_eta
          on_event: OrderStageChangedEvent
          when:
            to_stage: cancelled
          action:
            via: signal_with_start
            target_plugin: eta
            target_worker: eta
            target_workflow: HubaraEtaSessionWorkflow
            workflow_id_template: "eta-{event.session_id}"
            signal_name: notify_stage_change
            input_mapping:
              session_id: "$.session_id"
              order_id: "$.order_id"
              to_stage: "$.to_stage"
      deployment:
        replicas: 1                       # barrido idempotente — no hace falta paralelismo
        strategy: Recreate
        cpu_request: 50m
        memory_request: 128Mi
        env_secrets:
          - { var: MEDUSA_BASE_URL,         secret: hubara-medusa-secret, key: MEDUSA_BASE_URL }
          - { var: MEDUSA_ADMIN_TOKEN,      secret: hubara-medusa-secret, key: MEDUSA_ADMIN_TOKEN }
          - { var: MEDUSA_REGION_ID,        secret: hubara-medusa-secret, key: MEDUSA_REGION_ID }
          - { var: MEDUSA_SALES_CHANNEL_ID, secret: hubara-medusa-secret, key: MEDUSA_SALES_CHANNEL_ID }
      compose:
        env:
          TEMPORAL_URL: temporal:7233
          WORKSPACE_VAULT_DIR: /app/hubara_vault
          ORDER_RECONCILE_INTERVAL_MINUTES: "5"
          MEDUSA_BASE_URL: ${MEDUSA_BASE_URL}
          MEDUSA_ADMIN_TOKEN: ${MEDUSA_ADMIN_TOKEN}
          # WRITE port: sin REGION_ID + SALES_CHANNEL_ID el adapter cae al stub
          # y NO marca resuelto (ver reconciliation.py) — necesarios para registrar.
          MEDUSA_REGION_ID: ${MEDUSA_REGION_ID}
          MEDUSA_SALES_CHANNEL_ID: ${MEDUSA_SALES_CHANNEL_ID}
        volumes:
          - hubara-vault-local:/app/hubara_vault
        depends_on:
          - temporal

wiring_intents:
  env_vars_required:
    # Lectura (API kanban) — basta con base_url + auth. Si están vacíos, el
    # endpoint devuelve `catalog_available: false` + lista vacía (no rompe el
    # dashboard, pinta estado vacío).
    - MEDUSA_BASE_URL
    - MEDUSA_ADMIN_TOKEN
    # Escritura (worker reconcile) — el WRITE port exige estos para registrar
    # en Medusa; sin ellos cae al stub y NO resuelve.
    - MEDUSA_REGION_ID
    - MEDUSA_SALES_CHANNEL_ID
    - TEMPORAL_URL
  env_vars_optional:
    - ORDER_RECONCILE_INTERVAL_MINUTES   # default 5 min
