id: chats
version: 0.1.0
display_name: Chats
description: Conversaciones WhatsApp con agente Temporal (sales + remarketing) + dashboard SSE + handoff humano.

depends_on: []

# ── Frontend ───────────────────────────────────────────────────────────
# El barrel `./frontend/index.ts` exporta `Page` (la `ChatsSection` que el
# shell renderiza cuando section==="chat") + el sidebar/section contributions.
frontend:
  entry: ./frontend
  contributes:
    sections:
      - { key: chat, label: Chats, order: 1, icon: chat }
    sidebar:
      - { route: /chats, label: Chats, icon: chat }

# ── API REST ────────────────────────────────────────────────────────────
# PR2 mantiene los 3 routers viejos como módulos separados (`legacy_routers`).
# `main.py` los importa explícitamente. PR3 introducirá el loader que los lee
# de aquí y los registra automáticamente.
api:
  python_module: src.plugins.chats.api
  prefix: /api/chats
  tags: [Chats]
  legacy_routers:
    - { module: src.plugins.chats.api.sales,     prefix: /api,           tags: [WhatsApp_Sales_Domain] }
    - { module: src.plugins.chats.api.dashboard, prefix: /api/dashboard, tags: [Dashboard] }
    - { module: src.plugins.chats.api.handoff,   prefix: /api/dashboard, tags: [Dashboard_Handoff] }
    # El plugin `ads` no tiene backend propio — sus endpoints viven aquí (donde
    # están los metadata files de WhatsApp) y leen el `origin` + `last_touch`
    # que el ingest persiste. Cross-plugin import sería violación de R-DIP, por
    # eso vive en chats y el frontend del plugin `ads` consume `/api/chats/ads/*`.
    - { module: src.plugins.chats.api.ads,       prefix: /api/chats,     tags: [Ads] }

# ── Agente Temporal ────────────────────────────────────────────────────
# Dos workers en task queues exclusivas: SALES_QUEUE y REMARKETING_QUEUE.
# PR3 introducirá el meta-launcher que los arrancará en paralelo via
# asyncio.gather() para dev local. En producción siguen como containers
# independientes (ver hubara_agency/k8s/aws-produccion/worker-sales.yaml).
agent:
  python_module: src.plugins.chats.agent
  workers:
    - name: sales
      module: src.plugins.chats.workers.sales
      task_queue: queue-sales-agent
      # ADR-2026-05-20 (Declarative Orchestration): el código del workflow NO
      # importa `RemarketingSessionWorkflow`. Cuando la conversación cierra
      # con tag=INTERESADO, el workflow EMITE un `SalesSessionCompletionEvent`
      # via `dispatch_event_activity`; el dispatcher consulta este manifest,
      # encuentra la transition matchea, y arranca el target workflow por
      # nombre (string). Cross-worker imports están prohibidos por R-DIP #10
      # (ver `.importlinter` contracto `agents-independent`).
      workflow_classes:
        - HubaraSalesSessionWorkflow
      emits:
        - SalesSessionCompletionEvent
      transitions:
        - id: sales_to_remarketing_on_interested
          on_event: SalesSessionCompletionEvent
          when:
            tag: INTERESADO
          action:
            via: start_workflow_with_replace
            target_plugin: chats
            target_worker: remarketing
            target_workflow: RemarketingWorkflow
            workflow_id_template: "remarketing-{event.session_id}"
            input_mapping:
              session_id: "$.session_id"
              motivo: "$.motivo"
            start_delay_field: delay_seconds
      # LEGACY: declaración documental (Nivel 1, pre-ADR-2026-05-20). Reemplazada
      # por `transitions:` arriba. Conservada hasta que el system_map drift
      # detector se actualice para leer transitions (PR9 del ADR).
      invokes:
        - worker: remarketing
          via: start_workflow
          when: "tag=INTERESADO al cerrar sesión sales → programa follow-up"
      deployment:
        replicas: 3                       # high-throughput: cada sesión activa procesa turnos rápido
        cpu_request: 500m
        memory_request: 512Mi
        env_secrets:
          - { var: DEEPSEEK_API_KEY,        secret: hubara-llm-secret,      key: DEEPSEEK_API_KEY }
          - { var: WHATSAPP_PHONE_NUMBER_ID, secret: hubara-whatsapp-secret, key: WHATSAPP_PHONE_NUMBER_ID }
          - { var: WHATSAPP_ACCESS_TOKEN,   secret: hubara-whatsapp-secret, key: WHATSAPP_ACCESS_TOKEN }
          - { var: WHATSAPP_VERIFY_TOKEN,   secret: hubara-whatsapp-secret, key: WHATSAPP_VERIFY_TOKEN }
          - { var: META_CATALOG_ID,         secret: hubara-meta-secret,     key: META_CATALOG_ID }
          - { var: META_FLOW_ID_SHIPPING,   secret: hubara-meta-secret,     key: META_FLOW_ID_SHIPPING }
          # Sesión c4e3416f — Medusa Order Registration. Sin estos vars el
          # composition cae al StubOrderRegistration (loguea WARNING, no
          # registra en Medusa). En prod son requeridos.
          - { var: MEDUSA_BASE_URL,                  secret: hubara-medusa-secret, key: MEDUSA_BASE_URL }
          - { var: MEDUSA_ADMIN_TOKEN,               secret: hubara-medusa-secret, key: MEDUSA_ADMIN_TOKEN }
          - { var: MEDUSA_REGION_ID,                 secret: hubara-medusa-secret, key: MEDUSA_REGION_ID }
          - { var: MEDUSA_SALES_CHANNEL_ID,          secret: hubara-medusa-secret, key: MEDUSA_SALES_CHANNEL_ID }
          - { var: MEDUSA_DEFAULT_SHIPPING_OPTION_ID, secret: hubara-medusa-secret, key: MEDUSA_DEFAULT_SHIPPING_OPTION_ID }
      compose:
        env:
          TEMPORAL_URL: temporal:7233
          API_BASE_LLMLITE: http://litellm:4000
          WORKSPACE_VAULT_DIR: /app/hubara_vault
          CATALOG_SNAPSHOT_DIR: /app/hubara_vault/catalog
          CATALOG_MAX_AGE_MINUTES: "30"
          DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
          WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
          WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
          WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
          # Meta Commerce Catalog (HU-002 Parte B) — dispatch del intent
          # `products_list` lo lee para elegir entre `interactive.product_list`
          # (MPM con cards Meta) vs `interactive.list` (lista custom de texto).
          # Si está vacío → fallback a interactive.list. Si está set + intent
          # trae `prefer_native_product_list: true` + todos los rows tienen
          # `product_retailer_id` → MPM nativo.
          META_CATALOG_ID: ${META_CATALOG_ID}
          # WhatsApp Flow de datos de envío (HU-002 Parte A.9). El dispatch
          # del intent `shipping_flow` lee esta env: si está set + publicado,
          # abre el formulario nativo Meta (single-screen). Si está vacío,
          # cae a recolección conversacional turn-by-turn (texto plano).
          # Crear el Flow: docs/META_CATALOG_SETUP.md §Fase 13.
          META_FLOW_ID_SHIPPING: ${META_FLOW_ID_SHIPPING}
          # Medusa Order Registration (sesión c4e3416f). El sales worker
          # llama POST /admin/draft-orders en cierre exitoso. Si region_id/
          # sales_channel_id están vacíos, cae al StubOrderRegistration.
          MEDUSA_BASE_URL: ${MEDUSA_BASE_URL}
          MEDUSA_ADMIN_TOKEN: ${MEDUSA_ADMIN_TOKEN}
          MEDUSA_REGION_ID: ${MEDUSA_REGION_ID}
          MEDUSA_SALES_CHANNEL_ID: ${MEDUSA_SALES_CHANNEL_ID}
          MEDUSA_DEFAULT_SHIPPING_OPTION_ID: ${MEDUSA_DEFAULT_SHIPPING_OPTION_ID}
          MEDUSA_DEFAULT_CURRENCY: ${MEDUSA_DEFAULT_CURRENCY:-cop}
          MEDUSA_DEFAULT_COUNTRY: ${MEDUSA_DEFAULT_COUNTRY:-co}
        volumes:
          - hubara-vault-local:/app/hubara_vault
        depends_on:
          - temporal
          - litellm

    - name: remarketing
      module: src.plugins.chats.workers.remarketing
      task_queue: queue-remarketing-agent
      # ADR-2026-05-20 (Declarative Orchestration): cuando el cliente responde
      # durante el ciclo de remarketing (o la herramienta TransferToSales decide
      # devolver el control), el workflow EMITE un
      # `CustomerRepliedDuringRemarketingEvent` que el dispatcher rutea a Sales.
      # El handoff se hace en 2 pasos:
      #   1. `write_pending_handoff_activity` escribe el summary a metadata
      #      (el workflow lo invoca explícitamente antes del dispatch).
      #   2. `dispatch_event_activity` consulta este manifest y arranca/asegura
      #      el Sales workflow (via=ensure_running).
      workflow_classes:
        - RemarketingWorkflow
      emits:
        - CustomerRepliedDuringRemarketingEvent
      transitions:
        - id: remarketing_to_sales_on_customer_reply
          on_event: CustomerRepliedDuringRemarketingEvent
          # when: {} → matchea cualquier instance del evento (no hay sub-tipos).
          action:
            via: ensure_running
            target_plugin: chats
            target_worker: sales
            target_workflow: HubaraSalesSessionWorkflow
            workflow_id_template: "session-{event.session_id}"
            input_mapping:
              session_id: "$.session_id"
      # LEGACY: declaración documental (Nivel 1, pre-ADR-2026-05-20). Reemplazada
      # por `transitions:` arriba.
      invokes:
        - worker: sales
          via: get_workflow_handle
          when: "cliente responde durante remarketing → transferir a sales"
      deployment:
        replicas: 1                       # low-throughput: workflows long-lived que duermen días
        cpu_request: 250m
        memory_request: 384Mi
        env_secrets:
          - { var: DEEPSEEK_API_KEY,        secret: hubara-llm-secret,      key: DEEPSEEK_API_KEY }
          - { var: WHATSAPP_PHONE_NUMBER_ID, secret: hubara-whatsapp-secret, key: WHATSAPP_PHONE_NUMBER_ID }
          - { var: WHATSAPP_ACCESS_TOKEN,   secret: hubara-whatsapp-secret, key: WHATSAPP_ACCESS_TOKEN }
          - { var: WHATSAPP_VERIFY_TOKEN,   secret: hubara-whatsapp-secret, key: WHATSAPP_VERIFY_TOKEN }
      compose:
        env:
          TEMPORAL_URL: temporal:7233
          API_BASE_LLMLITE: http://litellm:4000
          WORKSPACE_VAULT_DIR: /app/hubara_vault
          DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
          WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
          WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
          WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
        volumes:
          - hubara-vault-local:/app/hubara_vault
        depends_on:
          - temporal
          - litellm

# ── Wiring intents ─────────────────────────────────────────────────────
wiring_intents:
  filesystem_volumes:
    - hubara-vault                   # JSONL message store + workspaces canónicos
  env_vars_required:
    - DEEPSEEK_API_KEY
    - WHATSAPP_PHONE_NUMBER_ID
    - WHATSAPP_ACCESS_TOKEN
    - WHATSAPP_VERIFY_TOKEN
    - TEMPORAL_URL
    - WORKSPACE_VAULT_DIR
