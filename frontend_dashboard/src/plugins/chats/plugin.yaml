id: chats
version: 0.1.0
archetype: agentic  # P-29 (workers conversacionales con workspace (sales/remarketing))
display_name: Chats
description: Conversaciones WhatsApp con agente Temporal (sales + remarketing) + dashboard SSE + handoff humano.
agentic: true  # workers conversacionales con workspace IDENTITY/SOUL/TOOLS/AGENTS/USER

# Dep DURA (P-DEPS): el canvas de pago del chat consume el contrato order@v1
# del plugin `orders` vía el cast server-side `api/order_actions` (consumes:
# abajo). P-6 exige orders habilitado siempre que chats lo esté.
depends_on: [orders]

# Canal 3 (PLUGIN_CONTRACT §5.3) — casting declarado. El frontend de chats
# SOLO ve su entity local `order-ref` (plugins/chats/frontend/entities/
# order-ref) y llama `/api/chats/order-actions/*`; el cast traduce al
# contrato publicado del provider. Swap de provider = cambiar SOLO el cast.
consumes:
  - provider: orders
    contract: order@v1          # PATCH /api/orders/orders/{id}/{schedule,confirm-payment}
    into: order-ref
    cast: api/order_actions

# ── Frontend ───────────────────────────────────────────────────────────
# El barrel `./frontend/index.ts` exporta `Page` (la `ChatsSection` que el
# shell renderiza cuando section==="chat") + el sidebar/section contributions.
frontend:
  entry: ./frontend
  contributes:
    sections:
      - { key: chat, label: Chats, order: 1, icon: chat }
    sidebar:
      - { route: /chats, label: Chats, icon: chat }

# ── API REST ────────────────────────────────────────────────────────────
# PR2 mantiene los 3 routers viejos como módulos separados (`legacy_routers`).
# `main.py` los importa explícitamente. PR3 introducirá el loader que los lee
# de aquí y los registra automáticamente.
api:
  python_module: src.plugins.chats.api
  prefix: /api/chats
  tags: [Chats]
  legacy_routers:
    - { module: src.plugins.chats.api.sales,     prefix: /api,           tags: [WhatsApp_Sales_Domain] }
    - { module: src.plugins.chats.api.dashboard, prefix: /api/dashboard, tags: [Dashboard] }
    - { module: src.plugins.chats.api.handoff,   prefix: /api/dashboard, tags: [Dashboard_Handoff] }
    # (ads extraído a su propio plugin `plugins/ads` — backend self-contained en
    #  `src.plugins.ads.api` con prefix `/api/ads`. PLUGIN_CONTRACT.md §5.2.)
    # (eta extraído a su propio plugin `plugins/eta` — backend self-contained en
    #  `src.plugins.eta.api` con prefix `/api/eta`. PLUGIN_CONTRACT.md §5.2.)
    - { module: src.plugins.chats.api.evals,     prefix: /api/chats,     tags: [Evals] }
    # Cast chats→orders (canal 3): sirve /api/chats/order-actions/* para el
    # canvas de pago. Ver `consumes:` arriba + src.plugins.chats.api.order_actions.
    - { module: src.plugins.chats.api.order_actions, prefix: /api/chats, tags: [Chats_OrderActions] }

# ── Agente Temporal ────────────────────────────────────────────────────
# Dos workers en task queues exclusivas: SALES_QUEUE y REMARKETING_QUEUE.
# PR3 introducirá el meta-launcher que los arrancará en paralelo via
# asyncio.gather() para dev local. En producción siguen como containers
# independientes (ver hubara_agency/k8s/aws-produccion/worker-sales.yaml).
agent:
  python_module: src.plugins.chats.agent
  workers:
    - name: sales
      module: src.plugins.chats.workers.sales
      task_queue: queue-sales-agent
      # ── Dashboard "Agents" (consumido por el plugin agents_admin) ─────────
      # Marca este worker como un AGENTE visible en la sección Agents del
      # dashboard y declara la ruta EXACTA de su workspace — donde viven
      # IDENTITY.md / SOUL.md / AGENTS.md / USER.md / TOOLS.md — + la metadata
      # de display. El backend de `agents_admin` escanea TODOS los manifests
      # buscando workers con un bloque `dashboard:`; NO hardcodea `chats`, así
      # que un agente nuevo aparece en la UI con solo declararlo aquí.
      dashboard:
        display_name: Asesor de Ventas
        role: Ventas premium de velas artesanales de cera de palma por WhatsApp
        category: Ventas
        icon: bolt
        color: blue
        model: DeepSeek V4 Pro
        # Ruta repo-root-relative; el backend resuelve <repo>/<workspace>.
        workspace: hubara_agency/src/plugins/chats/agent/sales/workspace
        # Capacidades reales (derivadas de las tools LLM registradas por el
        # worker sales — ver workspace/TOOLS.md). NO son métricas inventadas.
        capabilities:
          - { label: Buscar en el catálogo, icon: notes }
          - { label: Presentar productos con UI rica, icon: files }
          - { label: Tomar y registrar pedidos, icon: bolt }
          - { label: Recolectar datos de envío, icon: clipboard }
          - { label: Gestionar etiquetas de conversación, icon: tag }
          - { label: Escalar a un humano, icon: user }
      # ADR-2026-05-20 (Declarative Orchestration): el código del workflow NO
      # importa `RemarketingSessionWorkflow`. Cuando la conversación cierra
      # con tag=INTERESADO, el workflow EMITE un `SalesSessionCompletionEvent`
      # via `dispatch_event_activity`; el dispatcher consulta este manifest,
      # encuentra la transition matchea, y arranca el target workflow por
      # nombre (string). Cross-worker imports están prohibidos por R-DIP #10
      # (ver `.importlinter` contracto `agents-independent`).
      workflow_classes:
        - HubaraSalesSessionWorkflow
      emits:
        - SalesSessionCompletionEvent
        # HU-WA24H-001 Sprint 2: service-window lifecycle events.
        # `IngestInboundMessage` (use case del sales worker) emite estos en
        # cada inbound del cliente. Los routea el dispatcher al watchdog que
        # vive en el worker `remarketing` (decisión §5.1 del refinement).
        - ServiceWindowOpenedEvent
        - CustomerRepliedEvent
        # `EpisodeClosedEvent` se emite desde el sales workflow cuando una
        # tool LLM cierra el episodio (ManageConversationTagTool con un
        # CLOSING_TAG). Cancela el watchdog del episodio cerrado.
        - EpisodeClosedEvent
      transitions:
        # ── PR #113 (Window Strategist): `sales_to_remarketing_on_interested`
        # (INTERESADO → RemarketingWorkflow a los 300s, stopgap) se ELIMINÓ.
        # La reactivación ahora la decide el ciclo del agente window-strategist
        # (ventana × warmth × cadencia × presupuesto) y la dispara la
        # transition del plugin `reengagement`; el gate central re-valida al
        # ejecutar. El SalesSessionCompletionEvent se SIGUE emitiendo (sin
        # consumidor el dispatcher lo no-op-ea) — queda para observabilidad y
        # futuros consumidores. Guard anti-regresión:
        # tests/plugins/chats/test_manifest_no_immediate_remarketing.py.
        # NO re-agregar el disparo directo sin ADR.
        # ── HU-WA24H-001 Sprint 2 — watchdog wiring ──────────────────────
        # ServiceWindowOpenedEvent → arranca (o reemplaza) un watchdog por
        # episodio. `start_workflow_with_replace` mata cualquier watchdog
        # previo del mismo (session, episode) y arranca uno nuevo — así los
        # inbounds consecutivos extienden la ventana sin acumular workflows
        # paralelos.
        - id: sales_inbound_opens_service_window
          on_event: ServiceWindowOpenedEvent
          action:
            via: start_workflow_with_replace
            target_plugin: chats
            target_worker: remarketing
            target_workflow: ServiceWindowWatchdogWorkflow
            workflow_id_template: "watchdog-{event.session_id}-{event.episode_id}"
            input_mapping:
              session_id: "$.session_id"
              episode_id: "$.episode_id"
              fire_at_ms: "$.fire_at_ms"
              suggested_template_kind: "$.suggested_template_kind"
        # CustomerRepliedEvent → cancel del watchdog (cliente respondió,
        # no necesita nudge). `via=signal` apunta al mismo workflow_id.
        # OJO: si NO hay watchdog corriendo, Temporal NO noopea — lanza gRPC
        # NOT_FOUND ("sql: no rows in result set"). El dispatcher absorbe ese
        # caso como noop (`_is_not_found`), así que señalar un watchdog ausente
        # es seguro. (Antes crasheaba el Sales workflow — run 3b3fbaee.)
        # El dispatcher pasa el dict del `input_mapping` como UN solo arg
        # al signal handler — `cancel_watchdog(self, payload: dict)`
        # extrae `payload["reason"]`. Acá inyectamos un literal mediante un
        # field del evento que ya conocemos su valor para esta transition.
        - id: sales_inbound_cancels_watchdog_on_reply
          on_event: CustomerRepliedEvent
          action:
            via: signal
            target_plugin: chats
            target_worker: remarketing
            target_workflow: ServiceWindowWatchdogWorkflow
            workflow_id_template: "watchdog-{event.session_id}-{event.episode_id}"
            signal_name: cancel_watchdog
            input_mapping:
              # No hay un campo literal "customer_replied" en el evento —
              # mappeamos episode_id como anchor del payload; el reason
              # útil para el log lo genera el caller cuando enrique el
              # envelope (futuro). Por ahora el handler ve
              # {"reason": "<episode_id>"} y normaliza.
              reason: "$.episode_id"
        # EpisodeClosedEvent → cancel del watchdog (episodio cerró, no hay
        # razón comercial para seguir nudgeando). El closing_tag viaja al
        # handler como reason — útil para logs ("TIMEOUT" vs "COMPRA_EXITOSA"
        # vs "RECHAZO").
        - id: sales_episode_close_cancels_watchdog
          on_event: EpisodeClosedEvent
          action:
            via: signal
            target_plugin: chats
            target_worker: remarketing
            target_workflow: ServiceWindowWatchdogWorkflow
            workflow_id_template: "watchdog-{event.session_id}-{event.episode_id}"
            signal_name: cancel_watchdog
            input_mapping:
              reason: "$.closing_tag"
        # EpisodeClosedEvent → evaluar ESE episodio (calidad LLM, event-driven).
        # Cada episodio que cierra queda calificado una vez en el histórico —
        # cobertura completa por episodio, no muestreo temporal. `start_workflow`
        # con id por episodio: una re-entrega del evento no arranca dos (idempotente).
        # El target es efímero (evalúa y termina), por eso start_workflow y no signal.
        - id: sales_episode_close_triggers_eval
          on_event: EpisodeClosedEvent
          action:
            via: start_workflow
            target_plugin: chats
            target_worker: sales_eval
            target_workflow: EvaluateEpisodeWorkflow
            workflow_id_template: "eval-episode-{event.session_id}-{event.episode_id}"
            input_mapping:
              session_id: "$.session_id"
              episode_id: "$.episode_id"
              closing_tag: "$.closing_tag"
      # LEGACY: declaración documental (Nivel 1, pre-ADR-2026-05-20). Reemplazada
      # por `transitions:` arriba. Conservada hasta que el system_map drift
      # detector se actualice para leer transitions (PR9 del ADR).
      invokes:
        - worker: remarketing
          via: start_workflow
          when: "tag=INTERESADO al cerrar sesión sales → programa follow-up"
      deployment:
        replicas: 3                       # high-throughput: cada sesión activa procesa turnos rápido
        cpu_request: 500m
        memory_request: 512Mi
        env_secrets:
          - { var: DEEPSEEK_API_KEY,        secret: hubara-llm-secret,      key: DEEPSEEK_API_KEY }
          - { var: WHATSAPP_PHONE_NUMBER_ID, secret: hubara-whatsapp-secret, key: WHATSAPP_PHONE_NUMBER_ID }
          - { var: WHATSAPP_ACCESS_TOKEN,   secret: hubara-whatsapp-secret, key: WHATSAPP_ACCESS_TOKEN }
          - { var: WHATSAPP_VERIFY_TOKEN,   secret: hubara-whatsapp-secret, key: WHATSAPP_VERIFY_TOKEN }
          - { var: META_CATALOG_ID,         secret: hubara-meta-secret,     key: META_CATALOG_ID }
          - { var: META_FLOW_ID_SHIPPING,   secret: hubara-meta-secret,     key: META_FLOW_ID_SHIPPING }
          # Sesión c4e3416f — Medusa Order Registration. Sin estos vars el
          # composition cae al StubOrderRegistration (loguea WARNING, no
          # registra en Medusa). En prod son requeridos.
          - { var: MEDUSA_BASE_URL,                  secret: hubara-medusa-secret, key: MEDUSA_BASE_URL }
          - { var: MEDUSA_ADMIN_TOKEN,               secret: hubara-medusa-secret, key: MEDUSA_ADMIN_TOKEN }
          - { var: MEDUSA_REGION_ID,                 secret: hubara-medusa-secret, key: MEDUSA_REGION_ID }
          - { var: MEDUSA_SALES_CHANNEL_ID,          secret: hubara-medusa-secret, key: MEDUSA_SALES_CHANNEL_ID }
          - { var: MEDUSA_DEFAULT_SHIPPING_OPTION_ID, secret: hubara-medusa-secret, key: MEDUSA_DEFAULT_SHIPPING_OPTION_ID }
      compose:
        env:
          TEMPORAL_URL: temporal:7233
          API_BASE_LLMLITE: http://litellm:4000
          WORKSPACE_VAULT_DIR: /app/hubara_vault
          # Observabilidad OTel (HU-003 A6). El worker exporta traces/métricas/
          # gen_ai al collector de SigNoz. host.docker.internal:4317 = puerto
          # publicado al host: workers y SigNoz viven en redes distintas y
          # render-compose.py no soporta compose.networks. Sin esta env,
          # init_otel() cae a ConsoleSpanExporter y nada sale del container.
          # (Caveat Linux/prod: requiere extra_hosts o red compartida.)
          OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4317
          OTEL_SEMCONV_STABILITY_OPT_IN: gen_ai_latest_experimental
          # HU-003 A7: tarifas para que OpenLIT calcule el costo USD por petición
          # (gen_ai.usage.cost). deepseek-v4-flash es muy nuevo para la tabla
          # pública de OpenLIT → sin esto cost=0 (los tokens igual se capturan).
          # Rellenar las tarifas reales en deploy/openlit/pricing.json.
          OPENLIT_PRICING_JSON: /app/hubara_agency/deploy/openlit/pricing.json
          CATALOG_SNAPSHOT_DIR: /app/hubara_vault/catalog
          CATALOG_MAX_AGE_MINUTES: "30"
          DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
          WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
          WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
          WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
          # Meta Commerce Catalog (HU-002 Parte B) — dispatch del intent
          # `products_list` lo lee para elegir entre `interactive.product_list`
          # (MPM con cards Meta) vs `interactive.list` (lista custom de texto).
          # Si está vacío → fallback a interactive.list. Si está set + intent
          # trae `prefer_native_product_list: true` + todos los rows tienen
          # `product_retailer_id` → MPM nativo.
          META_CATALOG_ID: ${META_CATALOG_ID}
          # WhatsApp Flow de datos de envío (HU-002 Parte A.9). El dispatch
          # del intent `shipping_flow` lee esta env: si está set + publicado,
          # abre el formulario nativo Meta (single-screen). Si está vacío,
          # cae a recolección conversacional turn-by-turn (texto plano).
          # Crear el Flow: docs/META_CATALOG_SETUP.md §Fase 13.
          META_FLOW_ID_SHIPPING: ${META_FLOW_ID_SHIPPING}
          # Medusa Order Registration (sesión c4e3416f). El sales worker
          # llama POST /admin/draft-orders en cierre exitoso. Si region_id/
          # sales_channel_id están vacíos, cae al StubOrderRegistration.
          MEDUSA_BASE_URL: ${MEDUSA_BASE_URL}
          MEDUSA_ADMIN_TOKEN: ${MEDUSA_ADMIN_TOKEN}
          MEDUSA_REGION_ID: ${MEDUSA_REGION_ID}
          MEDUSA_SALES_CHANNEL_ID: ${MEDUSA_SALES_CHANNEL_ID}
          MEDUSA_DEFAULT_SHIPPING_OPTION_ID: ${MEDUSA_DEFAULT_SHIPPING_OPTION_ID}
          MEDUSA_DEFAULT_CURRENCY: ${MEDUSA_DEFAULT_CURRENCY:-cop}
          MEDUSA_DEFAULT_COUNTRY: ${MEDUSA_DEFAULT_COUNTRY:-co}
        volumes:
          - hubara-vault-local:/app/hubara_vault
        depends_on:
          - temporal
          - litellm

    - name: remarketing
      module: src.plugins.chats.workers.remarketing
      task_queue: queue-remarketing-agent
      # ── Dashboard "Agents" (ver la nota extensa en el worker `sales`) ─────
      dashboard:
        display_name: Recuperación Comercial
        role: Reactivación de leads INTERESADO que quedaron silentes
        category: Remarketing
        icon: refresh
        color: orange
        model: DeepSeek V4 Pro
        workspace: hubara_agency/src/plugins/chats/agent/remarketing/workspace
        # Remarketing es deliberadamente minimalista: un gancho conversacional
        # + transferencia a Ventas (su única tool LLM es transfer_to_sales_agent).
        capabilities:
          - { label: Reactivar leads INTERESADO, icon: refresh }
          - { label: Transferir la charla a Ventas, icon: user }
      # ADR-2026-05-20 (Declarative Orchestration): cuando el cliente responde
      # durante el ciclo de remarketing (o la herramienta TransferToSales decide
      # devolver el control), el workflow EMITE un
      # `CustomerRepliedDuringRemarketingEvent` que el dispatcher rutea a Sales.
      # El handoff se hace en 2 pasos:
      #   1. `write_pending_handoff_activity` escribe el summary a metadata
      #      (el workflow lo invoca explícitamente antes del dispatch).
      #   2. `dispatch_event_activity` consulta este manifest y arranca/asegura
      #      el Sales workflow (via=ensure_running).
      # HU-WA24H-001 Sprint 2: el watchdog vive registrado acá (decisión
      # §5.1 del refinement — reusar el worker remarketing en lugar de crear
      # un worker `watchdog` nuevo; menos overhead operativo, mismas
      # task_queues, comparte composition).
      workflow_classes:
        - RemarketingWorkflow
        - ServiceWindowWatchdogWorkflow
      emits:
        - CustomerRepliedDuringRemarketingEvent
        # Los inbounds durante remarketing también deben (a) extender la
        # ventana → ServiceWindowOpenedEvent, (b) cancelar el watchdog
        # actual → CustomerRepliedEvent. Mirror exacto del worker sales.
        - ServiceWindowOpenedEvent
        - CustomerRepliedEvent
        - EpisodeClosedEvent
      transitions:
        - id: remarketing_to_sales_on_customer_reply
          on_event: CustomerRepliedDuringRemarketingEvent
          # when: {} → matchea cualquier instance del evento (no hay sub-tipos).
          action:
            via: ensure_running
            target_plugin: chats
            target_worker: sales
            target_workflow: HubaraSalesSessionWorkflow
            workflow_id_template: "session-{event.session_id}"
            input_mapping:
              session_id: "$.session_id"
        # ── HU-WA24H-001 Sprint 2 — watchdog wiring (mirror de sales) ────
        - id: remarketing_inbound_opens_service_window
          on_event: ServiceWindowOpenedEvent
          action:
            via: start_workflow_with_replace
            target_plugin: chats
            target_worker: remarketing
            target_workflow: ServiceWindowWatchdogWorkflow
            workflow_id_template: "watchdog-{event.session_id}-{event.episode_id}"
            input_mapping:
              session_id: "$.session_id"
              episode_id: "$.episode_id"
              fire_at_ms: "$.fire_at_ms"
              suggested_template_kind: "$.suggested_template_kind"
        - id: remarketing_inbound_cancels_watchdog_on_reply
          on_event: CustomerRepliedEvent
          action:
            via: signal
            target_plugin: chats
            target_worker: remarketing
            target_workflow: ServiceWindowWatchdogWorkflow
            workflow_id_template: "watchdog-{event.session_id}-{event.episode_id}"
            signal_name: cancel_watchdog
            input_mapping:
              reason: "$.episode_id"
        - id: remarketing_episode_close_cancels_watchdog
          on_event: EpisodeClosedEvent
          action:
            via: signal
            target_plugin: chats
            target_worker: remarketing
            target_workflow: ServiceWindowWatchdogWorkflow
            workflow_id_template: "watchdog-{event.session_id}-{event.episode_id}"
            signal_name: cancel_watchdog
            input_mapping:
              reason: "$.closing_tag"
      # LEGACY: declaración documental (Nivel 1, pre-ADR-2026-05-20). Reemplazada
      # por `transitions:` arriba.
      invokes:
        - worker: sales
          via: get_workflow_handle
          when: "cliente responde durante remarketing → transferir a sales"
      deployment:
        replicas: 1                       # low-throughput: workflows long-lived que duermen días
        cpu_request: 250m
        memory_request: 384Mi
        env_secrets:
          - { var: DEEPSEEK_API_KEY,        secret: hubara-llm-secret,      key: DEEPSEEK_API_KEY }
          - { var: WHATSAPP_PHONE_NUMBER_ID, secret: hubara-whatsapp-secret, key: WHATSAPP_PHONE_NUMBER_ID }
          - { var: WHATSAPP_ACCESS_TOKEN,   secret: hubara-whatsapp-secret, key: WHATSAPP_ACCESS_TOKEN }
          - { var: WHATSAPP_VERIFY_TOKEN,   secret: hubara-whatsapp-secret, key: WHATSAPP_VERIFY_TOKEN }
      compose:
        env:
          TEMPORAL_URL: temporal:7233
          API_BASE_LLMLITE: http://litellm:4000
          WORKSPACE_VAULT_DIR: /app/hubara_vault
          # Observabilidad OTel (HU-003 A6) — ver nota en el worker `sales`.
          OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4317
          OTEL_SEMCONV_STABILITY_OPT_IN: gen_ai_latest_experimental
          # HU-003 A7: tarifas para que OpenLIT calcule el costo USD por petición.
          # Rellenar las tarifas reales en deploy/openlit/pricing.json.
          OPENLIT_PRICING_JSON: /app/hubara_agency/deploy/openlit/pricing.json
          DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
          WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
          WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
          WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
        volumes:
          - hubara-vault-local:/app/hubara_vault
        depends_on:
          - temporal
          - litellm

    # (Sub-agente ETA extraído a su propio plugin `plugins/eta` — su worker,
    #  workflow y workspace viven ahora bajo `src.plugins.eta`. Sigue siendo un
    #  TARGET de orquestación: el dispatcher lo arranca/signalea cuando `orders`
    #  emite OrderStageChangedEvent, ahora con target_plugin=eta. §5.2.)

    # ── Harness de evaluación de calidad del Asesor de Ventas ─────────────
    # Worker del eval loop (LLMOps): un Temporal Schedule (3×/día, hora Bogotá)
    # dispara SalesEvalWorkflow → muestrea conversaciones reales → DeepEval
    # (LLM-juez) puntúa adherencia al guion + estilo + no-alucinación → emite
    # scores a SigNoz + auto-curación de goldens. NO es un agente conversacional
    # (sin dashboard "Agents", sin emits/transitions). Requiere el extra `evals`
    # (deepeval): su imagen instala `uv sync --extra evals`.
    - name: sales_eval
      module: src.plugins.chats.workers.sales_eval
      task_queue: queue-sales-eval
      # DOS Temporal Schedules que el propio worker crea al bootear
      # (*_SCHEDULE_ID en workers/sales_eval.py): la eval online diaria
      # (toggle SALES_EVAL_SCHEDULE_ENABLED, default on) y la golden suite
      # (opt-in GOLDEN_EVAL_SCHEDULE_ENABLED, default OFF — vive en CI).
      # Acktos Studio dibuja el reloj a partir de esta declaración.
      schedule:
        - id: sales-eval-schedule
          cadence: diario 23:00 Bogotá
        - id: golden-eval-schedule
          cadence: diario 06:00 (opt-in, OFF por default)
      workflow_classes:
        - SalesEvalWorkflow
        # Eval dirigida de UN episodio al cerrar (event-driven). La dispara la
        # transition `sales_episode_close_triggers_eval` del worker `sales`.
        - EvaluateEpisodeWorkflow
      deployment:
        replicas: 1
        cpu_request: 250m
        memory_request: 512Mi
        env_secrets:
          - { var: DEEPSEEK_API_KEY, secret: hubara-llm-secret, key: DEEPSEEK_API_KEY }
      compose:
        env:
          TEMPORAL_URL: temporal:7233
          API_BASE_LLMLITE: http://litellm:4000
          WORKSPACE_VAULT_DIR: /app/hubara_vault
          # Observabilidad OTel (HU-003) — el juez también se mide en SigNoz.
          OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4317
          OTEL_SEMCONV_STABILITY_OPT_IN: gen_ai_latest_experimental
          OPENLIT_PRICING_JSON: /app/hubara_agency/deploy/openlit/pricing.json
          # Juez LLM (alias del proxy litellm). gemini-pro-judge = el MISMO juez
          # del golden de CI (paridad de criterio, ver judge.py). El valor
          # anterior (gemini-backup) era el fallback del PROPIO agente DeepSeek
          # → más débil y con riesgo de self-preference; quedó de antes del fix
          # de paridad.
          EVAL_JUDGE_MODEL: litellm_proxy/gemini-pro-judge
          # Candidatos a golden (auto-curación) → path montado durable; el
          # operador los baja, redacta y promueve a tests/evals/.../curated.json.
          EVAL_CANDIDATES_DIR: /app/hubara_vault/_evals/candidates
          # Muestreo diario APAGADO: la eval es event-driven (cada episodio se
          # evalúa al CERRAR vía EvaluateEpisodeWorkflow). El cron de 24h era
          # redundante — re-evaluaba lo ya cubierto al cierre. El worker borra el
          # schedule existente al bootear con esto en "false" (toggle real, INV-2).
          # Ventana/cadencia quedan declaradas por si se reactiva (solo barrido de
          # episodios activos largos), pero hoy no se usan con el schedule apagado.
          SALES_EVAL_SCHEDULE_ENABLED: "false"
          SALES_EVAL_LOOKBACK_HOURS: "8"
          SALES_EVAL_MAX_CONVERSATIONS: "50"
          DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
        volumes:
          - hubara-vault-local:/app/hubara_vault
        depends_on:
          - temporal
          - litellm
    - name: post_sale_return
      module: src.plugins.chats.workers.post_sale_return
      task_queue: queue-post-sale-return
      # Temporal Schedule que el propio worker crea/converge al bootear
      # (_SCHEDULE_ID en workers/post_sale_return.py): 1x/día devuelve al bot
      # de ventas las conversaciones con tag=COMPRA_EXITOSA que quedaron
      # abiertas en humano SIN robot corriendo — el estado que deja a
      # propósito la confirmación de pago del dashboard (ver
      # apply_payment_confirmation_to_chat_metadata). Es el botón "devolver
      # al robot" en batch. Toggle POST_SALE_RETURN_SCHEDULE_ENABLED (INV-2);
      # cron POST_SALE_RETURN_SCHEDULE_CRON. Sin LLM (mutación determinista).
      schedule:
        - id: post-sale-return-schedule
          cadence: diario 21:00 Bogotá
      workflow_classes:
        - PostSaleReturnWorkflow
      deployment:
        replicas: 1
        cpu_request: 100m
        memory_request: 256Mi
      compose:
        env:
          TEMPORAL_URL: temporal:7233
          WORKSPACE_VAULT_DIR: /app/hubara_vault
        volumes:
          - hubara-vault-local:/app/hubara_vault
        depends_on:
          - temporal

# ── Wiring intents ─────────────────────────────────────────────────────
wiring_intents:
  filesystem_volumes:
    - hubara-vault                   # JSONL message store + workspaces canónicos
  env_vars_required:
    - DEEPSEEK_API_KEY
    - WHATSAPP_PHONE_NUMBER_ID
    - WHATSAPP_ACCESS_TOKEN
    - WHATSAPP_VERIFY_TOKEN
    - TEMPORAL_URL
    - WORKSPACE_VAULT_DIR
