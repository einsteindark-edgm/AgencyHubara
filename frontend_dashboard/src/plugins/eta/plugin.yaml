id: eta
version: 0.1.0
display_name: ETA Tracker
description: Notificador de envíos — empuja al cliente cada cambio de estado de sus pedidos por WhatsApp SIN tomar el turno conversacional (las respuestas las atiende Sales) + sección de visualización (tracked orders + chat). Backend self-contained (`/api/eta` + worker `eta`); datos del frontend vía `entities/tracked-order`.
agentic: true  # worker conversacional ETA con workspace IDENTITY/SOUL/TOOLS/AGENTS/USER

# Dep DURA (P-DEPS): el ingest de WhatsApp (webhook + ruteo de inbounds) vive
# en `chats` — sin él, ETA notifica pero NUNCA recibe respuestas del cliente
# (hallazgo N-2, PLUGIN_ISOLATION_AUDIT_fable.md; decisión D4a del plan).
# `validate_enabled` (P-6) exige chats habilitado siempre que eta lo esté.
# Cuando el ingest se mueva a platform (plan F6/D4b), esta dep se elimina.
depends_on: [chats]

frontend:
  entry: ./frontend
  contributes:
    sections:
      - { key: eta, label: ETA, order: 3, icon: truck }
    sidebar:
      - { route: /eta, label: ETA, icon: truck }

# ── API REST ────────────────────────────────────────────────────────────
# Backend self-contained (extraído de chats — PLUGIN_CONTRACT.md §5.2). Sirve la
# sección ETA del dashboard derivando los pedidos en fulfillment del order query
# port (platform) + el `metadata.eta_tracking` per-sesión del vault. No importa
# de ningún plugin sibling (R-DIP: eta → platform).
api:
  python_module: src.plugins.eta.api
  prefix: /api/eta
  tags: [ETA]

# ── Agente Temporal ────────────────────────────────────────────────────
# Sub-agente ETA (notificaciones de estado de pedido). Es un TARGET de
# orquestación: lo arranca/signalea el dispatcher cuando `orders` emite
# OrderStageChangedEvent (NO emite eventos propios → sin `emits`/`transitions`).
# Declara su workflow_class para que `test_transition_targets_exist` lo resuelva.
agent:
  python_module: src.plugins.eta.agent
  workers:
    - name: eta
      module: src.plugins.eta.workers.eta
      task_queue: queue-eta-agent
      # SIN `owns_route` (convivencia ETA/Sales, 2026-06-10): el ETA es un
      # notificador puro — NO recibe inbounds. El turno conversacional es
      # SIEMPRE de Sales (o humano); las preguntas de entrega las responde
      # Sales con su tool `check_order_status`. El dispatch de notificaciones
      # NO depende de esto (las transitions de orders/plugin.yaml llevan su
      # propio workflow_id_template). Sesiones legacy con active_route=eta
      # caen a Sales por el fallback del router (ruta no registrada).
      dashboard:
        display_name: Asistente de Seguimiento
        role: Notifica al cliente cada cambio de estado de sus pedidos por WhatsApp (sin tomar el turno de la conversación)
        category: Postventa
        icon: truck
        color: green
        model: DeepSeek V4 Pro
        workspace: hubara_agency/src/plugins/eta/agent/eta/workspace
        capabilities:
          - { label: Notificar cambios de estado del pedido, icon: bolt }
          - { label: Seguir varios pedidos en tránsito a la vez, icon: truck }
          - { label: Escalar a un humano, icon: user }
      workflow_classes:
        - HubaraEtaSessionWorkflow
      deployment:
        replicas: 1                       # long-lived que duermen entre cambios de estado
        cpu_request: 250m
        memory_request: 384Mi
        env_secrets:
          - { var: DEEPSEEK_API_KEY,        secret: hubara-llm-secret,      key: DEEPSEEK_API_KEY }
          - { var: WHATSAPP_PHONE_NUMBER_ID, secret: hubara-whatsapp-secret, key: WHATSAPP_PHONE_NUMBER_ID }
          - { var: WHATSAPP_ACCESS_TOKEN,   secret: hubara-whatsapp-secret, key: WHATSAPP_ACCESS_TOKEN }
          - { var: WHATSAPP_VERIFY_TOKEN,   secret: hubara-whatsapp-secret, key: WHATSAPP_VERIFY_TOKEN }
          # READ-only de Medusa: `claim_eta_notification_activity` lee el order
          # query port para los slots del mensaje (nombre, total, tipo de pago).
          - { var: MEDUSA_BASE_URL,         secret: hubara-medusa-secret, key: MEDUSA_BASE_URL }
          - { var: MEDUSA_ADMIN_TOKEN,      secret: hubara-medusa-secret, key: MEDUSA_ADMIN_TOKEN }
      compose:
        env:
          TEMPORAL_URL: temporal:7233
          API_BASE_LLMLITE: http://litellm:4000
          WORKSPACE_VAULT_DIR: /app/hubara_vault
          OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4317
          OTEL_SEMCONV_STABILITY_OPT_IN: gen_ai_latest_experimental
          OPENLIT_PRICING_JSON: /app/hubara_agency/deploy/openlit/pricing.json
          DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
          WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
          WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
          WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
          MEDUSA_BASE_URL: ${MEDUSA_BASE_URL}
          MEDUSA_ADMIN_TOKEN: ${MEDUSA_ADMIN_TOKEN}
        volumes:
          - hubara-vault-local:/app/hubara_vault
        depends_on:
          - temporal
          - litellm

wiring_intents:
  env_vars_required: []
