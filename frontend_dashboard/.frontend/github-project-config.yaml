# GitHub Project config — REAL para AgencyHubara
#
# Este archivo lo leen `hu-frontend-pipeline` (vía nodos `project-set-*`) y
# `idea-a-hu-frontend` (nodo `agregar-a-project`). Si no existe, los workflows
# skipean los updates de Project (fail-soft).
#
# Generado por gh CLI + GraphQL el 2026-05-12. Para regenerarlo:
#   rtk proxy gh project view 1 --owner einsteindark-edgm --format json
#   rtk proxy gh project field-list 1 --owner einsteindark-edgm --format json
#
# FORMATO: para que los parsers awk del pipeline funcionen,
#   - Las keys sin espacios ni colons van SIN comillas
#   - Las keys con espacios o colons van CON comillas dobles
#   - NO usar comentarios inline en las líneas de option (los parsers no los strippean)

version: 1

# Información del Project
project_owner: einsteindark-edgm
project_number: 1
project_id: PVT_kwHOC1uris4BXfi4

# Field "Status" (single-select)
status_field_id: PVTSSF_lAHOC1uris4BXfi4zhSsBCM

# Mapping nombre-fase-del-pipeline → option_id del Status field
#
# Reusados de los defaults del Status field (mismo nombre que los built-in
# workflows usan: PR-merged → Done, etc.):
#   - Todo (GRAY)       → "Idea refined"
#   - In Progress (YEL) → "Implementing"
#   - Done (GREEN)      → "Done — PR ready"
#
# Nuevos agregados via GraphQL updateProjectV2Field:
#   - Refining (BLUE)   → FASE 0 del pipeline arranca
#   - Refined (BLUE)    → FASE 1 done
#   - Planned (PURPLE)  → FASE 2 done
#   - Blocked (RED)     → cualquier error del pipeline
status_options:
  "Idea refined": 3e1150f1
  Refining: f70edf20
  Refined: dd640195
  Planning: f70edf20
  Planned: 4f823c82
  Implementing: cdb96ad4
  "Done — PR ready": 287c3240
  "Blocked: refinement needs review": 2bbdde9e
  "Blocked: plan needs review": 2bbdde9e
  "Blocked: needs review": 2bbdde9e

# Sub-items (opcional, deshabilitado por ahora)
sub_items:
  enabled: false

# Si Project sync falla en algún punto, ¿imprimimos banner bien visible?
pause_on_blocked: true
